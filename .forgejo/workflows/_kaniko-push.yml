name: _kaniko-push
on:
  workflow_dispatch: {}
jobs:
  build_push:
    runs-on: codeberg-small
    container:
      image: gcr.io/kaniko-project/executor:v1.23.2-debug
    steps:
      - name: build & push trivial image
        shell: sh
        env:
          CB_USER: ${{ secrets.CODEBERG_USERNAME }}
          CB_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          set -e
          mkdir -p /workspace /kaniko/.docker
          printf 'FROM alpine:3.20\nRUN echo kaniko-push-ok > /ok.txt\n' > /workspace/Dockerfile
          AUTH=$(printf '%s:%s' "$CB_USER" "$CB_TOKEN" | base64 | tr -d '\n')
          printf '{"auths":{"codeberg.org":{"auth":"%s"}}}' "$AUTH" > /kaniko/.docker/config.json
          /kaniko/executor --context dir:///workspace --dockerfile /workspace/Dockerfile \
            --destination codeberg.org/conduction/kaniko-push-probe:test --verbosity info
