# TEMP: reveal what value the caller's github.event_name takes once passed as a
# workflow_call input, and which if: form Forgejo honors. Run/skip pattern = answer. DELETE after.
name: _evt-target
on:
  workflow_call:
    inputs:
      evt:
        type: string
        required: false
        default: "UNSET"
jobs:
  control_always:
    runs-on: codeberg-tiny
    steps: [{ run: echo control }]
  bare_dispatch:
    if: inputs.evt == 'workflow_dispatch'
    runs-on: codeberg-tiny
    steps: [{ run: echo bare_dispatch }]
  wrapped_dispatch:
    if: ${{ inputs.evt == 'workflow_dispatch' }}
    runs-on: codeberg-tiny
    steps: [{ run: echo wrapped_dispatch }]
  is_empty:
    if: ${{ inputs.evt == '' }}
    runs-on: codeberg-tiny
    steps: [{ run: echo is_empty }]
  is_unset_default:
    if: ${{ inputs.evt == 'UNSET' }}
    runs-on: codeberg-tiny
    steps: [{ run: echo is_unset_default }]
  is_workflow_call:
    if: ${{ inputs.evt == 'workflow_call' }}
    runs-on: codeberg-tiny
    steps: [{ run: echo is_workflow_call }]
  is_literal_template:
    if: ${{ inputs.evt == '${{ github.event_name }}' }}
    runs-on: codeberg-tiny
    steps: [{ run: echo is_literal_template }]
