# TEMP: real push to Codeberg registry with org creds via crane (decisive). DELETE after.
name: _cranepush
on:
  workflow_dispatch: {}
jobs:
  crane_push:
    runs-on: codeberg-small
    container: { image: alpine:3.20 }
    steps:
      - shell: sh
        env:
          CB_USER: ${{ secrets.CODEBERG_USERNAME }}
          CB_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          set -e
          apk add --no-cache curl tar
          curl -sL https://github.com/google/go-containerregistry/releases/download/v0.20.2/go-containerregistry_Linux_x86_64.tar.gz -o /tmp/c.tgz
          tar xzf /tmp/c.tgz -C /usr/local/bin crane
          echo "$CB_TOKEN" | crane auth login codeberg.org -u "$CB_USER" --password-stdin
          crane copy alpine:3.20 codeberg.org/conduction/crane-push-probe:test
          echo CRANE_PUSH_OK
