# Reusable Stable Release via semantic-release (commit-driven semver) for Codeberg.
# semantic-release/commit-analyzer computes the next version from Conventional
# Commits off the latest vX.Y.Z tag, creates+pushes the tag, and @semantic-release/exec
# runs the Nextcloud build/sign/Codeberg-release/App-Store steps in prepare+publish.
# No release happens unless there are releasable commits (feat/fix/BREAKING).
name: Stable Release (semantic-release)

on:
  workflow_call:
    inputs:
      app-name:
        description: "Nextcloud app ID (must match appinfo/info.xml)"
        required: true
        type: string
      node-version:
        required: false
        type: string
        default: "24"
      extra-rsync-excludes:
        required: false
        type: string
        default: ""
      release-branch:
        description: "Branch semantic-release treats as the stable release branch (default main; nldesign uses master)"
        required: false
        type: string
        default: "main"

jobs:
  release:
    runs-on: codeberg-medium
    container:
      image: php:8.3-cli
    timeout-minutes: 15
    steps:
      - name: Install base tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git curl ca-certificates gnupg jq rsync unzip zip \
            openssl libzip-dev libpng-dev
          docker-php-ext-install -j"$(nproc)" zip gd
          curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
          curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
          apt-get install -y nodejs

      - name: Checkout code
        uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install semantic-release
        run: npm install -g semantic-release@24 @semantic-release/commit-analyzer @semantic-release/release-notes-generator @semantic-release/exec

      - name: Write release scripts + config
        env:
          EXTRA_EXCLUDES: ${{ inputs.extra-rsync-excludes }}
        run: |
          mkdir -p .forgejo-release
          cat > .forgejo-release/prepare.sh <<'PREP'
          #!/usr/bin/env bash
          set -euo pipefail
          VERSION="$1"
          echo "prepare: building ${APP_NAME} ${VERSION}"
          if [ -f package.json ]; then npm ci || npm install; npm run build; fi
          if [ -f composer.json ]; then composer install --no-dev --optimize-autoloader --classmap-authoritative --ignore-platform-reqs; fi
          mkdir -p "package/${APP_NAME}"
          rsync -a \
            --exclude='/package' --exclude='/.git' --exclude='/.github' --exclude='/.forgejo' \
            --exclude='/.forgejo-release' --exclude='/.claude' --exclude='/.cursor' --exclude='/.vscode' \
            --exclude='/.nextcloud' --exclude='/docker' --exclude='/docker-compose.yml' \
            --exclude='/docs' --exclude='/website' --exclude='/node_modules' --exclude='/src' \
            --exclude='/phpcs-custom-sniffs' --exclude='/resources' --exclude='/tests' --exclude='/data' \
            --exclude='/package.json' --exclude='/package-lock.json' --exclude='/composer.json' \
            --exclude='/composer.lock' --exclude='/composer-setup.php' --exclude='/phpcs.xml' \
            --exclude='/phpmd.xml' --exclude='/psalm.xml' --exclude='/phpunit.xml' --exclude='/phpunit-unit.xml' \
            --exclude='/.phpunit.cache' --exclude='.phpunit.result.cache' --exclude='/jest.config.js' \
            --exclude='/webpack.config.js' --exclude='/tsconfig.json' --exclude='/.babelrc' \
            --exclude='/.eslintrc.js' --exclude='/.prettierrc' --exclude='/stylelint.config.js' \
            --exclude='/.spectral.yml' --exclude='/.gitignore' --exclude='/.gitattributes' \
            --exclude='/.php-cs-fixer.dist.php' --exclude='/.nvmrc' --exclude='/changelog-ci-config.json' \
            --exclude='/coverage.txt' --exclude='/signing-key.key' --exclude='/signing-cert.crt' \
            --exclude='/openapi.json' --exclude='/CHANGELOG.md' --exclude='/CONTRIBUTING.md' \
            ${EXTRA_EXCLUDES:-} \
            ./ "package/${APP_NAME}/"
          sed -i "s|<version>.*</version>|<version>${VERSION}</version>|" "package/${APP_NAME}/appinfo/info.xml"
          printf '%s' "${NEXTCLOUD_SIGNING_KEY}" > signing-key.key
          printf '%s' "${NEXTCLOUD_SIGNING_CERT}" > signing-cert.crt
          (cd package && tar -czf ../nextcloud-release.tar.gz "${APP_NAME}")
          echo "prepared tarball:"; du -h nextcloud-release.tar.gz
          PREP
          cat > .forgejo-release/publish.sh <<'PUB'
          #!/usr/bin/env bash
          set -euo pipefail
          VERSION="$1"
          REPO="${GITHUB_REPOSITORY}"
          TAG="v${VERSION}"
          ASSET="${APP_NAME}-${VERSION}.tar.gz"
          # semantic-release already created+pushed tag ${TAG}; create the Codeberg release object for it.
          # Retry transient Codeberg API errors (empty body / 5xx during instability) up to 5x.
          REL_ID=""
          for attempt in 1 2 3 4 5; do
            REL=$(curl -s -X POST "https://codeberg.org/api/v1/repos/${REPO}/releases" \
              -H "Authorization: token ${CODEBERG_TOKEN}" -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"${TAG}\",\"target_commitish\":\"${GITHUB_SHA}\",\"name\":\"Release ${VERSION}\",\"draft\":false,\"prerelease\":false}")
            echo "Codeberg release POST attempt ${attempt}: $(printf '%s' "${REL}" | head -c 200)"
            REL_ID=$(echo "${REL}" | jq -r '.id // empty')
            [ -n "${REL_ID}" ] && break
            REL_ID=$(curl -s -H "Authorization: token ${CODEBERG_TOKEN}" \
              "https://codeberg.org/api/v1/repos/${REPO}/releases/tags/${TAG}" | jq -r '.id // empty')
            [ -n "${REL_ID}" ] && break
            sleep 6
          done
          [ -n "${REL_ID}" ] || { echo "ERROR: no release id after 5 attempts"; exit 1; }
          curl -s -X POST "https://codeberg.org/api/v1/repos/${REPO}/releases/${REL_ID}/assets?name=${ASSET}" \
            -H "Authorization: token ${CODEBERG_TOKEN}" -F "attachment=@nextcloud-release.tar.gz" >/dev/null
          echo "Codeberg release ${TAG} asset uploaded (id ${REL_ID})"
          # ---- Nextcloud App Store ----
          REG_SIG=$(printf '%s' "${APP_NAME}" | openssl dgst -sha512 -sign signing-key.key | openssl base64 -A)
          # Register the app (new apps) — non-fatal (already-registered returns an error), but SURFACE the response.
          REG=$(curl -s -w $'\n[http %{http_code}]' -X POST "https://apps.nextcloud.com/api/v1/apps" \
            -H "Authorization: Token ${NEXTCLOUD_APPSTORE_TOKEN}" -H "Content-Type: application/json" \
            -d "{\"certificate\": $(jq -Rs . < signing-cert.crt), \"signature\": \"${REG_SIG}\"}" || true)
          echo "App Store register (${APP_NAME}) response: ${REG}"
          SIGNATURE=$(openssl dgst -sha512 -sign signing-key.key nextcloud-release.tar.gz | openssl base64 -A)
          DOWNLOAD_URL="https://codeberg.org/${REPO}/releases/download/${TAG}/${ASSET}"
          UP=$(curl -s -o /tmp/up.json -w "%{http_code}" -X POST "https://apps.nextcloud.com/api/v1/apps/releases" \
            -H "Authorization: Token ${NEXTCLOUD_APPSTORE_TOKEN}" -H "Content-Type: application/json" \
            -d "{\"download\": \"${DOWNLOAD_URL}\", \"signature\": \"${SIGNATURE}\", \"nightly\": false}")
          echo "=== App Store upload HTTP ${UP} ==="; cat /tmp/up.json; echo
          [ "${UP}" = "200" ] || [ "${UP}" = "201" ] || { echo "ERROR: App Store upload failed (HTTP ${UP})"; exit 1; }
          echo "Published ${APP_NAME} ${VERSION} to the App Store"
          PUB
          cat > .releaserc.json <<RC
          {
            "repositoryUrl": "https://codeberg.org/${{ github.repository }}.git",
            "branches": ["${{ inputs.release-branch }}"],
            "tagFormat": "v\${version}",
            "plugins": [
              "@semantic-release/commit-analyzer",
              "@semantic-release/release-notes-generator",
              ["@semantic-release/exec", {
                "prepareCmd": "bash .forgejo-release/prepare.sh \${nextRelease.version}",
                "publishCmd": "bash .forgejo-release/publish.sh \${nextRelease.version}"
              }]
            ]
          }
          RC
          echo "--- .releaserc.json ---"; cat .releaserc.json

      - name: Run semantic-release
        env:
          CI: "true"
          APP_NAME: ${{ inputs.app-name }}
          EXTRA_EXCLUDES: ${{ inputs.extra-rsync-excludes }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          CODEBERG_USERNAME: ${{ secrets.CODEBERG_USERNAME }}
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
          NEXTCLOUD_SIGNING_KEY: ${{ secrets.NEXTCLOUD_SIGNING_KEY }}
          NEXTCLOUD_SIGNING_CERT: ${{ secrets.NEXTCLOUD_SIGNING_CERT }}
          NEXTCLOUD_APPSTORE_TOKEN: ${{ secrets.NEXTCLOUD_APPSTORE_TOKEN }}
          GIT_CREDENTIALS: "https://x-access-token:${{ secrets.CODEBERG_TOKEN }}@codeberg.org"
        run: |
          git config --global --add safe.directory "$(pwd)"
          git config --global credential.helper store
          printf '%s\n' "${GIT_CREDENTIALS}" > ~/.git-credentials
          git config --global user.email "release-bot@conduction.nl"
          git config --global user.name "Conduction Release Bot"
          npx semantic-release

