# TEMP: can a Codeberg shared runner build container images? DELETE after.
name: _dockerprobe
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: codeberg-small
    steps:
      - name: inspect builders available
        run: |
          echo "=== docker CLI ==="; which docker && docker version 2>&1 | head -20 || echo "NO_DOCKER_or_DAEMON"
          echo "=== buildah ==="; which buildah || echo no-buildah
          echo "=== podman ==="; which podman || echo no-podman
          echo "=== kaniko ==="; ls /kaniko 2>/dev/null || echo no-kaniko
          echo "=== /var/run/docker.sock ==="; ls -l /var/run/docker.sock 2>/dev/null || echo no-socket
          echo "DONE"
