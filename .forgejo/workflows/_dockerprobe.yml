# TEMP: which image-build tool (if any) works on a Codeberg shared runner?
# Job success/failure encodes availability (logs are member-gated). DELETE after.
name: _dockerprobe
on:
  workflow_dispatch: {}
jobs:
  docker_daemon:
    runs-on: codeberg-small
    steps:
      - run: docker version
  docker_socket:
    runs-on: codeberg-small
    steps:
      - run: test -S /var/run/docker.sock
  buildah:
    runs-on: codeberg-small
    steps:
      - run: buildah --version
  podman:
    runs-on: codeberg-small
    steps:
      - run: podman --version
  trivial_build:
    runs-on: codeberg-small
    steps:
      - run: |
          printf 'FROM scratch\n' > Dockerfile
          docker build -t probe:t .
