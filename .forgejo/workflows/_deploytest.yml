# TEMP: prove org CF secrets + wrangler deploy work end-to-end (no Docusaurus build).
# Deploys a throwaway worker so it clobbers nothing. workflow_dispatch only. DELETE after.
name: _deploytest
on:
  workflow_dispatch: {}
jobs:
  deploy:
    runs-on: codeberg-small
    container:
      image: node:24-bookworm
    timeout-minutes: 5
    steps:
      - name: Make a tiny static site
        run: |
          mkdir -p build
          echo '<!doctype html><meta charset=utf-8><h1>Conduction CI deploy test</h1><p>wrangler + org CF secrets OK</p>' > build/index.html
      - name: Generate wrangler.toml
        run: |
          cat > wrangler.toml <<EOF
          name = "conduction-ci-deploytest"
          compatibility_date = "2026-05-30"

          [assets]
          directory = "./build"
          EOF
          cat wrangler.toml
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx -y wrangler@latest deploy
