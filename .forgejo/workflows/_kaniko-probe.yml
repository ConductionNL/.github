# TEMP: can kaniko (daemonless) build an image on a Codeberg shared runner? DELETE after.
name: _kaniko-probe
on:
  workflow_dispatch: {}
jobs:
  kaniko_build:
    runs-on: codeberg-small
    container:
      image: gcr.io/kaniko-project/executor:v1.23.2-debug
    steps:
      - name: trivial daemonless build (no push)
        shell: sh
        run: |
          mkdir -p /workspace
          printf 'FROM alpine:3.20\nRUN echo hello-from-kaniko > /hello.txt\n' > /workspace/Dockerfile
          /kaniko/executor --context dir:///workspace --dockerfile /workspace/Dockerfile --no-push --verbosity info
          echo "KANIKO_BUILD_OK"
