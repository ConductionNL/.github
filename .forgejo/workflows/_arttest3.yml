# TEMP: does actions/upload-artifact@v3 + download-artifact@v3 work across jobs on Codeberg? DELETE after.
name: _arttest3
on:
  workflow_dispatch: {}
jobs:
  up:
    runs-on: codeberg-tiny
    steps:
      - run: mkdir -p out && echo "hello-v3" > out/f.txt
      - uses: https://github.com/actions/upload-artifact@v3
        with:
          name: t3
          path: out
  down:
    needs: up
    runs-on: codeberg-tiny
    steps:
      - uses: https://github.com/actions/download-artifact@v3
        with:
          name: t3
          path: got
      - run: cat got/f.txt && echo DOWNLOAD_OK_V3
