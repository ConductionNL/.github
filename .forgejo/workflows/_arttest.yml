# TEMP: does actions/upload-artifact@v4 + download-artifact@v4 work across jobs on Codeberg? DELETE after.
name: _arttest
on:
  workflow_dispatch: {}
jobs:
  up:
    runs-on: codeberg-tiny
    steps:
      - run: mkdir -p out && echo "hello-artifact" > out/f.txt
      - uses: https://github.com/actions/upload-artifact@v4
        with:
          name: t
          path: out
  down:
    needs: up
    runs-on: codeberg-tiny
    steps:
      - uses: https://github.com/actions/download-artifact@v4
        with:
          name: t
          path: got
      - run: cat got/f.txt && echo DOWNLOAD_OK
