# TEMPORARY CI self-test — determines which `uses:` form Forgejo expands so the
# called workflow's runs-on propagates (vs the empty-label bug seen fleet-wide).
# workflow_dispatch only. DELETE after diagnosis.
name: _ci-selftest

on:
  workflow_dispatch: {}

jobs:
  baseline-selfcontained:
    name: baseline-explicit-codeberg-small
    runs-on: codeberg-small
    container:
      image: node:24-bookworm
    steps:
      - run: echo "baseline ran on codeberg-small"

  via-local:
    uses: ./.forgejo/workflows/_ci-selftest-target.yml
    with:
      caller: local

  via-short:
    uses: Conduction/.github/.forgejo/workflows/_ci-selftest-target.yml@main
    with:
      caller: short

  via-url:
    uses: https://codeberg.org/Conduction/.github/.forgejo/workflows/_ci-selftest-target.yml@main
    with:
      caller: url
