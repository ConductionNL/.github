name: _callerevt
on:
  workflow_dispatch: {}
jobs:
  on_dispatch:
    if: github.event_name == 'workflow_dispatch'
    runs-on: codeberg-tiny
    steps: [{ run: echo dispatch }]
  not_pr:
    if: github.event_name != 'pull_request'
    runs-on: codeberg-tiny
    steps: [{ run: echo not_pr }]
  always:
    runs-on: codeberg-tiny
    steps: [{ run: echo always }]
