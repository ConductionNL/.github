# Reusable Documentation workflow for Forgejo Actions on Codeberg.
#
# Translated from the GitHub Actions original (ConductionNL/.github
# .github/workflows/documentation.yml). Builds a Docusaurus site and
# deploys it to Cloudflare Pages (Codeberg has no Pages service of its
# own, and the Conduction fleet already publishes each site at
# {app}.conduction.nl on CF Pages).
#
# Compared with the GH original:
#   * `cname` input renamed to `cf-project-name` — it's now the
#     Cloudflare Pages project name, not a GitHub Pages CNAME.
#   * `build-image` input dropped: Codeberg runners have no Docker
#     daemon (Podman only) and Cloudflare Pages itself is the
#     resilience story now — a separate fallback image is redundant.
#   * `peaceiris/actions-gh-pages` replaced by `wrangler pages deploy`.
#   * Jobs run in `node:24-bookworm` containers (canonical Forgejo
#     pattern). 10-minute job cap respected by `timeout-minutes`.

name: Documentation

on:
  workflow_call:
    inputs:
      cf-project-name:
        description: >-
          Cloudflare Pages project name (e.g. 'pipelinq-docs').
          Replaces the GH-original 'cname' input — sites are now
          served from {project}.pages.dev (or a CF custom domain
          configured on the project), not GitHub Pages.
        required: true
        type: string
      source-folder:
        description: "Folder containing the Docusaurus project"
        required: false
        type: string
        default: "docs"
      node-version:
        description: "Node.js version for building"
        required: false
        type: string
        default: "20"

# Two jobs so the AI-baseline validation gate runs on every event,
# including pull_request, while the Cloudflare Pages deploy stays
# gated to push / schedule / workflow_dispatch. Sites that ship the
# postbuild validator from @conduction/docusaurus-preset (robots.txt,
# llms.txt, sitemaps, JSON-LD, FAQPage, og:image, etc.) get PR-time
# enforcement of the contract automatically.

jobs:
  build:
    name: Build and validate
    runs-on: docker
    container:
      image: node:24-bookworm
    timeout-minutes: 10
    outputs:
      built: ${{ steps.flag.outputs.built }}
    steps:
      - name: Checkout code
        uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: https://github.com/actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install dependencies and build
        timeout-minutes: 9
        env:
          # Pass the Codeberg-scoped token through so npm prebuild
          # scripts that hit forge APIs authenticate and avoid
          # anonymous rate limits. The token is run-scoped and
          # expires when the job ends.
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          cd "${{ inputs.source-folder }}"
          rm -rf node_modules/.cache .docusaurus build
          npm run ci

      - name: Verify build output
        run: |
          if [ ! -f "${{ inputs.source-folder }}/build/index.html" ]; then
            echo "ERROR: index.html not found in build directory!"
            exit 1
          fi

      - name: Upload build artifact for deploy job
        if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: https://github.com/actions/upload-artifact@v4
        with:
          name: docusaurus-build
          path: ${{ inputs.source-folder }}/build
          retention-days: 1

      - id: flag
        run: echo "built=true" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to Cloudflare Pages
    needs: build
    runs-on: docker
    container:
      image: node:24-bookworm
    timeout-minutes: 10
    # Deploy only on direct pushes, scheduled rebuilds, and manual
    # workflow_dispatch. PR runs stop after the build job, so the
    # AI-baseline gate runs but no deploy happens.
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download build artifact from build job
        uses: https://github.com/actions/download-artifact@v4
        with:
          name: docusaurus-build
          path: ${{ inputs.source-folder }}/build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          npx -y wrangler@latest pages deploy "${{ inputs.source-folder }}/build" \
            --project-name="${{ inputs.cf-project-name }}" \
            --branch="${{ github.ref_name }}" \
            --commit-hash="${{ github.sha }}" \
            --commit-message="Deploy from Codeberg Actions (${GITHUB_SHA:0:7})"

      - name: Verify deployment
        run: |
          echo "Deployed ${{ inputs.cf-project-name }} from ${{ github.ref_name }} (${GITHUB_SHA:0:7})"
