# expect.conf — read by scripts/lib/test_gate_acceptance_matrix.sh
#
# Columns:
#   gate <n> <log-basename|-> <planted-verdict> <clean-verdict> <subject-substring>
#
# Bundle: adr-number-collision — gate-95 (adr-number-collision).
#
# The two arms differ in ONE thing: which number the second document claims.
# planted/ has two files both claiming ADR-081; clean/ has the same two
# documents with the second renumbered to 108. Nothing else changes — same
# titles, same bodies, same directory — so a gate that graded on file count,
# on directory contents, or on anything other than the claimed NUMBER would
# misgrade this pair.
#
# The subject is `ADR-081` rather than a filename, and that is the load-bearing
# part. This gate's whole reason to exist is that a duplicated number is
# SILENT: nothing errors while a citation key resolves to two documents, so the
# finding is only useful if it NAMES the number a reader has to go and
# disambiguate. A bare "2 collisions" tells nobody which citations are now
# suspect.
#
# The pair is taken from the real 2026-08-26 state rather than invented.
# ADR-081 was claimed by THREE documents at once — Vue 3 migration, money and
# effort ownership, and public surface placement — while being cited fleet-wide
# as the Vue 3 authority. It is trimmed to two here because two is the minimum
# that expresses the defect, and the matrix wants the arms to differ in exactly
# one property.
#
# clean/ keeps ADR-081 on the Vue 3 document deliberately: the fix renumbered
# by USAGE, not by seniority. The fleet's citations of "ADR-081" mean Vue 3, so
# that document keeps the number and the other one moves. A fixture that moved
# the Vue 3 document instead would encode the wrong rule as the passing state.
gate 95 hydra-gate-adr-number-collision.log FAIL PASS ADR-081
