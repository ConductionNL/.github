# expect.conf — read by scripts/lib/test_gate_acceptance_matrix.sh
#
# Columns:
#   gate <n> <log-basename|-> <planted-verdict> <clean-verdict> <subject-substring>
#
# Bundle: manifest-l10n-coverage — gate-101 (manifest-l10n-coverage).
#
# The two arms differ in ONE thing: whether l10n/nl.json carries a key for the
# manifest's `Flow` label. The manifests are byte-identical. Same menu, same
# page, same Dashboard entry translated in both — so a gate that graded on
# manifest size, on key COUNT, or on anything other than which manifest strings
# are covered would misgrade this pair.
#
# `Dashboard` is translated in both arms deliberately. Without it the planted
# arm would have an empty-ish catalogue, and a gate that failed on "catalogue
# looks unpopulated" rather than on the specific uncovered string would pass
# this fixture for the wrong reason.
#
# The subject is `Flow` rather than a count, and that is the load-bearing part.
# This gate exists because the failure is SILENT: a manifest string with no key
# falls back to its English source, so the page renders English and nothing
# errors. A bare "1 uncovered string" tells nobody which label a Dutch user is
# reading in English.
#
# The pair is taken from a real regression rather than invented. buildiq #485
# added a Flows settings section on 2026-08-27, which put `Flow` in the
# manifest with no nl.json key. It merged green: `check:l10n-js` compares
# nl.json to nl.js and both files were at 1,045 keys, both missing the string,
# so they were perfectly in sync. keepiq #448 did the same thing hours earlier
# with `Registered by` and `Requested`. Two apps, same day, same shape, nothing
# to catch it.
#
# clean/ adds `Flow -> "Flow"` rather than inventing a Dutch word. Dutch
# Nextcloud keeps the product term, and decidiq, dossiq, openregister, keepiq,
# portaliq, pipelinq and filinq all carry that exact mapping. A fixture whose
# passing state translated it to something else would encode the wrong rule.
gate 101 hydra-gate-manifest-l10n-coverage.log FAIL PASS Flow
