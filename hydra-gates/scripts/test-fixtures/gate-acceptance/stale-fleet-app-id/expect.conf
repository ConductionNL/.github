# expect.conf — read by scripts/lib/test_gate_acceptance_matrix.sh
#
# Bundle: stale-fleet-app-id — gate-115.
#
# THE TWO ARMS DIFFER IN ONE FILE, DocumentGateway.php, AND NOTHING ELSE.
# `diff -rq planted clean` reports exactly that one file. Everything the gate
# must NOT fire on is byte-identical in both arms, so a widened checker turns
# the CLEAN arm red rather than leaving the planted one green:
#
#   Fallbacks.php      prose naming openconnector, docudesk and decidesk, in a
#                      `//` comment AND in a block comment whose continuation
#                      lines start with an ordinary word; a dual-spelling event
#                      array listing Decidiq above Decidesk; and two CURRENT
#                      register slug constants.
#   MigrateOwnRows.php this app's OWN former id and former namespace, which is
#                      what a migration repair step has to spell.
#
# So: a gate that stops skipping comments, that widens the dual-spelling accept
# back to the whole file, that forgets an app may name its own former id, or
# that fires on a slug the owning app still uses, all fail the clean arm.
#
# THE RETIRED SLUG SITS IN THE PLANTED ARM, and it did not always. It was in
# the shared file while slugs were excluded from the count. Ruben's ruling on
# 2026-09-10 made a consumer pinned to a migrated slug a defect rather than a
# policy question, and this bundle caught the consequence immediately: a
# finding cannot live in the file both arms share, because it then fires in
# the arm that must stay silent. The current-slug constants stay shared, as
# the control that the rule is about slugs that MOVED and not about the word
# "register" sitting next to an app name.
#
# WHY THE PLANTED VERDICT IS WARNING RATHER THAN FAIL. gate-115 ships
# advisory: 8 of the 21 core apps carry findings on inherited debt, and a gate
# that reds a third of the fleet on merge is a gate nobody enables.
# `HYDRA_GATE_STALE_FLEET_APP_ID_BLOCKING=1` makes it FAIL per repo. WARNING is
# a real verdict — the gate ran and found something — so grading it here pins
# the shipped behaviour rather than a hypothetical one. If the fleet is worked
# down and the gate is promoted, this line is what has to be edited, so the
# promotion cannot happen by accident.
#
# The subject is the FILE, not a count: a bare number would be satisfied by a
# gate that flagged the wrong line.
gate 115 hydra-gate-stale-fleet-app-id.log WARNING PASS lib/Service/DocumentGateway.php
