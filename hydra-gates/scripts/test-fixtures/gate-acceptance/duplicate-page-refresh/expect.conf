# expect.conf — read by scripts/lib/test_gate_acceptance_matrix.sh
#
# Columns:
#   gate <n> <log-basename|-> <planted-verdict> <clean-verdict> <subject-substring>
#
# Bundle: duplicate-page-refresh — gate-105.
#
# WHAT DRIVES THE RULE. CnActionsMenu renders Refresh as the FIRST item of the
# page-level Actions menu and `showRefresh` defaults to TRUE, so a surface that
# declares a Refresh of its own ships two. Five fleet surfaces did on
# 2026-08-31, which is what a user reported on the dossiq dashboard.
#
# ⚠️ TWO ROWS, BECAUSE THE DEFECT HAS TWO SHAPES IN TWO FILE KINDS, and each is
# independently fatal. A checker that caught one still fails this arm:
#
#   src/manifest.json        a `"type": "refresh"` headerAction on a dashboard
#   src/views/Dashboard.vue  a Refresh button in the `#actions` slot
#
# Three fleet apps had the first and two had the second, so a manifest-only
# fixture would have passed a Vue-blind checker and taught us nothing.
#
# THE CLEAN ARM IS NOT MERELY REFRESH-FREE. It keeps three near-misses that a
# widened gate would turn red, and each is a shape the fleet actually ships:
#
#   * `Reports` (manifest) and `ReportView.vue` BOTH keep their own Refresh and
#     stand the menu item down with `showRefresh: false`. That is openregister's
#     dashboard, and it is the exception the rule genuinely has: the gate bans
#     shipping BOTH, not having a Refresh button. A gate that ignored the opt-out
#     turns the clean arm red.
#   * `renew-consent` carries `"icon": "Refresh"` on an `api-call` action. That
#     is shillinq's real action. A gate keying on the icon rather than on
#     `"type": "refresh"` fires here.
#   * `Dashboard.vue`'s `#actions` slot holds an HTML COMMENT quoting the very
#     markup that was removed, `<Refresh :size="20" />` and a quoted label. This
#     gate's own remedy writes such a comment on every surface it touches, so a
#     checker that greps raw text flags the files it just cleaned.
#
# NOT APPLICABLE over this fixture is a FAILURE, never an excuse: both arms ship
# dashboard pages and a CnDashboardPage host, so an empty-scope verdict means
# the gate stopped recognising its own subject matter.
gate 105 hydra-gate-duplicate-page-refresh.log FAIL PASS src/manifest.json
gate 105 hydra-gate-duplicate-page-refresh.log FAIL PASS src/views/Dashboard.vue
