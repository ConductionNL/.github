#
# Bundle: cross-app-schema-slug — gate-106.
#
# WHAT DRIVES THE RULE. A schema slug is GLOBAL on a shared OpenRegister.
# SchemaMapper::find() matches on LOWER(slug) across every application and
# returns the first row it fetches, and descriptors write relations as a bare
# `"$ref": "Person"`. Two apps that pick the same word resolve to each other,
# silently. Measured 2026-08-31: 20 slugs claimed by more than one app across
# the fleet's shipped registers, 35 duplicated slugs live.
#
# THE PLANTED ARM claims `product`, which contracts/fleet-schema-slugs.json
# records as pipelinq's. That is the whole defect in one line.
#
# THE CLEAN ARM IS NOT MERELY COLLISION-FREE. It keeps three near-misses that a
# widened gate turns red, and each is a shape the fleet actually ships:
#
#   * register.d/mcp-adoption.json addresses the schema keyed `product` and
#     declares NO slug — it only adds `configuration`. larpinq ships exactly
#     this against the schema keyed `skill`, whose slug is `larping_skill`. The
#     FIRST DRAFT of the baseline generator read that key as a claim and
#     reported larpinq as still owning `skill` three days after the rename
#     shipped. A checker that reads a key as a claim fails here.
#   * keepiq_mock_register.json declares `product` in a MOCK. A mock is demo
#     data; RegisterDescriptorService skips it in the inventory for the same
#     reason, and a slug only a mock declares is not the app claiming the word.
#   * pipelinq_shipped_alongside.json sits in keepiq's tree but declares
#     `"app": "pipelinq"`. The DECLARING app owns the slug, not the directory —
#     openregister ships exactly this shape. A checker keyed on info.xml alone
#     fires here.
#
# NOT APPLICABLE over this fixture is a FAILURE, never an excuse: both arms ship
# descriptors under lib/Settings, so an empty-scope verdict means the gate
# stopped recognising its own subject matter.
gate 106 hydra-gate-cross-app-schema-slug.log FAIL PASS lib/Settings/keepiq_register.json
