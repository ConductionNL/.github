#
# Columns:
#   gate <n> <log-basename|-> <planted-verdict> <clean-verdict> <subject-substring>
#
# Bundle: repair-registration — gate-98 (ADR-005 rule 1, the other half).
#
# The two arms differ in ONE LINE of info.xml. Both ship the same repair-step
# class; in planted/ that class is named nowhere in <repair-steps>, in clean/ it
# is. That is the entire defect: a step Nextcloud was never told about does not
# run, and nothing at runtime can notice — by the time anyone looks, the only
# evidence is a register that does not exist.
#
# BOTH ARMS ALSO SHIP RepairPathHelper, WHICH IS NOT A REPAIR STEP. It lives
# under lib/Repair/, is absent from info.xml in both arms, and MUST be clean in
# both. That is what makes the clean arm load-bearing rather than trivially
# green: a checker keyed on the directory demands an info.xml entry for it and
# fails clean/, and a gate that fails on files the framework never looks for
# teaches people to stop reading it.
#
# Its docblock also NAMES IRepairStep, in a sentence explaining that it is not
# one. A checker written as a raw-text grep reports the sentence describing the
# rule as a violation of it — the same defect gate-2 was rewritten for after
# `"select dd(x)"` was filed as a finding.
#
# Subject substring is the step's path: a gate that fails for an unrelated
# reason, or reports a bare count, does not name it.
gate 98 hydra-gate-repair-registration.log FAIL PASS lib/Repair/ImportFixtureRegister.php
