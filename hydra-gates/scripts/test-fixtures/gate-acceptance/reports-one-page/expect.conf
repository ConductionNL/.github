# expect.conf — read by scripts/lib/test_gate_acceptance_matrix.sh
#
# Columns:
#   gate <n> <log-basename|-> <planted-verdict> <clean-verdict> <subject-substring>
#
# Bundle: reports-one-page — gate-104 (ADR-112).
#
# 🔑 THE ARMING INGREDIENT, AND WHY THE CORPUS CANNOT SUPPLY IT
# ------------------------------------------------------------
# gate-104 is inert unless the manifest declares a `type: "reports"` page.
# Measured across the fleet on 2026-08-31, NO app declares one — the page type
# shipped the same day — so a corpus sweep finds only apps where the gate is
# NOT APPLICABLE. That is exactly how a gate gets added to the runner and never
# tested: it reports "passed" everywhere because it inspected nothing.
#
# It is not hypothetical here. The checker's first version read `.pages` off
# the wrapper `assembleFromDir` returns ({manifest, inputs, expansion}), saw
# zero pages in every repo, and called all four of its own unit fixtures NOT
# APPLICABLE. Run only against real apps, that bug was invisible.
#
# ⚠️ THREE ROWS, BECAUSE THE RULE HAS THREE DIRECTIONS. The driver grades a
# VERDICT plus ONE named subject, so a one-row bundle stays green over a
# regression that leaves the other two findings standing.
#
#   two type:"reports" pages          -> ADR-112 Decision 1
#   the Reports entry outside footer  -> ADR-112 Decision 3
#   a report carded AND in the menu   -> ADR-112 Decision 2
#
# The CLEAN arm applies the remedy the gate prescribes to all three: drop the
# second reports page, move the entry to `section: "footer"` at order 95 (so it
# renders between Documentation at 90 and Features & roadmap at 100), and
# retire the carded report's own menu entry. Fixing only one leaves the others
# red, which is the point.
#
# ANTI-WIDENING, both arms:
#   * `ThingDetail` is a page no card names and no report. A gate widened to
#     "every page must be a card" turns the clean arm red on it.
#   * The clean arm still HAS a reports page, so a gate that fell back to
#     NOT APPLICABLE would pass the clean arm for the wrong reason. NOT
#     APPLICABLE over this bundle is a FAILURE, never an excuse: both arms are
#     built to arm the gate.
gate 104 hydra-gate-reports-one-page.log FAIL PASS ADR-112 Decision 1 allows one
gate 104 hydra-gate-reports-one-page.log FAIL PASS not "footer"
gate 104 hydra-gate-reports-one-page.log FAIL PASS already lists as a card
