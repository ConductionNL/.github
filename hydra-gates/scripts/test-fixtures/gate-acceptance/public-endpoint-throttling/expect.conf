# expect.conf — read by scripts/lib/test_gate_acceptance_matrix.sh
#
# Columns:
#   gate <n> <log-basename|-> <planted-verdict> <clean-verdict> <subject-substring>
#
# Bundle: public-endpoint-throttling — gate-82 (ADR-082).
#
# TWO PLANTS, ONE PER FORM OF THE MARKER, and each names a different file so
# neither can be satisfied by the other:
#
#   AnnotationController.php  @PublicPage — the LEGACY annotation
#   AttributeController.php   #[PublicPage] — the attribute
#
# Splitting them is the whole point of this gate. The fleet sweep that closed
# ADR-082 handled only the attribute form and reported the fleet fully
# throttled; counting both forms found 200 unthrottled endpoints, 199 of them
# in the form it could not see. A single-plant fixture would be satisfied by a
# checker with exactly that blind spot.
#
# clean/ is NOT "planted with the ceilings added". Three things are carried in
# it that a regressed gate would trip over:
#
#   * clean/AnnotationController.php MENTIONS `#[PublicPage]` in docblock prose.
#     If the gate ever matches the marker anywhere in a comment rather than
#     requiring the tag alone on its line, this arm goes red — catching the
#     overcount that once inflated a fleet figure to 223 by ~30%, all in the
#     alarming direction.
#   * clean/AttributeController.php puts a NON-public method directly below a
#     public one. The gate reads markers by scanning UP from a `function` line;
#     a scan that does not stop at real code would inherit the marker and report
#     a method that is not reachable at all.
#   * clean/Service/InertMarkerService.php carries a real @PublicPage on an
#     unrouted class — the shape found in opencatalogi PublicationService. It
#     must be reported as inert, never counted, or the gate produces findings
#     nobody can fix.
gate 82 hydra-gate-public-endpoint-throttling.log FAIL PASS Controller/AnnotationController.php
gate 82 hydra-gate-public-endpoint-throttling.log FAIL PASS Controller/AttributeController.php
