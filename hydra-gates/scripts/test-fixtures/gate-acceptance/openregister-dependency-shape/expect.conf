# expect.conf — read by scripts/lib/test_gate_acceptance_matrix.sh
#
# Columns:
#   gate <n> <log-basename|-> <planted-verdict> <clean-verdict> <subject-substring>
#
# Bundle: openregister-dependency-shape — gate-66 (ADR-083).
#
# ONE ROW PER PLANT, and each subject names a DIFFERENT file, so no plant can
# be satisfied by another. The three plants exercise three independent checks:
#
#   LookupService.php      rule 1 — a container lookup, the dependency as a string
#   InheritingService.php  rule 2 — an OpenRegister type in a class header
#   StatsService.php       rule 3 — reached from the default route, so the start
#                                   screen cannot boot without OpenRegister
#
# Rule 3's subject is the SERVICE, not the controller, on purpose. The finding
# reads "<controller> the default route reaches <service> … via <chain>", and
# naming the service is what proves the walk actually traversed the constructor
# graph. A subject of `PageController.php` would also be satisfied by the
# direct-reference branch of the same check, which is a different defect.
#
# clean/ is not merely "planted with the violations deleted":
#
#   * StatsService.php is carried over VERBATIM. Constructor injection is the
#     shape ADR-083 ASKS for, so a checker that flagged the app for merely
#     containing an OpenRegister-dependent service would fail this arm.
#   * clean/LookupService.php NAMES the container form in its docblock. If the
#     check ever reads raw source instead of comment-free source, this arm goes
#     red — a gate that a sentence in a comment can switch off is caught here
#     rather than in production.
gate 66 hydra-gate-openregister-dependency-shape.log FAIL PASS Service/LookupService.php
gate 66 hydra-gate-openregister-dependency-shape.log FAIL PASS Service/InheritingService.php
gate 66 hydra-gate-openregister-dependency-shape.log FAIL PASS Service/StatsService.php
