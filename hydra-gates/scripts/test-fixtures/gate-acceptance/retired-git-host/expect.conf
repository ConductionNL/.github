# expect.conf — read by scripts/lib/test_gate_acceptance_matrix.sh
#
# Columns:
#   gate <n> <log-basename|-> <planted-verdict> <clean-verdict> <subject-substring>
#
# Bundle: retired-git-host — gate-94 (retired-git-host-metadata).
#
# The two arms differ ONLY in the host the shipped URLs point at. clean/ uses
# github.com + raw.githubusercontent.com; planted/ uses codeberg.org, which
# ConductionNL retired on 2026-07-23.
#
# planted/ is representative of the fleet's ACTUAL state on 2026-08-22: 23 apps
# still shipped exactly this shape — <bugs>, <website>, <repository> and
# <screenshot> all pointing at codeberg.org/Conduction/<app>, a month after the
# last codeberg remote was removed. appinfo/info.xml is published to the
# Nextcloud app store, so <bugs> sent bug reporters to a tracker nobody reads
# and <screenshot> 404'd in the listing.
#
# The subject substring is `codeberg.org` rather than a field name: the gate's
# finding is "this URL points at a retired host", and the URL is the subject a
# human needs to see. A gate that reported only a count — "3 shipped URL(s)
# point at a retired git host" — would pass a nonzero-exit check for free while
# telling nobody WHICH url, which is the failure shape this whole suite exists
# to catch.
#
# Both arms carry a <screenshot> whose path is identical between them, so a
# checker that keyed on the path rather than the host would misgrade the pair.
# Both also carry a non-URL mention of the word "codeberg" in <description> —
# gate-94 is scoped to URL-bearing FIELDS, not to the file's prose, and a
# scanner that grepped the whole file would fail the clean/ arm on that line.
gate 94 hydra-gate-retired-git-host-metadata.log FAIL PASS codeberg.org
