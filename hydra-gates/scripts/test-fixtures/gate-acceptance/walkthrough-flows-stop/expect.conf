# expect.conf — read by scripts/lib/test_gate_acceptance_matrix.sh
#
# Columns:
#   gate <n> <log-basename|-> <planted-verdict> <clean-verdict> <subject-substring>
#
# Bundle: walkthrough-flows-stop — gate-70.
#
# 🔑 THE ARMING INGREDIENT, AND WHY THE CORPUS CANNOT SUPPLY IT
# ------------------------------------------------------------
# gate-70 is inert unless the manifest declares BOTH a `type: "flows"` page and
# an enabled `walkthrough` with at least one tour. Measured across the 20 fleet
# manifests on 2026-08-27: 19 apps had a walkthrough, 12 had a flows page, and
# exactly ONE tour mentioned flows — so a corpus sweep finds either apps where
# the gate cannot fire, or the single app that already complies. Neither drives
# the rule. This bundle supplies both ingredients deliberately.
#
# ⚠️ TWO ROWS, BECAUSE THE RULE HAS TWO DIRECTIONS. The driver grades a VERDICT
# plus ONE named subject, so a one-row bundle stays green over a regression
# that leaves the other finding standing. And these two pull OPPOSITE ways: a
# repair that satisfies one by overshooting into the other is exactly what the
# pair is here to catch.
#
#   tours[0] "wfsfx:getting-started"  a flows page ships and no step targets it
#                                     -> rule=missing-flows-stop
#   tours[1] "wfsfx:forcing"          a step DOES target it, but advances only
#                                     on `object-created` with no
#                                     `allowManualNext`, so the tour cannot be
#                                     finished without authoring a flow
#                                     -> rule=forcing-flows-stop
#
# The CLEAN arm applies the remedy the gate prescribes to BOTH tours: one
# view-only stop (`optional` + `allowManualNext` + a `route-match` advance).
# Turning only one tour green leaves the other arm red, which is the point.
#
# ANTI-WIDENING near-misses, both arms:
#   * `ThingDetail` is a page NO tour step points at, and must stay clean. A
#     gate widened to "every page needs a tour stop" turns the clean arm red.
#   * the `Things` nav entry IS targeted, by menu id `Things` — which equals
#     its route. `Flows` is targeted by route `Flows` while its MENU id is
#     `FlowsMenu`. A gate that compared menu ids instead of routes would call
#     the clean arm non-compliant; a gate that compared only page ids would
#     miss `Things`. Both keys are exercised on purpose.
#
# NOT APPLICABLE over this fixture is a FAILURE, never an excuse: the bundle is
# built to arm the gate, so a NOT-APPLICABLE verdict means the gate stopped
# recognising its own subject matter.
gate 70 hydra-gate-walkthrough-flows-stop.log FAIL PASS rule=missing-flows-stop
gate 70 hydra-gate-walkthrough-flows-stop.log FAIL PASS rule=forcing-flows-stop
gate 70 hydra-gate-walkthrough-flows-stop.log FAIL PASS rule=unanchorable-flows-stop
