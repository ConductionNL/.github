#
# Bundle: a11y-noise — gate-35 (img-alt-empty-only) and gate-36
# (tabindex-positive), the last two raw greps in the 31–36 family. Repaired
# 2026-08-12 in opposite directions, which is why both arms carry weight.
#
# gate-35 was BLIND. Its noun list was `\b`-anchored, and `\b` is a
# WORD-character boundary, so `avatarUrl` / `thumbnailUrl` / `photoUrl` /
# `pictureUrl` — and `avatar_url`, since `_` is a word character — could not
# match. A seven-image probe in which every image was a violation reported 3.
#   planted/  nine violations, one MECHANISM per file (see below).
#   clean/    THE ANTI-WIDENING ARM, and the reason this bundle exists rather
#             than a unit test. `photographerBio`, `gallery.pictures` and
#             `thumbnails` all CONTAIN a content noun as a substring and are
#             all fine. A matcher taught to see `<noun>Url` by relaxing to a
#             substring would light up every one of them and start the cycle
#             this repair exists to avoid. Also here: a real `:alt`, a
#             decorative-by-name `uploadIcon` (docudesk's live shape, the only
#             `alt=""` in the fleet) and a decorative-by-shape static asset.
#
# gate-36 was NOISY. A raw `grep -rnE` reported
#   <!-- never write tabindex="5" ... -->
# as a positive tabindex — gate-32's #236 shape, where the comment documenting
# the rule scores as a violation of it.
#   clean/    the HTML-comment form, a JS-comment form inside `<script>`, a
#             `.js` comment, plus `tabindex="0"`, `tabindex="-1"` and a bound
#             `:tabindex`.
#   planted/  `tabindex="5"` in a template, `tabindex='12'` single-quoted, and
#             `tabindex="4"` inside a `.js` string. That last one is the
#             assertion that the noise was removed by masking COMMENTS and not
#             by narrowing to the markup scope: `markup_mask` would blank
#             `<script>` and PHP wholesale and take the true positive with it.
#
# ---------------------------------------------------------------------------
# ⚠️ 2026-08-12, SECOND AUDIT — WHY THE FILES WERE SPLIT AGAIN
# ---------------------------------------------------------------------------
# This bundle was authored to `#380`'s remedy — ONE MECHANISM PER NAMED FILE —
# and `#404` then proved that remedy NECESSARY BUT NOT SUFFICIENT. The stronger
# invariant is:
#
#   🔑 A SUBJECT MUST BE UNSATISFIABLE BY EVERY OTHER FINDING THE BUNDLE CAN
#      PRODUCE — including findings from the SAME file.
#
# The subject here is a FILE PATH, and a file path is satisfied by EVERY finding
# in that file. So a named file holding two mechanisms is vacuous for whichever
# one is lost. Three files here did exactly that, and all three were MEASURED
# green over the regression they exist to pin:
#
#   Faces.vue       held the three `\b`-visible nouns AND the literal
#                   `src='/img/headshot.png' alt=''`. Dropping plain-`src`
#                   support: 9 findings -> 8, both subjects still named,
#                   SUITE GREEN 121/0.
#   FacesCamel.vue  held the four camelCase spellings AND `avatar_url` — which
#                   is a DIFFERENT CODE PATH (`_NON_ALNUM`, not `_CAMEL_1`/
#                   `_CAMEL_2`). Reverting camelCase splitting alone: 9 -> 5,
#                   `avatar_url` kept the file in the log, SUITE GREEN 121/0.
#                   *That is this bundle's headline mechanism, unpinned.*
#   Focus.vue       held `tabindex="5"` AND `tabindex='12'`. Dropping
#                   single-quote support: 3 -> 2, SUITE GREEN 121/0.
#
# The FULL revert was caught in every case (reverting gate-35 to the `\b` noun
# list -> `FAIL — 4`, FacesCamel.vue row red, 120/1). Full-revert-red is the
# test everybody runs, and it is why none of this was noticed.
#
# ✅ THE RULE THAT MAKES A ROW SAFE BY CONSTRUCTION: a named file carrying
# exactly ONE finding cannot be vacuous, because ANY mechanism that finding
# depends on empties the file when lost. Where one finding was not enough to
# state the claim (the noun spellings), every finding in the file rides the SAME
# code path, which is the same guarantee.
#
# One mechanism per named file, now actually one:
#   NounsPlain.vue     three bound `:src` content nouns, `alt=""` — the forms
#                      the OLD `\b` rule already caught, so a repair cannot
#                      trade the old set for the new one. All three ride
#                      `_NON_ALNUM` splitting.
#   NounsCamel.vue     ONLY the four camelCase spellings — `_CAMEL_1`/`_CAMEL_2`
#                      and nothing else. This is the file that must drop out of
#                      the log when camelCase splitting regresses.
#   NounsSnake.vue     ONLY `avatar_url`. Underscore tokenisation shares
#                      `_NON_ALNUM` with NounsPlain.vue TODAY, so this row is an
#                      extra guard against a `\b`-based predicate being
#                      reintroduced rather than an independent code path. Said
#                      plainly because a row that overclaims is how we got here.
#   NounsLiteral.vue   ONLY `src='/img/headshot.png' alt=''`. One finding, four
#                      mechanisms riding on it: plain (unbound) `src`, a
#                      single-quoted attribute VALUE, a single-quoted `alt=''`,
#                      and the `headshot` noun. Losing any one reddens this row;
#                      which one is lost is NOT readable from the failure, and
#                      that is an accepted limit, not an oversight.
#   FocusDouble.vue    ONLY `tabindex="5"` — the double-quoted form.
#   FocusSingle.vue    ONLY `tabindex='12'` — the single-quoted form.
#   render-helpers.js  ONLY a `tabindex="4"` inside a `.js` string, so `.js`
#                      cannot silently leave gate-36's scope. Measured: removing
#                      `-name '*.js' -o -name '*.ts'` from gate-36's `find`
#                      reddens THIS row alone (120/1).
#
# ⚠️ NOT pinned, deliberately: the CONTENT of `SEMANTIC_NOUNS`. Dropping one
# noun leaves its file's siblings standing. The noun set is DATA, not a
# mechanism, and the clean arm constrains it from the other side. Recorded so
# the next audit does not have to rediscover that this was a choice.
#
# ⚠️ THE SUBJECTS ARE PAIRWISE NON-CONTAINING, AND THAT IS CHECKED, NOT ASSUMED.
# `_names` is `grep -qF`, so a subject contained in another finding's line is
# satisfied by that other finding — the `authn-vs-authz` defect (`#404`), where
# `method=preamble` is contained in `method=preambleForbiddenCode`. The files
# were renamed away from `Faces.vue` / `FacesCamel.vue` for exactly this reason:
# `Faces.vue` IS a prefix of `FacesCamel.vue`, and only the `.vue` extension
# separated the two subjects. Relying on an extension as the terminator is
# relying on an accident. The control, run against the real logs:
#
#   for each subject S, for each finding line L not from S's file:
#       grep -qF "S" <<< "L"   ->  rc=1 for every pair       ✅
#
# ⚠️ Measured, and NOT what was predicted: substituting `markup_mask` for the
# comments-only mask — the tempting shortcut, since gates 31/32/35 all use it —
# turns the CLEAN arm red, not a planted row. `markup_mask` dispatches on
# extension and sends `.js` to `html_markup_mask`, which does not understand
# `//`, so the clean arm's `.js` COMMENT starts firing while both planted files
# keep firing. The suite catches the shortcut either way; the prediction about
# WHICH arm goes red was wrong and is recorded here rather than tidied away.
