# expect.conf — read by scripts/lib/test_gate_acceptance_matrix.sh
#
# Columns:
#   gate <n> <log-basename|-> <planted-verdict> <clean-verdict> <subject-substring>
#
# Bundle: openregister-contract-parity — gate-67 (ADR-084).
#
# ADR-084 puts the published contract in two places on purpose: lib/Contract/
# for openregister at RUNTIME (a require-dev package is absent from a
# production install, and `implements` is resolved at autoload), and
# hydra-gates/contracts/ for leaf apps under PHPUnit. Two copies is a drift
# risk; this gate is the mechanism that makes "one definition" true rather
# than aspirational.
#
# ONE ROW PER PLANT, and each subject names a DIFFERENT file, so no plant can
# be satisfied by another. The three plants are three genuinely different ways
# the copies fall out of step, and each fails for its own reason:
#
#   ObjectServiceInterface.php  CONTENT DRIFT — both sides exist, contents
#                               differ. The common case: someone edits one copy.
#   OrphanInterface.php         SHIPPED ONLY — consumers get an interface
#                               OpenRegister does not implement, so a leaf app
#                               type-hints something nothing satisfies.
#   UnshippedInterface.php      CANONICAL ONLY — part of the contract that
#                               never reaches a consumer's vendor/, which is
#                               precisely the gap ADR-084 exists to close.
#
# The equality check is symmetric, so both one-sided plants are needed: a
# checker that only walked lib/Contract/ would pass OrphanInterface, and one
# that only walked the shipped copy would pass UnshippedInterface. Either
# omission leaves a real drift invisible.
#
# clean/ is not "planted with the differences deleted". Its two files are
# byte-identical ACROSS the two trees, which is the entire contract being
# asserted — a checker that compared filenames, or method counts, or anything
# short of the bytes would pass planted/'s content drift too, and this arm is
# where that shortcut gets caught.
#
# The fixture interfaces are deliberately NOT copies of the real ones. The gate
# compares two trees against each other and never against a hard-coded
# expectation, so any pair works — and a fixture that tracked the real contract
# would need updating every time the contract grew, which is how a fixture
# quietly stops being run.
gate 67 hydra-gate-openregister-contract-parity.log FAIL PASS Contract/ObjectServiceInterface.php
gate 67 hydra-gate-openregister-contract-parity.log FAIL PASS OrphanInterface.php
gate 67 hydra-gate-openregister-contract-parity.log FAIL PASS Contract/UnshippedInterface.php
