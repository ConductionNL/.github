# Bundle: page-type — gate-69 (page-type-discipline).
#
# 🔑 WHY A CORPUS SWEEP CANNOT ARM RULE (b)
# ---------------------------------------------------------------------------
# Rule (b) fires only on a `type: "custom"` page whose component renders a
# typed page component AND which carries no `_note` explaining why. Measured
# across the 19-app fleet on 2026-08-20: 58 pages match the first half and
# ALL 58 carry a `_note`, so the rule is inert everywhere in the corpus. The
# reasons are genuine — softwarecatalog/Suites needs the wizard button in
# CnIndexPage's #actions slot, docudesk/Consent fetches from its own PHP
# controller — which is exactly why the note exempts them. The planted page
# below supplies the missing ingredient: the same shape with nothing said.
#
# Rule (a) is armed by a `type:"detail"` page carrying a body-slot widgets[]
# entry. That is hrmq#112: CnPageRenderer renders a bare CnWidgetGrid INSTEAD
# of the typed component, so the page silently never gets its own chrome.
#
# The clean side is not merely "the planted file with the defect deleted": it
# keeps a custom page (scanner) that legitimately has no typed archetype and
# says so, so a PASS proves the exemption works rather than proving the gate
# is asleep.
gate 69 hydra-gate-page-type-discipline.log FAIL PASS page 'widgetDetail' — type:"detail" with 1 page-level body widget
gate 69 hydra-gate-page-type-discipline.log FAIL PASS page 'widgets' — declared type:"custom" but its component
