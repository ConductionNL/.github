# expect.conf — read by scripts/lib/test_gate_acceptance_matrix.sh
#
# Columns:
#   gate <n> <log-basename|-> <planted-verdict> <clean-verdict> <subject-substring>
#
# Bundle: exclusion-evidence — gate-113.
#
# WHAT THE PAIR PINS
# ------------------
# The two arms carry a BYTE-IDENTICAL spec, with a byte-identical exclusion
# naming the same PHPUnit class:
#
#   @e2e exclude reconciliation runs below the HTTP surface, asserted by
#                GhostServiceTest::testGhostRowIsDropped
#
# The ONLY difference is whether tests/unit/GhostServiceTest.php exists. So
# the pair cannot be passed by a gate that grades the reason's WORDING, its
# length, or whether it looks test-shaped — every one of those is identical in
# both arms. It has to go and look for the artifact. That lookup is the gate,
# and it is what `exclusion_reason.py` says in its own docstring it will not do:
# "reasons naming a test artifact hold, reasons naming a state of the world
# rot ... Judging that needs a purpose-built check, not a len()".
#
# The clean arm is also the regression control for the OTHER direction: a gate
# that reported every citation as unresolved would fail it, and a repo cannot
# then be told to delete a reason that was correct all along.
#
# The subject names the CLASS, because a finding that says "1 unresolved
# exclusion" without naming what could not be found is not actionable.
gate 113 hydra-gate-exclusion-evidence.log FAIL PASS GhostServiceTest
