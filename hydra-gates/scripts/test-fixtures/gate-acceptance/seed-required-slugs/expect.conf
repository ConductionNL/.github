#
# Bundle: seed-required-slugs — gate-109.
#
# WHAT DRIVES THE RULE. `tests/e2e/ci-seed.sh` checks, before Playwright starts,
# that the schemas the suite needs actually imported — against a hard-coded list
# of slugs. Rename a slug without renaming that list and the seed exits non-zero
# and takes Playwright with it, so EVERY SPEC REPORTS AS NOT RUN rather than as
# failing. The leg reads as one broken seed instead of a suite that never
# executed.
#
# Measured 2026-09-05, three apps in one afternoon: planninq
# (`timeEntry` -> `plannedTimeEntry`, #575), buildiq (`agent` -> `buildAgent`,
# #686) and decidiq (an action id, renamed weeks earlier, answering 404 the
# whole time). Each rename shipped a repair step in both `<post-migration>` and
# `<install>` — thorough about the data, and each missed this one list.
#
# THE PLANTED ARM requires `timeEntry` while the descriptor declares
# `plannedTimeEntry`. That is the whole defect in one line.
#
# THE CLEAN ARM IS NOT MERELY CORRECT. It keeps the near-miss that broke the
# first draft of this checker:
#
#   * register.d/40-adds-a-property.json addresses the schema keyed `TimeEntry`
#     to add one property and declares NO slug. A checker that unions slugs
#     FILE BY FILE reads that key as a claim, and then the renamed-away word
#     `timeEntry` resolves against it case-insensitively — so the PLANTED arm
#     passed. The fix is to build the MERGED view first: a slug field wins
#     wherever any file declares one, and the key counts only when none does.
#     larpinq ships exactly this shape against `skill`, whose slug is
#     `larping_skill`, and it is the same near-miss gate 106's fixture records.
#
# NOT APPLICABLE over this fixture is a FAILURE, never an excuse: both arms ship
# a ci-seed.sh with a schema list, so an empty-scope verdict means the gate
# stopped recognising its own subject matter.
gate 109 hydra-gate-seed-required-slugs.log FAIL PASS tests/e2e/ci-seed.sh
