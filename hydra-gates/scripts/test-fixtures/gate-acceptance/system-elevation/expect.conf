# expect.conf — read by scripts/lib/test_gate_acceptance_matrix.sh
#
# Columns:
#   gate <n> <log-basename|-> <planted-verdict> <clean-verdict> <subject-substring>
#
# Bundle: system-elevation — gate-96 (system-elevation-reachability, ADR-099
# rule 9).
#
# The two arms differ in ONE method body. Both ship the same controller class
# and the same migration; in planted/ the controller elevates, in clean/ it
# refuses and names what is missing instead.
#
# THE MIGRATION IS IN BOTH ARMS, DELIBERATELY. It elevates in both, and must
# be clean in both. Without it the planted arm would pass for a gate that
# banned elevation outright, which is not the rule — the rule is about WHO may
# reach it. A gate that failed the migration too would look identical on the
# planted arm and would be wrong about the only distinction that matters.
#
# THE CLEAN CONTROLLER MENTIONS THE FORBIDDEN CALL TWICE — once in a docblock
# sentence, once inside a string literal in the refusal message it throws.
# That is what makes this arm load-bearing rather than trivially green: a
# checker written as a raw-text grep reports the sentence describing the rule
# as a violation of it, and would fail this arm. It is the same defect gate-2
# was rewritten for after `"select dd(x)"` and a comment saying "never use
# var_dump( here" were both reported as findings.
#
# Subject substring is the controller's path: a gate that fails for an
# unrelated reason, or reports a bare count, does not name it.
gate 96 hydra-gate-system-elevation.log FAIL PASS lib/Controller/ObjectImportController.php
