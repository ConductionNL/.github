# Bundle: app-chrome — gate-107 (ADR-114).
#
# 🔑 THE ARMING INGREDIENT, AND WHY THE CORPUS CANNOT SUPPLY IT
# ------------------------------------------------------------
# There is no real app that is clean for this gate except dossiq, and there is
# no real app whose defects are the five below and nothing else. Measured
# 2026-09-03 across the 21 core apps: ONE carries all seven chrome items.
# Pointed at the corpus, this gate reds almost everything, which grades nothing
# — a bundle needs an arm that PASSES to prove the gate can tell the two apart.
#
# ⚠️ FIVE ROWS, BECAUSE THE RULE HAS FIVE DIRECTIONS. The driver grades a
# VERDICT plus ONE named subject, so a one-row bundle stays green over a
# regression that leaves the other four findings standing.
#
#   Documentation outside `footer`   -> Decision 1 (placement)
#   no Flows surface at all          -> Decision 6 / ADR-110 D4 (presence)
#   a hand-rolled Admin settings link-> Decision 2 (the shell already draws it)
#   Reports below Features & roadmap -> Decision 1 (footer sequence)
#   Personal settings suppressed     -> Decision 1 item 6 (reachability)
#
# The CLEAN arm applies the remedy the gate prescribes to all five: move
# Documentation to `footer`, add the Flows page and its settings-foldout entry,
# delete the hand-rolled link, put Reports back above Features & roadmap, and
# give Personal settings a way to be reached. Fixing only one leaves the others
# red, which is the point.
#
# ⚠️ STORE AND REPORTS ARE PRESENT AND CORRECT IN **BOTH** ARMS, DELIBERATELY.
# They sit on the ADR-114 Decision 8 ratchet and are WARN today. If the planted
# arm were missing them, this bundle would keep passing for the wrong reason on
# the day the ratchet promotes them to blocking: the arm would fail on Store
# rather than on the five defects the rows name. Present in both arms, the
# promotion changes neither verdict, and these rows keep meaning what they say.
#
# ANTI-WIDENING, clean arm:
#   * `FlowRunsMenu` -> `FlowRuns` is an ordinary index in `main` whose LABEL
#     contains "flow". A gate matching Flows on the label rather than on the
#     page type would accept it as the Flows entry in the planted arm (turning
#     that row green for the wrong reason) and would flag its placement here.
#   * The clean arm's real `Flows` entry is NESTED inside a `ConfigGroup`.
#     ADR-110's own fleet audit walked only top-level `menu[]` entries, read
#     integriq's nested Flows as absent, and had to withdraw the claim inside
#     the ADR. A gate that does not descend into `children[]` turns this arm
#     red, which is the regression most likely to recur.
#   * The clean arm's roadmap surface is `type: "custom"` at the canonical
#     /features-roadmap path, which is what openregister actually ships and
#     what shillinq ships for reports. A gate insisting on the page TYPE calls
#     that MISSING and reds an app that is right. That regression was found on
#     the live fleet before this gate merged; reverting isSurface() to a
#     type-only test turns this arm red.
#   * The footer-order rule is RELATIVE, not absolute. The planted arm's
#     Reports is at 200 and fails; pipelinq ships 160 / 200 / 230 on the live
#     fleet and passes. A gate hardcoding 90 / 92 / 95 / 100 would red four
#     apps whose footers already read correctly.
#   * The clean arm keeps `includePersonalSettings: false` AND declares its own
#     `action: "user-settings"` entry, which is keepiq's shape: that flag is
#     legitimate for an app offering its own route to the same dialog, and a
#     gate that flagged the flag alone would red keepiq. openregister and
#     decidiq set the flag with no replacement, which is the planted case.
#   * Both arms declare pages, so NOT APPLICABLE over this bundle is a FAILURE,
#     never an excuse. A gate that fell back to the ADR-040 Tier-0 arm would
#     pass the clean arm for a reason that has nothing to do with its chrome.
