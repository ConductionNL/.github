# fixture must fail for a DIFFERENT reason than the one it exists to prove, and
# requiring the method name is what makes that visible: the planted arm's other
# methods carry no `#[NoAdminRequired]` either, so a file-level assertion could
# be satisfied by a checker with the exemption fully intact.
#
# ⚠️ NOTE FOR WHOEVER TOUCHES THE PLANTED ARM: `arbitraryId()` takes an id and
# resolves it GLOBALLY. Adding a register/schema/catalog argument to that
# lookup — or renaming the callee to something carrying a `Public` segment —
# clears the arm and this fixture silently stops proving anything.
gate 7 hydra-gate-no-admin-idor.log FAIL PASS method=arbitraryId
