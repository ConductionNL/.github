# expect.conf — read by scripts/lib/test_gate_acceptance_matrix.sh
#
# Columns:
#   gate <n> <log-basename|-> <planted-verdict> <clean-verdict> <subject-substring>
#
# Bundle: request-sourced-guard — gate-7's `request-sourced-object-guard` rule
# (ConductionNL/dossiq#799).
#
# THE PLANTED VERDICT IS `WARNING`, NOT `FAIL`, AND THAT IS THE POINT.
# ---------------------------------------------------------------------------
# The rule ships advisory. All twenty-one core apps resolve this package at
# `@main` and set `enable-hydra-gates: true`, so a blocking rule merged here is
# blocking everywhere the same minute, against debt nobody has had a chance to
# read. The driver treats WARNING as a real verdict and still demands that the
# finding NAME its subject, so demoting it costs no evidence. Flip
# HYDRA_GATE_IDOR_REQUEST_SOURCED_BLOCKING=1 per repo when that repo's
# population is worked down, and this row becomes FAIL.
#
# THE LOG IS THE ADVISORY ONE. The runner MOVES these lines out of
# `hydra-gate-no-admin-idor.log` (the blocking log) into
# `hydra-gate-no-admin-idor-request-sourced.log` while the rule is advisory,
# so naming the blocking log here would look for a subject that is no longer
# in it.
#
# 🔴 ONE ROW PER PLANT, AND NOT THE FILE PATH. Both plants live in one file, so
# a row whose subject was the path would be satisfied by ANY non-empty subset
# of them — the `Faces.vue` defect (.github#380), and the auth-guards bundle
# carries the same warning for the same reason. Each subject names the METHOD
# and closes on the right with ` rule=…`, so neither plant can stand in for the
# other and neither can be satisfied by an unrelated finding in the same file.
gate 7 hydra-gate-no-admin-idor-request-sourced.log WARNING PASS method=submitResult rule=request-sourced-object-guard
gate 7 hydra-gate-no-admin-idor-request-sourced.log WARNING PASS method=purge rule=request-sourced-object-guard
#
# THE NEGATIVE CONTROLS ARE IN THE PLANTED ARM, not only the clean one, and
# they are what stops this bundle rewarding an over-broad rule.
#
#   `prefs()`  — `$userId` is request-sourced AND is the lookup key. Pinning a
#                caller-supplied reference to the caller IS the scoping, spelled
#                as a comparison. It is the single most common correct shape in
#                the fleet.
#   `join()`   — MEASURED on openregister `OrganisationController::join()`.
#                Omitting `userId` skips the refusal, and that is harmless: the
#                callee resolves an absent target to the session user. A value
#                the callee RECEIVES is a parameter, not a decoration.
#
# Neither may appear in either arm. A rule that flagged every identity
# comparison touching request input scores 4 on planted/ instead of 2, and the
# `_names` subject check above would still be satisfied — so the over-flagging
# is caught by the clean arm's PASS row and by these two methods sitting in the
# planted arm unflagged.
#
# AND THE FIXTURE MUST PROVE THE FIX, not merely pass alongside it. Verified by
# hand before merge, both arms, both checkers:
#
#   planted/ under the PREVIOUS checker  -> 0 findings   (the blindness)
#   planted/ under this checker          -> 2 findings   (the two rows above)
#   clean/   under this checker          -> 0 findings
#
# A fixture that behaves identically before and after a fix proves nothing
# about the fix; the auth-guards bundle records an author who hit exactly that.
