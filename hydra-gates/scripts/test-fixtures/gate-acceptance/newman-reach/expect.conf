# expect.conf — read by scripts/lib/test_gate_acceptance_matrix.sh
#
# Columns:
#   gate <n> <log-basename|-> <planted-verdict> <clean-verdict> <subject-substring>
#
# Bundle: newman-reach — gate-112.
#
# WHAT THE PAIR PINS, AND WHY IT CANNOT BE PASSED BY ACCIDENT
# -----------------------------------------------------------
# The two arms ship a BYTE-IDENTICAL collection: same requests, same headers,
# same two `pm.test` assertions, same caller with `enable-newman: true`. The
# ONLY difference is the directory it sits in:
#
#   planted/  tests/newman/orphan.postman_collection.json      never executed
#   clean/    tests/integration/reachable.postman_collection.json  executed
#
# So this pair cannot be satisfied by a gate that merely counts collections,
# or looks at their contents, or checks whether Newman is enabled. It has to
# resolve `newman-collection-path` from the caller workflow and compare it to
# where the file actually is. That comparison is the gate.
#
# The subject names the FILE, not the finding code: a bare "1 finding" tells
# nobody which collection is dead, and the whole value of this gate is that it
# names the file you have to move.
#
# THE PLANTED VERDICT IS `WARNING`, NOT `FAIL` (.github#729/#712).
#
# gate-112 is report-only until an app sets
# HYDRA_GATE_NEWMAN_REACH_BLOCKING=1, so `WARNING` is the verdict the
# runner actually reaches over this fixture. The row said FAIL and passed
# anyway — on the helper's OWN `FAIL` line, which #729 removed because the
# helper cannot know whether the runner will block. So this row was being
# satisfied by the defect.
#
# The demotion costs this bundle nothing: the acceptance matrix now runs its
# subject assertion for WARNING exactly as for FAIL, and
# test_gate_discarded_counts_and_empty_deltas.sh bounds by name which gates
# may be advisory at all. Flip this back to FAIL on the day the gate blocks.
gate 112 hydra-gate-newman-reach.log WARNING PASS tests/newman/orphan.postman_collection.json
