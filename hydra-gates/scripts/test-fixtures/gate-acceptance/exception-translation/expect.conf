# expect.conf — read by scripts/lib/test_gate_acceptance_matrix.sh
#
# Bundle: exception-translation — gate-49 (controller-exception-translation).
#
# This pair pins TAG POSITION, not tag presence. Both arms contain exactly one
# `@throws \Throwable`; the ONLY difference between them is which docblock it
# is written in. planted/ has it in the FILE HEADER (where it describes
# nothing) and must FAIL; clean/ has it on the METHOD (where it describes the
# method) and must PASS.
#
# Run this bundle against a gate-49 whose METHOD_RE docblock group is
# unbounded and the planted arm goes GREEN — that is the whole defect, and it
# is why the two arms differ by position rather than by presence. A pair that
# differed by presence would have passed against the broken gate too.
#
# The clean arm is equally load-bearing in the other direction: `\Throwable`
# and `\Exception` are supersets of every tracked exception and MUST be
# accepted (they were rejected on hermiq#162, which pushed authors toward the
# NARROWER handler).
gate 49 hydra-gate-controller-exception-translation.log FAIL PASS purge()
