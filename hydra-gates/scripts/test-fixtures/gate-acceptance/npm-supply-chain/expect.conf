# expect.conf — read by scripts/lib/test_gate_acceptance_matrix.sh
#
# Columns:
#   gate <n> <log-basename|-> <planted-verdict> <clean-verdict> <subject-substring>
#
# Bundle: npm-supply-chain — gate-84 (npm-supply-chain-config).
#
# The two arms differ ONLY in the three settings that make the release-age
# cooldown real. Everything else — the app id, info.xml, the dependency list —
# is identical, so a gate that keyed on anything but those settings would grade
# both arms the same and this pair would prove nothing.
#
# planted/ is the state 13 of the fleet's 19 apps were in on 2026-08-15:
# `min-release-age=0` (disabled) and `engines.npm: ^10.0.0`. Both halves matter
# and each is independently fatal, which is why the planted arm carries both —
# a gate checking only one of them still fails this arm, and the suite in
# scripts/lib/test_check_npm_supply_chain_config.sh is what pins each setting
# as individually load-bearing.
#
# clean/ is the conformant state. It deliberately keeps `legacy-peer-deps=true`
# alongside the cooldown settings: a gate that parsed .npmrc by matching the
# whole file rather than per-setting would go red on an unrelated line, and
# 8 apps in the fleet carry exactly that line.
#
# ⚠️ FOR WHOEVER TOUCHES THIS BUNDLE: `min-release-age` DOES NOT EXIST IN
# NPM 10 — `npm config get min-release-age` answers `undefined` there, and
# every Node 22 release bundles npm 10. So the planted arm's real defect is not
# a weak number, it is a cooldown that is READ BY NOTHING while looking
# configured. That is why engines.npm is part of the gate at all.
gate 84 hydra-gate-npm-supply-chain-config.log FAIL PASS min-release-age
