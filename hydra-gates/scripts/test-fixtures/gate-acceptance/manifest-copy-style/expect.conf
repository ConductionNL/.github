# expect.conf — read by scripts/lib/test_gate_acceptance_matrix.sh
#
# Columns:
#   gate <n> <log-basename|-> <planted-verdict> <clean-verdict> <subject-substring>
#
# Bundle: manifest-copy-style — gate-96 (voice.md §8, added by #581).
#
# WHY THIS BUNDLE EXISTS. #581 added the gate to the runner and shipped no
# fixture and no UNCOVERED.md row, so the acceptance ratchet went red on `main`
# from the moment it merged — "a gate can be added to the runner and never
# tested; this is that moment", in the suite's own words. The ratchet worked;
# nothing had closed the loop it opened. This is that loop.
#
# THE TWO ARMS DIFFER IN TWO STRINGS, in two different files, on purpose:
#
#   * `src/manifest.json` → `title` carries an EM-DASH.
#   * `src/manifest.d/steps.json` → `emptyText` carries a DOUBLE-DASH.
#
# Both are independently fatal, so a checker that caught only one still fails
# this arm. Splitting them across the base manifest and a FRAGMENT is the part
# that matters most: fragments are merged at runtime by `require.context`, and a
# checker reading only `src/manifest.json` would be blind to eight fleet apps'
# copy — shillinq alone has 87 fragments. A single-file fixture would have passed
# such a checker and taught us nothing.
#
# THE CLEAN ARM IS NOT MERELY DASH-FREE. It keeps `helpText` reading
# "Reporting covers 2020–2024" — an EN-DASH between digits, which voice.md
# explicitly permits as a numeric range. Without that string, a checker that
# banned every dash character outright would pass the clean arm, and the one
# exception the rule actually has would be untested.
#
# Subject substring is the em-dashed title's own file, so a gate that fails for
# an unrelated reason, or reports a bare count, does not name it.
gate 96 hydra-gate-manifest-copy-style.log FAIL PASS src/manifest.json
