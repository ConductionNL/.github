# TEMPORARY MEASUREMENT HARNESS — not part of the quality pipeline.
#
# Reproduces the exact `needs:` / `if:` topology of the `hydra-gates` job in
# quality.yml so the guard can be measured in all three producer states
# (playwright succeeded / failed / skipped) in ONE run. Deleted after the
# measurement is recorded.
name: probe-gate-guard

on:
  workflow_call:
    inputs:
      enable-playwright:
        type: boolean
        required: true
      playwright-fails:
        type: boolean
        required: true
      enable-hydra-gates:
        type: boolean
        required: true

jobs:
  # Stands in for quality.yml's `playwright` job, which carries the same
  # `inputs.<flag> && !cancelled()` shape.
  playwright:
    if: ${{ inputs.enable-playwright && !cancelled() }}
    runs-on: ubuntu-latest
    name: "E2E Tests (Playwright)"
    steps:
      - name: Be the producer
        run: |
          if [ "${{ inputs.playwright-fails }}" = "true" ]; then
            echo "producer FAILS"
            exit 1
          fi
          echo "producer SUCCEEDS"

  # The guard as shipped by .github#148.
  gates-current:
    if: ${{ inputs.enable-hydra-gates && !cancelled() }}
    needs: [playwright]
    runs-on: ubuntu-latest
    name: "Hydra Gates (current guard)"
    steps:
      - run: echo "GATES RAN. needs.playwright.result=${{ needs.playwright.result }}"

  # The candidate replacement.
  gates-always:
    if: ${{ always() && inputs.enable-hydra-gates }}
    needs: [playwright]
    runs-on: ubuntu-latest
    name: "Hydra Gates (always guard)"
    steps:
      - run: echo "GATES RAN. needs.playwright.result=${{ needs.playwright.result }}"

  report:
    needs: [playwright, gates-current, gates-always]
    if: always()
    runs-on: ubuntu-latest
    name: "Report"
    steps:
      - run: |
          echo "playwright=${{ needs.playwright.result }}"
          echo "gates-current=${{ needs.gates-current.result }}"
          echo "gates-always=${{ needs.gates-always.result }}"
