name: Quality

on:
  workflow_call:
    inputs:
      app-name:
        description: "Nextcloud app ID (used for checkout path in NC server)"
        required: true
        type: string
      php-version:
        description: "Primary PHP version for linting"
        required: false
        type: string
        default: "8.3"
      php-test-versions:
        description: "JSON array of PHP versions for PHPUnit matrix"
        required: false
        type: string
        default: '["8.3", "8.4"]'
      nextcloud-test-refs:
        description: "JSON array of Nextcloud server branches for PHPUnit matrix"
        required: false
        type: string
        default: '["stable31", "stable32"]'
      enable-php:
        description: "Master switch for the PHP toolchain (php-quality, PHPUnit, composer security/license legs, SBOM). Set false for JS-only repos without composer.json."
        required: false
        type: boolean
        default: true
      enable-npm:
        description: "Master switch for the npm ecosystem checks (npm legs of security/license). Set false for PHP-only repos without package.json — `npm ci` fails hard without one. Counterpart of enable-php."
        required: false
        type: boolean
        default: true
      enable-psalm:
        description: "Run Psalm static analysis"
        required: false
        type: boolean
        default: true
      enable-phpstan:
        description: "Run PHPStan static analysis"
        required: false
        type: boolean
        default: true
      enable-phpmd:
        description: "Run PHPMD mess detection"
        required: false
        type: boolean
        default: true
      enable-phpcs:
        description: "Run PHPCS code style checks"
        required: false
        type: boolean
        default: true
      enable-phpmetrics:
        description: "Run phpmetrics code metrics"
        required: false
        type: boolean
        default: true
      enable-frontend:
        description: "Run frontend quality checks (ESLint + Stylelint)"
        required: false
        type: boolean
        default: true
      enable-eslint:
        description: "Run ESLint (requires enable-frontend)"
        required: false
        type: boolean
        default: true
      node-version:
        description: "Node.js version for all frontend/npm steps"
        required: false
        type: string
        default: "20"
      frontend-path:
        description: "Directory containing package.json + package-lock.json for all npm-side jobs (Vue Quality, Frontend Checks, npm security/license legs). Default: repo root. Use for repos where the frontend lives in a subdirectory (e.g. 'pwa')."
        required: false
        type: string
        default: "."
      enable-stylelint:
        description: "Run Stylelint (requires enable-frontend). Set false for repos without a stylelint npm script."
        required: false
        type: boolean
        default: true
      frontend-setup-command:
        description: "Optional ADDITIONAL setup command for the frontend-checks job. The standard root `npm ci` always runs first; this command runs after it and does NOT replace it. Use it to prepare things the root install doesn't cover, e.g. installing a nested package's dependencies: 'cd docusaurus && npm ci' (the nested directory then needs its own package.json + package-lock.json)."
        required: false
        type: string
        default: ""
      frontend-checks:
        description: "JSON array of npm scripts to run as individual 'Frontend Check (<script>)' jobs (e.g. '[\"test\", \"check:docs\"]'). Requires enable-frontend and a repo with package.json + package-lock.json (each leg runs `npm ci`). Every listed script MUST exist in the repo's package.json and MUST be self-contained — each leg is a fresh job (own checkout + npm ci), so bundle order-dependent steps into one script (e.g. \"check:build\": \"npm run build && npm run check:css-entry\"). See CONVENTIONS.md § Custom frontend checks."
        required: false
        type: string
        default: "[]"
      enable-license-check:
        description: "Run dependency license compliance check (composer + npm)"
        required: false
        type: boolean
        default: true
      enable-phpunit:
        description: "Run PHPUnit tests against Nextcloud server"
        required: false
        type: boolean
        default: false
      enable-newman:
        description: "Run Newman integration tests against Nextcloud server"
        required: false
        type: boolean
        default: false
      newman-collection-path:
        description: "Path to Newman/Postman collection files (relative to app root)"
        required: false
        type: string
        default: "tests/integration"
      newman-environment-path:
        description: "Path to Postman environment JSON file (relative to app root). When set, passes --environment to Newman instead of ad-hoc --env-var flags."
        required: false
        type: string
        default: ""
      newman-seed-command:
        description: "Shell command to run after server start but before Newman tests (e.g. 'php occ maintenance:repair' to seed test fixtures). Runs with cwd set to the Nextcloud server root."
        required: false
        type: string
        default: ""
      enable-playwright:
        description: "Run Playwright E2E browser tests against Nextcloud server"
        required: false
        type: boolean
        default: false
      playwright-test-path:
        description: "Path to Playwright test files (relative to app root)"
        required: false
        type: string
        default: "tests/e2e"
      playwright-seed-command:
        description: "Shell command to run after server start but before Playwright tests (e.g. 'php occ maintenance:repair' to seed test fixtures). Runs with cwd set to the Nextcloud server root."
        required: false
        type: string
        default: ""
      enable-playwright-coverage:
        description: "Collect V8 code coverage during Playwright tests and enforce threshold"
        required: false
        type: boolean
        default: false
      playwright-coverage-threshold:
        description: "Minimum line coverage percentage for Playwright tests (0-100). Only enforced when enable-playwright-coverage is true."
        required: false
        type: number
        default: 75
      enable-journeydoc-capture:
        description: "Run the journeydoc Playwright capture spec (tests/e2e/docs-screenshots.spec.ts) against a freshly-installed Nextcloud and commit any new/changed screenshots back to the calling repo. Per ADR-030. Recommended to invoke from a dedicated docs-capture.yml workflow with schedule + workflow_dispatch triggers (not on every PR — too expensive)."
        required: false
        type: boolean
        default: false
      journeydoc-output-path:
        description: "Path inside the app repo where the docs-capture Playwright project writes its screenshots. The diff/commit-back step monitors this path. Default matches the canonical journeydoc convention from ADR-030."
        required: false
        type: string
        default: "docs/static/screenshots/tutorials"
      journeydoc-deploy-workflow:
        description: "Optional: name (or filename) of a workflow to dispatch via `gh workflow run` after the screenshot-refresh commit. Use this to trigger the docs deploy when screenshots actually changed (e.g. 'documentation.yml' or 'deploy.yml'). Empty = no dispatch."
        required: false
        type: string
        default: ""
      additional-apps:
        description: "JSON array of additional app repos to checkout and enable (e.g. '[{\"repo\":\"ConductionNL/openregister\",\"app\":\"openregister\"}]')"
        required: false
        type: string
        default: "[]"
      enable-coverage-guard:
        description: "Run coverage baseline guard and auto-update"
        required: false
        type: boolean
        default: false
      enable-sbom:
        description: "Generate CycloneDX SBOM and validate it (Grype CVE scan + composer/npm audit — hard failures). Published as a run artifact and release asset; intentionally never committed to the repo."
        required: false
        type: boolean
        default: true
      enable-features-extract:
        description: "Verify docs/features.json is in sync with openspec/specs/ — READ-ONLY, hard-fails when stale (features-check on PRs, features-extract on pushes; both gate the Quality Report). Generation happens at commit time via the repo's .githooks/pre-commit — see CONVENTIONS.md."
        required: false
        type: boolean
        default: true
      database:
        description: "Database backend for integration tests (sqlite, pgsql, mysql)"
        required: false
        type: string
        default: "pgsql"
      enable-hydra-gates:
        description: "Run the 61 Hydra mechanical quality gates (conduction/hydra-gates) against this PR's diff. OPT-IN, default false: the gates are diff-scoped per ADR-020, but a repo whose in-flight branches touch files with inherited debt will go red the moment this is switched on, so each repo enables it once its own diffs are clean. Enabling it makes gate failures block the Quality Report."
        required: false
        type: boolean
        default: false
      hydra-gates-ref:
        description: "Ref of ConductionNL/.github to take the gate package from. Pin this to a tag to stop a gate change from altering a repo's verdict without a commit in that repo."
        required: false
        type: string
        default: "main"
      hydra-gates-require-full-coverage:
        description: "Treat 'a declared gate did not run' as a failure (exit 98). Off by default: a control that blocks legitimate work gets switched off, and a switched-off control is worth less than a loud one. The coverage block is printed either way."
        required: false
        type: boolean
        default: false

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ╔══════════════════════════════════════════════╗
  # ║  STAGE 1 — Four parallel quality gates        ║
  # ║                                               ║
  # ║  Each group uses a matrix strategy so GitHub   ║
  # ║  renders it as ONE collapsible box with        ║
  # ║  individual tool results visible inside.       ║
  # ║                                               ║
  # ║  ┌────────────┐ ┌────────────┐                ║
  # ║  │PHP Quality │ │Vue Quality │                ║
  # ║  │ ◦ lint     │ │ ◦ eslint   │                ║
  # ║  │ ◦ phpcs    │ │ ◦ stylelint│                ║
  # ║  │ ◦ phpmd    │ └────────────┘                ║
  # ║  │ ◦ psalm    │ ┌────────────┐                ║
  # ║  │ ◦ phpstan  │ │ License    │                ║
  # ║  │ ◦ metrics  │ │ ◦ composer │                ║
  # ║  └────────────┘ │ ◦ npm      │                ║
  # ║  ┌────────────┐ └────────────┘                ║
  # ║  │ Security   │                               ║
  # ║  │ ◦ composer │                               ║
  # ║  │ ◦ npm      │                               ║
  # ║  └────────────┘                               ║
  # ╚══════════════════════════════════════════════╝

  # ── Group 1: PHP Quality ────────────────────────
  php-quality:
    if: ${{ inputs.enable-php }}
    runs-on: ubuntu-latest
    name: "PHP Quality (${{ matrix.tool }})"
    # Observed across 1497 executions fleet-wide: median 0.5 min, p95 1.5 min,
    # max 4.0 min (launchpad). 20 min is a wide margin over the worst leg while
    # still turning a hang into a failure instead of a 6-hour runner burn.
    timeout-minutes: 20
    strategy:
      matrix:
        tool: [lint, phpcs, phpmd, psalm, phpstan, phpmetrics]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}
          extensions: mbstring, intl, zip, gd, curl, xml, json
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Run ${{ matrix.tool }}
        run: |
          # `composer <script>` exits 1 for BOTH "the script ran and returned 1"
          # and "Command \"<script>\" is not defined." Any leg that interprets
          # exit 1 (the phpcs warnings-are-non-blocking rule below) therefore
          # reads a MISSING gate as a PASSING gate — a gate's absence and a
          # gate's success become indistinguishable. See ConductionNL/.github#121.
          #
          # So: assert the script is declared BEFORE running it, and read the
          # declaration from composer.json rather than from the exit code.
          # Deliberately NOT an `[ -f vendor/bin/<tool> ]` guard — a file-presence
          # guard that skips is the same silent-pass defect in a new costume.
          require_script() {
            tool="$1"
            hint="$2"
            if [ ! -f composer.json ]; then
              echo "::error::The '$tool' gate is enabled but there is no composer.json in the repository root."
              exit 1
            fi
            if ! jq -e --arg s "$tool" '(.scripts // {}) | has($s)' composer.json > /dev/null 2>&1; then
              echo "::error::The '$tool' gate is enabled but composer.json declares no '$tool' script. Add it under \"scripts\", or turn the gate off with $hint."
              exit 1
            fi
          }
          case "${{ matrix.tool }}" in
            lint)
              require_script lint "the enable-php input"
              composer lint
              ;;
            phpcs)
              if [ "${{ inputs.enable-phpcs }}" != "true" ]; then
                echo "PHPCS is disabled — skipping."
                exit 0
              fi
              require_script phpcs "the enable-phpcs input"
              # Exit code 0 = clean, 1 = warnings only, 2 = errors found.
              # We treat warnings as non-blocking (exit 1 → success). This is only
              # safe because require_script has already proven the script exists.
              # NB: capture via `|| RC=$?` — a bare `composer phpcs; RC=$?`
              # is killed by `set -e` before RC is ever assigned.
              RC=0
              composer phpcs || RC=$?
              if [ "$RC" -eq 1 ]; then
                echo "::warning::PHPCS found warnings but no errors — passing."
                exit 0
              fi
              exit $RC
              ;;
            phpmd)
              if [ "${{ inputs.enable-phpmd }}" != "true" ]; then
                echo "PHPMD is disabled — skipping."
                exit 0
              fi
              require_script phpmd "the enable-phpmd input"
              composer phpmd
              ;;
            psalm)
              if [ "${{ inputs.enable-psalm }}" != "true" ]; then
                echo "Psalm is disabled — skipping."
                exit 0
              fi
              require_script psalm "the enable-psalm input"
              composer psalm
              ;;
            phpstan)
              if [ "${{ inputs.enable-phpstan }}" != "true" ]; then
                echo "PHPStan is disabled — skipping."
                exit 0
              fi
              require_script phpstan "the enable-phpstan input"
              composer phpstan
              ;;
            phpmetrics)
              if [ "${{ inputs.enable-phpmetrics }}" != "true" ]; then
                echo "phpmetrics is disabled — skipping."
                exit 0
              fi
              require_script phpmetrics "the enable-phpmetrics input"
              composer phpmetrics
              ;;
          esac

      - name: Record result
        if: always()
        run: |
          mkdir -p quality-results
          echo "${{ job.status }}" > quality-results/${{ matrix.tool }}.txt
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-php-quality-${{ matrix.tool }}
          path: quality-results/

  # ── Group 2: Vue Quality ────────────────────────
  vue-quality:
    if: ${{ inputs.enable-frontend }}
    runs-on: ubuntu-latest
    name: "Vue Quality (${{ matrix.tool }})"
    # Observed across 494 executions: median 0.6 min, p95 1.2 min, max 2.1 min
    # (opencatalogi). 20 min absorbs npm-install contention with ~10x headroom.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.frontend-path }}
    strategy:
      matrix:
        tool: [eslint, stylelint]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "${{ inputs.node-version }}"
          cache: "npm"
          cache-dependency-path: "${{ inputs.frontend-path }}/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Run ${{ matrix.tool }}
        run: |
          case "${{ matrix.tool }}" in
            eslint)
              if [ "${{ inputs.enable-eslint }}" != "true" ]; then
                echo "ESLint is disabled — skipping."
                exit 0
              fi
              npm run lint
              ;;
            stylelint)
              if [ "${{ inputs.enable-stylelint }}" != "true" ]; then
                echo "Stylelint is disabled — skipping."
                exit 0
              fi
              npm run stylelint
              ;;
          esac

      - name: Record result
        if: always()
        run: |
          mkdir -p quality-results
          echo "${{ job.status }}" > quality-results/${{ matrix.tool }}.txt
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-vue-quality-${{ matrix.tool }}
          path: ${{ inputs.frontend-path }}/quality-results/

  # ── Group 2b: Custom frontend checks ───────────
  #
  # Repo-defined npm scripts run as individual matrix legs, e.g.
  #   frontend-checks: '["test", "check:build", "check:docs"]'
  # Each leg gets a fresh checkout + npm ci, so scripts must be
  # self-contained (bundle ordering deps into one script, e.g.
  # "check:build": "npm run build && npm run check:css-entry").
  frontend-checks:
    if: ${{ inputs.enable-frontend && inputs.frontend-checks != '[]' }}
    runs-on: ubuntu-latest
    name: "Frontend Check (${{ matrix.script }})"
    # Observed across 102 executions: median 0.6 min, p95 1.4 min, max 2.1 min
    # (nextcloud-vue). These legs include `npm run build`, which has been
    # measured at 211 s under heavy load, so the bound is deliberately loose.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.frontend-path }}
    strategy:
      matrix:
        script: ${{ fromJSON(inputs.frontend-checks) }}
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "${{ inputs.node-version }}"
          cache: "npm"
          cache-dependency-path: "${{ inputs.frontend-path }}/package-lock.json"

      # Caller-supplied values are passed via env and referenced as "$VAR"
      # (never inlined into the script) so special characters cannot break
      # out of the intended shell context.
      - name: Verify script exists in package.json
        env:
          SCRIPT: ${{ matrix.script }}
        run: |
          if ! node -e "const s = require('./package.json').scripts || {}; process.exit(s[process.env.SCRIPT] ? 0 : 1)"; then
            echo "::error::npm script '$SCRIPT' is listed in this repo's frontend-checks input but does not exist in package.json. Add the script (see CONVENTIONS.md § Custom frontend checks in ConductionNL/.github) or remove it from the frontend-checks list in .github/workflows/code-quality.yml."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Extra setup (runs after npm ci, does not replace it)
        if: ${{ inputs.frontend-setup-command != '' }}
        env:
          SETUP_CMD: ${{ inputs.frontend-setup-command }}
        run: bash -c "$SETUP_CMD"

      - name: Run ${{ matrix.script }}
        env:
          SCRIPT: ${{ matrix.script }}
        run: npm run "$SCRIPT"

      - name: Record result
        if: always()
        env:
          SCRIPT: ${{ matrix.script }}
        run: |
          mkdir -p quality-results
          # ':' is invalid in artifact file paths — sanitize the script name
          echo "${{ job.status }}" > "quality-results/$(echo "$SCRIPT" | tr ':/' '--').txt"
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-frontend-check-${{ strategy.job-index }}
          path: ${{ inputs.frontend-path }}/quality-results/

  # Auto-detected frontend BUILD gate.
  #
  # `npm run build` existed in this file in exactly two places — inside the
  # Playwright job and inside the journeydoc capture job — and both are opt-in
  # and default OFF. Only 2 of the 21 repos that call this workflow enable
  # Playwright (doriath, pipelinq) and none enable journeydoc capture, so for
  # the other 19 the frontend was NEVER COMPILED IN CI AT ALL. A repo could
  # ship a bundle that does not build and every gate stayed green, because
  # nothing in the pipeline ever ran webpack.
  #
  # That is not hypothetical: hermiq's build broke when the floating
  # `node-polyfill-webpack-plugin: ^4.0.0` resolved to 4.1.0 and webpack
  # emitted 25 errors. Nine repos still carry an unpinned caret on that same
  # plugin (openbuild, petstore, portaliq, shillinq, nextcloud-app-template at
  # ^4.0.0; decidesk, zaakafhandelapp at ^3.0.0; pipelinq at ^4.1.0), so any
  # lockfile regeneration can reproduce it silently.
  #
  # Like `frontend-tests` below, this job takes no opt-in input: it runs the
  # repo's own `build` script when one exists and BLOCKS on failure. A repo
  # with no package.json or no `build` script skips cleanly, and — unlike
  # `frontend-tests` — it does not even set up Node in that case, so a repo
  # without a lockfile cannot be newly broken by this job.
  #
  # The compiled output is uploaded as an artifact and reused by the Playwright
  # job, which previously ran its own identical `npm run build`. See the
  # "Restore prebuilt app frontend" step there: the reuse is a fast path with a
  # full fallback, never a replacement, so a bad hand-off costs time, not a
  # verdict.
  frontend-build:
    if: ${{ inputs.enable-frontend }}
    runs-on: ubuntu-latest
    name: "Frontend Build"
    # UNMEASURED as a standalone job — it has never existed. The best proxy is
    # the `npm run build` already embedded in other legs: measured at 211 s
    # under heavy load, and the frontend-checks legs that wrap it peak at 2.1
    # min end to end. `npm ci` adds ~1 min cold. 30 min is therefore ~8x the
    # worst observed build and leaves the runner's own contention plenty of
    # room, while still converting a hang into a failure inside half an hour
    # rather than burning six hours on GitHub's default. Deliberately generous:
    # a bound that fires under normal contention produces a CANCELLED job,
    # which returns no verdict at all — strictly worse than no bound.
    timeout-minutes: 30
    outputs:
      # 'true' only when the build actually ran AND produced files. The
      # Playwright job keys its artifact download off this, so "no artifact"
      # and "artifact I should not trust" both resolve to the fallback path.
      built: ${{ steps.package.outputs.uploaded }}
    defaults:
      run:
        working-directory: ${{ inputs.frontend-path }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Runs BEFORE setup-node on purpose. `actions/setup-node` with
      # `cache: npm` hard-fails when no lockfile is found, so detecting first
      # means a repo with no package.json (or no build script) skips this job
      # without ever touching a step that could fail on its behalf.
      - name: Detect a build script
        id: detect
        run: |
          if [ ! -f package.json ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No package.json in '${{ inputs.frontend-path }}' — nothing to build."
            exit 0
          fi
          if [ ! -f package-lock.json ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::warning::package.json present but no package-lock.json — skipping the frontend build (npm ci requires a lockfile)."
            exit 0
          fi
          BUILD_CMD="$(jq -r '.scripts.build // ""' package.json)"
          if [ -z "$BUILD_CMD" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No 'build' script in package.json — nothing to build."
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "Detected 'build' script: $BUILD_CMD"

      - name: Setup Node.js
        if: steps.detect.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "${{ inputs.node-version }}"
          cache: "npm"
          cache-dependency-path: "${{ inputs.frontend-path }}/package-lock.json"

      - name: Install dependencies
        if: steps.detect.outputs.run == 'true'
        run: npm ci

      - name: Extra setup (runs after npm ci, does not replace it)
        if: ${{ steps.detect.outputs.run == 'true' && inputs.frontend-setup-command != '' }}
        env:
          SETUP_CMD: ${{ inputs.frontend-setup-command }}
        run: bash -c "$SETUP_CMD"

      # The marker is dropped AFTER `npm ci` so that only what the build itself
      # writes is captured — install-time churn under node_modules is already
      # older than it.
      - name: Build frontend
        if: steps.detect.outputs.run == 'true'
        run: |
          touch /tmp/frontend-build-marker
          npm run build

      # Collect the build output WITHOUT knowing where it lands. Nextcloud apps
      # emit to `js/`, vite apps to `dist/`, portaliq writes two bundles from a
      # composite script — hardcoding any of those is how the hand-off to
      # Playwright would silently ship an empty bundle. Instead: everything the
      # build step touched, minus node_modules and .git.
      #
      # This matters because a MISSING bundle does not 404. Nextcloud's front
      # controller answers an absent asset with HTTP 200 and an HTML error
      # page, so a status-code probe reads it as success and the only symptom
      # is a selector timeout that names an element. Several repos' ci-seed.sh
      # guards against that by asserting the response is actually JavaScript;
      # this job keeps that guard meaningful by making the reuse path prove it
      # restored real .js files (see the Playwright job) and falling back to a
      # real build when it cannot.
      - name: Package build output
        id: package
        if: steps.detect.outputs.run == 'true'
        run: |
          set -euo pipefail
          find . -type f -newer /tmp/frontend-build-marker \
            -not -path './node_modules/*' \
            -not -path './.git/*' \
            -print0 > /tmp/frontend-build-files.z
          COUNT="$(tr -cd '\0' < /tmp/frontend-build-files.z | wc -c)"
          JS_COUNT="$(tr '\0' '\n' < /tmp/frontend-build-files.z | grep -c '\.js$' || true)"
          echo "Build wrote $COUNT file(s), of which $JS_COUNT are .js"
          if [ "$COUNT" -eq 0 ]; then
            echo "uploaded=false" >> "$GITHUB_OUTPUT"
            echo "::warning::The build produced no files outside node_modules — nothing to hand off. Downstream jobs will build for themselves."
            exit 0
          fi
          tar --null -czf /tmp/frontend-build-output.tar.gz -T /tmp/frontend-build-files.z
          echo "uploaded=true" >> "$GITHUB_OUTPUT"
          tr '\0' '\n' < /tmp/frontend-build-files.z | head -40
          echo "…"

      - name: Upload build output
        if: steps.package.outputs.uploaded == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-output
          path: /tmp/frontend-build-output.tar.gz
          retention-days: 1

      - name: Record result
        if: always()
        run: |
          mkdir -p quality-results
          if [ "${{ steps.detect.outputs.run }}" != "true" ]; then
            echo "skipped" > quality-results/frontend-build.txt
          else
            echo "${{ job.status }}" > quality-results/frontend-build.txt
          fi

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-frontend-build
          path: ${{ inputs.frontend-path }}/quality-results/

  # Auto-detected JS unit tests.
  #
  # `frontend-checks` above is an opt-in LIST that defaults to "[]", so a repo
  # only runs its JS suite if someone remembered to name the script. Nobody
  # did: across the fleet this job's matrix resolved empty and reported
  # "skipping" with the expression unexpanded, so vitest/jest suites had NEVER
  # run in CI. Real failures sat invisible for months (openbuild carries one;
  # procest's harness is broken outright — `tests/vitest/setup.js` does
  # `import Vue from 'vue'`, which vue@3 does not publish).
  #
  # This job needs no opt-in: it runs the repo's own `test` script when one
  # exists and is not a placeholder, and it BLOCKS on failure. A repo with no
  # test script skips cleanly.
  #
  # Note it invokes `npm run test`, never `npx vitest` — a bare `npx vitest`
  # exits 0 with no output when it finds no matching config, which is how
  # doriath's "passing" unit gate was running nothing at all.
  frontend-tests:
    if: ${{ inputs.enable-frontend }}
    runs-on: ubuntu-latest
    name: "Frontend Tests (unit)"
    # Observed across 232 executions: median 0.6 min, p95 1.5 min, max 2.0 min
    # (openbuild). Unit runs are load-sensitive, so 20 min, not 5.
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "${{ inputs.node-version }}"
          cache: "npm"

      - name: Detect a runnable test script
        id: detect
        run: |
          if [ ! -f package.json ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No package.json — nothing to test."
            exit 0
          fi
          # Prefer `test`, fall back to `test:unit` — several repos declare
          # their suite only under the latter (decidesk has 282 passing tests
          # that a `test`-only probe would have skipped entirely).
          #
          # Skip the conventional npm placeholder, which "passes" while
          # running nothing: "Error: no test specified" && exit 1.
          node -e "
            const s = (require('./package.json').scripts) || {};
            const placeholder = v => !v || /no test specified/i.test(v);
            const name = !placeholder(s.test) ? 'test'
                       : !placeholder(s['test:unit']) ? 'test:unit'
                       : '';
            console.log('run=' + (name ? 'true' : 'false'));
            console.log('script=' + name);
          " >> "$GITHUB_OUTPUT"
          node -e "
            const s = (require('./package.json').scripts) || {};
            const placeholder = v => !v || /no test specified/i.test(v);
            const name = !placeholder(s.test) ? 'test'
                       : !placeholder(s['test:unit']) ? 'test:unit'
                       : '';
            console.log(name
              ? 'Detected \'' + name + '\' script: ' + s[name]
              : 'No runnable test script (checked: test, test:unit).');
          "

      - name: Install dependencies
        if: steps.detect.outputs.run == 'true'
        run: npm ci

      - name: Run unit tests
        if: steps.detect.outputs.run == 'true'
        env:
          SCRIPT: ${{ steps.detect.outputs.script }}
        run: npm run "$SCRIPT"

      - name: Record result
        if: always()
        run: |
          mkdir -p quality-results
          if [ "${{ steps.detect.outputs.run }}" != "true" ]; then
            echo "skipped" > quality-results/frontend-tests.txt
          else
            echo "${{ job.status }}" > quality-results/frontend-tests.txt
          fi

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-frontend-tests
          path: quality-results/

  # ── Group 3: Security ──────────────────────────
  security:
    runs-on: ubuntu-latest
    name: "Security (${{ matrix.ecosystem }})"
    # Observed across 505 executions: median 0.4 min, p95 1.0 min, max 5.7 min
    # (docudesk). Advisory-database fetches can stall, hence 20 min.
    timeout-minutes: 20
    strategy:
      matrix:
        ecosystem: [composer, npm]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        if: matrix.ecosystem == 'composer'
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}
          tools: composer:v2

      - name: Setup Node.js
        if: matrix.ecosystem == 'npm'
        uses: actions/setup-node@v4
        with:
          node-version: "${{ inputs.node-version }}"
          cache: "npm"
          cache-dependency-path: "${{ inputs.frontend-path }}/package-lock.json"

      - name: Run ${{ matrix.ecosystem }} audit
        env:
          FRONTEND_PATH: ${{ inputs.frontend-path }}
        run: |
          case "${{ matrix.ecosystem }}" in
            composer)
              if [ "${{ inputs.enable-php }}" != "true" ]; then
                echo "PHP toolchain is disabled — skipping composer audit."
                exit 0
              fi
              composer install --no-progress --prefer-dist --optimize-autoloader
              composer audit --format=plain --abandoned=report
              ;;
            npm)
              if [ "${{ inputs.enable-npm }}" != "true" ]; then
                echo "npm ecosystem is disabled — skipping npm audit."
                exit 0
              fi
              cd "$FRONTEND_PATH"
              npm ci
              # Tolerate an unavailable npm advisory endpoint: npm is retiring
              # the audits/quick endpoint and it intermittently 400s ("audit
              # endpoint returned an error" / "Invalid package tree"). That is an
              # infra outage, not a security finding, and must not hard-fail CI.
              # Real advisories (which print a vuln table, not an endpoint error)
              # still fail the gate.
              out="$(npm audit --audit-level=critical --omit=dev 2>&1)" && rc=0 || rc=$?
              echo "$out"
              if [ "$rc" -ne 0 ] && printf '%s' "$out" | grep -qiE "audit endpoint returned an error|Invalid package tree|ECONNRESET|ETIMEDOUT|ENOTFOUND|being retired|Service Unavailable"; then
                echo "::warning::npm audit skipped — npm advisory endpoint unavailable (external); not a vulnerability."
              elif [ "$rc" -ne 0 ]; then
                exit "$rc"
              fi
              ;;
          esac

      - name: Record result
        if: always()
        run: |
          mkdir -p quality-results
          echo "${{ job.status }}" > quality-results/${{ matrix.ecosystem }}.txt
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-security-${{ matrix.ecosystem }}
          path: quality-results/

  # ── Group 4: License Compliance ─────────────────
  #
  # Checks dependencies against an allowlist of approved SPDX license
  # identifiers. Generates a license report as a workflow artifact for
  # audit/compliance purposes.
  #
  # Configuration (optional files in your app repo root):
  #
  #   .license-allowlist.json
  #   ─────────────────────────────────────────────
  #   A JSON array of approved SPDX license identifiers. If this file is
  #   absent, the built-in default allowlist is used (see step below).
  #   Example:
  #     ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC",
  #      "LGPL-2.1-only", "LGPL-2.1-or-later", "LGPL-3.0-only",
  #      "LGPL-3.0-or-later", "EUPL-1.2", "AGPL-3.0-or-later",
  #      "GPL-2.0-only", "GPL-2.0-or-later", "GPL-3.0-only",
  #      "GPL-3.0-or-later", "MPL-2.0", "Unlicense", "0BSD",
  #      "CC0-1.0", "CC-BY-3.0", "CC-BY-4.0", "PSF-2.0",
  #      "Zlib", "BlueOak-1.0.0", "OSL-3.0"]
  #
  #   .license-overrides.json
  #   ─────────────────────────────────────────────
  #   A JSON object to manually approve specific packages even if their
  #   license is not on the allowlist. Use this for packages where:
  #   - The license is valid but uses a non-standard SPDX string
  #   - Legal has explicitly approved a specific dependency
  #   - The package is dual-licensed and the checker picks the wrong one
  #
  #   Keys are package names (composer: "vendor/package", npm: "package-name").
  #   Values are a justification string (who approved it and when).
  #   Example:
  #     {
  #       "vendor/some-package": "Approved by legal (Jan de Vries) — 2026-03-14, dual-licensed MIT/proprietary, we use MIT terms",
  #       "some-npm-package": "License is 'Artistic-2.0', compatible with EUPL — approved 2026-03-01"
  #     }
  #
  # How it works:
  #   1. Extracts all dependency licenses from composer or npm
  #   2. For dual-licensed packages ("MIT OR Apache-2.0"), passes if ANY
  #      license in the OR expression is on the allowlist
  #   3. Checks each package against overrides first, then the allowlist
  #   4. Generates a markdown + JSON report uploaded as a workflow artifact
  #   5. Fails the workflow if any dependency has a disallowed license
  # ────────────────────────────────────────────────
  license:
    if: ${{ inputs.enable-license-check }}
    runs-on: ubuntu-latest
    name: "License (${{ matrix.ecosystem }})"
    # Observed across 497 executions: median 0.7 min, p95 1.4 min, max 1.9 min
    # (planix). 20 min covers a slow registry without ever firing on a good run.
    timeout-minutes: 20
    strategy:
      matrix:
        ecosystem: [composer, npm]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        if: matrix.ecosystem == 'composer'
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}
          tools: composer:v2

      - name: Setup Node.js
        if: matrix.ecosystem == 'npm'
        uses: actions/setup-node@v4
        with:
          node-version: "${{ inputs.node-version }}"
          cache: "npm"
          cache-dependency-path: "${{ inputs.frontend-path }}/package-lock.json"

      - name: Install dependencies
        env:
          FRONTEND_PATH: ${{ inputs.frontend-path }}
        run: |
          if [ "${{ matrix.ecosystem }}" = "composer" ]; then
            if [ "${{ inputs.enable-php }}" != "true" ]; then
              echo "PHP toolchain is disabled — skipping composer install."
              exit 0
            fi
            composer install --no-progress --prefer-dist --optimize-autoloader
          else
            if [ "${{ inputs.enable-npm }}" != "true" ]; then
              echo "npm ecosystem is disabled — skipping npm install."
              exit 0
            fi
            cd "$FRONTEND_PATH"
            npm ci
            npm install -g license-checker
          fi

      - name: Check ${{ matrix.ecosystem }} licenses
        env:
          FRONTEND_PATH: ${{ inputs.frontend-path }}
        run: |
          set -euo pipefail

          if [ "${{ matrix.ecosystem }}" = "composer" ] && [ "${{ inputs.enable-php }}" != "true" ]; then
            echo "PHP toolchain is disabled — skipping composer license check."
            exit 0
          fi

          if [ "${{ matrix.ecosystem }}" = "npm" ] && [ "${{ inputs.enable-npm }}" != "true" ]; then
            echo "npm ecosystem is disabled — skipping npm license check."
            exit 0
          fi

          # ── Default allowlist (EUPL-1.2 / AGPL-3.0 compatible) ──
          DEFAULT_ALLOWLIST='[
            "MIT", "ISC", "BSD-2-Clause", "BSD-3-Clause", "0BSD",
            "Apache-2.0",
            "LGPL-2.0-only", "LGPL-2.0-or-later",
            "LGPL-2.1-only", "LGPL-2.1-or-later",
            "LGPL-3.0-only", "LGPL-3.0-or-later",
            "GPL-2.0-only", "GPL-2.0-or-later",
            "GPL-3.0-only", "GPL-3.0-or-later",
            "AGPL-3.0-only", "AGPL-3.0-or-later",
            "EUPL-1.1", "EUPL-1.2",
            "MPL-2.0", "OSL-3.0",
            "Unlicense", "CC0-1.0", "CC-BY-3.0", "CC-BY-4.0",
            "PSF-2.0", "Python-2.0", "Zlib", "BlueOak-1.0.0",
            "Artistic-2.0", "BSL-1.0", "WTFPL",
            "OFL-1.1", "OFL-1.0"
          ]'

          if [ -f .license-allowlist.json ]; then
            ALLOWLIST=$(cat .license-allowlist.json)
            echo "Using project .license-allowlist.json"
          else
            ALLOWLIST="$DEFAULT_ALLOWLIST"
            echo "Using built-in default allowlist"
          fi

          if [ -f .license-overrides.json ]; then
            OVERRIDES=$(cat .license-overrides.json)
            echo "Loaded .license-overrides.json with $(echo "$OVERRIDES" | jq 'length') override(s)"
          else
            OVERRIDES='{}'
          fi

          mkdir -p license-report

          # Helper: check if a license string is allowed
          # Handles SPDX OR expressions and trailing "*" from license-checker
          check_license() {
            local license_str="$1"
            IFS='|' read -ra PARTS <<< "$(echo "$license_str" | sed 's/ OR /|/g; s/ or /|/g')"
            for part in "${PARTS[@]}"; do
              part=$(echo "$part" | sed 's/^ *//;s/ *$//' | sed 's/[()]//g' | sed 's/\*$//')
              if echo "$ALLOWLIST" | jq -e --arg l "$part" 'map(ascii_downcase) | index($l | ascii_downcase)' > /dev/null 2>&1; then
                return 0
              fi
            done
            return 1
          }

          VIOLATIONS=0
          REPORT_JSON='[]'
          ECOSYSTEM="${{ matrix.ecosystem }}"

          if [ "$ECOSYSTEM" = "composer" ]; then
            echo ""
            echo "=== Checking Composer dependencies ==="
            COMPOSER_JSON=$(composer licenses --format=json 2>/dev/null || echo '{"dependencies":{}}')

            for pkg in $(echo "$COMPOSER_JSON" | jq -r '.dependencies | keys[]' 2>/dev/null); do
              license=$(echo "$COMPOSER_JSON" | jq -r --arg p "$pkg" '.dependencies[$p].license | join(" OR ")')
              version=$(echo "$COMPOSER_JSON" | jq -r --arg p "$pkg" '.dependencies[$p].version')

              override=$(echo "$OVERRIDES" | jq -r --arg p "$pkg" '.[$p] // empty')
              if [ -n "$override" ]; then
                status="approved-override"
                echo "  OVERRIDE: $pkg ($license) — $override"
              elif check_license "$license"; then
                status="approved"
              else
                status="DENIED"
                VIOLATIONS=$((VIOLATIONS + 1))
                echo "::error::Disallowed license: $pkg ($version) uses '$license'"
              fi

              REPORT_JSON=$(echo "$REPORT_JSON" | jq \
                --arg pkg "$pkg" --arg ver "$version" --arg lic "$license" \
                --arg st "$status" --arg ovr "${override:-}" \
                '. + [{"package": $pkg, "version": $ver, "license": $lic, "status": $st, "override": $ovr, "ecosystem": "composer"}]')
            done

          else
            echo ""
            echo "=== Checking npm dependencies ==="
            NPM_JSON=$(license-checker --json --production --start "$FRONTEND_PATH" 2>/dev/null || echo '{}')

            for pkg in $(echo "$NPM_JSON" | jq -r 'keys[]' 2>/dev/null); do
              license=$(echo "$NPM_JSON" | jq -r --arg p "$pkg" '.[$p].licenses // .[$p].license // "UNKNOWN"')
              pkg_name=$(echo "$pkg" | sed 's/@[^@]*$//')
              pkg_version=$(echo "$pkg" | grep -oP '@[^@]+$' | sed 's/^@//')

              override=$(echo "$OVERRIDES" | jq -r --arg p "$pkg_name" '.[$p] // empty')
              if [ -n "$override" ]; then
                status="approved-override"
                echo "  OVERRIDE: $pkg_name ($license) — $override"
              elif check_license "$license"; then
                status="approved"
              else
                status="DENIED"
                VIOLATIONS=$((VIOLATIONS + 1))
                echo "::error::Disallowed license: $pkg_name ($pkg_version) uses '$license'"
              fi

              REPORT_JSON=$(echo "$REPORT_JSON" | jq \
                --arg pkg "$pkg_name" --arg ver "$pkg_version" --arg lic "$license" \
                --arg st "$status" --arg ovr "${override:-}" \
                '. + [{"package": $pkg, "version": $ver, "license": $lic, "status": $st, "override": $ovr, "ecosystem": "npm"}]')
            done
          fi

          TOTAL=$(echo "$REPORT_JSON" | jq 'length')
          APPROVED=$(echo "$REPORT_JSON" | jq '[.[] | select(.status == "approved")] | length')
          OVERRIDDEN=$(echo "$REPORT_JSON" | jq '[.[] | select(.status == "approved-override")] | length')
          DENIED=$(echo "$REPORT_JSON" | jq '[.[] | select(.status == "DENIED")] | length')

          # Save JSON report
          echo "$REPORT_JSON" | jq '.' > license-report/$ECOSYSTEM-licenses.json

          # Generate Markdown report
          {
            echo "# $ECOSYSTEM License Report"
            echo ""
            echo "**Generated:** $(date -u +'%Y-%m-%d %H:%M UTC')"
            echo "**Repository:** ${{ github.repository }}"
            echo "**Ref:** ${{ github.sha }}"
            echo ""
            echo "## Summary"
            echo ""
            echo "| Metric | Count |"
            echo "|--------|-------|"
            echo "| Total dependencies | $TOTAL |"
            echo "| Approved (allowlist) | $APPROVED |"
            echo "| Approved (manual override) | $OVERRIDDEN |"
            echo "| **Denied** | **$DENIED** |"
            echo ""
            echo "## Dependencies"
            echo ""
            echo "| Package | Version | License | Status | Override |"
            echo "|---------|---------|---------|--------|----------|"
          } > license-report/$ECOSYSTEM-licenses.md

          echo "$REPORT_JSON" | jq -r '.[] | "| \(.package) | \(.version) | \(.license) | \(.status) | \(.override) |"' >> license-report/$ECOSYSTEM-licenses.md

          if [ "$DENIED" -gt 0 ]; then
            {
              echo ""
              echo "## Denied Dependencies"
              echo ""
              echo "| Package | License |"
              echo "|---------|---------|"
            } >> license-report/$ECOSYSTEM-licenses.md
            echo "$REPORT_JSON" | jq -r '.[] | select(.status == "DENIED") | "| \(.package) | \(.license) |"' >> license-report/$ECOSYSTEM-licenses.md
            {
              echo ""
              echo "### How to resolve"
              echo ""
              echo "1. Add the license SPDX identifier to \`.license-allowlist.json\` if the license is generally acceptable"
              echo "2. Add the specific package to \`.license-overrides.json\` with a justification if only this package is approved"
              echo ""
              echo "See the workflow comments in quality.yml for configuration details."
            } >> license-report/$ECOSYSTEM-licenses.md
          fi

          echo ""
          echo "════════════════════════════════════════"
          echo "$ECOSYSTEM: $TOTAL total, $APPROVED approved, $OVERRIDDEN overridden, $DENIED denied"
          echo "════════════════════════════════════════"

          if [ "$VIOLATIONS" -gt 0 ]; then
            echo "::error::$VIOLATIONS $ECOSYSTEM dependency license(s) are not on the allowlist. Add them to .license-allowlist.json or .license-overrides.json"
            exit 1
          fi
          echo "All $ECOSYSTEM dependency licenses are compliant."

      - name: Upload license report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: license-report-${{ matrix.ecosystem }}
          path: license-report/
          retention-days: 90

      - name: Record result
        if: always()
        run: |
          mkdir -p quality-results
          echo "${{ job.status }}" > quality-results/${{ matrix.ecosystem }}.txt
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-license-${{ matrix.ecosystem }}
          path: quality-results/

  # ╔══════════════════════════════════════════════╗
  # ║  STAGE 2 — Tests (gated behind Stage 1)      ║
  # ║                                               ║
  # ║  • PHPUnit matrix (PHP × Nextcloud versions)  ║
  # ║  • Integration tests (Newman)                 ║
  # ║  • E2E browser tests (Playwright)             ║
  # ╚══════════════════════════════════════════════╝

  phpunit:
    if: ${{ inputs.enable-php && inputs.enable-phpunit && !cancelled() && needs.php-quality.result != 'failure' && needs.security.result != 'failure' }}
    runs-on: ubuntu-latest
    name: "PHPUnit (PHP ${{ matrix.php-version }}, NC ${{ matrix.nextcloud-ref }})"
    needs: [php-quality, security]
    # Observed across 337 SUCCESSFUL executions: median 1.7 min, p95 13.6 min,
    # max 18.9 min (shillinq, green). The spread is huge because each leg
    # installs a full Nextcloud server before the suite runs, so a tight bound
    # would newly fail shillinq's already-green runs. 45 min is ~2.4x the worst
    # observed green run and still cuts a hang from 6 hours to 45 minutes.
    timeout-minutes: 45

    services:
      postgres:
        image: ${{ inputs.database == 'pgsql' && 'postgres:16' || '' }}
        env:
          POSTGRES_USER: nextcloud
          POSTGRES_PASSWORD: nextcloud
          POSTGRES_DB: nextcloud
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U nextcloud"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    strategy:
      matrix:
        php-version: ${{ fromJSON(inputs.php-test-versions) }}
        nextcloud-ref: ${{ fromJSON(inputs.nextcloud-test-refs) }}
      fail-fast: false

    steps:
      - name: Checkout Nextcloud server
        uses: actions/checkout@v4
        with:
          repository: nextcloud/server
          ref: ${{ matrix.nextcloud-ref }}
          path: server

      - name: Checkout server submodules
        run: |
          cd server
          git submodule update --init 3rdparty

      - name: Checkout app
        uses: actions/checkout@v4
        with:
          path: server/apps/${{ inputs.app-name }}

      - name: Checkout additional apps
        if: ${{ inputs.additional-apps != '[]' }}
        run: |
          echo '${{ inputs.additional-apps }}' | jq -c '.[]' | while read -r app; do
            repo=$(echo "$app" | jq -r '.repo')
            name=$(echo "$app" | jq -r '.app')
            ref=$(echo "$app" | jq -r '.ref // "main"')
            echo "Checking out $repo ($name) at $ref..."
            git clone --depth 1 --branch "$ref" "https://github.com/$repo.git" "server/apps/$name"
            if [ -f "server/apps/$name/composer.json" ]; then
              cd "server/apps/$name"
              composer install --no-progress --prefer-dist --optimize-autoloader --no-dev 2>/dev/null || true
              cd -
            fi
          done

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, intl, sqlite3, pgsql, pdo_pgsql, zip, gd, curl, xml, json
          coverage: xdebug
          tools: composer:v2

      - name: Install Nextcloud
        run: |
          cd server
          if [ "${{ inputs.database }}" = "pgsql" ]; then
            php occ maintenance:install \
              --database pgsql \
              --database-host 127.0.0.1 \
              --database-port 5432 \
              --database-name nextcloud \
              --database-user nextcloud \
              --database-pass nextcloud \
              --admin-user admin \
              --admin-pass admin
          else
            php occ maintenance:install \
              --database ${{ inputs.database }} \
              --admin-user admin \
              --admin-pass admin
          fi
          if [ '${{ inputs.additional-apps }}' != '[]' ]; then
            echo '${{ inputs.additional-apps }}' | jq -r '.[].app' | while read -r name; do
              echo "Enabling app: $name"
              php occ app:enable "$name" || echo "::warning::Failed to enable $name, continuing..."
            done
          fi
          chmod -R a+w config

      # Install the app's own dependencies BEFORE enabling it. Enabling triggers
      # install-scope repair steps that autowire services with eager constructors
      # (e.g. SaveObject does `new Twig\Environment(...)`); without vendor present
      # that fatals with an uncaught \Error (NC core only catches \Exception),
      # killing the step. Matches the newman/playwright/journeydoc jobs, which
      # already composer-install before enabling the app.
      - name: Install app dependencies and enable app
        run: |
          cd server/apps/${{ inputs.app-name }}
          composer install --no-progress --prefer-dist --optimize-autoloader
          cd ../../
          php occ app:enable ${{ inputs.app-name }}

      - name: Validate test infrastructure
        run: |
          cd server/apps/${{ inputs.app-name }}
          if [ ! -f phpunit.xml ] && [ ! -f phpunit-unit.xml ]; then
            echo "::error::PHPUnit is enabled but no phpunit.xml or phpunit-unit.xml found."
            exit 1
          fi
          if [ ! -d tests/Unit ] && [ ! -d tests/unit ] && [ ! -d tests/Service ] && [ ! -d tests/Integration ] && [ ! -d tests/integration ]; then
            echo "::error::PHPUnit is enabled but no test directories found."
            exit 1
          fi
          echo "PHPUnit infrastructure validated."

      - name: Run PHPUnit tests
        run: |
          cd server/apps/${{ inputs.app-name }}
          ./vendor/bin/phpunit \
            -c phpunit.xml \
            --colors=always \
            --coverage-clover=coverage/clover.xml

      - name: Guard coverage baseline
        if: inputs.enable-coverage-guard && matrix.php-version == inputs.php-version && matrix.nextcloud-ref == fromJSON(inputs.nextcloud-test-refs)[0]
        run: |
          cd server/apps/${{ inputs.app-name }}
          php scripts/coverage-guard.php coverage/clover.xml

      - name: Upload coverage artifact
        if: always() && matrix.php-version == inputs.php-version && matrix.nextcloud-ref == fromJSON(inputs.nextcloud-test-refs)[0]
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: server/apps/${{ inputs.app-name }}/coverage/
          retention-days: 14
          if-no-files-found: ignore

  newman:
    if: ${{ inputs.enable-newman && !cancelled() && needs.php-quality.result != 'failure' && needs.security.result != 'failure' }}
    runs-on: ubuntu-latest
    name: "Integration Tests (Newman)"
    needs: [php-quality, security]
    # Observed across 39 executions: median 1.9 min, max 7.5 min (launchpad).
    # Also installs a full Nextcloud server first, so 30 min — 4x the worst run.
    timeout-minutes: 30

    services:
      postgres:
        image: ${{ inputs.database == 'pgsql' && 'postgres:16' || '' }}
        env:
          POSTGRES_USER: nextcloud
          POSTGRES_PASSWORD: nextcloud
          POSTGRES_DB: nextcloud
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U nextcloud"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout Nextcloud server
        uses: actions/checkout@v4
        with:
          repository: nextcloud/server
          ref: ${{ fromJSON(inputs.nextcloud-test-refs)[0] }}
          path: server

      - name: Checkout server submodules
        run: |
          cd server
          git submodule update --init 3rdparty

      - name: Checkout app
        uses: actions/checkout@v4
        with:
          path: server/apps/${{ inputs.app-name }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}
          extensions: mbstring, intl, sqlite3, pgsql, pdo_pgsql, zip, gd, curl, xml, json
          tools: composer:v2

      - name: Checkout additional apps
        if: ${{ inputs.additional-apps != '[]' }}
        run: |
          echo '${{ inputs.additional-apps }}' | jq -c '.[]' | while read -r app; do
            repo=$(echo "$app" | jq -r '.repo')
            name=$(echo "$app" | jq -r '.app')
            ref=$(echo "$app" | jq -r '.ref // "main"')
            echo "Checking out $repo ($name) at $ref..."
            git clone --depth 1 --branch "$ref" "https://github.com/$repo.git" "server/apps/$name"
            if [ -f "server/apps/$name/composer.json" ]; then
              echo "Installing composer dependencies for $name..."
              cd "server/apps/$name"
              composer install --no-progress --prefer-dist --optimize-autoloader --no-dev
              cd -
            fi
          done

      - name: Install Nextcloud
        run: |
          cd server
          if [ "${{ inputs.database }}" = "pgsql" ]; then
            php occ maintenance:install \
              --database pgsql \
              --database-host 127.0.0.1 \
              --database-port 5432 \
              --database-name nextcloud \
              --database-user nextcloud \
              --database-pass nextcloud \
              --admin-user admin \
              --admin-pass admin
          else
            php occ maintenance:install \
              --database ${{ inputs.database }} \
              --admin-user admin \
              --admin-pass admin
          fi
          if [ '${{ inputs.additional-apps }}' != '[]' ]; then
            echo '${{ inputs.additional-apps }}' | jq -r '.[].app' | while read -r name; do
              echo "Enabling app: $name"
              php occ app:enable "$name" || echo "::warning::Failed to enable $name, continuing..."
            done
          fi

      - name: Install and enable app
        run: |
          cd server/apps/${{ inputs.app-name }}
          composer install --no-progress --prefer-dist --optimize-autoloader
          cd ../../
          php occ app:enable ${{ inputs.app-name }}

      - name: Start PHP built-in server
        # Same front-controller router as the Playwright job — see the long
        # comment on that step. Without it, `php -S` returns 404 for any path
        # that resolves to an existing directory with no index.php inside,
        # which is every pretty Nextcloud URL once the app is checked out to
        # `server/apps/<app>`. A Postman collection hitting `/apps/<app>/api/…`
        # rather than `/index.php/apps/<app>/api/…` fails here for that reason
        # alone.
        run: |
          cd server
          cat > ci-router.php <<'ROUTER'
          <?php
          $path = parse_url($_SERVER['REQUEST_URI'], PHP_URL_PATH) ?: '/';
          if ($path !== '/' && is_file(__DIR__ . $path)) {
              return false;
          }
          $segments = explode('/', ltrim($path, '/'));
          $prefix = '';
          foreach ($segments as $i => $segment) {
              $prefix .= '/' . $segment;
              if (substr($segment, -4) !== '.php'
                  || $prefix === '/index.php'
                  || !is_file(__DIR__ . $prefix)
              ) {
                  continue;
              }
              $rest = implode('/', array_slice($segments, $i + 1));
              $_SERVER['SCRIPT_NAME'] = $prefix;
              $_SERVER['SCRIPT_FILENAME'] = __DIR__ . $prefix;
              $_SERVER['PHP_SELF'] = $path;
              $_SERVER['PATH_INFO'] = $rest === '' ? '' : '/' . $rest;
              require __DIR__ . $prefix;
              return true;
          }
          $_SERVER['SCRIPT_NAME'] = '/index.php';
          $_SERVER['SCRIPT_FILENAME'] = __DIR__ . '/index.php';
          $_SERVER['PHP_SELF'] = '/index.php';
          require __DIR__ . '/index.php';
          ROUTER
          php -S 0.0.0.0:8080 ci-router.php &
          sleep 3
          curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/status.php || echo "Server not ready"
        env:
          # PHP_CLI_SERVER_WORKERS: `php -S` is SINGLE-WORKER by default, so it
          # can only ever have one request in flight. That is fatal — not slow,
          # FATAL — for any API collection in which the app under test calls
          # BACK into this same instance while serving a request: the one
          # worker is blocked inside the outer request, so the nested request
          # can never be accepted, and both hang until the job's timeout kills
          # them.
          #
          # Measured on openconnector (run 30821823343, job 91713730053): the
          # collection creates a "self-pointing source" whose `location` is
          # this very server, then calls
          # `POST /api/synchronizations/<uuid>/test`. That request never
          # returned. The job sat in "Run Newman tests" for ~30 minutes and was
          # cancelled by timeout-minutes, having completed J2.2 and printed
          # nothing after J2.3. Self-referential fixtures like this are normal
          # in an integration suite — pointing a Source at the instance's own
          # OpenRegister API is the cheapest way to get a real, reachable
          # upstream — so the runner has to be able to serve them.
          #
          # The Playwright job's identical `php -S` step already sets this (for
          # a different symptom: SPA boot requests serialising behind each
          # other). Callers cannot set it — the `php -S` invocation lives in
          # this workflow — so, exactly as noted there, it has to be fixed here.
          PHP_CLI_SERVER_WORKERS: 8

      - name: Seed test data
        if: inputs.newman-seed-command != ''
        # Same rationale as the Playwright job's seed step: a seed script is
        # usually driving the app's own admin API and has to be told WHICH
        # instance and with what credentials. This step declared no `env:` at
        # all, so a script here saw neither BASE_URL nor ADMIN_USER and had to
        # hardcode `http://localhost:8080` — a literal that means the SHARED
        # dev container on a developer box, which makes the same script unsafe
        # to run anywhere else.
        env:
          BASE_URL: http://localhost:8080
          NEXTCLOUD_URL: http://localhost:8080
          NC_BASE_URL: http://localhost:8080
          ADMIN_USER: admin
          ADMIN_PASSWORD: admin
          NC_ADMIN_USER: admin
          NC_ADMIN_PASS: admin
        run: |
          cd server
          echo "Running seed command: ${{ inputs.newman-seed-command }}"
          # Run the seed command (e.g. maintenance:repair, custom script, etc.)
          # Use eval to support complex commands with pipes or &&
          eval ${{ inputs.newman-seed-command }}
          echo "Seed command completed."

      - name: Setup Node.js and Newman
        uses: actions/setup-node@v4
        with:
          node-version: "${{ inputs.node-version }}"

      - name: Install Newman
        run: npm install -g newman

      - name: Validate Newman collections
        run: |
          cd server/apps/${{ inputs.app-name }}
          COLLECTION_PATH="${{ inputs.newman-collection-path }}"
          if [ ! -d "$COLLECTION_PATH" ]; then
            echo "::error::Newman is enabled but collection directory '$COLLECTION_PATH' does not exist."
            exit 1
          fi
          COLLECTIONS=$(find "$COLLECTION_PATH" -name "*.postman_collection.json" 2>/dev/null | wc -l)
          if [ "$COLLECTIONS" -eq 0 ]; then
            echo "::error::No .postman_collection.json files found in '$COLLECTION_PATH'."
            exit 1
          fi
          echo "Found $COLLECTIONS Postman collection(s) in $COLLECTION_PATH."

      - name: Run Newman tests
        run: |
          cd server/apps/${{ inputs.app-name }}/${{ inputs.newman-collection-path }}

          # Build environment args: use --environment file if provided, otherwise ad-hoc vars
          ENV_ARGS=""
          if [ -n "${{ inputs.newman-environment-path }}" ]; then
            # Absolute, so it does not depend on how deep
            # `newman-collection-path` happens to be. The previous value,
            # "../../../apps/<app>/<env-path>", was hand-rolled relative to the
            # cwd set above and was off by one level: from
            # `server/apps/<app>/tests/postman`, `../../..` is `server/apps`,
            # so it resolved to `server/apps/apps/<app>/...` and never existed.
            # Every run took the fallback branch and emitted a "not found"
            # warning about a file that is committed and present (measured on
            # openconnector, which ships tests/postman/*.postman_environment.json).
            # The fallback happens to set the same three variables, so this was
            # invisible — until a collection needs a variable the fallback does
            # not define, at which point it fails for a reason the warning
            # actively misdirects you away from.
            ENV_FILE="$GITHUB_WORKSPACE/server/apps/${{ inputs.app-name }}/${{ inputs.newman-environment-path }}"
            if [ -f "$ENV_FILE" ]; then
              # Rewrite localhost:8080 for CI (PHP built-in server runs on 8080)
              echo "Using environment file: ${{ inputs.newman-environment-path }}"
              ENV_ARGS="--environment $ENV_FILE"
            else
              echo "::warning::Environment file '${{ inputs.newman-environment-path }}' not found, falling back to default env vars."
              ENV_ARGS='--env-var "base_url=http://localhost:8080" --env-var "admin_user=admin" --env-var "admin_password=admin"'
            fi
          else
            ENV_ARGS='--env-var "base_url=http://localhost:8080" --env-var "admin_user=admin" --env-var "admin_password=admin"'
          fi

          FAIL=0
          for collection in *.postman_collection.json; do
            echo ""
            echo "=== Running: $collection ==="
            eval newman run "\"$collection\"" $ENV_ARGS --reporters cli || FAIL=1
          done
          if [ "$FAIL" -ne 0 ]; then
            echo "::error::One or more Newman collections failed."
            exit 1
          fi

      - name: Show Nextcloud log on failure
        if: failure()
        run: |
          echo "=== Last 50 lines of Nextcloud log ==="
          tail -50 server/data/nextcloud.log 2>/dev/null | python3 -m json.tool --no-ensure-ascii 2>/dev/null || tail -50 server/data/nextcloud.log 2>/dev/null || echo "No log found"

  playwright:
    if: ${{ inputs.enable-playwright && !cancelled() && needs.security.result != 'failure' }}
    runs-on: ubuntu-latest
    name: "E2E Tests (Playwright)"
    # `frontend-build` is a dependency purely so its artifact is available to
    # download — NOT a gate. The `if:` above contains `!cancelled()`, which
    # suppresses the implicit `success()` on needs, so a failed or skipped
    # frontend-build still lets this job run and reach its own verdict. When
    # the artifact is absent for any reason the build step below runs exactly
    # as it did before this dependency existed.
    needs: [php-quality, security, frontend-build]
    # No job in this file declared a timeout, so a hung suite ran to GitHub's
    # 6-hour default. Observed durations once the suite is healthy: 4-10 min
    # (planix 0.8, doriath 4.2, zaakafhandelapp 5.3, softwarecatalog 6.1,
    # openconnector 7.7, opencatalogi 10.0). Unhealthy runs measured 1.1h and
    # 1.6h before the `visual`/`docs-capture` projects were excluded. 45
    # minutes leaves a wide margin over every healthy run while turning a hang
    # into a failure in under an hour instead of burning a runner for six.
    timeout-minutes: 45

    services:
      postgres:
        image: ${{ inputs.database == 'pgsql' && 'postgres:16' || '' }}
        env:
          POSTGRES_USER: nextcloud
          POSTGRES_PASSWORD: nextcloud
          POSTGRES_DB: nextcloud
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U nextcloud"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout Nextcloud server
        uses: actions/checkout@v4
        with:
          repository: nextcloud/server
          ref: ${{ fromJSON(inputs.nextcloud-test-refs)[0] }}
          path: server

      - name: Checkout server submodules
        run: |
          cd server
          git submodule update --init 3rdparty

      - name: Checkout app
        uses: actions/checkout@v4
        with:
          path: server/apps/${{ inputs.app-name }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}
          extensions: mbstring, intl, sqlite3, pgsql, pdo_pgsql, zip, gd, curl, xml, json
          tools: composer:v2

      - name: Checkout additional apps
        if: ${{ inputs.additional-apps != '[]' }}
        run: |
          echo '${{ inputs.additional-apps }}' | jq -c '.[]' | while read -r app; do
            repo=$(echo "$app" | jq -r '.repo')
            name=$(echo "$app" | jq -r '.app')
            ref=$(echo "$app" | jq -r '.ref // "main"')
            echo "Checking out $repo ($name) at $ref..."
            git clone --depth 1 --branch "$ref" "https://github.com/$repo.git" "server/apps/$name"
            if [ -f "server/apps/$name/composer.json" ]; then
              echo "Installing composer dependencies for $name..."
              cd "server/apps/$name"
              composer install --no-progress --prefer-dist --optimize-autoloader --no-dev
              cd -
            fi
          done

      - name: Install Nextcloud
        run: |
          cd server
          if [ "${{ inputs.database }}" = "pgsql" ]; then
            php occ maintenance:install \
              --database pgsql \
              --database-host 127.0.0.1 \
              --database-port 5432 \
              --database-name nextcloud \
              --database-user nextcloud \
              --database-pass nextcloud \
              --admin-user admin \
              --admin-pass admin
          else
            php occ maintenance:install \
              --database ${{ inputs.database }} \
              --admin-user admin \
              --admin-pass admin
          fi
          if [ '${{ inputs.additional-apps }}' != '[]' ]; then
            echo '${{ inputs.additional-apps }}' | jq -r '.[].app' | while read -r name; do
              echo "Enabling app: $name"
              php occ app:enable "$name" || echo "::warning::Failed to enable $name, continuing..."
            done
          fi

      - name: Install and enable app
        run: |
          cd server/apps/${{ inputs.app-name }}
          composer install --no-progress --prefer-dist --optimize-autoloader
          cd ../../
          php occ app:enable ${{ inputs.app-name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "${{ inputs.node-version }}"

      - name: Install app npm dependencies
        run: |
          cd server/apps/${{ inputs.app-name }}
          if [ -f "package.json" ]; then
            npm ci
          fi

      - name: Install Playwright
        run: |
          cd server/apps/${{ inputs.app-name }}
          npm install --save-dev @playwright/test
          npx playwright install --with-deps chromium

      # ── Reuse the bundle the `frontend-build` job already compiled ─────────
      #
      # Fast path only. Every condition below is written so that "I am not
      # certain this is the right bundle" resolves to REBUILDING, never to
      # running specs against something unverified — a wrong or empty bundle
      # does not produce a 404, it produces HTTP 200 text/html and a wall of
      # selector timeouts that read as a broken app rather than a broken
      # pipeline. The cost of the fallback is ~3 minutes; the cost of a bad
      # hand-off is a false verdict on every UI spec in the fleet.
      #
      # Guarded on frontend-path == '.' because the build job runs inside
      # `inputs.frontend-path` while this job builds at the app root; for a
      # repo with a nested frontend the two output trees are not the same
      # paths, so that case keeps building here.
      - name: Download prebuilt app frontend
        id: prebuilt
        if: ${{ needs.frontend-build.outputs.built == 'true' && inputs.frontend-path == '.' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: frontend-build-output
          path: /tmp/frontend-build

      - name: Restore prebuilt app frontend
        id: restore
        if: ${{ steps.prebuilt.outcome == 'success' }}
        run: |
          set -euo pipefail
          TARBALL=/tmp/frontend-build/frontend-build-output.tar.gz
          if [ ! -f "$TARBALL" ]; then
            echo "restored=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Prebuilt frontend artifact downloaded but the tarball is missing — building here instead."
            exit 0
          fi
          # Positive check on the thing that actually matters: JavaScript.
          # An artifact that extracts cleanly but carries no .js is
          # indistinguishable from a successful build at the HTTP layer
          # (200 text/html either way), so assert it HERE, where the failure
          # is still legible, and rebuild rather than proceed on doubt.
          TOTAL="$(tar -tzf "$TARBALL" | grep -c . || true)"
          JS_COUNT="$(tar -tzf "$TARBALL" | grep -c '\.js$' || true)"
          echo "Artifact holds $TOTAL file(s), of which $JS_COUNT are .js"
          if [ "$TOTAL" -eq 0 ] || [ "$JS_COUNT" -eq 0 ]; then
            echo "restored=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Prebuilt frontend artifact carried no JavaScript — building here instead."
            exit 0
          fi
          tar -xzf "$TARBALL" -C "server/apps/${{ inputs.app-name }}"
          echo "Restored $TOTAL file(s) from the frontend-build artifact into server/apps/${{ inputs.app-name }}."
          echo "restored=true" >> "$GITHUB_OUTPUT"

      - name: Build app frontend
        # Vue/React apps that mount via `Util::addScript()` need their
        # webpack bundle on disk before specs render the page; without
        # this step every selector waits times out because the script
        # tag 404s and the SPA never mounts. Skip silently when the app
        # has no `build` npm script (legacy apps without a frontend).
        #
        # Skipped when the `frontend-build` job already produced the bundle and
        # the restore step verified it. Any other outcome falls through to here
        # and builds, which is byte-for-byte the behaviour that predates the
        # artifact hand-off.
        if: ${{ steps.restore.outputs.restored != 'true' }}
        run: |
          cd server/apps/${{ inputs.app-name }}
          if [ -f "package.json" ] && node -e "process.exit(require('./package.json').scripts && require('./package.json').scripts.build ? 0 : 1)" 2>/dev/null; then
            echo "Building app frontend with 'npm run build'…"
            npm run build
          else
            echo "No 'build' script in package.json; skipping frontend build."
          fi

      - name: Validate Playwright tests exist
        run: |
          cd server/apps/${{ inputs.app-name }}
          TEST_PATH="${{ inputs.playwright-test-path }}"
          if [ ! -d "$TEST_PATH" ]; then
            echo "::error::Playwright is enabled but test directory '$TEST_PATH' does not exist."
            exit 1
          fi
          TESTS=$(find "$TEST_PATH" -name "*.spec.ts" -o -name "*.spec.js" 2>/dev/null | wc -l)
          if [ "$TESTS" -eq 0 ]; then
            echo "::error::No .spec.ts or .spec.js files found in '$TEST_PATH'."
            exit 1
          fi
          echo "Found $TESTS Playwright test file(s) in $TEST_PATH."

      - name: Start PHP built-in server
        # Started AFTER the slow setup phases (npm ci, playwright install,
        # frontend build) so the server is not idle for minutes — that's
        # what was causing the orphaned `php -S` process to disappear by
        # the time specs ran.
        #
        # Polling loop (per @WilcoLouwerse's review): `curl -sf` returns
        # failure immediately on connection refused — `-m 5` only applies
        # AFTER the TCP connection is established. A single probe after
        # `sleep 3` therefore fails spuriously when the runner is noisy
        # and `php -S` hasn't bound :8080 yet. Poll every 0.5s with a
        # 15s hard cap so the fail-fast path is honest.
        #
        # PHP_CLI_SERVER_WORKERS: the built-in server is SINGLE-WORKER by
        # default, so every request a Nextcloud SPA fires on boot is
        # serialised behind the one before it. Measured on opencatalogi:
        # whichever spec ran first blew its 60s test timeout waiting for the
        # index page to render and then passed in 9.1s on retry, while every
        # later spec ran in 4-7s. It was measuring server warm-up, and it
        # cost a retry on every run. Callers cannot set this — the `php -S`
        # invocation lives here — so it has to be fixed here.
        #
        # ── ci-router.php: PRETTY URLs 404 WITHOUT IT ───────────────────────
        # `php -S` was started with no router script, so it resolved each
        # request path against the document root itself. For a path that
        # resolves to a DIRECTORY WITH NO index.php INSIDE, it returns 404 —
        # it does not fall back to the root index.php. Measured:
        #
        #     /index.php/apps/<app>/   -> 200   PATH_INFO=/apps/<app>/
        #     /apps/<app>/             -> 404   <-- the directory exists
        #     /nonexistent/            -> 200   <-- falls through to index.php
        #
        # Note the inversion: a path that does NOT exist works, and one that
        # DOES exist fails. The app under test is checked out to
        # `server/apps/<app>`, so every pretty Nextcloud URL in the fleet's
        # specs 404s here. None of it shows up in the docker dev images, where
        # apps live in `custom_apps/` and Apache + Nextcloud's own .htaccess
        # rewrites pretty URLs — so a spec that passes locally 404s on CI and
        # reports it as a selector timeout naming an ELEMENT, not a missing
        # page. That is a wall of red pointing at the wrong thing.
        #
        # Evidence, from one run on one instance (ConductionNL/openconnector
        # run 30771630267): the specs whose base URL was
        # `/index.php/apps/openconnector` PASSED, while the specs whose base
        # URL was `/apps/openconnector/#` failed with `main` not found. Across
        # pipelinq, openconnector and scholiq alone that is ~55 spec files.
        #
        # The router does exactly what Nextcloud's shipped .htaccess does —
        # `RewriteRule . index.php [PT,E=PATH_INFO:$1]`: serve real files
        # as-is, route everything else through the root index.php with
        # REQUEST_URI untouched. Nextcloud's Request::getRawPathInfo() derives
        # the path by stripping SCRIPT_NAME from REQUEST_URI, so with
        # SCRIPT_NAME="/index.php" both URL forms yield a byte-identical path
        # info. Verified against that exact algorithm, including query-string
        # preservation, static JS keeping `application/javascript`, and
        # `status.php` still executing as itself.
        #
        # ── AND THE OTHER PHP ENTRY POINTS NEED A PREFIX MATCH ──────────────
        # The first cut of the router claimed those other entry points still
        # "execute as themselves" on the strength of `is_file()`. That check
        # only ever matches a URL that IS a file exactly — `/status.php`, the
        # one case that got tested. Nextcloud never calls the OCS entry points
        # that way: every real request carries path info,
        #
        #     /ocs/v2.php/cloud/user
        #     /ocs/v1.php/cloud/groups?format=json
        #     /remote.php/dav/files/admin
        #
        # and `is_file(__DIR__ . '/ocs/v2.php/cloud/user')` is false. So the
        # router swallowed them into index.php with SCRIPT_NAME="/index.php",
        # getRawPathInfo() returned "/ocs/v2.php/cloud/user", no route matched,
        # and every OCS call in the fleet became a hard 404. Nextcloud's
        # .htaccess exempts these by PREFIX (`RewriteCond %{REQUEST_FILENAME}
        # !/ocs/v1.php` …), not by file existence — so do the same: walk the
        # path for the longest `.php` prefix that exists on disk and hand the
        # request to that script with a matching SCRIPT_NAME/PATH_INFO pair,
        # which is exactly what a router-less `php -S` did before.
        #
        # `/index.php` is excluded from the walk on purpose, so `/index.php/…`
        # keeps taking the fall-through branch byte-for-byte as before. The
        # change is therefore additive: only URLs that were 404ing move.
        #
        # Measured on a fixture reproducing all three configurations
        # (no router / first cut / this one):
        #
        #                                    no router      first cut     this
        #     /ocs/v2.php/cloud/user         ocs/v2.php     index.php     ocs/v2.php
        #     /remote.php/dav/files/admin    remote.php     index.php     remote.php
        #     /status.php                    status.php     status.php    status.php
        #     /apps/<app>/                   404            index.php     index.php
        #     /index.php/apps/<app>/         index.php      index.php     index.php
        env:
          PHP_CLI_SERVER_WORKERS: 8
        run: |
          cd server
          cat > ci-router.php <<'ROUTER'
          <?php
          // Front controller for `php -S`, mirroring Nextcloud's .htaccess.
          //
          // 1. A real file on disk is served by the built-in server as-is, so
          //    static assets keep their MIME types.
          // 2. Nextcloud's other PHP entry points — ocs/v1.php, ocs/v2.php,
          //    remote.php, public.php, cron.php, core/ajax/update.php — are
          //    reached WITH path info, which rule 1 never matches. Resolve the
          //    longest existing `.php` prefix and execute that script itself.
          // 3. Everything else routes through index.php, REQUEST_URI intact.
          $path = parse_url($_SERVER['REQUEST_URI'], PHP_URL_PATH) ?: '/';
          if ($path !== '/' && is_file(__DIR__ . $path)) {
              return false;
          }
          $segments = explode('/', ltrim($path, '/'));
          $prefix = '';
          foreach ($segments as $i => $segment) {
              $prefix .= '/' . $segment;
              if (substr($segment, -4) !== '.php'
                  || $prefix === '/index.php'
                  || !is_file(__DIR__ . $prefix)
              ) {
                  continue;
              }
              $rest = implode('/', array_slice($segments, $i + 1));
              $_SERVER['SCRIPT_NAME'] = $prefix;
              $_SERVER['SCRIPT_FILENAME'] = __DIR__ . $prefix;
              $_SERVER['PHP_SELF'] = $path;
              $_SERVER['PATH_INFO'] = $rest === '' ? '' : '/' . $rest;
              require __DIR__ . $prefix;
              return true;
          }
          $_SERVER['SCRIPT_NAME'] = '/index.php';
          $_SERVER['SCRIPT_FILENAME'] = __DIR__ . '/index.php';
          $_SERVER['PHP_SELF'] = '/index.php';
          require __DIR__ . '/index.php';
          ROUTER
          php -S 0.0.0.0:8080 ci-router.php > /tmp/php-server.log 2>&1 &
          PHP_PID=$!
          echo "${PHP_PID}" > /tmp/php-server.pid
          timeout 15 bash -c 'until curl -sf -o /dev/null http://localhost:8080/status.php; do sleep 0.5; done' || {
            echo "::error::PHP built-in server failed to come up on :8080."
            cat /tmp/php-server.log
            exit 1
          }
          # Prove the front controller is actually routing before any spec runs.
          # `/apps/<app>/` is the URL the fleet's specs use; without the router
          # it is a hard 404 and every one of them fails on a selector timeout.
          PRETTY="$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8080/apps/${{ inputs.app-name }}/")"
          echo "Front-controller check: /apps/${{ inputs.app-name }}/ -> HTTP ${PRETTY}"
          if [ "$PRETTY" = "404" ]; then
            echo "::error::The php -S front-controller router is not routing pretty URLs — /apps/${{ inputs.app-name }}/ returned 404. Every spec using a pretty Nextcloud URL will fail on a selector timeout."
            exit 1
          fi
          # And prove the OTHER Nextcloud PHP entry points still reach
          # themselves. This gate did not exist when the router first shipped,
          # and its absence is the whole reason a router that broke every OCS
          # call read as a clean green server-start: the pretty-URL check above
          # passed, so nothing spoke. `/ocs/v2.php/cloud/user` unauthenticated
          # is a 401 when it reaches ocs/v2.php and a 404 when the router
          # swallows it into index.php, so the two outcomes are distinguishable
          # by status code alone.
          OCS="$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8080/ocs/v2.php/cloud/user?format=json")"
          echo "OCS entry-point check: /ocs/v2.php/cloud/user -> HTTP ${OCS}"
          if [ "$OCS" = "404" ]; then
            echo "::error::The php -S front-controller router is swallowing Nextcloud's OCS entry point — /ocs/v2.php/cloud/user returned 404 instead of reaching ocs/v2.php. Every OCS call (current user, groups, user_status, dashboard layout) will 404, and specs will report it as a missing element."
            exit 1
          fi
          echo "PHP built-in server alive (pid=${PHP_PID})."

      - name: Seed test data
        if: inputs.playwright-seed-command != ''
        # The seed command needs to know WHICH instance to seed and with what
        # credentials, exactly like the test step below — a seed script is
        # usually driving the app's own admin API. This step declared no `env:`
        # at all, so a script here saw neither BASE_URL nor ADMIN_USER and had
        # to hardcode `http://localhost:8080` to work. That literal is the
        # SHARED dev container on a developer box, which makes the same script
        # unsafe to run anywhere else. The journeydoc capture job already
        # exports the full set to its own seed step; this matches it.
        env:
          BASE_URL: http://localhost:8080
          NEXTCLOUD_URL: http://localhost:8080
          NC_BASE_URL: http://localhost:8080
          ADMIN_USER: admin
          ADMIN_PASSWORD: admin
          NC_ADMIN_USER: admin
          NC_ADMIN_PASS: admin
        run: |
          cd server
          echo "Running seed command: ${{ inputs.playwright-seed-command }}"
          eval ${{ inputs.playwright-seed-command }}
          echo "Seed command completed."

      - name: Run Playwright tests
        run: |
          cd server/apps/${{ inputs.app-name }}
          CONFIG="${{ inputs.playwright-test-path }}/playwright.config.ts"
          if [ ! -f "$CONFIG" ] && [ -f "playwright.config.ts" ]; then
            CONFIG="playwright.config.ts"
          fi
          npx playwright test --config="$CONFIG"
        # This step exported only BASE_URL / ADMIN_USER / ADMIN_PASSWORD, but a
        # survey of the 21 fleet repos found 15 whose config resolves the target
        # as `process.env.NEXTCLOUD_URL || 'http://localhost:8080'` and never
        # reads BASE_URL. Those repos do not fail here — they fall through to
        # the literal, which happens to be this runner's own `php -S`, so the
        # suite runs against the right host FOR THE WRONG REASON and the same
        # config points at the SHARED dev container the moment anyone runs it
        # locally. Exporting every name the fleet actually uses means the
        # variable, not the fallback, is what selects the target here.
        #
        # (Repos should still drop the `|| 'http://localhost:8080'` literal —
        # see tests/e2e/base-url.ts in openregister/doriath/shillinq for the
        # pattern that throws instead. This just stops CI from silently
        # depending on it.)
        env:
          BASE_URL: http://localhost:8080
          NEXTCLOUD_URL: http://localhost:8080
          NC_BASE_URL: http://localhost:8080
          ADMIN_USER: admin
          ADMIN_PASSWORD: admin
          NC_ADMIN_USER: admin
          NC_ADMIN_PASS: admin
          COLLECT_COVERAGE: ${{ inputs.enable-playwright-coverage }}

      - name: Generate spec-to-test coverage report
        if: ${{ inputs.enable-playwright-coverage && !cancelled() }}
        run: |
          cd server/apps/${{ inputs.app-name }}
          node -e "
          const fs = require('fs');
          const path = require('path');

          // Collect all spec scenarios from openspec
          const specDir = 'openspec/specs';
          const changeDir = 'openspec/changes';
          let scenarios = [];

          function extractScenarios(dir) {
            if (!fs.existsSync(dir)) return;
            for (const entry of fs.readdirSync(dir, { recursive: true })) {
              const file = path.join(dir, entry);
              if (!file.endsWith('spec.md') && !file.endsWith('spec.md')) continue;
              if (!fs.statSync(file).isFile()) continue;
              const content = fs.readFileSync(file, 'utf8');
              const matches = content.match(/^###?\s+(S\d+|Scenario[:\s]|REQ-)[^\n]*/gm) || [];
              for (const m of matches) {
                scenarios.push({ file: file.replace(/\\\\/g, '/'), scenario: m.replace(/^#+\s+/, '').trim() });
              }
            }
          }
          extractScenarios(specDir);
          extractScenarios(changeDir);

          // Collect all test descriptions from Playwright specs
          const testDir = '${{ inputs.playwright-test-path }}';
          let tests = [];
          if (fs.existsSync(testDir)) {
            for (const entry of fs.readdirSync(testDir, { recursive: true })) {
              const file = path.join(testDir, entry);
              if (!file.endsWith('.spec.ts') && !file.endsWith('.spec.js')) continue;
              if (!fs.statSync(file).isFile()) continue;
              const content = fs.readFileSync(file, 'utf8');
              const matches = content.match(/test\(['\x60]([^'\x60]+)/g) || [];
              for (const m of matches) {
                tests.push({ file: file.replace(/\\\\/g, '/'), test: m.replace(/test\(['\x60]/, '').trim() });
              }
            }
          }

          // Collect test flow files
          const flowDir = 'tests/flows';
          let flows = [];
          if (fs.existsSync(flowDir)) {
            for (const entry of fs.readdirSync(flowDir)) {
              if (entry.endsWith('.md') && entry !== 'README.md') flows.push(entry);
            }
          }

          const report = {
            specScenarios: scenarios.length,
            playwrightTests: tests.length,
            testFlows: flows.length,
            coverage: scenarios.length > 0 ? Math.round((tests.length / scenarios.length) * 100) : 100,
            scenarios,
            tests,
            flows,
          };

          fs.writeFileSync('playwright-coverage.json', JSON.stringify(report, null, 2));
          console.log('Spec scenarios: ' + report.specScenarios);
          console.log('Playwright tests: ' + report.playwrightTests);
          console.log('Test flows: ' + report.testFlows);
          console.log('Spec-to-test coverage: ' + report.coverage + '%');

          if (report.coverage < ${{ inputs.playwright-coverage-threshold }}) {
            console.log('::warning::Spec-to-test coverage ' + report.coverage + '% is below threshold ' + ${{ inputs.playwright-coverage-threshold }} + '%');
          }
          "

      - name: Upload Playwright report
        if: always()
        # `tests/e2e/…` is included because that is where the scaffolded config
        # in most fleet repos actually writes. With only the app-root paths
        # listed, both upload steps matched nothing — and `if-no-files-found:
        # ignore` meant they said so quietly and uploaded an empty artifact. A
        # red run left no report and no traces to read, which is precisely when
        # you need them. Extra paths are harmless: unmatched ones are ignored.
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            server/apps/${{ inputs.app-name }}/playwright-report/
            server/apps/${{ inputs.app-name }}/tests/e2e/playwright-report/
            server/apps/${{ inputs.app-name }}/playwright-coverage.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: |
            server/apps/${{ inputs.app-name }}/test-results/
            server/apps/${{ inputs.app-name }}/tests/e2e/test-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Show Nextcloud log on failure
        if: failure()
        run: |
          echo "=== Last 50 lines of Nextcloud log ==="
          tail -50 server/data/nextcloud.log 2>/dev/null | python3 -m json.tool --no-ensure-ascii 2>/dev/null || tail -50 server/data/nextcloud.log 2>/dev/null || echo "No log found"

  # ╔══════════════════════════════════════════════╗
  # ║  STAGE 2 (cont.) — Journeydoc capture         ║
  # ║                                               ║
  # ║  Runs the docs-capture Playwright project     ║
  # ║  (tests/e2e/docs-screenshots.spec.ts) against ║
  # ║  a freshly-installed Nextcloud, then commits  ║
  # ║  any new/changed screenshots back to the      ║
  # ║  calling repo and optionally dispatches a     ║
  # ║  docs-deploy workflow.                        ║
  # ║                                               ║
  # ║  Reference: ADR-030 (journeydoc pattern) in   ║
  # ║  ConductionNL/hydra/openspec/architecture/.   ║
  # ║                                               ║
  # ║  Recommended invocation (per-app):            ║
  # ║                                               ║
  # ║    # .github/workflows/docs-capture.yml       ║
  # ║    on:                                        ║
  # ║      schedule:                                ║
  # ║        - cron: "27 3 * * *"   # nightly       ║
  # ║      workflow_dispatch:                       ║
  # ║    jobs:                                      ║
  # ║      capture:                                 ║
  # ║        uses: ConductionNL/.github/            ║
  # ║              .github/workflows/quality.yml@main║
  # ║        with:                                  ║
  # ║          app-name: <slug>                     ║
  # ║          enable-journeydoc-capture: true      ║
  # ║          enable-frontend: false               ║
  # ║          enable-license-check: false          ║
  # ║          enable-sbom: false                   ║
  # ║          enable-features-extract: false       ║
  # ║          journeydoc-deploy-workflow: \         ║
  # ║            documentation.yml                  ║
  # ║                                               ║
  # ║  Don't enable in your main code-quality.yml — ║
  # ║  it spins up a full Nextcloud + Postgres +    ║
  # ║  Playwright for every run. Nightly is plenty. ║
  # ╚══════════════════════════════════════════════╝

  journeydoc-capture:
    if: ${{ inputs.enable-journeydoc-capture && !cancelled() && needs.security.result != 'failure' }}
    runs-on: ubuntu-latest
    name: "Journeydoc Capture (screenshots)"
    needs: [security]
    # UNMEASURED: no caller in the fleet currently sets
    # `enable-journeydoc-capture: true`, so this job has never executed (312
    # skipped records, 0 executions, across 15 repos). Its step list is a
    # superset of the Playwright job's — full Nextcloud install, frontend build,
    # a Playwright project, plus a commit and a workflow dispatch — so it is
    # bounded above the Playwright job's 45 min rather than at it. Revisit with
    # real numbers once a caller enables it.
    timeout-minutes: 60
    permissions:
      contents: write
      actions: write

    services:
      postgres:
        image: ${{ inputs.database == 'pgsql' && 'postgres:16' || '' }}
        env:
          POSTGRES_USER: nextcloud
          POSTGRES_PASSWORD: nextcloud
          POSTGRES_DB: nextcloud
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U nextcloud"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout Nextcloud server
        uses: actions/checkout@v4
        with:
          repository: nextcloud/server
          ref: ${{ fromJSON(inputs.nextcloud-test-refs)[0] }}
          path: server

      - name: Checkout server submodules
        run: |
          cd server
          git submodule update --init 3rdparty

      - name: Checkout app
        # Default token (github.token) is the caller's GITHUB_TOKEN with
        # contents:write — we need that for the screenshot commit-back later.
        uses: actions/checkout@v4
        with:
          path: server/apps/${{ inputs.app-name }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}
          extensions: mbstring, intl, sqlite3, pgsql, pdo_pgsql, zip, gd, curl, xml, json
          tools: composer:v2

      - name: Checkout additional apps
        if: ${{ inputs.additional-apps != '[]' }}
        run: |
          echo '${{ inputs.additional-apps }}' | jq -c '.[]' | while read -r app; do
            repo=$(echo "$app" | jq -r '.repo')
            name=$(echo "$app" | jq -r '.app')
            ref=$(echo "$app" | jq -r '.ref // "main"')
            echo "Checking out $repo ($name) at $ref..."
            git clone --depth 1 --branch "$ref" "https://github.com/$repo.git" "server/apps/$name"
            if [ -f "server/apps/$name/composer.json" ]; then
              cd "server/apps/$name"
              composer install --no-progress --prefer-dist --optimize-autoloader --no-dev
              cd -
            fi
          done

      - name: Install Nextcloud
        run: |
          cd server
          if [ "${{ inputs.database }}" = "pgsql" ]; then
            php occ maintenance:install \
              --database pgsql \
              --database-host 127.0.0.1 \
              --database-port 5432 \
              --database-name nextcloud \
              --database-user nextcloud \
              --database-pass nextcloud \
              --admin-user admin \
              --admin-pass admin
          else
            php occ maintenance:install \
              --database ${{ inputs.database }} \
              --admin-user admin \
              --admin-pass admin
          fi
          if [ '${{ inputs.additional-apps }}' != '[]' ]; then
            echo '${{ inputs.additional-apps }}' | jq -r '.[].app' | while read -r name; do
              echo "Enabling app: $name"
              php occ app:enable "$name" || echo "::warning::Failed to enable $name, continuing..."
            done
          fi

      - name: Install and enable app
        run: |
          cd server/apps/${{ inputs.app-name }}
          composer install --no-progress --prefer-dist --optimize-autoloader
          cd ../../
          php occ app:enable ${{ inputs.app-name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "${{ inputs.node-version }}"

      - name: Install app npm dependencies
        run: |
          cd server/apps/${{ inputs.app-name }}
          if [ -f "package.json" ]; then
            npm ci
          fi

      - name: Install Playwright
        run: |
          cd server/apps/${{ inputs.app-name }}
          npm install --save-dev @playwright/test
          npx playwright install --with-deps chromium

      - name: Build app frontend
        # Same rationale as the playwright job: SPA mount via Util::addScript()
        # needs the bundle on disk before the docs-capture spec navigates.
        run: |
          cd server/apps/${{ inputs.app-name }}
          if [ -f "package.json" ] && node -e "process.exit(require('./package.json').scripts && require('./package.json').scripts.build ? 0 : 1)" 2>/dev/null; then
            echo "Building app frontend with 'npm run build'…"
            npm run build
          else
            echo "No 'build' script in package.json; skipping frontend build."
          fi

      - name: Validate journeydoc capture spec exists
        run: |
          cd server/apps/${{ inputs.app-name }}
          if [ ! -f "tests/e2e/docs-screenshots.spec.ts" ]; then
            echo "::error::Journeydoc capture spec not found at tests/e2e/docs-screenshots.spec.ts. See ADR-030."
            exit 1
          fi
          # Confirm playwright config declares a 'docs-capture' project — without it,
          # `--project docs-capture` silently runs nothing and we'd commit nothing.
          if ! grep -q "name: 'docs-capture'" playwright.config.ts 2>/dev/null && \
             ! grep -q 'name: "docs-capture"' playwright.config.ts 2>/dev/null; then
            echo "::error::playwright.config.ts does not declare a 'docs-capture' project. Run /journeydoc-init to regenerate the scaffold (ADR-030)."
            exit 1
          fi

      - name: Start PHP built-in server
        # Same front-controller router as the Playwright job — see the long
        # comment on that step. The docs-capture project drives the same
        # pretty Nextcloud URLs the regression specs do, so without the router
        # every tutorial screenshot would be shot against a 404 page.
        run: |
          cd server
          cat > ci-router.php <<'ROUTER'
          <?php
          $path = parse_url($_SERVER['REQUEST_URI'], PHP_URL_PATH) ?: '/';
          if ($path !== '/' && is_file(__DIR__ . $path)) {
              return false;
          }
          $segments = explode('/', ltrim($path, '/'));
          $prefix = '';
          foreach ($segments as $i => $segment) {
              $prefix .= '/' . $segment;
              if (substr($segment, -4) !== '.php'
                  || $prefix === '/index.php'
                  || !is_file(__DIR__ . $prefix)
              ) {
                  continue;
              }
              $rest = implode('/', array_slice($segments, $i + 1));
              $_SERVER['SCRIPT_NAME'] = $prefix;
              $_SERVER['SCRIPT_FILENAME'] = __DIR__ . $prefix;
              $_SERVER['PHP_SELF'] = $path;
              $_SERVER['PATH_INFO'] = $rest === '' ? '' : '/' . $rest;
              require __DIR__ . $prefix;
              return true;
          }
          $_SERVER['SCRIPT_NAME'] = '/index.php';
          $_SERVER['SCRIPT_FILENAME'] = __DIR__ . '/index.php';
          $_SERVER['PHP_SELF'] = '/index.php';
          require __DIR__ . '/index.php';
          ROUTER
          php -S 0.0.0.0:8080 ci-router.php > /tmp/php-server.log 2>&1 &
          PHP_PID=$!
          echo "${PHP_PID}" > /tmp/php-server.pid
          timeout 15 bash -c 'until curl -sf -o /dev/null http://localhost:8080/status.php; do sleep 0.5; done' || {
            echo "::error::PHP built-in server failed to come up on :8080."
            cat /tmp/php-server.log
            exit 1
          }
          echo "PHP built-in server alive (pid=${PHP_PID})."

      - name: Seed test data
        if: inputs.playwright-seed-command != ''
        run: |
          cd server
          echo "Running seed command: ${{ inputs.playwright-seed-command }}"
          eval ${{ inputs.playwright-seed-command }}
          echo "Seed command completed."

      - name: Run docs-capture Playwright project
        run: |
          cd server/apps/${{ inputs.app-name }}
          npx playwright test --project docs-capture
        env:
          BASE_URL: http://localhost:8080
          NEXTCLOUD_URL: http://localhost:8080
          NC_BASE_URL: http://localhost:8080
          ADMIN_USER: admin
          ADMIN_PASSWORD: admin
          NC_ADMIN_USER: admin
          NC_ADMIN_PASS: admin

      - name: Commit refreshed screenshots if changed
        id: commit
        run: |
          set -euo pipefail
          cd server/apps/${{ inputs.app-name }}
          OUTPUT_PATH="${{ inputs.journeydoc-output-path }}"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage anything under the journeydoc output path (new files + diffs).
          git add "$OUTPUT_PATH" 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No screenshot changes — nothing to commit."
            echo "changed=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Count what we're committing for the message.
          CHANGED=$(git diff --staged --name-only -- "$OUTPUT_PATH" | wc -l)
          git commit -m "docs(screenshots): refresh journeydoc captures (${CHANGED} files) [skip ci]"

          # Push to the branch this workflow ran on. Use github.ref_name (e.g.
          # "main") not github.ref (e.g. "refs/heads/main") — git push wants a
          # bare branch.
          REF_NAME="${{ github.ref_name }}"
          # Non-blocking on protected branches per ConductionNL/.github#61.
          if git push origin "HEAD:${REF_NAME}"; then
            echo "Screenshots pushed to ${REF_NAME}."
            echo "changed=1" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Could not push screenshot refresh — branch protection rejected the bot push (see ConductionNL/.github#61). Inspect the journeydoc-screenshots artifact and commit manually."
            echo "changed=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch deploy workflow if screenshots changed
        if: ${{ inputs.journeydoc-deploy-workflow != '' && steps.commit.outputs.changed == '1' }}
        env:
          GH_TOKEN: ${{ github.token }}
        # GITHUB_TOKEN-driven pushes do NOT auto-trigger workflow_run on other
        # workflows (anti-loop). Explicitly dispatch the docs-deploy workflow
        # so the site rebuilds with the new screenshots.
        run: |
          gh workflow run "${{ inputs.journeydoc-deploy-workflow }}" \
            --repo "${{ github.repository }}" \
            --ref "${{ github.ref_name }}"

      - name: Upload screenshots as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journeydoc-screenshots
          path: server/apps/${{ inputs.app-name }}/${{ inputs.journeydoc-output-path }}/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Playwright trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: journeydoc-playwright-traces
          path: server/apps/${{ inputs.app-name }}/test-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Show Nextcloud log on failure
        if: failure()
        run: |
          echo "=== Last 50 lines of Nextcloud log ==="
          tail -50 server/data/nextcloud.log 2>/dev/null | python3 -m json.tool --no-ensure-ascii 2>/dev/null || tail -50 server/data/nextcloud.log 2>/dev/null || echo "No log found"

      - name: Record result
        if: always()
        run: |
          mkdir -p quality-results
          echo "${{ job.status }}" > quality-results/journeydoc-capture.txt
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-journeydoc-capture
          path: quality-results/

  # ╔══════════════════════════════════════════════╗
  # ║  STAGE 3 — Reporting & coverage baseline      ║
  # ╚══════════════════════════════════════════════╝

  baseline-protection:
    if: ${{ inputs.enable-coverage-guard && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    name: "Coverage Baseline Protection"
    # Observed across 8 executions: median 0.3 min, max 1.0 min (procest).
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for manual baseline changes
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q '^\.coverage-baseline$'; then
            echo "::error::Manual changes to .coverage-baseline are not allowed."
            exit 1
          fi
          echo "No manual baseline changes detected."

  update-baseline:
    if: ${{ inputs.enable-coverage-guard && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development') }}
    runs-on: ubuntu-latest
    name: "Update Coverage Baseline"
    needs: phpunit
    # Observed across 3 executions: max 0.3 min (openregister). Downloads an
    # artifact and commits; 15 min is generous for a push+commit round trip.
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: coverage/
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}
      - name: Update baseline if improved
        run: php scripts/coverage-guard.php coverage/clover.xml --update-baseline
      - name: Commit updated baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet .coverage-baseline; then
            echo "Baseline unchanged, nothing to commit."
          else
            git add .coverage-baseline
            git commit -m "ci: update coverage baseline [skip ci]"
            # Non-blocking: branch-protection rulesets reject the bot push on
            # repos with a protected development/main. Surface a warning instead
            # of failing the whole workflow over an auto-committed convenience
            # file. Tracked in ConductionNL/.github#61 (add bot as a bypass actor).
            git push || echo "::warning::Could not push the updated coverage baseline — branch protection rejected the bot push (see ConductionNL/.github#61). Commit .coverage-baseline manually."
          fi

  # ── Hydra mechanical gates ──────────────────────
  #
  # The 61 gates, run from conduction/hydra-gates (this repository, hydra-gates/).
  # OPT-IN via enable-hydra-gates; default false. See the input description.
  #
  # Two properties this job exists to preserve, both of which have been observed
  # failing silently:
  #
  #   1. THE BASE REF IS EXPLICIT AND FAILS CLOSED. The gates are diff-scoped,
  #      so a base that resolves to nothing makes every gate pass having read no
  #      files — a green indistinguishable from a real one. On a pull_request we
  #      name the PR's actual target branch. We never use @{upstream} (on a
  #      pushed feature branch that is the branch ITSELF, which is exactly the
  #      empty-diff case, and it happens precisely when CI runs) and we never
  #      fall back to HEAD~1 (on a squash-merged mainline that is the previous
  #      release). An unresolvable base exits 99 and prints no green.
  #
  #   2. THE EXIT CODE IS THE FAILURE COUNT. We capture it before deciding the
  #      job verdict, and report 99 ("could not run at all") distinctly from
  #      "N gates failed". A configuration error must never read as a clean tree.
  #
  # The package is checked out as a SIBLING of the app checkout, not inside it,
  # so nothing in the gate package can ever be mistaken for app code under scan.
  hydra-gates:
    if: ${{ inputs.enable-hydra-gates }}
    runs-on: ubuntu-latest
    name: "Hydra Gates"
    # The gates are shell + python over a PR-sized diff. Bounded generously:
    # the slowest observed component is the manifest gate's node startup.
    timeout-minutes: 20

    steps:
      - name: Checkout app
        uses: actions/checkout@v4
        with:
          path: app
          # fetch-depth: 0 is REQUIRED, not an optimisation. The gates are
          # diff-scoped; a shallow clone has no base branch to diff against, so
          # the base would not resolve and the run would (correctly) exit 99.
          fetch-depth: 0

      - name: Checkout conduction/hydra-gates
        uses: actions/checkout@v4
        with:
          repository: ConductionNL/.github
          ref: ${{ inputs.hydra-gates-ref }}
          path: gates

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "${{ inputs.node-version }}"

      - name: Install ajv for the manifest gates
        # Installed INTO the package dir so `require('ajv')` from
        # scripts/lib/check_manifest.js resolves by walking up to
        # gates/hydra-gates/node_modules. A global install would need NODE_PATH
        # and would silently not be found — which the manifest gates survive via
        # a vendored fallback, meaning the miss would not be visible here. The
        # coverage block at the end of the run is what makes any such gap loud.
        run: npm --prefix gates/hydra-gates install --no-save --no-audit --no-fund ajv

      - name: Resolve the diff base
        id: base
        run: |
          set -u
          if [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ github.event_name }}" = "pull_request_target" ]; then
            # The PR's real target branch. This is the only base that answers
            # the question the gates are being asked: "what does this PR add?"
            BASE="origin/${{ github.base_ref }}"
          else
            # Not a PR. We deliberately set NOTHING and let the package's own
            # precedence chain resolve origin/HEAD -> origin/development ->
            # origin/main -> origin/master, printing which one won and exiting
            # 99 if none do. Inventing a base here would be the HEAD~1 mistake
            # wearing a different name.
            BASE=""
          fi
          echo "base=${BASE}" >> "$GITHUB_OUTPUT"
          echo "Diff base for this run: ${BASE:-<auto-detect, see the run output>}"

      - name: Run the Hydra gates
        id: gates
        env:
          HYDRA_GATE_BASE_REF: ${{ steps.base.outputs.base }}
        run: |
          set -u
          ARGS="--app-dir ${GITHUB_WORKSPACE}/app"
          if [ "${{ inputs.hydra-gates-require-full-coverage }}" = "true" ]; then
            ARGS="${ARGS} --require-full-coverage"
          fi
          # The default shell for a `run:` block is `bash -e {0}`. A bare
          # invocation followed by `RC=$?` would therefore never reach the
          # assignment — the step would abort on the first failing gate and the
          # exit code, which carries the FAILURE COUNT, would be lost. Putting
          # the call in an `&& / ||` list suspends errexit for it, so we get the
          # real code. This is the 0/1 collapse the contract forbids, and it is
          # one character away at all times.
          bash "${GITHUB_WORKSPACE}/gates/hydra-gates/bin/hydra-gates" ${ARGS} && RC=0 || RC=$?
          echo "rc=${RC}" >> "$GITHUB_OUTPUT"

          if [ "${RC}" -eq 0 ]; then
            echo "All gates that ran passed. Read the COVERAGE block above before treating this as complete."
            exit 0
          fi
          if [ "${RC}" -eq 99 ]; then
            echo "::error::hydra-gates COULD NOT RUN (exit 99). This is a configuration error, NOT a clean tree — nothing was gated. Most often: the diff base did not resolve, or the app checkout is shallow."
            exit 1
          fi
          if [ "${RC}" -eq 98 ]; then
            echo "::error::hydra-gates passed but coverage was incomplete, and hydra-gates-require-full-coverage is set. See the GATES THAT DID NOT RUN line above."
            exit 1
          fi
          echo "::error::${RC} Hydra gate(s) failed. The exit code is the failure COUNT — see the named [gate-N] FAIL lines above."
          exit 1

      - name: Record result
        if: always()
        run: |
          mkdir -p quality-results
          echo "${{ job.status }}" > quality-results/hydra-gates.txt
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-hydra-gates
          path: quality-results/

  report:
    runs-on: ubuntu-latest
    name: "Quality Report"
    needs: [php-quality, vue-quality, frontend-build, frontend-checks, security, license, phpunit, newman, playwright, journeydoc-capture, baseline-protection, sbom, features-check, features-extract, hydra-gates]
    if: always()
    # Observed across 266 executions: median 0.6 min — but 2% of runs sit at
    # ~30 min because the `Install PDF tools` apt-get step stalls on the Ubuntu
    # mirror. That stall is currently intermittent-but-live fleet-wide
    # (nldesign, opencatalogi, pipelinq, planix, softwarecatalog) and it still
    # SUCCEEDS: pipelinq run 30799846661 spent 09:34:30 -> 10:04:52 in that one
    # step and went green. Anything under ~45 min would newly fail runs that
    # pass today, so this is bounded at 60 min. The apt stall is a separate
    # defect worth fixing on its own; this bound only stops the 6-hour case.
    timeout-minutes: 60

    steps:
      - name: Download all result artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: result-*
          path: results/
          merge-multiple: false

      - name: Download license reports
        uses: actions/download-artifact@v4
        with:
          pattern: license-report-*
          path: license-reports/
          merge-multiple: true
        continue-on-error: true

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: coverage/
        continue-on-error: true

      - name: Download Playwright coverage
        uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: results/playwright-report/
        continue-on-error: true

      - name: Install PDF tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq pandoc wkhtmltopdf

      - name: Generate report
        run: |
          set -euo pipefail

          REPORT="quality-report.md"
          REPO="${{ github.repository }}"
          SHA="${{ github.sha }}"
          SHORT_SHA="${SHA:0:7}"
          BRANCH="${{ github.ref_name }}"
          EVENT="${{ github.event_name }}"
          DATE="$(date -u +'%Y-%m-%d %H:%M UTC')"
          RUN_URL="https://github.com/$REPO/actions/runs/${{ github.run_id }}"

          # Helper to read result from artifact files
          read_result() {
            local file="$1"
            if [ -f "$file" ]; then
              cat "$file" | tr -d '[:space:]'
            else
              echo "skipped"
            fi
          }

          icon() {
            case "$1" in
              success|Success) echo "✅" ;;
              skipped|Skipped) echo "⏭️" ;;
              *) echo "❌" ;;
            esac
          }

          # Build license info strings
          license_info() {
            local eco="$1"
            local JSON_FILE="license-reports/$eco-licenses.json"
            if [ -f "$JSON_FILE" ]; then
              local total=$(jq 'length' "$JSON_FILE")
              local denied=$(jq '[.[] | select(.status == "DENIED")] | length' "$JSON_FILE")
              if [ "$denied" -gt 0 ]; then
                echo "❌ $denied/$total denied"
              else
                echo "✅ $total/$total"
              fi
            else
              local result=$(read_result "results/result-license-$eco/$eco.txt")
              echo "$(icon "$result")"
            fi
          }

          # ── Compact report: categories as columns, checks as rows ──
          {
            echo "# Quality Report — $REPO @ \`$SHORT_SHA\`"
            echo ""
            echo "| Check | PHP | Vue | Security | License | Tests |"
            echo "|-------|-----|-----|----------|---------|-------|"

            # PHP-only checks
            for tool in lint phpcs phpmd psalm phpstan phpmetrics; do
              result=$(read_result "results/result-php-quality-$tool/$tool.txt")
              echo "| $tool | $(icon "$result") | | | | |"
            done

            # Vue-only checks
            for tool in eslint stylelint; do
              result=$(read_result "results/result-vue-quality-$tool/$tool.txt")
              echo "| $tool | | $(icon "$result") | | | |"
            done

            # Frontend build gate (auto-detected, blocking)
            build_result=$(read_result "results/result-frontend-build/frontend-build.txt")
            echo "| build | | $(icon "$build_result") | | | |"

            # Custom frontend checks (if any)
            for f in results/result-frontend-check-*/*.txt; do
              [ -f "$f" ] || continue
              tool=$(basename "$f" .txt)
              echo "| $tool | | $(icon "$(read_result "$f")") | | | |"
            done

            # Composer: security + license in one row
            sec_comp=$(read_result "results/result-security-composer/composer.txt")
            echo "| composer | | | $(icon "$sec_comp") | $(license_info "composer") | |"

            # npm: security + license in one row
            sec_npm=$(read_result "results/result-security-npm/npm.txt")
            echo "| npm | | | $(icon "$sec_npm") | $(license_info "npm") | |"

            # Test rows
            echo "| PHPUnit | | | | | $(icon '${{ needs.phpunit.result }}') |"
            echo "| Newman | | | | | $(icon '${{ needs.newman.result }}') |"
            echo "| Playwright | | | | | $(icon '${{ needs.playwright.result }}') |"
            echo ""
          } > "$REPORT"

          # ── Failures detail (only shown when something fails) ──
          HAS_FAILURES=false

          # License denials
          for eco in composer npm; do
            JSON_FILE="license-reports/$eco-licenses.json"
            if [ -f "$JSON_FILE" ]; then
              DENIED=$(jq '[.[] | select(.status == "DENIED")] | length' "$JSON_FILE")
              if [ "$DENIED" -gt 0 ]; then
                HAS_FAILURES=true
                {
                  echo "### ❌ Denied $eco licenses"
                  echo ""
                  echo "| Package | Version | License |"
                  echo "|---------|---------|---------|"
                  jq -r '.[] | select(.status == "DENIED") | "| \(.package) | \(.version) | \(.license) |"' "$JSON_FILE"
                  echo ""
                } >> "$REPORT"
              fi
            fi
          done

          # Coverage (if available)
          if [ -f "coverage/clover.xml" ]; then
            COVERED=$(grep -oP 'coveredstatements="\K[0-9]+' coverage/clover.xml | head -1 || echo "0")
            TOTAL_STMTS=$(grep -oP 'statements="\K[0-9]+' coverage/clover.xml | head -1 || echo "0")
            if [ "$TOTAL_STMTS" -gt 0 ]; then
              COVERAGE=$(echo "scale=1; $COVERED * 100 / $TOTAL_STMTS" | bc)
              echo "**Coverage:** ${COVERAGE}% ($COVERED/$TOTAL_STMTS statements)" >> "$REPORT"
              echo "" >> "$REPORT"
            fi
          fi

          # Playwright spec-to-test coverage (if available)
          COVERAGE_FILE="results/playwright-report/playwright-coverage.json"
          if [ -f "$COVERAGE_FILE" ]; then
            SPEC_COUNT=$(jq '.specScenarios' "$COVERAGE_FILE")
            TEST_COUNT=$(jq '.playwrightTests' "$COVERAGE_FILE")
            COVERAGE=$(jq '.coverage' "$COVERAGE_FILE")
            echo "**Spec coverage:** ${COVERAGE}% ($TEST_COUNT tests / $SPEC_COUNT specs)" >> "$REPORT"
            echo "" >> "$REPORT"
          fi

          # Footer
          echo "---" >> "$REPORT"
          echo "" >> "$REPORT"
          echo "*[Quality workflow]($RUN_URL) — $DATE*" >> "$REPORT"

          echo "Report generated: $(wc -l < "$REPORT") lines"

      - name: Convert to PDF
        run: |
          pandoc quality-report.md \
            -o quality-report.pdf \
            --pdf-engine=wkhtmltopdf \
            --metadata title="Quality Report" \
            -V margin-top=20mm \
            -V margin-bottom=20mm \
            -V margin-left=15mm \
            -V margin-right=15mm

      - name: Write step summary
        if: always()
        run: cat quality-report.md >> $GITHUB_STEP_SUMMARY

      - name: Upload PDF report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-report
          path: |
            quality-report.pdf
            quality-report.md
          retention-days: 90

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        # Posting the summary comment needs `pull-requests: write`. A reusable
        # workflow inherits the CALLER's permissions, and most callers declare
        # only `contents: read` + `packages: read` — so this step 403s with
        # "Resource not accessible by integration" and failed the whole Quality
        # Report job. A cosmetic comment must never fail a quality gate: the
        # gate's verdict comes from the jobs it aggregates, not from whether it
        # could comment. Callers that want the comment should add
        # `pull-requests: write` to their own `permissions:` block.
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = fs.readFileSync('quality-report.md', 'utf8');
            body += `\n\n> Download the [full PDF report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) from the workflow artifacts.\n`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      # Makes "quality / Quality Report" a usable required check: without
      # this the job always succeeded (if: always() + report-only steps),
      # so requiring it in branch protection would gate nothing.
      - name: Gate — fail when any upstream job failed
        if: ${{ always() && contains(needs.*.result, 'failure') }}
        run: |
          echo "::error::One or more quality jobs failed — see the report above."
          exit 1

  # ╔══════════════════════════════════════════════╗
  # ║  STAGE 4 — SBOM Generation & Validation      ║
  # ║                                               ║
  # ║  Generates a CycloneDX SBOM from Composer     ║
  # ║  and npm dependencies, validates against CVE   ║
  # ║  databases and license policies, then commits  ║
  # ║  the validated SBOM to the repository.         ║
  # ╚══════════════════════════════════════════════╝

  sbom:
    if: ${{ inputs.enable-php && inputs.enable-sbom && !cancelled() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta' || github.ref == 'refs/heads/development') }}
    runs-on: ubuntu-latest
    name: "SBOM"
    needs: [security]
    # Observed across 54 executions: median 1.1 min, max 1.9 min
    # (nextcloud-app-template). Does composer install + npm install + a Grype
    # download + a CVE scan, all network-bound, so 30 min rather than 10.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}
          extensions: mbstring, intl, zip, gd, curl, xml, json
          tools: composer:v2

      - name: Setup Node
        if: ${{ inputs.enable-frontend }}
        uses: actions/setup-node@v4
        with:
          node-version: "${{ inputs.node-version }}"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Generate PHP SBOM
        run: composer CycloneDX:make-sbom --output-format=JSON --output-file=bom-php.cdx.json --spec-version=1.5 --omit=dev --omit=plugin

      - name: Install npm dependencies
        if: ${{ inputs.enable-frontend }}
        run: npm ci

      - name: Generate npm SBOM
        if: ${{ inputs.enable-frontend }}
        # --package-lock-only: build the SBOM from package-lock.json rather than
        # `npm ls`. `npm ls` exits non-zero (ELSPROBLEMS) on benign tree quirks —
        # peer/version mismatches in transitive deps, a hard dependency declared
        # by a lib but deduped away, etc. — which has nothing to do with the SBOM.
        # The lockfile is the deterministic source of truth for what gets installed.
        # --ignore-npm-errors: cyclonedx-npm still shells out to `npm ls` internally
        # even with --package-lock-only, and aborts on those same benign
        # ELSPROBLEMS (e.g. a transitive @vueuse/core pulled by @nextcloud/dialogs
        # that mismatches a peer range). The tree quirk does not affect the SBOM,
        # so tolerate it rather than red the whole quality run.
        run: npx @cyclonedx/cyclonedx-npm --package-lock-only --ignore-npm-errors --output-file bom-npm.cdx.json --spec-version 1.5 --omit dev

      - name: Merge PHP + npm SBOMs
        if: ${{ inputs.enable-frontend }}
        run: |
          jq -s '.[0] * {components: ([.[].components[]?] | unique_by(.purl // .name))}' bom-php.cdx.json bom-npm.cdx.json > sbom.cdx.json

      - name: Use PHP SBOM as single SBOM
        if: ${{ !inputs.enable-frontend }}
        run: mv bom-php.cdx.json sbom.cdx.json

      # Fold each component's npm scope back into its name.
      #
      # CycloneDX splits a scoped package into two fields:
      #
      #     name:  gen-mapping        group: @jridgewell
      #     purl:  pkg:npm/%40jridgewell/gen-mapping@0.3.13
      #
      # Grype matches on `name` alone and ignores `group`, so the legitimate
      # @jridgewell/gen-mapping collides with "Malware in gen-mapping" — an
      # advisory about the UNSCOPED typosquat of the same base name. The npm
      # typosquatting campaign hit enough popular scoped packages that this is a
      # recurring class, not three one-offs: openbuild's SBOM went red on
      # @rollup/rollup-linux-riscv64-gnu after the ignore list below already
      # covered the first two.
      #
      # Writing "@scope/name" into `name` is what npm itself calls the package,
      # matches the purl that is already correct, and makes Grype match the right
      # advisory. It SUPPRESSES NOTHING: a genuinely unscoped malicious package
      # has no `group` to fold, keeps its bare name, and is still flagged.
      #
      # Recursive because CycloneDX permits nested `components`; a top-level-only
      # pass leaves nested entries unrenamed and still failing.
      - name: Normalise scoped npm names in the SBOM
        run: |
          python3 - <<'PY'
          import json

          with open('sbom.cdx.json') as fh:
              doc = json.load(fh)

          renamed = 0

          def fold(node):
              global renamed
              if isinstance(node, dict):
                  group = node.get('group')
                  name = node.get('name')
                  if group and isinstance(name, str) and not name.startswith('@'):
                      node['name'] = group + '/' + name
                      renamed += 1
                  for value in node.values():
                      fold(value)
              elif isinstance(node, list):
                  for value in node:
                      fold(value)

          fold(doc)

          with open('sbom.cdx.json', 'w') as fh:
              json.dump(doc, fh)

          print(f'Normalised {renamed} scoped component name(s) for Grype matching.')
          PY

      # ── Validation gate ──

      - name: Install Grype
        uses: anchore/scan-action/download-grype@v5
        id: grype-install

      # The ignore list that used to live here is deliberately gone.
      #
      # It suppressed GHSA-8rmg-jf7p-4p22 and GHSA-pvjq-589m-3mc8 outright to work
      # around the scope-matching problem the normalisation step above now fixes
      # properly. Those entries carried no package qualifier, so they suppressed
      # the advisories for ANY component — including a genuinely malicious
      # unscoped `gen-mapping`, which is exactly the package the advisory is about.
      #
      # Measured, by injecting a real unscoped `gen-mapping@0.3.13` (no group) into
      # the SBOM:
      #
      #   with the old ignore list   -> grype exit 0, 0 criticals   (malware hidden)
      #   with normalisation, no list -> grype exit 1, 1 critical    (malware caught)
      #
      # A workaround that hides the thing it is named after is worse than the
      # false positive it was written for.

      - name: CVE scan SBOM
        run: ${{ steps.grype-install.outputs.cmd }} sbom:sbom.cdx.json --fail-on critical

      - name: Composer audit
        run: composer audit --format=json || true
        # composer audit exits non-zero for any advisory; we rely on Grype for blocking

      - name: npm audit
        if: ${{ inputs.enable-frontend }}
        # --omit=dev: gate only on production-dependency criticals. Dev-only
        # build tooling (node-gyp/cacache → tar, cyclonedx, babel, …) is never
        # shipped in the app bundle, and its frequent advisories would otherwise
        # red every run. Matches the dedicated `Security (npm)` job, which
        # already runs `--audit-level=critical --omit=dev`.
        # Also tolerate an unavailable npm advisory endpoint (npm is retiring
        # audits/quick; it intermittently 400s) — an infra outage, not a finding.
        # Real advisories (a vuln table, not an endpoint error) still fail.
        run: |
          out="$(npm audit --audit-level=critical --omit=dev 2>&1)" && rc=0 || rc=$?
          echo "$out"
          if [ "$rc" -ne 0 ] && printf '%s' "$out" | grep -qiE "audit endpoint returned an error|Invalid package tree|ECONNRESET|ETIMEDOUT|ENOTFOUND|being retired|Service Unavailable"; then
            echo "::warning::npm audit skipped — npm advisory endpoint unavailable (external); not a vulnerability."
          elif [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi

      # ── Publish validated SBOM ──
      # The SBOM is intentionally NOT committed back to the repo.
      # It is published via two channels:
      #   1. Workflow artifact (90-day retention) — used by CI debugging + audit replay
      #   2. Release asset on every tag push — stable URL for downstream consumers
      # See SECURITY.md "Software Bill of Materials" for the consumer contract.

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ inputs.app-name }}
          path: sbom.cdx.json
          retention-days: 90

      - name: Attach SBOM to release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          files: sbom.cdx.json

  # ╔══════════════════════════════════════════════╗
  # ║  STAGE 5 — Features verification (read-only)  ║
  # ║                                               ║
  # ║  Scans openspec/specs/*/spec.md for           ║
  # ║  capabilities whose YAML frontmatter declares  ║
  # ║  status: implemented OR reviewed, emits a      ║
  # ║  sorted docs/features.json that the in-product ║
  # ║  Features & Roadmap surface consumes via       ║
  # ║  initial-state injection.                      ║
  # ║                                               ║
  # ║  CI never commits: generation happens at       ║
  # ║  COMMIT TIME via each repo's committed          ║
  # ║  .githooks/pre-commit (CONVENTIONS.md). Both    ║
  # ║  jobs below only verify and HARD-FAIL when     ║
  # ║  stale — via the Quality Report gate that      ║
  # ║  blocks the merge.                             ║
  # ╚══════════════════════════════════════════════╝

  # On pull_request events, run the extractor in `--check` mode only — fail
  # the PR if docs/features.json is stale instead of auto-committing. This
  # keeps the PR diff clean (no bot commits on top of the human's work) and
  # forces the author to regenerate locally so they see the change.
  features-check:
    if: ${{ inputs.enable-features-extract && !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    name: "Features Check"
    # Observed across 174 executions: median 0.2 min, max 3.1 min
    # (zaakafhandelapp).
    timeout-minutes: 20
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python -m pip install --quiet pyyaml

      - name: Checkout shared scripts
        uses: actions/checkout@v4
        with:
          repository: ConductionNL/.github
          path: .conduction-shared
          ref: main

      - name: Verify docs/features.json is up to date
        run: python .conduction-shared/scripts/extract-features.py --app-root . --check

  # READ-ONLY by design. This job used to auto-commit + push the regenerated
  # docs/features.json back to the branch — a quality pipeline mutating the
  # branch it is judging. That moved the PR head from under the checks
  # (with [skip ci] it stripped ALL checks from the PR), dismissed reviewer
  # approvals via the org ruleset's dismiss-stale-on-push, and on protected
  # branches the bot push bounced anyway (#61). Generation now happens at
  # COMMIT TIME in each repo via the committed .githooks/pre-commit hook
  # (see CONVENTIONS.md § features.json is generated at commit time); CI
  # only verifies and hands back the regenerated file as an artifact.
  features-extract:
    if: ${{ inputs.enable-features-extract && !cancelled() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    name: "Features Extract"
    # Observed across 76 executions: median 0.2 min, max 2.5 min
    # (nextcloud-app-template).
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python -m pip install --quiet pyyaml

      - name: Checkout shared scripts
        uses: actions/checkout@v4
        with:
          repository: ConductionNL/.github
          path: .conduction-shared
          ref: main

      - name: Regenerate docs/features.json
        run: python .conduction-shared/scripts/extract-features.py --app-root .

      - name: Fail if stale
        id: fail-if-stale
        run: |
          if git diff --quiet docs/features.json 2>/dev/null && ! git status --porcelain docs/features.json | grep -q '^??'; then
            echo "docs/features.json is up to date."
          else
            echo "::error::docs/features.json is out of date with openspec/specs/. Regenerate it locally (the committed .githooks/pre-commit hook does this automatically — see CONVENTIONS.md) and commit it. The regenerated file is attached as the 'features-json' artifact of this run."
            exit 1
          fi

      - name: Upload regenerated file
        # Gate on the staleness step SPECIFICALLY, not `failure()` alone: if the
        # Regenerate step itself crashed, the file on disk is the stale committed
        # copy (or absent), and uploading it under the 'features-json' label would
        # invite committing exactly what CI just rejected. Only when fail-if-stale
        # failed is the on-disk file guaranteed to be the fresh regeneration.
        # (`failure() &&` is required — without a status-check function GitHub
        # implies `success()`, and the step would never run after a failure.)
        if: failure() && steps.fail-if-stale.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: features-json
          path: docs/features.json
          retention-days: 7
