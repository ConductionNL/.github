name: Quality

on:
  workflow_call:
    inputs:
      app-name:
        description: "Nextcloud app ID (used for checkout path in NC server)"
        required: true
        type: string
      php-version:
        description: "Primary PHP version for linting"
        required: false
        type: string
        default: "8.3"
      php-test-versions:
        description: "JSON array of PHP versions for PHPUnit matrix"
        required: false
        type: string
        default: '["8.3", "8.4"]'
      nextcloud-test-refs:
        # ── AN OVERRIDE NOW, NOT THE SOURCE OF TRUTH ──────────────────────
        #
        # The matrix is DERIVED from the app's own appinfo/info.xml by the
        # `nextcloud-matrix` job below. Leave this unset — the default — and the
        # tested range cannot disagree with the declared one, because there is
        # only one place the range is written down.
        #
        # WHY THAT CHANGED. This value used to be hand-maintained per app, and
        # the fleet broke the info.xml <-> matrix agreement in BOTH directions
        # inside a single programme:
        #
        #   * every app declared NC 32-34 and tested stable31/stable32, so the
        #     version being adopted was exercised by nothing. And stable31 was
        #     worse than useless: openregister declares min-version="32", so
        #     `occ app:enable openregister` failed with only a ::warning::, the
        #     run continued with NO data layer, and every /apps/openregister/...
        #     call returned Nextcloud's HTML 404 page. That leg's red said
        #     nothing and its green said less.
        #   * the migration that fixed it REPLACED the list with '["stable34"]'
        #     instead of extending it, and 16 apps stopped testing their own
        #     declared floor.
        #
        # Both were detectable. Neither was detected, because the two halves
        # were two files that could be edited independently. Derivation removes
        # the second half.
        #
        # WHEN TO SET IT ANYWAY. A repo whose tested range must deliberately
        # differ from its declared range — petstore declares NC 28-34 and has no
        # intention of running seven server legs — passes an explicit array here
        # and keeps exactly today's behaviour. gate-65 rule 11 then requires
        # that array to agree with info.xml, so an override is a decision
        # somebody has to defend, not a place a value can quietly rot.
        #
        # The ORDER of an override is no longer load-bearing. It used to be:
        # `fromJSON(...)[0]` was read as THE single server for newman,
        # playwright, journeydoc-capture and the coverage guard. Those six reads
        # are now `needs.nextcloud-matrix.outputs.single-server`, which is the
        # NUMERICALLY HIGHEST stable branch in the resolved set, whichever way
        # round it is written. A positional convention is how a defect like this
        # survives: it is invisible in a diff and it is not checkable.
        description: "OVERRIDE for the Nextcloud server branches used by the PHPUnit matrix, as a JSON array. LEAVE UNSET (default) to derive the range from appinfo/info.xml, which is the supported configuration — a derived matrix cannot disagree with the declared range. Set it only when the tested range must deliberately differ from the declared one; gate-65 rule 11 then requires the two to agree."
        required: false
        type: string
        default: ""
      nextcloud-info-path:
        # The manifest the matrix is derived from. Two reasons this is an input
        # rather than a hard-coded 'appinfo/info.xml':
        #
        #   1. It is how THIS repository proves its own derivation. .github is
        #      not a Nextcloud app and has no appinfo/info.xml, so without a
        #      path input `quality-selftest.yml` could only ever exercise the
        #      no-manifest fallback — and a derivation that is never executed in
        #      the repo that ships it is a derivation nobody has measured. The
        #      selftest points this at a fixture declaring 32-34, and a second
        #      caller points it at one declaring 32-33; the two runs differing
        #      is the positive control that the matrix TRACKS info.xml rather
        #      than returning a constant.
        #   2. Repos whose app manifest is not at the default path. Same shape
        #      as `frontend-path`.
        description: "Path to the appinfo/info.xml the Nextcloud test matrix is derived from. Default: appinfo/info.xml. A repo with no manifest at this path derives nothing and falls back to the shared default range."
        required: false
        type: string
        default: "appinfo/info.xml"
      enable-php:
        description: "Master switch for the PHP toolchain (php-quality, PHPUnit, composer security/license legs, SBOM). Set false for JS-only repos without composer.json."
        required: false
        type: boolean
        default: true
      enable-npm:
        description: "Master switch for the npm ecosystem checks (npm legs of security/license). Set false for PHP-only repos without package.json — `npm ci` fails hard without one. Counterpart of enable-php."
        required: false
        type: boolean
        default: true
      enable-psalm:
        description: "Run Psalm static analysis"
        required: false
        type: boolean
        default: true
      enable-phpstan:
        description: "Run PHPStan static analysis"
        required: false
        type: boolean
        default: true
      enable-phpmd:
        description: "Run PHPMD mess detection"
        required: false
        type: boolean
        default: true
      enable-phpcs:
        description: "Run PHPCS code style checks"
        required: false
        type: boolean
        default: true
      enable-phpmetrics:
        description: "Run phpmetrics code metrics"
        required: false
        type: boolean
        default: true
      enable-frontend:
        description: "Run frontend quality checks (ESLint + Stylelint)"
        required: false
        type: boolean
        default: true
      enable-eslint:
        description: "Run ESLint (requires enable-frontend)"
        required: false
        type: boolean
        default: true
      node-version:
        # Node 24, and the reason is npm, not Node.
        #
        # The fleet's supply-chain cooldown (`min-release-age` +
        # `min-release-age-exclude` in each repo's .npmrc) is an npm 11+
        # feature. It does not exist in npm 10 AT ALL — not as a rejected
        # value, not as a warning: `npm config get min-release-age` answers
        # `undefined` and the setting is read by nothing. And EVERY Node 22
        # release bundles npm 10 (22.23.2, the latest, ships 10.9.8), so no
        # value of this input in the 22 line can deliver it. Node 24.19 bundles
        # npm 11.17.
        #
        # This supersedes the previous "Node 22 is what Nextcloud's own apps
        # target" rationale. That still holds as a statement about upstream,
        # but a cooldown that is silently inert is worse than no cooldown: it
        # reads as protection nobody has. The apps' own `engines.node` already
        # declares `^22.14 || ^24 || >=26`, so 24 was always an allowed
        # runtime here — this makes it the one CI uses.
        #
        # The Node 20 floor below is unchanged and still binding:
        # @nextcloud/eslint-config@9 declares `engines.node: ^22.14 || ^24 ||
        # >=26` and imports `findPackageJSON` from `node:module`, an API that
        # first exists in 22.14. On Node 20 the eslint job dies before linting
        # a single file with `SyntaxError: The requested module 'node:module'
        # does not provide an export named 'findPackageJSON'` — and npm reports
        # the mismatch only as an EBADENGINE warning it then continues past, so
        # the crash is the only signal.
        #
        # A caller that must stay on 22 can still pass `node-version: "22"`.
        # It will get npm 10 and the cooldown will be inert for that repo,
        # which gate-84 reports rather than letting it pass quietly.
        description: "Node.js version for all frontend/npm steps"
        required: false
        type: string
        default: "24"
      frontend-path:
        description: "Directory containing package.json + package-lock.json for all npm-side jobs (Vue Quality, Frontend Checks, npm security/license legs). Default: repo root. Use for repos where the frontend lives in a subdirectory (e.g. 'pwa')."
        required: false
        type: string
        default: "."
      enable-stylelint:
        description: "Run Stylelint (requires enable-frontend). Set false for repos without a stylelint npm script."
        required: false
        type: boolean
        default: true
      frontend-setup-command:
        description: "Optional ADDITIONAL setup command for the frontend-checks job. The standard root `npm ci` always runs first; this command runs after it and does NOT replace it. Use it to prepare things the root install doesn't cover, e.g. installing a nested package's dependencies: 'cd docusaurus && npm ci' (the nested directory then needs its own package.json + package-lock.json)."
        required: false
        type: string
        default: ""
      frontend-checks:
        description: "JSON array of npm scripts to run as individual 'Frontend Check (<script>)' jobs (e.g. '[\"test\", \"check:docs\"]'). Requires enable-frontend and a repo with package.json + package-lock.json (each leg runs `npm ci`). Every listed script MUST exist in the repo's package.json and MUST be self-contained — each leg is a fresh job (own checkout + npm ci), so bundle order-dependent steps into one script (e.g. \"check:build\": \"npm run build && npm run check:css-entry\"). See CONVENTIONS.md § Custom frontend checks."
        required: false
        type: string
        default: "[]"
      database-test-matrix:
        description: "JSON array of databases to run PHPUnit against, e.g. '[\"pgsql\", \"mysql\", \"sqlite\"]'. Nextcloud runs its own suites on mariadb, mysql, oci and sqlite separately, because database-portability bugs are invisible on a single backend. DEFAULT IS EMPTY, which means 'use the single `database` input' — today's behaviour exactly, so this change is inert until an app opts in."
        required: false
        type: string
        default: "[]"
      enable-check-code:
        # DEFAULT FLIPPED true -> false, because the command this job runs DOES
        # NOT EXIST any more and the job therefore cannot pass in any repo here.
        #
        # `occ app:check-code` was removed from Nextcloud server after v20.
        # Measured, extracting the registered App-namespace commands from
        # `core/register_command.php` at each tag — same expression, same file,
        # only the tag varying:
        #
        #   v20.0.0  Disable Enable GetPath Install ListApps Remove Update
        #            + CheckCode                       <- the control: it CAN appear
        #   v34.0.0  Disable Enable GetPath Install ListApps Remove Update
        #                                              <- CheckCode is gone
        #
        # Corroborated independently: `core/Command/App/CheckCode.php` answers
        # 200 at v20 and v21 and 404 at v25, v31, v32, v33 and v34, while
        # `core/Command/App/ListApps.php` answers 200 at every one of those tags
        # — so the 404s are a removal, not a bad path.
        #
        # Every app in this fleet declares <nextcloud min-version> of 31, 32 or
        # 34, and this job fetches the server at the version the app DECLARES.
        # So `occ` would be asked for a command roughly eleven majors dead. It
        # would print no recognisable verdict, the job's own positive control
        # would fire, and that control's `exit 1` is UNCONDITIONAL — it sits
        # above the `check-code-blocking` branch and is not covered by it. The
        # result would be a hard failure in every PHP repo in the fleet, on a
        # check that can never pass.
        #
        # The positive control is doing its job here, exactly as designed: it
        # refuses to report "no private API usage" from a run that inspected
        # nothing. The job is what is wrong, not the control.
        #
        # LEFT WIRED, NOT DELETED, and still listed in the Quality Report's
        # `needs:`. A skipped job's result is `skipped`, not `failure`, so this
        # blocks nothing while it is off — and when someone rebuilds the check on
        # something that exists (Psalm/PHPStan over the private surface, or
        # nextcloud/app-api's linter), the wiring is already correct and one
        # input turns it on. Deleting it would lose that and quietly re-open the
        # gap #385 was written to close.
        description: "Run `occ app:check-code` against the Nextcloud version the app declares in info.xml. OFF BY DEFAULT AND CURRENTLY UNUSABLE: `app:check-code` was removed from Nextcloud server after v20 (verified against core/register_command.php and core/Command/App/CheckCode.php from v20 through v34), and every app here declares min-version 31 or later, so the command cannot be found and the job's positive control fails the run. Do not set this true until the check is rebuilt on tooling that still exists."
        required: false
        type: boolean
        default: false
      check-code-blocking:
        description: "Turn app:check-code findings into a build failure. OFF by default on purpose: every app in this fleet reaches into server internals somewhere, and a gate that is red on arrival is a gate nobody turns on. Flip it per app once the findings are worked down."
        required: false
        type: boolean
        default: false
      enable-reuse:
        description: "Run the REUSE/SPDX linter, as Nextcloud does on every app. Broader than the PHPCS @license sniff, which only sees PHP docblocks."
        required: false
        type: boolean
        default: true
      reuse-blocking:
        description: "Turn REUSE findings into a build failure. OFF by default — most fleet apps ship no REUSE.toml or LICENSES/ directory yet."
        required: false
        type: boolean
        default: false
      enable-license-check:
        description: "Run dependency license compliance check (composer + npm)"
        required: false
        type: boolean
        default: true
      enable-phpunit:
        description: "Run PHPUnit tests against Nextcloud server"
        required: false
        type: boolean
        default: false
      enable-newman:
        description: "Run Newman integration tests against Nextcloud server"
        required: false
        type: boolean
        default: false
      newman-collection-path:
        description: "Path to Newman/Postman collection files (relative to app root)"
        required: false
        type: string
        default: "tests/integration"
      newman-environment-path:
        description: "Path to Postman environment JSON file (relative to app root). When set, passes --environment to Newman instead of ad-hoc --env-var flags."
        required: false
        type: string
        default: ""
      newman-seed-command:
        description: "Shell command to run after server start but before Newman tests (e.g. 'php occ maintenance:repair' to seed test fixtures). Runs with cwd set to the Nextcloud server root."
        required: false
        type: string
        default: ""
      enable-playwright:
        description: "Run Playwright E2E browser tests against Nextcloud server"
        required: false
        type: boolean
        default: false
      playwright-test-path:
        description: "Path to Playwright test files (relative to app root)"
        required: false
        type: string
        default: "tests/e2e"
      playwright-seed-command:
        description: "Shell command to run after server start but before Playwright tests (e.g. 'php occ maintenance:repair' to seed test fixtures). Runs with cwd set to the Nextcloud server root."
        required: false
        type: string
        default: ""
      enable-playwright-coverage:
        description: "Measure spec-to-test scenario coverage after the Playwright suite (and set COLLECT_COVERAGE for the suite itself). Produces playwright-coverage.json and enforces playwright-coverage-threshold."
        required: false
        type: boolean
        default: false
      playwright-coverage-threshold:
        # #189. Three things were wrong with this knob and all three are fixed
        # in the step that reads it ("Generate spec-to-test coverage report"):
        #
        #   1. It never enforced. Below-threshold emitted `::warning::` and the
        #      job stayed green, so the value was decorative. pipelinq declared
        #      75, its run printed 28%, and the run passed. It now `::error::`s
        #      and exits non-zero.
        #   2. The number was not coverage. It was
        #      `count(test() calls) / count(scenario headings)` — two
        #      independent totals, never compared to each other. Ten unrelated
        #      tests raised it exactly as much as covering ten scenarios, and it
        #      could exceed 100% while covering nothing. It is now real
        #      per-scenario matching against `@e2e` references, using gate-19's
        #      dialect. The old ratio is still reported, under the honest name
        #      `testsPerScenarioPercent`, and is not gated on.
        #   3. Zero scenarios scored 100% — the worst-covered repo and the best
        #      produced the same number. Zero enforceable scenarios is now a
        #      FAILURE TO MEASURE and fails.
        #
        # The description below is also corrected. It used to read "Only
        # enforced when enable-playwright-coverage is true", which told a reader
        # that setting the flag switched enforcement on. It did not.
        #
        # DEFAULT CHANGED 75 -> 0, deliberately, to bound the blast radius of
        # making a dead gate live. Measured 2026-08-08 across all 31 fleet
        # callers: exactly ONE repo (pipelinq) sets `enable-playwright-coverage:
        # true`, and it also sets its own threshold explicitly. Every other
        # caller leaves the flag false, so the step does not run at all. A
        # default of 0 means a repo that switches measurement on gets the
        # NUMBER without being turned red by a floor it never chose; gating is
        # opt-in by setting a value, which is what a threshold input should
        # mean.
        description: "Minimum percentage of non-excluded openspec scenarios that must be referenced by an @e2e annotation in a Playwright test (0-100). ENFORCED — below this the Playwright job fails. Only evaluated when enable-playwright-coverage is true. Default 0 means measure and report, do not gate."
        required: false
        type: number
        default: 0
      enable-axe:
        # Same shape and the same reasoning as enable-hydra-gates below: a
        # control that goes red on inherited debt the moment it is switched on
        # gets switched off again, so each repo opts in once its own routes are
        # clean.
        #
        # It is worth being blunt about what "goes red" means here, because it
        # was measured rather than assumed. Running this runner against a
        # VANILLA Nextcloud 34 — no Conduction app installed at all — over
        # /apps/dashboard/, /apps/files/ and /settings/user produced three
        # serious/critical violations from Nextcloud's own UI (label,
        # aria-input-field-name, aria-prohibited-attr). An app's own routes
        # render inside that same shell, so the first run in any repo will
        # almost certainly be red, and some of that red will not be the app's
        # to fix. Default-on would therefore have blocked the fleet on core
        # Nextcloud defects on day one.
        description: "Run axe-core (@axe-core/playwright) against the app's routes inside the Playwright job and publish tests/axe/report.json, which is the file hydra-gates gate-33 consumes. OPT-IN, default false. Gate-33 fails on `serious`/`critical` violations only; without this the report does not exist and gate-33 reports SKIPPED, which is what it has done in every repo in the fleet since it was written. Requires enable-playwright (the report is produced by that job, against its Nextcloud instance) and is only consumed when enable-hydra-gates is also true. SETTING THIS TRUE IS AN OPT-IN TO ENFORCEMENT, NOT TO A BEST EFFORT: if no usable axe report reaches the hydra-gates job — because Playwright was skipped or failed, or because the report was rejected by the provenance check — that job now FAILS with a named reason instead of going green with gate-33 silently SKIPPED. Leave it false, deliberately and visibly, for any repo not ready to enforce it. Measured against a vanilla Nextcloud 34 with no app installed, core's own pages already carry serious/critical violations — expect the first run in a repo to be red, which is exactly why this is off by default."
        required: false
        type: boolean
        default: false
      axe-routes:
        description: "Newline- or comma-separated paths to run axe against, relative to the instance root (e.g. '/index.php/apps/openregister/,/index.php/apps/openregister/#/schemas'). Empty means the app's own root route. A path that answers HTTP >= 400 is a hard failure, not an empty result: axe would otherwise analyse Nextcloud's error page and report it as clean. Settings-only apps have no root route and MUST set this."
        required: false
        type: string
        default: ""
      axe-include-selector:
        # MEASURED on a live Nextcloud 34.0.2, logged in, for every candidate
        # selector ever proposed for this. `#app-content` and `main#content` do
        # not exist on NC34 at all; `#content-vue` is absent on the dashboard and
        # `#content` is absent on /apps/files/, so no SINGLE selector covers every
        # page — hence a two-selector default. `#app-content-vue`/`main` also
        # cover every page but sit INSIDE `#content-vue` and exclude the app
        # navigation, which a Conduction app renders itself; scoping to them
        # would hide real app defects, which is muting rather than scoping.
        description: "CSS selector(s), comma-separated, wrapping this app's OWN rendered DOM. axe analyses only what is inside them (AxeBuilder.include), so Nextcloud's chrome is no longer attributed to the app. MEASURED: /apps/openregister/ went from 2 serious/critical violations to 0 and /apps/hermiq/ from 1 to 0, and every violation removed was core's. This is a SCOPE, not a mute: a deliberate violation injected inside the container is still reported, and the same violation injected outside it is not — both asserted on the live page every run. A selector list matching NOTHING is a hard failure. Set to 'body' to opt out."
        required: false
        type: string
        default: "#content-vue, #content"
      axe-exclude-selector:
        # The one lever here that can hide a real defect of the app's own.
        # Default empty. An exclude naming a missing selector is silently
        # ignored by axe (fails open), unlike include which aborts.
        description: "Optional CSS selector(s) to remove from inside the include scope (AxeBuilder.exclude). Default empty. Use ONLY for a region the app embeds but does not own; name it and say why in the caller."
        required: false
        type: string
        default: ""
      axe-version:
        description: "Version of @axe-core/playwright to install. Pinned rather than floating because the axe rule set decides the verdict: an unpinned install can turn a repo red on a day nobody committed anything, which is the one thing a mechanical gate must never do. Move it deliberately, in a commit."
        required: false
        type: string
        default: "4.12.1"
      enable-journeydoc-capture:
        description: "Run the journeydoc Playwright capture spec (tests/e2e/docs-screenshots.spec.ts) against a freshly-installed Nextcloud and commit any new/changed screenshots back to the calling repo. Per ADR-030. Recommended to invoke from a dedicated docs-capture.yml workflow with schedule + workflow_dispatch triggers (not on every PR — too expensive)."
        required: false
        type: boolean
        default: false
      journeydoc-output-path:
        description: "Path inside the app repo where the docs-capture Playwright project writes its screenshots. The diff/commit-back step monitors this path. Default matches the canonical journeydoc convention from ADR-030."
        required: false
        type: string
        default: "docs/static/screenshots/tutorials"
      journeydoc-deploy-workflow:
        description: "Optional: name (or filename) of a workflow to dispatch via `gh workflow run` after the screenshot-refresh commit. Use this to trigger the docs deploy when screenshots actually changed (e.g. 'documentation.yml' or 'deploy.yml'). Empty = no dispatch."
        required: false
        type: string
        default: ""
      additional-apps:
        description: "JSON array of additional app repos to checkout and enable (e.g. '[{\"repo\":\"ConductionNL/openregister\",\"app\":\"openregister\"}]')"
        required: false
        type: string
        default: "[]"
      enable-coverage-guard:
        description: "Enforce the coverage ratchet — READ-ONLY, never commits. On a PULL REQUEST the merge base is measured in the phpunit job and the change must not reduce coverage against it; the floor is measured, not typed, so it cannot go stale and there is nothing for an author to keep up to date. On a PUSH the committed .coverage-baseline is enforced as a conservative fail-safe floor (below it fails; above it is fine). PRs may raise that floor but never lower it. Requires scripts/coverage-guard.php supporting --against; the workflow probes for it and fails loudly rather than silently downgrading the check."
        required: false
        type: boolean
        default: false
      enable-sbom:
        description: "Generate CycloneDX SBOM and validate it (Grype CVE scan + composer/npm audit — hard failures). Published as a run artifact and release asset; intentionally never committed to the repo."
        required: false
        type: boolean
        default: true
      enable-features-extract:
        description: "Verify docs/features.json is in sync with openspec/specs/ — READ-ONLY, hard-fails when stale (features-check on PRs, features-extract on pushes; both gate the Quality Report). Generation happens at commit time via the repo's .githooks/pre-commit — see CONVENTIONS.md."
        required: false
        type: boolean
        default: true
      database:
        description: "Database backend for integration tests (sqlite, pgsql, mysql)"
        required: false
        type: string
        default: "pgsql"
      enable-hydra-gates:
        # No gate count here on purpose. There is no single true number to
        # write: the total depends on which ref the CALLER pins via
        # hydra-gates-ref, and the number that actually ran depends on the
        # repo's own diff and toolchain. Measured on openbuild#113
        # (2026-08-04, pinned v1.0.1):
        #
        #   [hydra-gates] ALL 61 GATES GREEN
        #   [hydra-gates] COVERAGE: 58 of 61 declared gates reported a result.
        #   [hydra-gates] GATES THAT DID NOT RUN: 4 24 33
        #
        # Three defensible figures for one line — 61 declared at that pin, 63
        # declared on main, 58 actually executed — and the one a reader needs
        # is per-run and unknowable statically. The package prints it
        # (COVERAGE: N of M); a digit in prose has nothing to reconcile
        # against and drifts silently in both directions.
        description: "Run the Hydra mechanical quality gates (conduction/hydra-gates — https://github.com/ConductionNL/.github/tree/main/hydra-gates) against this PR's diff. OPT-IN, default false: the gates are diff-scoped per ADR-020, but a repo whose in-flight branches touch files with inherited debt will go red the moment this is switched on, so each repo enables it once its own diffs are clean. Enabling it makes gate failures block the Quality Report."
        required: false
        type: boolean
        default: false
      hydra-gates-ref:
        # DEFAULT `main`, AND CALLERS SHOULD NOT SET THIS AT ALL.
        #
        # A pin is a silent expiry date. It has now cost the fleet twice:
        #
        #   #159  22 repos sat on v1.0.1, which predated a batch of gate fixes.
        #         16 gates were DEAD fleet-wide and every one of them reported
        #         PASS, because a gate whose helper never ran emits a tick
        #         identical to a real one.
        #   #173  the coverage flag was flipped to default true HERE, at @main,
        #         and reached v1.0.1 runners that predate the accounting that
        #         makes it survivable. decidesk and doriath went red (exit 98)
        #         on gates 4, 24 and 33 — precisely the not-applicable gates
        #         that must never fail a run.
        #
        # Both are the same defect: this workflow is consumed at @main while the
        # package was consumed at a pin, so the two moved independently and a
        # change on one side reached a runner from the other side's past. The
        # fix is not a better pin. It is no pin — the two sides move together
        # again, and a fix landed here is a fix everyone has.
        #
        # ROLLBACK, because "always latest" is only safe with a way back:
        #
        #   fleet-wide, immediate — revert the offending commit on
        #     ConductionNL/.github main. One commit, no per-repo PRs, and every
        #     caller picks it up on its next run. This is the normal lever, and
        #     it is strictly faster than the 23-PR bump that a pin makes
        #     necessary.
        #   one repo, immediate — set this input to a tag or SHA in that repo's
        #     caller. Still supported, still honoured, and the right move when a
        #     single repo needs to hold still while an upstream problem is
        #     sorted out. Treat it as a temporary escape hatch and remove it
        #     when the reason is gone: an explicit pin is exactly the state that
        #     produced #159 and #173, and nothing here will remind you it is set.
        #
        # A moving major tag (`v1`, re-pointed each release) was considered and
        # rejected. It would give a release boundary, but only while someone
        # remembers to move it — and a tag nobody re-points is indistinguishable
        # from the stale pin this change exists to remove. It would reproduce
        # the failure silently, which is the one property being engineered out.
        # `main` cannot rot, and main is now gated: see
        # .github/workflows/quality-resolve-probe.yml, which counts the JOBS a
        # real in-repo caller materialises, and hydra-gates-package.yml, which
        # runs the package's own suites on every PR here.
        #
        # Version floors, still enforced by the capability probe below rather
        # than by parsing this string (a pin may be a branch, a SHA or a fork,
        # and none of those carry a version): v1.3.0 is the minimum for
        # hydra-gates-require-full-coverage to be honoured — earlier packages
        # count every not-applicable gate as a coverage gap — and v1.4.0 is the
        # minimum for enable-axe to run at all, since it ships the axe runner.
        # Below those the affected flag is WITHHELD with a named warning rather
        # than failing the run for something the repo did not do.
        description: "Ref of ConductionNL/.github to take the gate package from. LEAVE UNSET: the default tracks @main so a gate fix reaches every repo without a commit in that repo, and this workflow is itself consumed at @main so the two sides stay in step. Set it only as a temporary escape hatch when one repo must hold still — an explicit pin is a silent expiry date and has twice left gates dead or falsely red fleet-wide (#159, #173). To roll back for everyone, revert on ConductionNL/.github main instead. Older refs are still supported: a capability probe reads the package's own accounting and withholds a flag the pinned runner cannot honour, rather than failing the run."
        required: false
        type: string
        default: "main"
      hydra-gates-require-full-coverage:
        # ON by default as of this change, and only because the accounting was
        # fixed first. It could not be switched on before: "did not run"
        # collapsed three different facts into one, and the flag failed on all
        # of them. Measured on a Tier-0 fixture with nothing wrong with it, 30
        # of 63 gates emitted NOTHING — 25 of those simply because they are
        # wrapped in `if [ -d src ]` and the repo has no frontend — and the flag
        # exited 98. A control that red-flags a repo for gates it has no surface
        # for is a control that gets switched off.
        #
        # The runner now distinguishes:
        #   NOT APPLICABLE  subject matter absent from this repo or this diff.
        #                   Named in the output, excluded from coverage, does
        #                   NOT fail. (No src/ → no <img> to lack an alt. No
        #                   composer file in the diff → no dependency change to
        #                   audit, per ADR-020.)
        #   SKIPPED (structural)  the subject matter EXISTS and nothing produced
        #                   the gate's input. Fails.
        #   SKIPPED (wiring)  the gate's own machinery is missing — a helper
        #                   script, a tool. Fails, and this is the worst of the
        #                   three: it is how gate-7 once reported PASS over 11
        #                   real unguarded IDOR endpoints.
        #
        # Silence still counts AGAINST coverage. A gate stops counting only by
        # declaring itself not-applicable out loud, with a category that is
        # validated — an unrecognised one is a hard failure, never a default.
        #
        # Measured against five fleet repos with the flag on: openregister,
        # opencatalogi and docudesk have ZERO gates that did not run; hermiq and
        # openconnector have exactly one each (gate-24), and it is a genuine gap
        # — both register integration leaves and neither ships a parity check.
        description: "Fail the run (exit 98) when a gate whose subject matter EXISTS did not report. ON by default. A gate that is legitimately not applicable — a Tier-0 app with no src/, or gate-4 correctly diff-scoped out under ADR-020 because no composer file changed — reports NOT APPLICABLE, is named in the coverage block, and does NOT fail the run. Only two states fail: a STRUCTURAL gap (the subject matter exists and nothing produced the gate's input, e.g. a repo that registers integration leaves but ships no parity check) and a WIRING gap (the gate's own helper or tool is missing — the shape that once let gate-7 report PASS over 11 real unguarded IDOR endpoints). A gate that emits nothing at all still counts against coverage: not-applicable must be DECLARED, and its category is validated, so a gate cannot stop counting by staying quiet or by misspelling its reason. REQUIRES hydra-gates-ref v1.3.0 or later — an earlier package cannot tell the three states apart and counts every not-applicable gate as a gap, so at an older pin this flag is WITHHELD with a named warning instead of failing the run (measured: decidesk and doriath went red at v1.0.1 on nothing but gates 4, 24 and 33). Set false only if you knowingly want a green that may be silent about what it did not check — the coverage block is printed either way."
        required: false
        type: boolean
        default: true

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ╔══════════════════════════════════════════════╗
  # ║  STAGE 1 — Four parallel quality gates        ║
  # ║                                               ║
  # ║  Each group uses a matrix strategy so GitHub   ║
  # ║  renders it as ONE collapsible box with        ║
  # ║  individual tool results visible inside.       ║
  # ║                                               ║
  # ║  ┌────────────┐ ┌────────────┐                ║
  # ║  │PHP Quality │ │Vue Quality │                ║
  # ║  │ ◦ lint     │ │ ◦ eslint   │                ║
  # ║  │ ◦ phpcs    │ │ ◦ stylelint│                ║
  # ║  │ ◦ phpmd    │ └────────────┘                ║
  # ║  │ ◦ psalm    │ ┌────────────┐                ║
  # ║  │ ◦ phpstan  │ │ License    │                ║
  # ║  │ ◦ metrics  │ │ ◦ composer │                ║
  # ║  └────────────┘ │ ◦ npm      │                ║
  # ║  ┌────────────┐ └────────────┘                ║
  # ║  │ Security   │                               ║
  # ║  │ ◦ composer │                               ║
  # ║  │ ◦ npm      │                               ║
  # ║  └────────────┘                               ║
  # ╚══════════════════════════════════════════════╝

  # ── Group 1: PHP Quality ────────────────────────
  php-quality:
    if: ${{ inputs.enable-php }}
    runs-on: ubuntu-latest
    name: "PHP Quality (${{ matrix.tool }})"
    # Observed across 1497 executions fleet-wide: median 0.5 min, p95 1.5 min,
    # max 4.0 min (launchpad). 20 min is a wide margin over the worst leg while
    # still turning a hang into a failure instead of a 6-hour runner burn.
    timeout-minutes: 20
    strategy:
      matrix:
        tool: [lint, phpcs, phpmd, psalm, phpstan, phpmetrics]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}
          extensions: mbstring, intl, zip, gd, curl, xml, json
          tools: composer:v2

      # `composer.json` joins the key deliberately. `hashFiles` returns an EMPTY
      # string when nothing matches its pattern, so on the three fleet repos
      # that ship no composer.lock (hermiq, hrmq, zaakafhandelapp) this key
      # collapsed to the constant `Linux-composer-`. A GitHub Actions cache
      # entry is IMMUTABLE once written, so those repos restored the same
      # `vendor/` forever and no dependency change could ever rotate it — a
      # cache that cannot expire is a stale tree with a fast install. Naming
      # both files gives every repo a key that moves when its dependencies do.
      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock', 'composer.json') }}
          restore-keys: ${{ runner.os }}-composer-

      # Second, independent cache: composer's DOWNLOAD directory. The `vendor`
      # cache above only helps when dependencies are unchanged; this one is what
      # makes the install after a dependency change fast, because the archives
      # are already local. They are not redundant — they cover opposite cases.
      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: ${{ runner.os }}-composer-files-${{ hashFiles('composer.lock', 'composer.json') }}
          restore-keys: ${{ runner.os }}-composer-files-

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Run ${{ matrix.tool }}
        run: |
          # `composer <script>` exits 1 for BOTH "the script ran and returned 1"
          # and "Command \"<script>\" is not defined." Any leg that interprets
          # exit 1 (the phpcs warnings-are-non-blocking rule below) therefore
          # reads a MISSING gate as a PASSING gate — a gate's absence and a
          # gate's success become indistinguishable. See ConductionNL/.github#121.
          #
          # So: assert the script is declared BEFORE running it, and read the
          # declaration from composer.json rather than from the exit code.
          # Deliberately NOT an `[ -f vendor/bin/<tool> ]` guard — a file-presence
          # guard that skips is the same silent-pass defect in a new costume.
          require_script() {
            tool="$1"
            hint="$2"
            if [ ! -f composer.json ]; then
              echo "::error::The '$tool' gate is enabled but there is no composer.json in the repository root."
              exit 1
            fi
            if ! jq -e --arg s "$tool" '(.scripts // {}) | has($s)' composer.json > /dev/null 2>&1; then
              echo "::error::The '$tool' gate is enabled but composer.json declares no '$tool' script. Add it under \"scripts\", or turn the gate off with $hint."
              exit 1
            fi
          }
          case "${{ matrix.tool }}" in
            lint)
              require_script lint "the enable-php input"
              composer lint
              ;;
            phpcs)
              if [ "${{ inputs.enable-phpcs }}" != "true" ]; then
                echo "PHPCS is disabled — skipping."
                exit 0
              fi
              require_script phpcs "the enable-phpcs input"
              #
              # ⚠️ THE EXIT CODES ARE NOT WHAT THIS BLOCK USED TO CLAIM.
              #
              # The comment here used to read "0 = clean, 1 = warnings only,
              # 2 = errors found", and the block mapped exit 1 to SUCCESS on
              # that basis. Measured against php_codesniffer 3.13.6
              # (`Runner::runPHPCS()`) with this fleet's real ruleset, the
              # actual mapping is:
              #
              #   0  No ERRORS. Warnings never reach the exit code at all: the
              #      shared hydra-gates ruleset sets `ignore_warnings_on_exit=1`,
              #      which subtracts them in `Runner::run()` before
              #      `runPHPCS()` ever looks at the total.
              #   1  ERRORS present, and NONE of the violations are
              #      phpcbf-fixable.
              #   2  ERRORS present, and at least one IS phpcbf-fixable.
              #   3  phpcs could not run at all (config/tokenizer failure).
              #
              # So exit 1 never meant "warnings only". It meant "errors, none
              # auto-fixable" — and this block passed every single one of them.
              #
              # The old rule was not merely wrong, it was near-total. The shared
              # ruleset deliberately removed every auto-fixable formatting sniff
              # (see its own header: 111,747 of 111,932 findings were the
              # formatter being argued with). That makes exit 2 nearly
              # unreachable and exit 1 the ORDINARY way for errors to present,
              # so the special case swallowed essentially the whole fleet's
              # error debt. Measured 2026-08-17 across all 18 core repos on
              # `development`: 12 repos green with 707 real phpcs errors between
              # them; every one of the 12 returned exit 1, and every one of the
              # 6 genuinely clean repos returned 0. Zero repos returned 2.
              #
              # Warnings staying non-blocking needs NO special case here, because
              # phpcs already returns 0 for them. Passing the code straight
              # through is both the correct rule and the simpler one.
              #
              # `--runtime-set ignore_warnings_on_exit 1` is appended so that
              # "warnings do not fail the build" holds BY CONSTRUCTION at the
              # gate, rather than by inheritance from a vendored ruleset that an
              # app could stop referencing. All 18 core repos currently inherit
              # it and none set it themselves, so today it rests on one line in
              # one vendored file — too thin to carry an enforcement flip.
              #
              # NB: capture via `|| RC=$?` — a bare `composer phpcs; RC=$?`
              # is killed by `set -e` before RC is ever assigned.
              RC=0
              composer phpcs -- --runtime-set ignore_warnings_on_exit 1 || RC=$?
              if [ "$RC" -eq 3 ]; then
                echo "::error::PHPCS could not run (exit 3) — this is a configuration or tokenizer failure, not a code finding. Check the app's phpcs.xml."
              elif [ "$RC" -ne 0 ]; then
                echo "::error::PHPCS found errors (exit $RC). Warnings are non-blocking and are NOT counted here — this is errors only."
              fi
              exit $RC
              ;;
            phpmd)
              if [ "${{ inputs.enable-phpmd }}" != "true" ]; then
                echo "PHPMD is disabled — skipping."
                exit 0
              fi
              require_script phpmd "the enable-phpmd input"
              composer phpmd
              ;;
            psalm)
              if [ "${{ inputs.enable-psalm }}" != "true" ]; then
                echo "Psalm is disabled — skipping."
                exit 0
              fi
              require_script psalm "the enable-psalm input"
              composer psalm
              ;;
            phpstan)
              if [ "${{ inputs.enable-phpstan }}" != "true" ]; then
                echo "PHPStan is disabled — skipping."
                exit 0
              fi
              require_script phpstan "the enable-phpstan input"
              composer phpstan
              ;;
            phpmetrics)
              if [ "${{ inputs.enable-phpmetrics }}" != "true" ]; then
                echo "phpmetrics is disabled — skipping."
                exit 0
              fi
              require_script phpmetrics "the enable-phpmetrics input"
              composer phpmetrics
              ;;
          esac

      - name: Record result
        if: always()
        run: |
          mkdir -p quality-results
          echo "${{ job.status }}" > quality-results/${{ matrix.tool }}.txt
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-php-quality-${{ matrix.tool }}
          path: quality-results/

  # ── occ app:check-code — private and deprecated Nextcloud API usage ────
  #
  # Nextcloud's own tooling for "is this app using things it should not?".
  # This fleet ran no equivalent. The closest we had was ONE hand-written PHPCS
  # sniff covering ONE symbol (\OC::$server, removed in NC 34) — written by
  # hand precisely because static analysis could not see the removal while
  # nextcloud/ocp was pinned below the declared min-version.
  #
  # app:check-code is the general form of that sniff. It knows the whole private
  # API surface of the server version it ships with, so it needs no per-symbol
  # maintenance and it moves forward when Nextcloud does.
  #
  # WARN, NOT FAIL, and deliberately so. Every app in this fleet reaches into
  # server internals somewhere — OCA\DAV, OC_App, Doctrine\DBAL are all
  # ignored in phpstan-base.neon by name. Turning this red on day one would make
  # it a gate nobody can turn on, which is how the E2E job in openregister ended
  # up never having succeeded. It reports, the findings get worked down, and the
  # `check-code-blocking` input flips it to a hard failure per app when that app
  # is ready.
  app-check-code:
    if: ${{ inputs.enable-php && inputs.enable-check-code }}
    runs-on: ubuntu-latest
    name: "Nextcloud API check (app:check-code)"
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: ${{ inputs.app-name }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}
          extensions: mbstring, intl, zip, gd, curl, xml, json, sqlite3, pdo_sqlite
          coverage: none

      # The server version the app DECLARES it supports, not a hardcoded one.
      # Anchored to the <nextcloud> element: info.xml carries min-version on
      # <php> too, and <php> comes first. Measured across 18 apps, an
      # unanchored pattern returned 8 for thirteen of them and a plausible-but
      # -wrong 28 for a fourteenth.
      - name: Fetch the declared Nextcloud server
        id: server
        run: |
          set -euo pipefail
          NCVERSION=$(grep -oP '<nextcloud[^>]*min-version="\K[0-9]+' "${{ inputs.app-name }}/appinfo/info.xml" | head -1)
          [ -n "${NCVERSION}" ] || { echo "::error::appinfo/info.xml declares no <nextcloud min-version>."; exit 1; }
          echo "Declared min-version: ${NCVERSION}"
          URL=$(curl -sS "https://updates.nextcloud.com/updater_server/latest?channel=stable&version=${NCVERSION}" | jq -r '.downloads.zip[0]')
          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            URL=$(curl -sS "https://updates.nextcloud.com/updater_server/latest?channel=beta&version=${NCVERSION}" | jq -r '.downloads.zip[0]')
          fi
          [ -n "$URL" ] && [ "$URL" != "null" ] || { echo "::error::No Nextcloud download for min-version ${NCVERSION}."; exit 1; }
          curl -sSL "$URL" -o nextcloud.zip
          unzip -q nextcloud.zip
          test -f nextcloud/occ || { echo "::error::The archive has no nextcloud/occ."; exit 1; }

      - name: app:check-code
        id: check
        run: |
          set +e
          cp -r "${{ inputs.app-name }}" "nextcloud/apps/${{ inputs.app-name }}"
          php -d memory_limit=512M nextcloud/occ app:check-code "${{ inputs.app-name }}" > check-code.log 2>&1
          RC=$?
          set -e
          cat check-code.log

          # POSITIVE CONTROL. occ exits 0 on paths that inspect nothing — an app
          # directory it cannot see, a command that bailed on the environment
          # check. A silent exit 0 must not read as "no private API usage".
          if ! grep -qiE 'App is compliant|[0-9]+ error|deprecated|private' check-code.log; then
            echo "::error::app:check-code produced no recognisable verdict (exit ${RC}). It inspected nothing, so private-API usage is UNVERIFIED by this run."
            exit 1
          fi

          if [ "$RC" -ne 0 ]; then
            if [ "${{ inputs.check-code-blocking }}" = "true" ]; then
              echo "::error::app:check-code reported findings and check-code-blocking is on."
              exit "$RC"
            fi
            echo "::warning::app:check-code reported findings. Not blocking yet — set check-code-blocking: true once they are worked down."
          fi
          exit 0

      - name: Record result
        if: always()
        run: |
          mkdir -p quality-results
          echo "${{ job.status }}" > quality-results/app-check-code.txt
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-app-check-code
          path: quality-results/

  # ── REUSE / SPDX compliance ────────────────────────────────────────────
  #
  # Nextcloud runs reuse.yml on every app. We had a PHPCS sniff that checks for
  # @license and @copyright in PHP docblocks, which is a proxy for one file type
  # and says nothing about images, JSON, YAML, or the LICENSES/ directory REUSE
  # requires.
  #
  # It also closes a loop opened by the coding-standard migration: the SPDX
  # `InvalidEndChar` exception in the shared PHPCS ruleset exists because a
  # trailing full stop would turn a machine-parsed SPDX expression into an
  # invalid one. That exception is only worth having if something actually
  # parses those expressions. This is that something.
  #
  # Non-blocking by default for the same reason as app:check-code — 2 of the 4
  # apps sampled ship a REUSE.toml at all.
  reuse:
    if: ${{ inputs.enable-reuse }}
    runs-on: ubuntu-latest
    name: "REUSE compliance"
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: REUSE lint
        id: lint
        continue-on-error: ${{ !inputs.reuse-blocking }}
        uses: fsfe/reuse-action@v5

      - name: Explain a non-blocking failure
        if: steps.lint.outcome == 'failure' && !inputs.reuse-blocking
        run: |
          echo "::warning::REUSE reported findings. Not blocking yet — set reuse-blocking: true once this app ships a REUSE.toml and a LICENSES/ directory."

      - name: Record result
        if: always()
        run: |
          mkdir -p quality-results
          echo "${{ steps.lint.outcome }}" > quality-results/reuse.txt
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-reuse
          path: quality-results/

  # ── appinfo/info.xml, validated against the App Store's own schema ─────
  #
  # Nextcloud ships `lint-info-xml.yml` as a workflow template and every
  # upstream app runs it. This fleet ran no equivalent: `quality.yml` did not
  # reference appinfo/info.xml anywhere, so a malformed manifest was discovered
  # at App Store upload time — after the release had been built, tagged and
  # published to GitHub.
  #
  # That matters more now than it did last week. The release path reads
  # info.xml for two things it cannot get wrong: the version the tag must match,
  # and the Nextcloud version whose `occ` signs the package. A file that does
  # not validate can still parse well enough for a grep to return something
  # plausible — which is exactly how an unanchored min-version pattern resolved
  # `8` from `<php min-version="8.3"/>` in 13 apps.
  #
  # The schema is fetched from nextcloud/appstore rather than vendored, because
  # a vendored copy is a claim about what the App Store accepts that goes stale
  # silently. If the fetch fails the job FAILS — a validator that cannot get its
  # schema has validated nothing, and saying so is the whole point.
  info-xml:
    if: ${{ inputs.enable-php }}
    runs-on: ubuntu-latest
    name: "info.xml lint"
    # 🔑 A JOB CAP MUST BE LARGER THAN ITS OWN STEPS' WORST CASE, OR THE
    # CAREFUL BOUNDED RETRY BELOW CAN NEVER FINISH.
    #
    # This was 10 while `Install xmllint` was written to allow 3 attempts of up
    # to 300s + 300s each — a worst case of ~30 minutes inside a 10-minute job.
    # The retry was therefore killed mid-SECOND attempt every time, and the
    # outcome was `cancelled` (no verdict, neither failed nor passed) rather
    # than the clear "the mirror is unreachable, this is infrastructure" error
    # it was written to produce. Observed 2026-08-19 on hrmq (10m10s) and
    # app-versions (10m18s).
    #
    # The step's attempts are now 120s + 180s, so its worst case is
    # 3 × 300s + 2 × 10s sleep ≈ 15.3 min. 20 leaves headroom for checkout and
    # the validation steps. CHANGE BOTH TOGETHER — the arithmetic is the point.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: appinfo/

      - name: Is there an info.xml to lint?
        id: detect
        run: |
          if [ -f appinfo/info.xml ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No appinfo/info.xml — this repo is not a Nextcloud app."
          fi

      # BOUNDED, AND NOT SILENT. `-qq` on both halves meant a stalled Ubuntu
      # mirror produced ZERO bytes of output for the full step timeout, so the
      # log showed the command and nothing else — measured on decidesk,
      # procest and zaakafhandelapp on 2026-08-18, 10m19s of silence apiece
      # before the runner killed it. There was no way to tell a hung mirror
      # from a hung runner from a package that does not exist.
      #
      # `timeout 300` fails this step in five minutes instead of burning the
      # job's whole budget, and one `q` less lets apt say what it is doing.
      # The retry covers the common case where the mirror is briefly
      # unreachable rather than down.
      - name: Install xmllint
        if: steps.detect.outputs.run == 'true'
        run: |
          set -euo pipefail

          # DON'T REACH FOR apt AT ALL IF THE TOOL IS ALREADY HERE. The runner
          # image ships libxml2-utils, so the overwhelmingly common path needs
          # no package manager — and the stall this step keeps hitting is apt
          # blocking on /var/lib/dpkg/lock-frontend, which it waits on forever
          # by design while printing nothing. The cheapest way not to hang on a
          # lock is not to take it.
          if command -v xmllint > /dev/null 2>&1; then
            echo "xmllint already present: $(xmllint --version 2>&1 | head -1)"
            exit 0
          fi

          # Fallback, bounded so its worst case fits this job's cap:
          # 3 × (120s + 180s) + 2 × 10s ≈ 15.3 min against timeout-minutes: 20.
          for attempt in 1 2 3; do
            if timeout 120 sudo apt-get update -q && timeout 180 sudo apt-get install -y -q libxml2-utils; then
              exit 0
            fi
            echo "::warning::apt attempt ${attempt}/3 failed or timed out; retrying."
            sleep 10
          done
          echo "::error::Could not install libxml2-utils after 3 bounded attempts — the Ubuntu mirror is unreachable or apt is stalled on the dpkg lock. This is infrastructure, not this app's manifest."
          exit 1

      - name: Fetch the App Store schema
        if: steps.detect.outputs.run == 'true'
        run: |
          set -euo pipefail
          curl -sSfL -o info.xsd \
            https://raw.githubusercontent.com/nextcloud/appstore/master/nextcloudappstore/api/v1/release/info.xsd
          # A 200 that returned an error page is not a schema. Assert the shape
          # before trusting a validation result produced with it.
          head -1 info.xsd | grep -q '<?xml' || { echo "::error::The fetched info.xsd is not XML — validating against it would prove nothing."; exit 1; }
          grep -q 'schema' info.xsd || { echo "::error::The fetched info.xsd contains no schema element."; exit 1; }

      - name: Validate appinfo/info.xml
        if: steps.detect.outputs.run == 'true'
        run: |
          set -euo pipefail
          xmllint --noout --schema info.xsd appinfo/info.xml

      # The two values the release path reads out of this file. Validity alone
      # does not mean they are present, and their absence surfaces at release
      # time — long after this PR merged.
      - name: Assert the release-critical fields exist
        if: steps.detect.outputs.run == 'true'
        run: |
          set -euo pipefail
          grep -qoP '<version>[^<]+</version>' appinfo/info.xml \
            || { echo "::error::appinfo/info.xml declares no <version>. The release tag has nothing to match against."; exit 1; }
          grep -qoP '<nextcloud[^>]*min-version="[0-9]+"' appinfo/info.xml \
            || { echo "::error::appinfo/info.xml declares no <nextcloud min-version>. The release cannot resolve which server to sign with."; exit 1; }
          echo "version:     $(grep -oP '(?<=<version>)[^<]+' appinfo/info.xml | head -1)"
          echo "nextcloud:   $(grep -oP '<nextcloud[^>]*' appinfo/info.xml | head -1)"

      - name: Record result
        if: always()
        run: |
          mkdir -p quality-results
          echo "${{ job.status }}" > quality-results/info-xml.txt
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-info-xml
          path: quality-results/

  # ── Group 2: Vue Quality ────────────────────────
  vue-quality:
    if: ${{ inputs.enable-frontend }}
    runs-on: ubuntu-latest
    name: "Vue Quality (${{ matrix.tool }})"
    # Observed across 494 executions: median 0.6 min, p95 1.2 min, max 2.1 min
    # (opencatalogi). 20 min absorbs npm-install contention with ~10x headroom.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.frontend-path }}
    strategy:
      matrix:
        tool: [eslint, stylelint]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "${{ inputs.node-version }}"
          cache: "npm"
          cache-dependency-path: "${{ inputs.frontend-path }}/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Run ${{ matrix.tool }}
        run: |
          case "${{ matrix.tool }}" in
            eslint)
              if [ "${{ inputs.enable-eslint }}" != "true" ]; then
                echo "ESLint is disabled — skipping."
                exit 0
              fi
              npm run lint
              ;;
            stylelint)
              if [ "${{ inputs.enable-stylelint }}" != "true" ]; then
                echo "Stylelint is disabled — skipping."
                exit 0
              fi
              npm run stylelint
              ;;
          esac

      - name: Record result
        if: always()
        run: |
          mkdir -p quality-results
          echo "${{ job.status }}" > quality-results/${{ matrix.tool }}.txt
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-vue-quality-${{ matrix.tool }}
          path: ${{ inputs.frontend-path }}/quality-results/

  # ── Group 2b: Custom frontend checks ───────────
  #
  # Repo-defined npm scripts run as individual matrix legs, e.g.
  #   frontend-checks: '["test", "check:build", "check:docs"]'
  # Each leg gets a fresh checkout + npm ci, so scripts must be
  # self-contained (bundle ordering deps into one script, e.g.
  # "check:build": "npm run build && npm run check:css-entry").
  # The guard below tests the PARSED list, not the raw string, and that is the
  # whole point. It used to read `inputs.frontend-checks != '[]'` — a literal
  # two-character comparison against a value the matrix consumes through
  # `fromJSON`. Guard and matrix therefore disagreed for every other spelling
  # of "empty": `'[ ]'`, `'[\n]'`, `'[""]'` all pass a `!= '[]'` test and then
  # resolve to an empty matrix vector.
  #
  # An empty matrix vector does not skip. MEASURED on run 30898927145 of this
  # repo's self-test with `frontend-checks: '[ ]'`: the job is deleted from the
  # run outright — 19 jobs instead of 21, no "skipping" row, no failure, no
  # annotation anywhere. `report` has `if: always()`, so it still goes green.
  # The gate disappears without leaving a trace, which is strictly worse than
  # the visible "skipping" row a false `if:` produces.
  #
  # Routing both sides through `fromJSON` makes that state unreachable: any
  # spelling of empty now yields a visible skip, and malformed JSON fails the
  # run loudly in the `if:` instead of silently voiding the job.
  frontend-checks:
    if: ${{ inputs.enable-frontend && join(fromJSON(inputs.frontend-checks), ',') != '' }}
    runs-on: ubuntu-latest
    name: "Frontend Check (${{ matrix.script }})"
    # Observed across 102 executions: median 0.6 min, p95 1.4 min, max 2.1 min
    # (nextcloud-vue). These legs include `npm run build`, which has been
    # measured at 211 s under heavy load, so the bound is deliberately loose.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.frontend-path }}
    strategy:
      matrix:
        script: ${{ fromJSON(inputs.frontend-checks) }}
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "${{ inputs.node-version }}"
          cache: "npm"
          cache-dependency-path: "${{ inputs.frontend-path }}/package-lock.json"

      # Caller-supplied values are passed via env and referenced as "$VAR"
      # (never inlined into the script) so special characters cannot break
      # out of the intended shell context.
      - name: Verify script exists in package.json
        env:
          SCRIPT: ${{ matrix.script }}
        run: |
          if ! node -e "const s = require('./package.json').scripts || {}; process.exit(s[process.env.SCRIPT] ? 0 : 1)"; then
            echo "::error::npm script '$SCRIPT' is listed in this repo's frontend-checks input but does not exist in package.json. Add the script (see CONVENTIONS.md § Custom frontend checks in ConductionNL/.github) or remove it from the frontend-checks list in .github/workflows/code-quality.yml."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Extra setup (runs after npm ci, does not replace it)
        if: ${{ inputs.frontend-setup-command != '' }}
        env:
          SETUP_CMD: ${{ inputs.frontend-setup-command }}
        run: bash -c "$SETUP_CMD"

      - name: Run ${{ matrix.script }}
        env:
          SCRIPT: ${{ matrix.script }}
        run: npm run "$SCRIPT"

      - name: Record result
        if: always()
        env:
          SCRIPT: ${{ matrix.script }}
        run: |
          mkdir -p quality-results
          # ':' is invalid in artifact file paths — sanitize the script name
          echo "${{ job.status }}" > "quality-results/$(echo "$SCRIPT" | tr ':/' '--').txt"
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-frontend-check-${{ strategy.job-index }}
          path: ${{ inputs.frontend-path }}/quality-results/

  # Auto-detected frontend BUILD gate.
  #
  # `npm run build` existed in this file in exactly two places — inside the
  # Playwright job and inside the journeydoc capture job — and both are opt-in
  # and default OFF. Only 2 of the 21 repos that call this workflow enable
  # Playwright (doriath, pipelinq) and none enable journeydoc capture, so for
  # the other 19 the frontend was NEVER COMPILED IN CI AT ALL. A repo could
  # ship a bundle that does not build and every gate stayed green, because
  # nothing in the pipeline ever ran webpack.
  #
  # That is not hypothetical: hermiq's build broke when the floating
  # `node-polyfill-webpack-plugin: ^4.0.0` resolved to 4.1.0 and webpack
  # emitted 25 errors. Nine repos still carry an unpinned caret on that same
  # plugin (openbuild, petstore, portaliq, shillinq, nextcloud-app-template at
  # ^4.0.0; decidesk, zaakafhandelapp at ^3.0.0; pipelinq at ^4.1.0), so any
  # lockfile regeneration can reproduce it silently.
  #
  # Like `frontend-tests` below, this job takes no opt-in input: it runs the
  # repo's own `build` script when one exists and BLOCKS on failure. A repo
  # with no package.json or no `build` script skips cleanly, and — unlike
  # `frontend-tests` — it does not even set up Node in that case, so a repo
  # without a lockfile cannot be newly broken by this job.
  #
  # The compiled output is uploaded as an artifact and reused by the Playwright
  # job, which previously ran its own identical `npm run build`. See the
  # "Restore prebuilt app frontend" step there: the reuse is a fast path with a
  # full fallback, never a replacement, so a bad hand-off costs time, not a
  # verdict.
  frontend-build:
    if: ${{ inputs.enable-frontend }}
    runs-on: ubuntu-latest
    name: "Frontend Build"
    # UNMEASURED as a standalone job — it has never existed. The best proxy is
    # the `npm run build` already embedded in other legs: measured at 211 s
    # under heavy load, and the frontend-checks legs that wrap it peak at 2.1
    # min end to end. `npm ci` adds ~1 min cold. 30 min is therefore ~8x the
    # worst observed build and leaves the runner's own contention plenty of
    # room, while still converting a hang into a failure inside half an hour
    # rather than burning six hours on GitHub's default. Deliberately generous:
    # a bound that fires under normal contention produces a CANCELLED job,
    # which returns no verdict at all — strictly worse than no bound.
    timeout-minutes: 30
    outputs:
      # 'true' only when the build actually ran AND produced files. The
      # Playwright job keys its artifact download off this, so "no artifact"
      # and "artifact I should not trust" both resolve to the fallback path.
      built: ${{ steps.package.outputs.uploaded }}
    defaults:
      run:
        working-directory: ${{ inputs.frontend-path }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Runs BEFORE setup-node on purpose. `actions/setup-node` with
      # `cache: npm` hard-fails when no lockfile is found, so detecting first
      # means a repo with no package.json (or no build script) skips this job
      # without ever touching a step that could fail on its behalf.
      - name: Detect a build script
        id: detect
        run: |
          if [ ! -f package.json ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No package.json in '${{ inputs.frontend-path }}' — nothing to build."
            exit 0
          fi
          if [ ! -f package-lock.json ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::warning::package.json present but no package-lock.json — skipping the frontend build (npm ci requires a lockfile)."
            exit 0
          fi
          BUILD_CMD="$(jq -r '.scripts.build // ""' package.json)"
          if [ -z "$BUILD_CMD" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No 'build' script in package.json — nothing to build."
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "Detected 'build' script: $BUILD_CMD"

      - name: Setup Node.js
        if: steps.detect.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "${{ inputs.node-version }}"
          cache: "npm"
          cache-dependency-path: "${{ inputs.frontend-path }}/package-lock.json"

      - name: Install dependencies
        if: steps.detect.outputs.run == 'true'
        run: npm ci

      - name: Extra setup (runs after npm ci, does not replace it)
        if: ${{ steps.detect.outputs.run == 'true' && inputs.frontend-setup-command != '' }}
        env:
          SETUP_CMD: ${{ inputs.frontend-setup-command }}
        run: bash -c "$SETUP_CMD"

      # The marker is dropped AFTER `npm ci` so that only what the build itself
      # writes is captured — install-time churn under node_modules is already
      # older than it.
      - name: Build frontend
        if: steps.detect.outputs.run == 'true'
        run: |
          touch /tmp/frontend-build-marker
          npm run build

      # Collect the build output WITHOUT knowing where it lands. Nextcloud apps
      # emit to `js/`, vite apps to `dist/`, portaliq writes two bundles from a
      # composite script — hardcoding any of those is how the hand-off to
      # Playwright would silently ship an empty bundle. Instead: everything the
      # build step touched, minus node_modules and .git.
      #
      # This matters because a MISSING bundle does not 404. Nextcloud's front
      # controller answers an absent asset with HTTP 200 and an HTML error
      # page, so a status-code probe reads it as success and the only symptom
      # is a selector timeout that names an element. Several repos' ci-seed.sh
      # guards against that by asserting the response is actually JavaScript;
      # this job keeps that guard meaningful by making the reuse path prove it
      # restored real .js files (see the Playwright job) and falling back to a
      # real build when it cannot.
      - name: Package build output
        id: package
        if: steps.detect.outputs.run == 'true'
        run: |
          set -euo pipefail
          find . -type f -newer /tmp/frontend-build-marker \
            -not -path './node_modules/*' \
            -not -path './.git/*' \
            -print0 > /tmp/frontend-build-files.z
          COUNT="$(tr -cd '\0' < /tmp/frontend-build-files.z | wc -c)"
          JS_COUNT="$(tr '\0' '\n' < /tmp/frontend-build-files.z | grep -c '\.js$' || true)"
          echo "Build wrote $COUNT file(s), of which $JS_COUNT are .js"
          if [ "$COUNT" -eq 0 ]; then
            echo "uploaded=false" >> "$GITHUB_OUTPUT"
            echo "::warning::The build produced no files outside node_modules — nothing to hand off. Downstream jobs will build for themselves."
            exit 0
          fi
          tar --null -czf /tmp/frontend-build-output.tar.gz -T /tmp/frontend-build-files.z
          echo "uploaded=true" >> "$GITHUB_OUTPUT"
          # `sed -n '1,40p'`, NOT `head -40`. `head` closes the pipe as soon as
          # it has its 40 lines, `tr` then dies of SIGPIPE, and `set -o pipefail`
          # (three lines up) turns that into a FAILED JOB — for a log-preview
          # line that has no bearing on whether the build worked.
          #
          # It only fires when the producer is still writing when head leaves,
          # i.e. on repos with many build outputs. openregister's build writes
          # fewer than 40 files and passed; nextcloud-vue's dist is thousands of
          # files and failed every run. Reproduced: 200k NUL-separated entries
          # through `tr | head -40` under pipefail exits 141 and the step never
          # reaches the next line. `sed` reads its input to the end, so there is
          # nothing to break.
          tr '\0' '\n' < /tmp/frontend-build-files.z | sed -n '1,40p'
          if [ "$COUNT" -gt 40 ]; then
            echo "… and $((COUNT - 40)) more"
          fi

      - name: Upload build output
        if: steps.package.outputs.uploaded == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-output
          path: /tmp/frontend-build-output.tar.gz
          retention-days: 1

      - name: Record result
        if: always()
        run: |
          mkdir -p quality-results
          if [ "${{ steps.detect.outputs.run }}" != "true" ]; then
            echo "skipped" > quality-results/frontend-build.txt
          else
            echo "${{ job.status }}" > quality-results/frontend-build.txt
          fi

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-frontend-build
          path: ${{ inputs.frontend-path }}/quality-results/

  # Auto-detected JS unit tests.
  #
  # `frontend-checks` above is an opt-in LIST that defaults to "[]", so a repo
  # only runs its JS suite if someone remembered to name the script. Nobody
  # did, so vitest/jest suites had NEVER run in CI.
  #
  # CORRECTION (measured, run 30898711087): the earlier note here said that
  # matrix "resolved empty and reported skipping with the expression
  # unexpanded". That mechanism is wrong, and believing it costs real time —
  # it has since caused at least one repeat misdiagnosis of this job.
  # A literal `${{ matrix.x }}` in a check-list name is the signature of a
  # job whose `if:` was FALSE, and says nothing about whether the matrix
  # would have expanded. Proof from that one run: `PHP Quality
  # (${{ matrix.tool }})`, `License (${{ matrix.ecosystem }})` and `PHPUnit
  # (PHP ${{ matrix.php-version }}, ...)` all rendered unexpanded in exactly
  # the same way — and every one of those matrices is a hard-coded literal
  # list that CANNOT be empty. They were gated off by their `if:`, nothing
  # more. An empty matrix behaves the opposite way: the job vanishes from the
  # run entirely (see the frontend-checks guard above).
  #
  # Real failures sat invisible for months (openbuild carries one;
  # procest's harness is broken outright — `tests/vitest/setup.js` does
  # `import Vue from 'vue'`, which vue@3 does not publish).
  #
  # This job needs no opt-in: it runs the repo's own `test` script when one
  # exists and is not a placeholder, and it BLOCKS on failure. A repo with no
  # test script skips cleanly.
  #
  # Note it invokes `npm run test`, never `npx vitest` — a bare `npx vitest`
  # exits 0 with no output when it finds no matching config, which is how
  # doriath's "passing" unit gate was running nothing at all.
  frontend-tests:
    if: ${{ inputs.enable-frontend }}
    runs-on: ubuntu-latest
    name: "Frontend Tests (unit)"
    # Observed across 232 executions: median 0.6 min, p95 1.5 min, max 2.0 min
    # (openbuild). Unit runs are load-sensitive, so 20 min, not 5.
    timeout-minutes: 20
    # This job was the only frontend job that ignored `frontend-path`: it had
    # no `working-directory` and no `cache-dependency-path`, so on a repo whose
    # frontend lives in a subdirectory it probed the REPO ROOT. Both outcomes
    # are dead gates. MEASURED on run 30898711087 with `frontend-path:
    # ci-selftest`: `setup-node` hard-failed with "Dependencies lock file is
    # not found in /home/runner/work/.github/.github" — a falsely RED gate that
    # blames the app for the workflow's own mislocation. The quieter outcome is
    # worse: where the root does have a package.json, the probe finds no test
    # script there, records "skipped" and goes GREEN while the frontend's real
    # suite never runs — reopening, for subdirectory repos, precisely the hole
    # this job was added to close.
    #
    # No caller sets a non-default `frontend-path` today (org-wide code search,
    # 2026-08-04: the only hit is this file), so this is latent rather than
    # live. It is fixed here because adopting `frontend-path` must not silently
    # switch the unit gate off.
    defaults:
      run:
        working-directory: ${{ inputs.frontend-path }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Detection runs BEFORE setup-node, mirroring frontend-build: setup-node
      # with `cache: npm` hard-fails when it finds no lockfile, so a repo with
      # nothing to test must never reach it.
      - name: Detect a runnable test script
        id: detect
        run: |
          if [ ! -f package.json ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No package.json in '${{ inputs.frontend-path }}' — nothing to test."
            exit 0
          fi
          if [ ! -f package-lock.json ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::warning::package.json present in '${{ inputs.frontend-path }}' but no package-lock.json — skipping unit tests (npm ci requires a lockfile)."
            exit 0
          fi
          # Prefer `test`, fall back to `test:unit` — several repos declare
          # their suite only under the latter (decidesk has 282 passing tests
          # that a `test`-only probe would have skipped entirely).
          #
          # Skip the conventional npm placeholder, which "passes" while
          # running nothing: "Error: no test specified" && exit 1.
          node -e "
            const s = (require('./package.json').scripts) || {};
            const placeholder = v => !v || /no test specified/i.test(v);
            const name = !placeholder(s.test) ? 'test'
                       : !placeholder(s['test:unit']) ? 'test:unit'
                       : '';
            console.log('run=' + (name ? 'true' : 'false'));
            console.log('script=' + name);
          " >> "$GITHUB_OUTPUT"
          node -e "
            const s = (require('./package.json').scripts) || {};
            const placeholder = v => !v || /no test specified/i.test(v);
            const name = !placeholder(s.test) ? 'test'
                       : !placeholder(s['test:unit']) ? 'test:unit'
                       : '';
            console.log(name
              ? 'Detected \'' + name + '\' script: ' + s[name]
              : 'No runnable test script (checked: test, test:unit).');
          "

      - name: Setup Node.js
        if: steps.detect.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "${{ inputs.node-version }}"
          cache: "npm"
          cache-dependency-path: "${{ inputs.frontend-path }}/package-lock.json"

      - name: Install dependencies
        if: steps.detect.outputs.run == 'true'
        run: npm ci

      - name: Run unit tests
        if: steps.detect.outputs.run == 'true'
        env:
          SCRIPT: ${{ steps.detect.outputs.script }}
        run: npm run "$SCRIPT"

      - name: Record result
        if: always()
        run: |
          mkdir -p quality-results
          if [ "${{ steps.detect.outputs.run }}" != "true" ]; then
            echo "skipped" > quality-results/frontend-tests.txt
          else
            echo "${{ job.status }}" > quality-results/frontend-tests.txt
          fi

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-frontend-tests
          path: quality-results/

  # ── Group 3: Security ──────────────────────────
  #
  # ══ THIS JOB NO LONGER GATES THE TEST TIER (#194) ═════════════════════════
  #
  # `phpunit`, `newman`, `playwright` and `journeydoc-capture` each used to
  # carry `&& needs.security.result != 'failure'` in their `if:`. That single
  # clause answered TWO different questions with one conditional:
  #
  #   1. should a security failure block the MERGE?          — yes, and it still does
  #   2. should a security failure DELETE the test evidence? — no, and it did
  #
  # WHAT HAPPENED, 2026-08-06. CVE-2026-67434 was published against
  # `squizlabs/php_codesniffer <3.13.6`. `composer audit` queries the LIVE
  # Packagist advisory feed on every run, so the moment the advisory began
  # being served, `Security (composer)` went red in every repo in the fleet
  # simultaneously — with no commit, no push and no code change anywhere. The
  # clause above then turned PHPUnit, Newman and E2E into `skipped` across 16
  # repositories at once.
  #
  # A SKIPPED JOB RENDERS AS A GREY TICK, NOT A RED X. Dashboards, `gh pr
  # checks` tallies and any count of failures read zero and report success. The
  # runs did not look broken; the tests simply had not run. It fooled a review
  # into filing a "fully green" report over a fleet with no test coverage at
  # all.
  #
  # The coupling was never justified by the risk it managed. The dependency in
  # question is a CODE FORMATTER that never executes in production. There is no
  # reading of "phpcs has a command-injection bug" that implies "we can no
  # longer trust what PHPUnit reports". And the shape inverts the purpose of
  # CI: at the exact moment a security problem appears — when you most want to
  # know whether the code still works — it deleted the evidence that would tell
  # you.
  #
  # WHAT REPLACES IT (option E of #194 — decouple, and render loudly):
  #
  #   * The test jobs no longer read `needs.security.result`. They always run
  #     and always produce a verdict. `needs: [security]` is kept on some of
  #     them for ORDERING only — every one of them carries `!cancelled()`,
  #     which suppresses the implicit `success()` on `needs`.
  #
  #   * Security still blocks the merge, unchanged: this job is in the Quality
  #     Report's `needs:`, and `quality / Quality Report` is a required context
  #     on `main` and `beta` in all 25 fleet repos. NOTHING IS WEAKENED AT THE
  #     MERGE GATE. The cost is a few CI minutes spent on a PR that could not
  #     have merged anyway.
  #
  #   * The Quality Report gained a third gate — "a test-tier job that was
  #     ENABLED but did not run" — so that if any future condition deletes the
  #     test tier again, the report says so in words and fails, instead of
  #     tallying the absence of a verdict as a pass. See that step for detail.
  #
  # ══════════════════════════════════════════════════════════════════════════
  security:
    runs-on: ubuntu-latest
    name: "Security (${{ matrix.ecosystem }})"
    # Observed across 505 executions: median 0.4 min, p95 1.0 min, max 5.7 min
    # (docudesk). Advisory-database fetches can stall, hence 20 min.
    timeout-minutes: 20
    strategy:
      matrix:
        ecosystem: [composer, npm]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        if: matrix.ecosystem == 'composer'
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}
          tools: composer:v2

      # Composer's download cache for the composer leg of this matrix. Only the
      # composer leg has anything to restore, and gating the step keeps the npm
      # leg's log free of a cache entry that would always miss.
      #
      # This job checks out the app at the repository ROOT (no Nextcloud server
      # alongside), so the composer files are keyed by their root paths. Both
      # `composer.lock` and `composer.json` are listed because three fleet repos
      # ship no lockfile; `hashFiles` skips patterns that match nothing.
      - name: Cache Composer downloads
        if: matrix.ecosystem == 'composer' && inputs.enable-php
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: ${{ runner.os }}-composer-files-${{ hashFiles('composer.lock', 'composer.json') }}
          restore-keys: ${{ runner.os }}-composer-files-

      # `enable-npm` must be in this condition, not only in the audit step below.
      # actions/setup-node with `cache: npm` HARD-FAILS when there is no
      # package-lock.json, so on a PHP-only repo (enable-npm: false) this step
      # died before the audit step could report its polite "npm ecosystem is
      # disabled — skipping". The npm leg then failed, and the Quality Report
      # gate failed with it — a permanent red on every repo that legitimately
      # has no package.json. Observed on ConductionNL/hydra 2026-08-04.
      - name: Setup Node.js
        if: matrix.ecosystem == 'npm' && inputs.enable-npm
        uses: actions/setup-node@v4
        with:
          node-version: "${{ inputs.node-version }}"
          cache: "npm"
          cache-dependency-path: "${{ inputs.frontend-path }}/package-lock.json"

      - name: Run ${{ matrix.ecosystem }} audit
        env:
          FRONTEND_PATH: ${{ inputs.frontend-path }}
        run: |
          case "${{ matrix.ecosystem }}" in
            composer)
              if [ "${{ inputs.enable-php }}" != "true" ]; then
                echo "PHP toolchain is disabled — skipping composer audit."
                exit 0
              fi
              composer install --no-progress --prefer-dist --optimize-autoloader
              composer audit --format=plain --abandoned=report
              ;;
            npm)
              if [ "${{ inputs.enable-npm }}" != "true" ]; then
                echo "npm ecosystem is disabled — skipping npm audit."
                exit 0
              fi
              cd "$FRONTEND_PATH"
              npm ci
              # Tolerate an unavailable npm advisory endpoint: npm is retiring
              # the audits/quick endpoint and it intermittently 400s ("audit
              # endpoint returned an error" / "Invalid package tree"). That is an
              # infra outage, not a security finding, and must not hard-fail CI.
              # Real advisories (which print a vuln table, not an endpoint error)
              # still fail the gate.
              out="$(npm audit --audit-level=critical --omit=dev 2>&1)" && rc=0 || rc=$?
              echo "$out"
              if [ "$rc" -ne 0 ] && printf '%s' "$out" | grep -qiE "audit endpoint returned an error|Invalid package tree|ECONNRESET|ETIMEDOUT|ENOTFOUND|being retired|Service Unavailable"; then
                echo "::warning::npm audit skipped — npm advisory endpoint unavailable (external); not a vulnerability."
              elif [ "$rc" -ne 0 ]; then
                exit "$rc"
              fi
              ;;
          esac

      - name: Record result
        if: always()
        run: |
          mkdir -p quality-results
          echo "${{ job.status }}" > quality-results/${{ matrix.ecosystem }}.txt
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-security-${{ matrix.ecosystem }}
          path: quality-results/

  # ── Group 4: License Compliance ─────────────────
  #
  # Checks dependencies against an allowlist of approved SPDX license
  # identifiers. Generates a license report as a workflow artifact for
  # audit/compliance purposes.
  #
  # Configuration (optional files in your app repo root):
  #
  #   .license-allowlist.json
  #   ─────────────────────────────────────────────
  #   A JSON array of approved SPDX license identifiers. If this file is
  #   absent, the built-in default allowlist is used (see step below).
  #   Example:
  #     ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC",
  #      "LGPL-2.1-only", "LGPL-2.1-or-later", "LGPL-3.0-only",
  #      "LGPL-3.0-or-later", "EUPL-1.2", "AGPL-3.0-or-later",
  #      "GPL-2.0-only", "GPL-2.0-or-later", "GPL-3.0-only",
  #      "GPL-3.0-or-later", "MPL-2.0", "Unlicense", "0BSD",
  #      "CC0-1.0", "CC-BY-3.0", "CC-BY-4.0", "PSF-2.0",
  #      "Zlib", "BlueOak-1.0.0", "OSL-3.0"]
  #
  #   .license-overrides.json
  #   ─────────────────────────────────────────────
  #   A JSON object to manually approve specific packages even if their
  #   license is not on the allowlist. Use this for packages where:
  #   - The license is valid but uses a non-standard SPDX string
  #   - Legal has explicitly approved a specific dependency
  #   - The package is dual-licensed and the checker picks the wrong one
  #
  #   Keys are package names (composer: "vendor/package", npm: "package-name").
  #   Values are a justification string: the reason, who approved it, and
  #   when. Write the approver as a RESOLVABLE identity — GitHub handle with
  #   profile link, or the full URL of the reviewing PR — not a bare name:
  #   a name is ambiguous years later; a handle or PR resolves to an account
  #   and a review trail. Use full URLs, not "#123": bare number references
  #   only auto-link inside GitHub issues/PRs, not in a JSON file.
  #   Example:
  #     {
  #       "vendor/some-package": "Dual-licensed MIT/proprietary, we use the MIT terms. Approved 2026-03-14 by @infoconductionnl (https://github.com/infoconductionnl).",
  #       "some-npm-package": "License is 'Artistic-2.0', compatible with EUPL. Approved in https://github.com/ConductionNL/.github/pull/157 by @infoconductionnl."
  #     }
  #
  # How it works:
  #   1. Extracts all dependency licenses from composer or npm
  #   2. For dual-licensed packages ("MIT OR Apache-2.0"), passes if ANY
  #      license in the OR expression is on the allowlist
  #   3. Checks each package against overrides first, then the allowlist
  #   4. Generates a markdown + JSON report uploaded as a workflow artifact
  #   5. Fails the workflow if any dependency has a disallowed license
  # ────────────────────────────────────────────────
  license:
    if: ${{ inputs.enable-license-check }}
    runs-on: ubuntu-latest
    name: "License (${{ matrix.ecosystem }})"
    # Observed across 497 executions: median 0.7 min, p95 1.4 min, max 1.9 min
    # (planix). 20 min covers a slow registry without ever firing on a good run.
    timeout-minutes: 20
    strategy:
      matrix:
        ecosystem: [composer, npm]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        if: matrix.ecosystem == 'composer'
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}
          tools: composer:v2

      # Composer's download cache for the composer leg of this matrix. Only the
      # composer leg has anything to restore, and gating the step keeps the npm
      # leg's log free of a cache entry that would always miss.
      #
      # This job checks out the app at the repository ROOT (no Nextcloud server
      # alongside), so the composer files are keyed by their root paths. Both
      # `composer.lock` and `composer.json` are listed because three fleet repos
      # ship no lockfile; `hashFiles` skips patterns that match nothing.
      - name: Cache Composer downloads
        if: matrix.ecosystem == 'composer' && inputs.enable-php
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: ${{ runner.os }}-composer-files-${{ hashFiles('composer.lock', 'composer.json') }}
          restore-keys: ${{ runner.os }}-composer-files-

      # See the identical note on the security job's Setup Node.js step —
      # `cache: npm` hard-fails without a package-lock.json, so this must also
      # be gated on enable-npm, not only on the matrix leg.
      - name: Setup Node.js
        if: matrix.ecosystem == 'npm' && inputs.enable-npm
        uses: actions/setup-node@v4
        with:
          node-version: "${{ inputs.node-version }}"
          cache: "npm"
          cache-dependency-path: "${{ inputs.frontend-path }}/package-lock.json"

      - name: Install dependencies
        env:
          FRONTEND_PATH: ${{ inputs.frontend-path }}
        run: |
          if [ "${{ matrix.ecosystem }}" = "composer" ]; then
            if [ "${{ inputs.enable-php }}" != "true" ]; then
              echo "PHP toolchain is disabled — skipping composer install."
              exit 0
            fi
            composer install --no-progress --prefer-dist --optimize-autoloader
          else
            if [ "${{ inputs.enable-npm }}" != "true" ]; then
              echo "npm ecosystem is disabled — skipping npm install."
              exit 0
            fi
            cd "$FRONTEND_PATH"
            npm ci
            npm install -g license-checker
          fi

      - name: Check ${{ matrix.ecosystem }} licenses
        env:
          FRONTEND_PATH: ${{ inputs.frontend-path }}
        run: |
          set -euo pipefail

          if [ "${{ matrix.ecosystem }}" = "composer" ] && [ "${{ inputs.enable-php }}" != "true" ]; then
            echo "PHP toolchain is disabled — skipping composer license check."
            exit 0
          fi

          if [ "${{ matrix.ecosystem }}" = "npm" ] && [ "${{ inputs.enable-npm }}" != "true" ]; then
            echo "npm ecosystem is disabled — skipping npm license check."
            exit 0
          fi

          # ── Default allowlist (EUPL-1.2 / AGPL-3.0 compatible) ──
          DEFAULT_ALLOWLIST='[
            "MIT", "ISC", "BSD-2-Clause", "BSD-3-Clause", "0BSD",
            "Apache-2.0",
            "LGPL-2.0-only", "LGPL-2.0-or-later",
            "LGPL-2.1-only", "LGPL-2.1-or-later",
            "LGPL-3.0-only", "LGPL-3.0-or-later",
            "GPL-2.0-only", "GPL-2.0-or-later",
            "GPL-3.0-only", "GPL-3.0-or-later",
            "AGPL-3.0-only", "AGPL-3.0-or-later",
            "EUPL-1.1", "EUPL-1.2",
            "MPL-2.0", "OSL-3.0",
            "Unlicense", "CC0-1.0", "CC-BY-3.0", "CC-BY-4.0",
            "PSF-2.0", "Python-2.0", "Zlib", "BlueOak-1.0.0",
            "Artistic-2.0", "BSL-1.0", "WTFPL",
            "OFL-1.1", "OFL-1.0"
          ]'

          if [ -f .license-allowlist.json ]; then
            ALLOWLIST=$(cat .license-allowlist.json)
            echo "Using project .license-allowlist.json"
          else
            ALLOWLIST="$DEFAULT_ALLOWLIST"
            echo "Using built-in default allowlist"
          fi

          if [ -f .license-overrides.json ]; then
            OVERRIDES=$(cat .license-overrides.json)
            echo "Loaded .license-overrides.json with $(echo "$OVERRIDES" | jq 'length') override(s)"
          else
            OVERRIDES='{}'
          fi

          mkdir -p license-report

          # Helper: check if a license string is allowed.
          #
          # SPDX semantics:
          #   OR  -> at least one branch must be allowed  (you may pick either)
          #   AND -> every term must be allowed           (you must comply with both)
          #
          # The previous version split on " OR " only and returned success on the
          # first allowed part. That made every conjunction a false failure:
          # "MIT AND Zlib" never split, was treated as one unknown token, and was
          # DENIED even though both halves are allowlisted. Repos worked around it
          # with manual override entries (e.g. pako, sha.js) that are no longer
          # needed once AND is evaluated correctly.
          #
          # Nested expressions FAIL CLOSED. Naive string splitting cannot evaluate
          # "(MIT OR Apache-2.0) AND Zlib": splitting on OR first detaches the
          # group, the bare "MIT" branch satisfies it, and the required "Zlib" is
          # never checked — so a DISALLOWED licence would PASS. In a licence gate a
          # false pass is worse than a false failure, so anything with an
          # inner-grouped operator is refused and must be resolved with an
          # explicit, reviewed override entry.
          check_license() {
            local license_str="$1"
            local s
            s=$(echo "$license_str" | sed 's/\*$//')

            # Refuse genuinely nested expressions (a parenthesised group that is
            # not simply the entire string).
            local trimmed
            trimmed=$(echo "$s" | sed 's/^ *//;s/ *$//')
            if echo "$trimmed" | grep -q '('; then
              if ! echo "$trimmed" | grep -qE '^\([^()]*\)$'; then
                echo "::warning::Un-evaluatable SPDX expression '$license_str' — add a reviewed override entry"
                return 1
              fi
            fi
            s=$(echo "$s" | sed 's/[()]//g')

            local IFS
            IFS='|' read -ra OR_BRANCHES <<< "$(echo "$s" | sed 's/ OR /|/g; s/ or /|/g')"
            for branch in "${OR_BRANCHES[@]}"; do
              IFS=$'\x1f' read -ra AND_TERMS <<< "$(echo "$branch" | sed 's/ AND /\x1f/g; s/ and /\x1f/g')"
              local all_allowed=1
              for term in "${AND_TERMS[@]}"; do
                term=$(echo "$term" | sed 's/^ *//;s/ *$//')
                [ -z "$term" ] && continue
                if ! echo "$ALLOWLIST" | jq -e --arg l "$term" 'map(ascii_downcase) | index($l | ascii_downcase)' > /dev/null 2>&1; then
                  all_allowed=0
                  break
                fi
              done
              [ "$all_allowed" = "1" ] && return 0
            done
            return 1
          }

          VIOLATIONS=0
          REPORT_JSON='[]'
          ECOSYSTEM="${{ matrix.ecosystem }}"

          if [ "$ECOSYSTEM" = "composer" ]; then
            echo ""
            echo "=== Checking Composer dependencies ==="
            COMPOSER_JSON=$(composer licenses --format=json 2>/dev/null || echo '{"dependencies":{}}')

            for pkg in $(echo "$COMPOSER_JSON" | jq -r '.dependencies | keys[]' 2>/dev/null); do
              license=$(echo "$COMPOSER_JSON" | jq -r --arg p "$pkg" '.dependencies[$p].license | join(" OR ")')
              version=$(echo "$COMPOSER_JSON" | jq -r --arg p "$pkg" '.dependencies[$p].version')

              override=$(echo "$OVERRIDES" | jq -r --arg p "$pkg" '.[$p] // empty')
              if [ -n "$override" ]; then
                status="approved-override"
                echo "  OVERRIDE: $pkg ($license) — $override"
              elif check_license "$license"; then
                status="approved"
              else
                status="DENIED"
                VIOLATIONS=$((VIOLATIONS + 1))
                echo "::error::Disallowed license: $pkg ($version) uses '$license'"
              fi

              REPORT_JSON=$(echo "$REPORT_JSON" | jq \
                --arg pkg "$pkg" --arg ver "$version" --arg lic "$license" \
                --arg st "$status" --arg ovr "${override:-}" \
                '. + [{"package": $pkg, "version": $ver, "license": $lic, "status": $st, "override": $ovr, "ecosystem": "composer"}]')
            done

          else
            echo ""
            echo "=== Checking npm dependencies ==="
            NPM_JSON=$(license-checker --json --production --start "$FRONTEND_PATH" 2>/dev/null || echo '{}')

            for pkg in $(echo "$NPM_JSON" | jq -r 'keys[]' 2>/dev/null); do
              license=$(echo "$NPM_JSON" | jq -r --arg p "$pkg" '.[$p].licenses // .[$p].license // "UNKNOWN"')
              pkg_name=$(echo "$pkg" | sed 's/@[^@]*$//')
              pkg_version=$(echo "$pkg" | grep -oP '@[^@]+$' | sed 's/^@//')

              override=$(echo "$OVERRIDES" | jq -r --arg p "$pkg_name" '.[$p] // empty')
              if [ -n "$override" ]; then
                status="approved-override"
                echo "  OVERRIDE: $pkg_name ($license) — $override"
              elif check_license "$license"; then
                status="approved"
              else
                status="DENIED"
                VIOLATIONS=$((VIOLATIONS + 1))
                echo "::error::Disallowed license: $pkg_name ($pkg_version) uses '$license'"
              fi

              REPORT_JSON=$(echo "$REPORT_JSON" | jq \
                --arg pkg "$pkg_name" --arg ver "$pkg_version" --arg lic "$license" \
                --arg st "$status" --arg ovr "${override:-}" \
                '. + [{"package": $pkg, "version": $ver, "license": $lic, "status": $st, "override": $ovr, "ecosystem": "npm"}]')
            done
          fi

          TOTAL=$(echo "$REPORT_JSON" | jq 'length')
          APPROVED=$(echo "$REPORT_JSON" | jq '[.[] | select(.status == "approved")] | length')
          OVERRIDDEN=$(echo "$REPORT_JSON" | jq '[.[] | select(.status == "approved-override")] | length')
          DENIED=$(echo "$REPORT_JSON" | jq '[.[] | select(.status == "DENIED")] | length')

          # Save JSON report
          echo "$REPORT_JSON" | jq '.' > license-report/$ECOSYSTEM-licenses.json

          # Generate Markdown report
          {
            echo "# $ECOSYSTEM License Report"
            echo ""
            echo "**Generated:** $(date -u +'%Y-%m-%d %H:%M UTC')"
            echo "**Repository:** ${{ github.repository }}"
            echo "**Ref:** ${{ github.sha }}"
            echo ""
            echo "## Summary"
            echo ""
            echo "| Metric | Count |"
            echo "|--------|-------|"
            echo "| Total dependencies | $TOTAL |"
            echo "| Approved (allowlist) | $APPROVED |"
            echo "| Approved (manual override) | $OVERRIDDEN |"
            echo "| **Denied** | **$DENIED** |"
            echo ""
            echo "## Dependencies"
            echo ""
            echo "| Package | Version | License | Status | Override |"
            echo "|---------|---------|---------|--------|----------|"
          } > license-report/$ECOSYSTEM-licenses.md

          echo "$REPORT_JSON" | jq -r '.[] | "| \(.package) | \(.version) | \(.license) | \(.status) | \(.override) |"' >> license-report/$ECOSYSTEM-licenses.md

          if [ "$DENIED" -gt 0 ]; then
            {
              echo ""
              echo "## Denied Dependencies"
              echo ""
              echo "| Package | License |"
              echo "|---------|---------|"
            } >> license-report/$ECOSYSTEM-licenses.md
            echo "$REPORT_JSON" | jq -r '.[] | select(.status == "DENIED") | "| \(.package) | \(.license) |"' >> license-report/$ECOSYSTEM-licenses.md
            {
              echo ""
              echo "### How to resolve"
              echo ""
              echo "1. Add the license SPDX identifier to \`.license-allowlist.json\` if the license is generally acceptable"
              echo "2. Add the specific package to \`.license-overrides.json\` with a justification if only this package is approved"
              echo ""
              echo "See the workflow comments in quality.yml for configuration details."
            } >> license-report/$ECOSYSTEM-licenses.md
          fi

          echo ""
          echo "════════════════════════════════════════"
          echo "$ECOSYSTEM: $TOTAL total, $APPROVED approved, $OVERRIDDEN overridden, $DENIED denied"
          echo "════════════════════════════════════════"

          if [ "$VIOLATIONS" -gt 0 ]; then
            echo "::error::$VIOLATIONS $ECOSYSTEM dependency license(s) are not on the allowlist. Add them to .license-allowlist.json or .license-overrides.json"
            exit 1
          fi
          echo "All $ECOSYSTEM dependency licenses are compliant."

      - name: Upload license report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: license-report-${{ matrix.ecosystem }}
          path: license-report/
          retention-days: 90

      - name: Record result
        if: always()
        run: |
          mkdir -p quality-results
          echo "${{ job.status }}" > quality-results/${{ matrix.ecosystem }}.txt
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-license-${{ matrix.ecosystem }}
          path: quality-results/

  # ╔══════════════════════════════════════════════╗
  # ║  STAGE 2 — Tests                              ║
  # ║                                               ║
  # ║  • Nextcloud test matrix (derived)            ║
  # ║  • PHPUnit matrix (PHP × Nextcloud versions)  ║
  # ║  • Integration tests (Newman)                 ║
  # ║  • E2E browser tests (Playwright)             ║
  # ║                                               ║
  # ║  Gated on `security` only. PHPUnit and        ║
  # ║  Playwright deliberately do NOT gate on       ║
  # ║  php-quality — a complexity or formatting     ║
  # ║  finding must not silently delete the test    ║
  # ║  signal. Newman still does; see its `if:`.    ║
  # ╚══════════════════════════════════════════════╝

  # WHICH NEXTCLOUD VERSIONS THIS APP IS TESTED ON, AND WHERE THAT COMES FROM.
  #
  # `appinfo/info.xml` is a promise to the App Store: these server majors work.
  # The test matrix is the only thing that can redeem that promise, and for as
  # long as the two were separate hand-maintained lists they disagreed — first
  # in one direction, then, after the migration that "fixed" it, in the other.
  # See the note on the `nextcloud-test-refs` input for the two incidents.
  #
  # This job derives the range from the manifest, so the disagreement has
  # nowhere left to live. Nextcloud's own app CI does the same thing with the
  # same action, which is the point: we may be stricter than Nextcloud, we may
  # not be different from it.
  #
  # THREE OUTPUTS, AND WHY `single-server` IS ONE OF THEM.
  #
  #   branches       the whole set — the PHPUnit matrix dimension.
  #   single-server  THE one server that newman, playwright, journeydoc-capture
  #                  and the coverage guard run against.
  #   source         derived | override | fallback. Printed on every run, so
  #                  "where did this range come from" is never a question you
  #                  have to answer by reading three files.
  #
  # Those four jobs used to read `fromJSON(inputs.nextcloud-test-refs)[0]`, and
  # the fleet's convention of writing the newest version first is what made that
  # correct. The action's `branches` output is OLDEST-FIRST — measured in its
  # source, where `range(min,max)` is reversed for the branched-off check and
  # reversed back again, so `["stable32","stable33","stable34"]` is what comes
  # out. Consuming it positionally would have moved every one of those jobs onto
  # stable32 silently, and stable34 at that position is not incidental: it is
  # what surfaced eight dead NC32/33-only selectors on portaliq. stable34 is the
  # least-exercised version, which is exactly why the single-server jobs belong
  # on it.
  #
  # The fix is NOT to reverse the array. It is to stop reading a meaning off a
  # position: `single-server` is the numerically highest stable branch in the
  # resolved set, computed and printed, and for the derived path it is the
  # action's own `branches-max` output rather than anything this file infers.
  nextcloud-matrix:
    runs-on: ubuntu-latest
    name: "Nextcloud test matrix"
    # No `if:` and no `needs:`. Every consumer below is a different combination
    # of enable-flags, so gating this on any one of them would delete the matrix
    # for the others; and a job with `needs:` but no status function is deletable
    # by its producer (see scripts/assert-no-producer-deletes-a-verdict.py).
    # Observed cost is a checkout of one file plus ~15s of API calls.
    timeout-minutes: 10
    outputs:
      branches: ${{ steps.resolve.outputs.branches }}
      single-server: ${{ steps.resolve.outputs.single-server }}
      source: ${{ steps.resolve.outputs.source }}
    steps:
      - name: Checkout the app manifest
        uses: actions/checkout@v4
        with:
          # Non-cone mode: the pattern is a FILE, and cone mode only accepts
          # directory prefixes — in cone mode `appinfo/info.xml` checks out
          # nothing and the detect step below would report "not a Nextcloud
          # app" for every caller in the fleet.
          sparse-checkout: ${{ inputs.nextcloud-info-path }}
          sparse-checkout-cone-mode: false

      - name: Is there a manifest to derive from?
        id: detect
        env:
          INFO_PATH: ${{ inputs.nextcloud-info-path }}
        run: |
          set -eu
          if [ -f "$INFO_PATH" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Deriving from ${INFO_PATH}:"
            grep -o '<nextcloud[^>]*>' "$INFO_PATH" || \
              echo "::warning::${INFO_PATH} declares no <nextcloud> element — derivation will fail."
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No ${INFO_PATH} — this repo has no app manifest to derive from."
          fi

      # PINNED BY COMMIT SHA, not by tag. `8a7bac6` IS v1.3.2, the newest
      # release; the tag is recorded in the comment so a human can read what the
      # SHA means, and the SHA is what the runner resolves so a moved tag cannot
      # change what executes here. That is a supply-chain decision, not a style
      # one: this workflow is consumed at @main by 23 repositories, so a
      # third-party action running here runs in all of them, unreviewed, at
      # whatever content the tag points to on the day.
      #
      # v1.3.2 is deliberately not the action's tip. The tip carries an
      # unreleased ES-module/node24 rewrite; the tagged release is node20 and
      # `dist/index.js`. We take releases, not commits-since-a-release.
      #
      # Runs even when an override is set, and that is on purpose: the derived
      # value is what the resolve step below compares the override against, so a
      # hand-declared matrix that has drifted away from info.xml is reported in
      # the run rather than only by the static gate.
      - name: Derive the range from the manifest
        id: derive
        if: ${{ steps.detect.outputs.found == 'true' }}
        uses: icewind1991/nextcloud-version-matrix@8a7bac6300b2f0f3100088b297995a229558ddba # v1.3.2
        with:
          filename: ${{ inputs.nextcloud-info-path }}

      # `!cancelled()` because the step above can FAIL — a manifest with no
      # max-version makes the action throw — and this step still has to publish
      # a syntactically valid array. An empty `branches` output is not a
      # skipped PHPUnit job, it is a matrix that cannot be evaluated, and a job
      # deleted at expansion time renders no verdict at all.
      - name: Resolve the matrix
        id: resolve
        if: ${{ !cancelled() }}
        env:
          INFO_PATH: ${{ inputs.nextcloud-info-path }}
          OVERRIDE: ${{ inputs.nextcloud-test-refs }}
          DERIVED: ${{ steps.derive.outputs.branches }}
          DERIVED_MAX: ${{ steps.derive.outputs.branches-max }}
          FOUND: ${{ steps.detect.outputs.found }}
          # The pre-derivation shared default, kept for exactly one case: a repo
          # with no app manifest at all (nextcloud-vue is the live example).
          # It is NOT a soft landing for a failed derivation — that path sets
          # `hard` below and the job goes red.
          FALLBACK: '["stable32", "stable33", "stable34"]'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, sys

          out_path = os.environ["GITHUB_OUTPUT"]
          summary  = os.environ.get("GITHUB_STEP_SUMMARY", os.devnull)
          override = os.environ["OVERRIDE"].strip()
          derived  = os.environ["DERIVED"].strip()
          dmax     = os.environ["DERIVED_MAX"].strip()
          found    = os.environ["FOUND"].strip()
          fallback = os.environ["FALLBACK"].strip()

          hard = []

          def parse(raw, what):
              try:
                  value = json.loads(raw)
              except json.JSONDecodeError as exc:
                  hard.append(f"{what} is not valid JSON ({exc}): {raw!r}")
                  return None
              if not isinstance(value, list) or not value:
                  hard.append(f"{what} is not a non-empty JSON array: {raw!r}")
                  return None
              if not all(isinstance(v, str) and v for v in value):
                  hard.append(f"{what} contains a non-string entry: {value!r}")
                  return None
              return value

          derived_refs = parse(derived, "the derived branch list") if derived else None

          if override:
              refs = parse(override, "nextcloud-test-refs") or parse(fallback, "the fallback range")
              source = "override"
          elif derived_refs is not None:
              refs = derived_refs
              source = "derived"
          else:
              refs = parse(fallback, "the fallback range")
              source = "fallback"
              if found == "true":
                  hard.append(
                      "a manifest was found but no range could be derived from it. "
                      "The matrix below is the SHARED FALLBACK, not this app's "
                      "declared range, so these legs prove nothing about the "
                      "versions appinfo/info.xml promises."
                  )

          refs = refs or json.loads(fallback)

          def stable_no(ref):
              m = re.fullmatch(r"stable(\d+)", ref)
              return int(m.group(1)) if m else None

          if source == "derived" and dmax:
              # The action's OWN maximum, not one inferred from a position in
              # its output. See the block comment above this job.
              single = dmax
          else:
              numbered = [(stable_no(r), r) for r in refs if stable_no(r) is not None]
              single = max(numbered)[1] if numbered else refs[0]

          lines = []
          # An override that disagrees with the manifest is a WARNING here and a
          # FAILURE in gate-65 rule 11. Warning rather than error on purpose:
          # this file is consumed unpinned by 23 repositories, and turning three
          # of them red the moment it merges is a flag day. The gate is where
          # the disagreement is enforced, per app, on that app's own schedule.
          if source == "override" and derived_refs is not None:
              if set(refs) != set(derived_refs):
                  lines.append(
                      f"::warning::nextcloud-test-refs is set to {refs} but "
                      f"{os.environ.get('INFO_PATH', 'appinfo/info.xml')} derives "
                      f"{derived_refs}. The tested range and the declared range "
                      f"disagree; gate-65 rule 11 reports this per app. Remove the "
                      f"override to derive, or correct the manifest."
                  )
              else:
                  lines.append(
                      "The override matches the derived range exactly — it can be "
                      "removed, and the matrix will keep the same shape."
                  )

          for problem in hard:
              lines.append(f"::error::{problem}")

          for line in lines:
              print(line)

          print(f"source        = {source}")
          print(f"branches      = {json.dumps(refs)}")
          print(f"single-server = {single}")

          # WRITTEN BEFORE ANY NON-ZERO EXIT. A failed resolve must still hand
          # downstream a usable array: a job that cannot expand its matrix is
          # DELETED, and a deleted job is not a red one.
          with open(out_path, "a", encoding="utf-8") as fh:
              fh.write(f"branches={json.dumps(refs)}\n")
              fh.write(f"single-server={single}\n")
              fh.write(f"source={source}\n")

          with open(summary, "a", encoding="utf-8") as fh:
              fh.write("### Nextcloud test matrix\n\n")
              fh.write(f"- source: `{source}`\n")
              fh.write(f"- PHPUnit server legs: `{json.dumps(refs)}`\n")
              fh.write(f"- single server (newman / playwright / journeydoc / coverage guard): `{single}`\n")

          sys.exit(1 if hard else 0)
          PY

  phpunit:
    # NOT gated on php-quality — deliberately. `php-quality` is a matrix job, so
    # its result is 'failure' if ANY leg fails, including phpmd (complexity/mess
    # detection) and phpcs (formatting). Neither says anything about whether the
    # test suite passes, but gating on them meant a repo carrying architectural
    # debt got NO test signal at all — and the loss renders in the checks list as
    # a single greyed-out "skipping" placeholder, which reads like a non-event
    # rather than a gate that stopped running.
    #
    # Observed 2026-08-04 on ConductionNL/procest: phpmd was red on 25 complexity
    # findings, so `development` runs had 26 jobs and ZERO PHPUnit legs. Its 1684
    # tests had had no CI signal for as long as phpmd had been red. The contrast
    # is the proof — ConductionNL/decidesk, identical workflow inputs, produced 29
    # jobs with 4 green PHPUnit legs, and the ONLY difference was that decidesk's
    # phpmd was green. Worse, it was green only because a phpmd.baseline.xml was
    # suppressing 73 real findings: whether the test suite ran at all was
    # contingent on a suppression file.
    #
    # NOT gated on security either, as of #194 — and that clause used to be
    # here, justified as "a repo with a known-vulnerable dependency should not
    # spin up servers". The justification did not survive contact with a real
    # advisory. See the block on the `security` job for the full argument and
    # the 2026-08-06 incident; the short version is that `composer audit`
    # queries the LIVE Packagist feed, so an advisory published against any
    # shared dev dependency deleted the entire fleet's test tier at once, with
    # no commit and no red. A skipped job is a grey tick, not a failure.
    #
    # Security still blocks the MERGE: `security` is in the Quality Report's
    # `needs:`, and `quality / Quality Report` is the required context on main
    # and beta in all 25 fleet repos. Decoupling costs a few CI minutes on a PR
    # that cannot merge anyway; it buys a verdict that exists.
    #
    # ── `php-quality` REMOVED from `needs:`; `security` KEPT ────────────────
    #
    # `needs:` in GitHub Actions is a SCHEDULING edge as well as a conditional
    # one. `!cancelled()` suppresses the implicit `success()`, so this job
    # already ran regardless of static-analysis colour — but suppressing the
    # condition does not release the job to START. So PHPUnit sat behind
    # php-quality for a verdict it never consumed.
    #
    # That php-quality is not load-bearing here is not an inference — it is
    # recorded directly above by #194 and by the 2026-08-04 procest incident:
    # gating on it meant a phpmd COMPLEXITY finding deleted the entire test
    # tier, and the loss rendered as a grey "skipping" placeholder. The `if:`
    # clause was removed then; the `needs:` entry was simply left behind, and
    # the comment that survived called it "retained for ordering only".
    # Ordering was the whole cost. Measured on openregister run 31358011759:
    # php-quality 2m, with the 4m test jobs queued behind it.
    #
    # `security` STAYS. It resolves in seconds (9s and 16s for its two legs in
    # the runs measured on this change), so it buys back no meaningful time,
    # and keeping it preserves the conventional ordering with no latency cost.
    # It is still NOT a gate — the `if:` reads no result from it, so the
    # 2026-08-06 advisory shape (one CVE against a dev-only formatter deleting
    # the fleet's test tier) cannot return through this edge.
    #
    # Nothing in this job's steps reads `needs.php-quality.*` or
    # `needs.security.*` — verified across the whole file, where every
    # surviving `needs.` expression belongs to the `report` job or to the
    # Playwright job's frontend-build artifact check.
    if: ${{ inputs.enable-php && inputs.enable-phpunit && !cancelled() }}
    runs-on: ubuntu-latest
    name: "PHPUnit (PHP ${{ matrix.php-version }}, NC ${{ matrix.nextcloud-ref }}, ${{ matrix.database }})"
    # `nextcloud-matrix` is a REAL edge, unlike `security`: this job's matrix
    # dimension and its coverage-guard steps both read that job's outputs.
    # `!cancelled()` in the `if:` above still suppresses the implicit success(),
    # so a failed resolve does not delete these legs — the resolve step publishes
    # a valid array before it exits non-zero, precisely so this stays true.
    needs: [security, nextcloud-matrix]
    # Observed across 337 SUCCESSFUL executions: median 1.7 min, p95 13.6 min,
    # max 18.9 min (shillinq, green). The spread is huge because each leg
    # installs a full Nextcloud server before the suite runs, so a tight bound
    # would newly fail shillinq's already-green runs. 45 min is ~2.4x the worst
    # observed green run and still cuts a hang from 6 hours to 45 minutes.
    timeout-minutes: 45

    # A service whose `image` evaluates to an empty string is not started, which
    # is how one job definition serves several backends. Both are keyed off
    # matrix.database rather than inputs.database so a multi-database matrix
    # starts the right container per leg.
    services:
      postgres:
        image: ${{ matrix.database == 'pgsql' && 'postgres:16' || '' }}
        env:
          POSTGRES_USER: nextcloud
          POSTGRES_PASSWORD: nextcloud
          POSTGRES_DB: nextcloud
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U nextcloud"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      mysql:
        image: ${{ matrix.database == 'mysql' && 'mysql:8.4' || '' }}
        env:
          MYSQL_ROOT_PASSWORD: nextcloud
          MYSQL_USER: nextcloud
          MYSQL_PASSWORD: nextcloud
          MYSQL_DATABASE: nextcloud
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -unextcloud -pnextcloud"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    strategy:
      matrix:
        php-version: ${{ fromJSON(inputs.php-test-versions) }}
        # DERIVED from appinfo/info.xml by the `nextcloud-matrix` job, not read
        # from an input any more. The `needs:` edge below is what makes this
        # expression resolvable; without it the matrix evaluates to nothing and
        # the job is DELETED rather than failed.
        nextcloud-ref: ${{ fromJSON(needs.nextcloud-matrix.outputs.branches) }}
        # An empty database-test-matrix collapses to the single `database`
        # input, which is what every caller uses today — so the matrix keeps
        # exactly its current dimensions until an app opts in. Routed through
        # fromJSON on BOTH sides on purpose: a string comparison against '[]'
        # accepts '[ ]' and '[""]' and then resolves to an empty matrix vector,
        # and an empty vector does not skip a job — it DELETES it from the run,
        # with no row, no annotation and no trace. Measured on this repo's
        # self-test for frontend-checks: 19 jobs instead of 21.
        database: ${{ join(fromJSON(inputs.database-test-matrix), ',') != '' && fromJSON(inputs.database-test-matrix) || fromJSON(format('["{0}"]', inputs.database)) }}
      fail-fast: false

    steps:
      - name: Checkout Nextcloud server
        uses: actions/checkout@v4
        with:
          repository: nextcloud/server
          ref: ${{ matrix.nextcloud-ref }}
          path: server

      - name: Checkout server submodules
        run: |
          cd server
          git submodule update --init 3rdparty

      - name: Checkout app
        uses: actions/checkout@v4
        with:
          path: server/apps/${{ inputs.app-name }}
          # Full history: the coverage ratchet measures the MERGE BASE, and the
          # default depth-1 checkout cannot reach it. Unconditional rather than
          # keyed off enable-coverage-guard, because `inputs.x && 0 || 1` is a
          # trap in GitHub expressions — 0 is falsy, so the `|| 1` branch wins
          # and the depth silently stays 1.
          fetch-depth: 0

      - name: Checkout additional apps
        if: ${{ inputs.additional-apps != '[]' }}
        run: |
          echo '${{ inputs.additional-apps }}' | jq -c '.[]' | while read -r app; do
            repo=$(echo "$app" | jq -r '.repo')
            name=$(echo "$app" | jq -r '.app')
            ref=$(echo "$app" | jq -r '.ref // "main"')
            echo "Checking out $repo ($name) at $ref..."
            git clone --depth 1 --branch "$ref" "https://github.com/$repo.git" "server/apps/$name"
            if [ -f "server/apps/$name/composer.json" ]; then
              echo "Installing composer dependencies for $name..."
              # ⚠️ This install used to end in `2>/dev/null || true` — stderr
              # discarded AND the exit status thrown away. It was the ONLY
              # `composer install` of the 20+ in this workflow to do either,
              # and the `git clone` immediately above it has always failed
              # loudly, so the asymmetry was not a deliberate policy.
              #
              # A sibling app whose dependencies did not install is not a
              # neutral condition. The suite then runs against a HALF-INSTALLED
              # app, and its missing classes surface as failures of the
              # CONSUMING repository — a red cell pointing at the wrong repo.
              #
              # Measured on decidesk#517 (2026-08-17), a diff of exactly one
              # `.ts` file and zero PHP: ALL SIX PHPUnit cells hit a transient
              # HTTP 504 while installing openregister's dependencies, and all
              # six reported this step as SUCCESSFUL. Three then went red with
              # 87 errors — the first being
              #   Class "Twig\Extension\AbstractExtension" not found
              #   in server/apps/openregister/lib/Twig/MappingExtension.php
              # — while three went green. The only difference was WHICH package
              # the 504 happened to remove; the green cells were exactly as
              # half-installed as the red ones.
              #
              # So: keep stderr, and fail the step naming the app and its ref.
              # Retrying is an operator's decision to take knowingly, not a
              # silent default.
              if ! ( cd "server/apps/$name" && composer install --no-progress --prefer-dist --optimize-autoloader --no-dev ); then
                echo "::error::Dependency install FAILED for sibling app '$name' ($repo@$ref). Refusing to continue: the suite would otherwise run against a half-installed app and report its missing classes as this repository's failures."
                exit 1
              fi
            fi
          done

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          # pdo_mysql joins the list unconditionally: setup-php installs
          # extensions per leg, and a leg that does not use MySQL pays only the
          # install cost. Making it conditional would mean a mysql leg silently
          # falling back to the else-branch of the install below and testing
          # sqlite while its name said mysql.
          extensions: mbstring, intl, sqlite3, pgsql, pdo_pgsql, mysqli, pdo_mysql, zip, gd, curl, xml, json
          coverage: xdebug
          tools: composer:v2

      - name: Install Nextcloud
        run: |
          cd server
          DB="${{ matrix.database }}"
          case "$DB" in
            pgsql)
              php occ maintenance:install \
                --database pgsql \
                --database-host 127.0.0.1 \
                --database-port 5432 \
                --database-name nextcloud \
                --database-user nextcloud \
                --database-pass nextcloud \
                --admin-user admin \
                --admin-pass admin
              ;;
            mysql|mariadb)
              php occ maintenance:install \
                --database mysql \
                --database-host 127.0.0.1 \
                --database-port 3306 \
                --database-name nextcloud \
                --database-user nextcloud \
                --database-pass nextcloud \
                --admin-user admin \
                --admin-pass admin
              ;;
            sqlite)
              php occ maintenance:install \
                --database sqlite \
                --admin-user admin \
                --admin-pass admin
              ;;
            *)
              echo "::error::Unknown database '$DB'. Supported: pgsql, mysql, mariadb, sqlite."
              exit 1
              ;;
          esac
          # POSITIVE CONTROL. `maintenance:install` can exit 0 having fallen back
          # to a different backend, and a suite that passes on sqlite while the
          # leg is named mysql is worse than no leg at all. Assert the server is
          # actually on the backend this leg claims.
          ACTUAL=$(php occ config:system:get dbtype)
          EXPECT="$DB"; [ "$DB" = "mariadb" ] && EXPECT="mysql"
          if [ "$ACTUAL" != "$EXPECT" ]; then
            echo "::error::This leg is named '$DB' but the server installed on '$ACTUAL'. The result would describe the wrong backend."
            exit 1
          fi
          echo "Installed on $ACTUAL, as declared."
          # A REQUIRED additional app that does not enable is an ENVIRONMENT
          # failure, and it must not be allowed to resurface as APPLICATION
          # failures. It used to: `|| echo "::warning::…, continuing"` let the
          # run proceed without the dependency, and the consuming app's tests
          # then died on the absent classes.
          #
          # Measured on ConductionNL/hermiq, full-scope run 31490144919, six
          # PHPUnit cells, perfect 6/6 correlation:
          #
          #   enable ok      -> Tests: 1500, Errors: 5, Failures: 1   (x3)
          #   enable FAILED  -> Tests: 1500, Errors: 12               (x3)
          #
          # The seven extra "errors" were `Interface
          # "OCA\OpenRegister\Service\Flow\IFlowNodeLogActions" not found` and
          # `Call to undefined method MockObject_ToolRegistryFacade::
          # describeTools()` — which read as app debt and were an absent app.
          # Two distinct causes, one deterministic (OpenRegister declares
          # min-version="32"; the cell was stable31) and one transient
          # (`curl error 60 … self-signed certificate` during composer install
          # left Twig missing, so enabling crashed). Both deserve a red job:
          # the first is a real configuration error, the second is re-runnable.
          #
          # ⚠️ The failure flag goes through a FILE, not a variable. The loop
          # body runs in a subshell (it is fed by a pipeline), so a variable set
          # inside it is invisible after `done` — the same trap the gate runner
          # documents at its gate-30 loop.
          if [ '${{ inputs.additional-apps }}' != '[]' ]; then
            rm -f "${RUNNER_TEMP:-/tmp}/additional-app-enable-failed"
            echo '${{ inputs.additional-apps }}' | jq -r '.[].app' | while read -r name; do
              echo "Enabling app: $name"
              if ! php occ app:enable "$name"; then
                echo "::error::Failed to enable required additional app '$name'. This is an ENVIRONMENT failure, not an application failure — the run cannot measure this repository without it. Common causes: the app declares a min-version above the Nextcloud ref this cell tests, or its composer install did not complete."
                echo "$name" >> "${RUNNER_TEMP:-/tmp}/additional-app-enable-failed"
              fi
            done
            if [ -s "${RUNNER_TEMP:-/tmp}/additional-app-enable-failed" ]; then
              echo "::error::Aborting: $(tr '\n' ' ' < "${RUNNER_TEMP:-/tmp}/additional-app-enable-failed")could not be enabled."
              exit 1
            fi
          fi
          chmod -R a+w config

      # Install the app's own dependencies BEFORE enabling it. Enabling triggers
      # install-scope repair steps that autowire services with eager constructors
      # (e.g. SaveObject does `new Twig\Environment(...)`); without vendor present
      # that fatals with an uncaught \Error (NC core only catches \Exception),
      # killing the step. Matches the newman/playwright/journeydoc jobs, which
      # already composer-install before enabling the app.
      # Composer's download cache. Same reasoning as the newman / playwright /
      # journeydoc jobs — see the long note there. The PHP version is in the key
      # because this job is a matrix over `php-version` and composer resolves
      # platform-dependent packages differently per version; sharing one cache
      # entry across the legs would make the restored archives depend on
      # whichever leg happened to save first.
      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: ${{ runner.os }}-composer-files-php${{ matrix.php-version }}-${{ hashFiles(format('server/apps/{0}/composer.lock', inputs.app-name), format('server/apps/{0}/composer.json', inputs.app-name)) }}
          restore-keys: |
            ${{ runner.os }}-composer-files-php${{ matrix.php-version }}-
            ${{ runner.os }}-composer-files-

      - name: Install app dependencies and enable app
        run: |
          cd server/apps/${{ inputs.app-name }}
          composer install --no-progress --prefer-dist --optimize-autoloader
          cd ../../
          php occ app:enable ${{ inputs.app-name }}

      - name: Validate test infrastructure
        run: |
          cd server/apps/${{ inputs.app-name }}
          if [ ! -f phpunit.xml ] && [ ! -f phpunit-unit.xml ]; then
            echo "::error::PHPUnit is enabled but no phpunit.xml or phpunit-unit.xml found."
            exit 1
          fi
          if [ ! -d tests/Unit ] && [ ! -d tests/unit ] && [ ! -d tests/Service ] && [ ! -d tests/Integration ] && [ ! -d tests/integration ]; then
            echo "::error::PHPUnit is enabled but no test directories found."
            exit 1
          fi
          echo "PHPUnit infrastructure validated."

      - name: Run PHPUnit tests
        run: |
          cd server/apps/${{ inputs.app-name }}
          ./vendor/bin/phpunit \
            -c phpunit.xml \
            --colors=always \
            --coverage-clover=coverage/clover.xml

      # ── The ratchet's floor is MEASURED, not typed ────────────────────────
      #
      # `.coverage-baseline` was read two ways at once: this job failed when
      # coverage was BELOW it, and the push-side job failed when the file was
      # STALE — i.e. when coverage was ABOVE it. Together those demand exact
      # equality with a checked-in constant, and against a base branch that
      # moves that is not satisfiable. To clear "stale" an author must commit
      # the value the tree will measure AFTER landing, but their own diff moves
      # that value and other pull requests land in between.
      #
      # Measured on openregister: an author committed 58.93, `development`
      # advanced 16030 -> 16038 tests while the PR sat, the merge result
      # measured 58.88, and the guard reported "dropped by 0.05%". While the
      # follow-up pinned 58.88, development moved two further commits. There was
      # no value that author could have committed that was correct on arrival.
      #
      # So the floor stops being a number a human types. On a pull request the
      # MERGE BASE is measured here — same PHP, same xdebug driver, same suite,
      # same job — and that measurement is the floor. The merge base is
      # immutable for a given head, so it cannot go stale; a rebase re-measures
      # both sides together; and because both numbers come from one driver, the
      # xdebug/pcov statement-counting difference that can invalidate a locally
      # measured constant cancels instead of being baked in.
      #
      # The measurement itself is deterministic, which is what makes an exact
      # comparison honest rather than flaky. Verified on decidesk: two
      # independent runs of the SAME commit (f4ed5611, runs 31050137982 and
      # 31050142139) both reported 8687/15065 statements, and again at 3731e11f.
      # Where the number does move between runs it is because the CODE moved —
      # openbuild reads 8018/13971 across eight consecutive commits, then
      # 8034/13988, then 8229/13987 once a 349-line test file was added.
      #
      # The test RESULT at the merge base is deliberately discarded (`|| true`):
      # we are measuring the base, not judging it, and a base whose suite is red
      # must not turn every open pull request red. The clover file is NOT
      # optional — a missing or zero-statement report is a hard error in both
      # this step and the guard, because a base measured as 0% would set the
      # floor to zero and pass every possible drop.
      #
      # ── THE MERGE BASE IS DERIVED, NOT READ OUT OF THE EVENT PAYLOAD ──────
      #
      # This step used to compute `git merge-base "$BASE_SHA" "$HEAD_SHA"` with
      # BASE_SHA taken from `github.event.pull_request.base.sha`. Both halves of
      # that expression are wrong, and they hid each other:
      #
      #  1. `pull_request.base.sha` is the base branch tip SNAPSHOTTED when the
      #     pull request was opened. GitHub does not refresh it as the base
      #     branch advances. Measured on zaakafhandelapp#247 ("Release: merge
      #     development into beta"), opened 2026-05-23: `base.sha` still reads
      #     b233af99 — beta's tip on that day — although beta moved to a92d8707
      #     on 2026-06-25. Nearly three months of drift, on a PR that is
      #     re-run nightly.
      #
      #  2. On a `pull_request` event actions/checkout leaves `refs/pull/N/merge`
      #     at HEAD, and that merge commit ALREADY CONTAINS the base branch. So
      #     `git merge-base <any base commit> <merge ref>` returns that base
      #     commit unchanged — the call was a no-op that laundered a stale sha
      #     into something that reads like a computed merge base. The step's own
      #     comment claims "the merge base is immutable for a given head, so it
      #     cannot go stale"; the value it actually used was neither.
      #
      # The consequence is not cosmetic. On zaakafhandelapp the "merge base"
      # resolved to a commit that predates this repository committing a
      # composer.lock AND predates phpunit/phpunit being a dependency at all, so
      # `composer install` resolved to latest, produced a 64-package set with no
      # test runner in it, and the step died on
      # `./vendor/bin/phpunit: No such file or directory` — reported as
      # "Could not measure coverage at merge base", which reads like an
      # unreachable object and is not. The suite itself was GREEN in the same
      # job: `OK (268 tests, 825 assertions)`.
      #
      # The merge ref's parents are the authoritative answer and cost nothing:
      # parent 1 is the CURRENT base tip, parent 2 is the pull request head. We
      # only trust them when parent 2 actually IS `pull_request.head.sha`, so a
      # checkout of a PR head that happens to be a merge commit cannot be
      # mistaken for the merge ref. Verified against the real refs of
      # zaakafhandelapp#247 (merge ref cb1439f3):
      #   old logic -> b233af99  (no phpunit at that commit -> hard failure)
      #   new logic -> 27027b32  (merge-base of a92d8707 and 986730b8)
      - name: Measure merge-base coverage
        if: ${{ inputs.enable-coverage-guard && github.event_name == 'pull_request' && matrix.php-version == inputs.php-version && matrix.nextcloud-ref == needs.nextcloud-matrix.outputs.single-server }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          cd "server/apps/${{ inputs.app-name }}"

          # A RELEASE PROMOTION HAS NO RATCHET TO RUN, AND ITS BASE CANNOT BOOT.
          #
          # This step runs the BASE's test suite inside the HEAD's environment.
          # `server/` is checked out once, at
          # `needs.nextcloud-matrix.outputs.single-server` (the numerically
          # highest stable branch), and is never moved when the app is rewound
          # to the merge base. For a feature branch that is harmless: the merge
          # base is days old, and base and head agree about which Nextcloud
          # they are written against. For a `development -> beta` promotion the
          # merge base is the PREVIOUS RELEASE POINT, a whole cycle behind, and
          # that span routinely contains a Nextcloud major adoption. The base
          # then fatals at LOAD time, produces no clover at all, and the guard
          # below refuses — correctly on its own terms, but naming no remedy
          # the author can take, because a merge base is immutable history.
          #
          # Observed 2026-08-18 on ConductionNL/openconnector#1094
          # (`development -> beta`, 1752 files, run 32111820806). Merge base
          # 071eb50e (2026-07-09) still carried the pre-NC34 stub
          # `tests/stubs/OC/Hooks/Emitter.php`, and the base suite died in 1.8s:
          #
          #   PHP Fatal error: Declaration of OC\Files\Node\LazyFolder::listen(
          #   $scope, $method, callable $callback) must be compatible with
          #   OC\Hooks\Emitter::listen(string $scope, string $method,
          #   callable $callback): void
          #
          # That stub was made untyped in openconnector#1229 on 2026-08-12 —
          # INSIDE the promotion diff. The sibling branch's remedy ("merge the
          # current base branch into this pull request") was checked and does
          # not work either: `beta`'s own tip 01a15d4f carries the same typed
          # stub, so merging it moves the merge base to a commit that fatals
          # identically. Every run of #1094 from 2026-08-16 on was red on this
          # step alone — the suite itself passed with
          # `Tests: 2359, Assertions: 8341` and the head clover measured 62.05%
          # against a committed floor of 60.65%.
          #
          # THIS IS NOT A COVERAGE FLOOR GOING UNCHECKED. `Guard coverage
          # baseline` below falls back to the committed `.coverage-baseline` on
          # exactly this condition, so an absolute floor is still enforced and
          # the log says in words which check ran. What is skipped is the
          # RATCHET, and on a promotion it has nothing to catch: every commit in
          # the diff already faced the ratchet on its own pull request into
          # `development`.
          #
          # SCOPED BY THE HEAD REF, NEVER BY THE BASE REF. Nine of the eighteen
          # fleet repositories have `main` as their GitHub default branch, so
          # exempting "pull requests targeting main" would silently disarm the
          # ratchet for half the fleet's ordinary feature work. `development`
          # and `beta` are protected long-lived integration branches and no
          # feature branch is named either, so a pull request whose HEAD is one
          # of them is a promotion by construction.
          case "$PR_HEAD_REF" in
            development|beta)
              echo "::notice::Release promotion ($PR_HEAD_REF -> $BASE_REF): skipping the merge-base coverage ratchet. Its merge base is the previous release point and cannot be booted in this job's Nextcloud environment, and every commit in the diff already passed the ratchet on its own pull request into $PR_HEAD_REF. The committed .coverage-baseline floor is still enforced by the next step."
              exit 0
              ;;
          esac

          HEAD_SHA="$(git rev-parse HEAD)"

          SECOND_PARENT="$(git rev-parse --verify --quiet "${HEAD_SHA}^2" || true)"
          if [ "$HEAD_SHA" != "$PR_HEAD_SHA" ] && [ "$SECOND_PARENT" = "$PR_HEAD_SHA" ]; then
            BASE_TIP="$(git rev-parse "${HEAD_SHA}^1")"
            MERGE_BASE="$(git merge-base "$BASE_TIP" "$PR_HEAD_SHA")"
            echo "resolved via the merge ref: base-tip=$BASE_TIP pr-head=$PR_HEAD_SHA"
          elif git rev-parse --verify --quiet "refs/remotes/origin/$BASE_REF" >/dev/null; then
            BASE_TIP="$(git rev-parse "refs/remotes/origin/$BASE_REF")"
            MERGE_BASE="$(git merge-base "$BASE_TIP" "$HEAD_SHA")"
            echo "resolved via origin/$BASE_REF: base-tip=$BASE_TIP"
          else
            MERGE_BASE="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
            echo "::warning::Neither the merge ref nor origin/$BASE_REF was available; falling back to the event payload's base.sha=$BASE_SHA, which is the base tip as of PR creation and may be stale."
          fi
          echo "head=$HEAD_SHA merge-base=$MERGE_BASE"

          cp coverage/clover.xml "$RUNNER_TEMP/head-clover.xml"
          git checkout --force --detach "$MERGE_BASE"
          composer install --no-progress --prefer-dist --optimize-autoloader
          # Recorded WHILE the base is checked out — after the checkout back to
          # HEAD the evidence is gone, and "no clover file" would otherwise be
          # reported with a cause the log does not support.
          BASE_HAS_RUNNER=yes
          [ -x ./vendor/bin/phpunit ] || BASE_HAS_RUNNER=no
          ./vendor/bin/phpunit -c phpunit.xml --coverage-clover="$RUNNER_TEMP/base-clover.xml" || true
          git checkout --force --detach "$HEAD_SHA"
          composer install --no-progress --prefer-dist --optimize-autoloader
          cp "$RUNNER_TEMP/head-clover.xml" coverage/clover.xml

          # THE REMEDY AN ERROR NAMES HAS TO EXIST — the two ways this can fail
          # have different remedies, and the old single message named neither.
          if [ ! -s "$RUNNER_TEMP/base-clover.xml" ]; then
            if [ "$BASE_HAS_RUNNER" = "no" ]; then
              echo "::error::Merge base $MERGE_BASE has no ./vendor/bin/phpunit after composer install — that commit predates this repository's PHPUnit setup, so there is no coverage floor to measure against. Merge the current base branch ($BASE_REF) into this pull request, or rebase it onto a base that carries the test suite. Refusing to report a ratchet that did not run."
            else
              echo "::error::PHPUnit is present at merge base $MERGE_BASE but produced no clover report there — the base suite could not run at all (check the PHPUnit output above this line). Refusing to report a ratchet that did not run."
            fi
            exit 1
          fi

      # The capability probe is deliberately a HARD failure, not a fallback.
      # An older copy of scripts/coverage-guard.php accepts `--against` and
      # silently ignores it, which would quietly demote the ratchet back to the
      # committed-constant check while still reporting success — a check that
      # did not run looking exactly like one that passed. Every repository that
      # sets enable-coverage-guard was updated before this workflow changed, so
      # this should never fire; if it does, the repository is the thing to fix.
      - name: Guard coverage baseline
        if: inputs.enable-coverage-guard && matrix.php-version == inputs.php-version && matrix.nextcloud-ref == needs.nextcloud-matrix.outputs.single-server
        env:
          # Through `env:`, never interpolated into the script body. A branch
          # name is attacker-controlled text and git permits a double quote in
          # one, so `case "${{ ... }}" in` would be a script-injection site.
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          cd "server/apps/${{ inputs.app-name }}"
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            php scripts/coverage-guard.php coverage/clover.xml
            exit 0
          fi
          # THE REMEDY AN ERROR NAMES HAS TO EXIST.
          #
          # This message used to say "Update it from ConductionNL/.github",
          # and there was no coverage-guard.php anywhere in that repository —
          # a recursive tree search returned nothing. An author following the
          # instruction exactly could not comply, and the only way to find the
          # right file was to notice that eighteen unrelated app repos happen
          # to agree on one. That is the unclosable-gate shape gate-59 exists
          # to forbid, in an error message rather than in a finding.
          #
          # The canonical copy now lives at quality-config/coverage-guard.php
          # in this repository, so the path below resolves.
          php scripts/coverage-guard.php --capabilities 2>/dev/null | grep -qx against \
            || { echo "::error::scripts/coverage-guard.php predates merge-base comparison (it does not report the 'against' capability). Copy the canonical version from ConductionNL/.github at quality-config/coverage-guard.php into scripts/coverage-guard.php, or set enable-coverage-guard: false until you do."; exit 1; }
          # Scope the ratchet to the PHP this change actually touches.
          #
          # The whole-project comparison fired on measurement noise. doriath#240
          # was a pull request whose entire diff was `webpack.config.js` — no PHP
          # at all — and it went red:
          #
          #     Coverage current:       60.50%  (8303/13723 statements)
          #     Coverage merge base:    60.55%  (8309/13723 statements)
          #     FAIL: coverage dropped by 0.05% against the merge base.
          #
          # Identical denominator, and both runs reported exactly
          # `Tests: 948, Assertions: 3051, Skipped: 1`. Only which six statements
          # xdebug recorded as covered moved between two runs of the same code.
          # The measured `--against` floor removes DRIVER variance, as its header
          # says; it does not remove RUN-TO-RUN variance, and the guard has no
          # tolerance. A gate that can fail a diff containing none of the language
          # it measures gets routinely overridden, and after that its silences
          # stop meaning anything either.
          #
          # A tolerance band was the alternative and is worse: it blinds the gate
          # to small real regressions forever, at a threshold nobody can defend.
          # Scoping keeps full strength on changed code and makes the noise
          # unreachable rather than forgiven.
          #
          # PROBED, not assumed. A copy predating the flag would accept
          # `--changed-files` and ignore it, silently restoring whole-project
          # comparison while still reporting success — the same silent-downgrade
          # shape the `against` probe above exists to prevent. Older copies keep
          # the previous behaviour instead of erroring, because unlike `against`
          # this is a narrowing of an existing check, not the difference between
          # a check running and not running.
          # THE PROMOTION EXEMPTION, ENFORCED HERE TOO — and nowhere wider.
          #
          # `Measure merge-base coverage` exits 0 without writing
          # base-clover.xml for a `development`/`beta` head ref; its comment
          # carries the evidence. Falling back on the mere ABSENCE of that file
          # would be the wrong test: absence is also what a future bug in that
          # step would look like, and this branch would then quietly demote the
          # ratchet to the constant floor while still reporting success — the
          # silent-downgrade shape the `against` probe above exists to prevent.
          # So the fallback is gated on the SAME head-ref condition, and any
          # other route to a missing base clover stays a hard failure.
          case "${PR_HEAD_REF:-}" in
            development|beta)
              echo "::notice::Release promotion: the merge-base ratchet did not run (see the previous step). Enforcing the committed .coverage-baseline floor instead."
              php scripts/coverage-guard.php coverage/clover.xml
              exit 0
              ;;
          esac
          if [ ! -s "$RUNNER_TEMP/base-clover.xml" ]; then
            echo "::error::No merge-base clover report, and this is not a release promotion — 'Measure merge-base coverage' should have failed before this step was reached. Refusing to report a ratchet that did not run."
            exit 1
          fi

          if php scripts/coverage-guard.php --capabilities 2>/dev/null | grep -qx changed-files; then
            MERGE_BASE="$(git merge-base "${{ github.event.pull_request.base.sha }}" HEAD)"
            # `|| true`: an empty diff is a legitimate answer (docs-only, or a
            # merge commit), and the guard treats an empty list as "no PHP
            # changed, nothing to compare" rather than as zero coverage.
            git diff --name-only "$MERGE_BASE" HEAD -- '*.php' > "$RUNNER_TEMP/changed-php.txt" || true
            echo "Changed PHP files in this PR: $(wc -l < "$RUNNER_TEMP/changed-php.txt")"

            # ── DELETIONS ARE NOT COVERAGE REGRESSIONS ────────────────────────
            #
            # The scoping above removed the noise; it did not remove the
            # ARITHMETIC. `cgRatioDropped()` is one integer cross-product with no
            # tolerance, and read plainly it demands that the code you touched be
            # at least as well covered as the code you did not. For additions that
            # is exactly right. For deletions it inverts: removing `d` statements
            # of which `c` were covered lowers the ratio whenever the deleted code
            # was better tested than what remains — and DEAD CODE IS DEAD BECAUSE
            # NOTHING CALLS IT, NOT BECAUSE NOTHING TESTED IT. gate-57
            # (orphaned-write-capability) exists to find precisely that code, so
            # the two are in arithmetic opposition, not tension. Such a pull
            # request cannot satisfy the ratchet from inside its own subject: the
            # only moves are delete less, add filler, or delete additional
            # *uncovered* statements until it balances. Measured on
            # opencatalogi#895 (-0.62% scoped) and launchpad#128 (-0.32% scoped),
            # both of which deleted dead code and neither of which could comply.
            #
            # `--deletion-neutral` compares METHOD BUCKETS asymmetrically:
            # base-only methods leave the base side, head-only methods stay on the
            # head side. A pure deletion becomes exactly neutral; a regression in
            # surviving code and new untested code both still fail. The symmetric
            # version of that rule is the obvious one and it is broken — it also
            # drops head-only statements, so forty new statements with none
            # covered pass. quality-config/tests/test-coverage-guard.py asserts all
            # four cases and kills a mutant that reintroduces the symmetric rule.
            #
            # PROBED, not assumed, for the same reason as the flag above: a copy
            # predating this flag would accept it and ignore it, silently
            # restoring the deletion penalty while reporting success. Older copies
            # keep today's behaviour rather than erroring — this narrows an
            # existing check, it is not the difference between a check running and
            # not running.
            CG_MODE=()
            if php scripts/coverage-guard.php --capabilities 2>/dev/null | grep -qx deletion-neutral; then
              CG_MODE+=(--deletion-neutral)
            else
              echo "::notice::scripts/coverage-guard.php predates --deletion-neutral, so deleting well-tested dead code will still read as a coverage drop. Copy the canonical version from ConductionNL/.github at quality-config/coverage-guard.php to pick it up."
            fi

            php scripts/coverage-guard.php coverage/clover.xml \
              --against="$RUNNER_TEMP/base-clover.xml" \
              --changed-files="$RUNNER_TEMP/changed-php.txt" \
              "${CG_MODE[@]}"
          else
            php scripts/coverage-guard.php coverage/clover.xml --against="$RUNNER_TEMP/base-clover.xml"
          fi

      - name: Upload coverage artifact
        if: always() && matrix.php-version == inputs.php-version && matrix.nextcloud-ref == needs.nextcloud-matrix.outputs.single-server
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: server/apps/${{ inputs.app-name }}/coverage/
          retention-days: 14
          if-no-files-found: ignore

  newman:
    # NOT gated on php-quality — deliberately, and for exactly the reason the
    # `phpunit` job above already records. `php-quality` is a MATRIX job, so its
    # result is 'failure' if ANY leg fails, including phpmd (complexity/mess
    # detection) and phpcs (formatting). Neither says anything about whether the
    # app's HTTP API answers correctly, but gating on them meant a repo carrying
    # architectural debt got NO integration signal at all — and the loss renders
    # in the checks list as a single greyed-out "skipping" placeholder, which
    # reads like a non-event rather than a gate that stopped running.
    #
    # Observed 2026-08-05 on ConductionNL/doriath, run 31008292790 on
    # `development`: `PHP Quality (phpmd)` was the ONLY red leg — phpcs, psalm,
    # phpstan, phpmetrics and lint were all green, both Security legs were
    # green, and E2E (Playwright) passed. doriath sets `enable-newman: true` and
    # ships 2 Postman collections. Its Integration Tests job still reported
    # `skipped`. A complexity finding had silently deleted the integration
    # tests, and nothing in the run said so.
    #
    # This is the same defect the phpunit job was fixed for; newman was simply
    # left behind. playwright already declines to gate on php-quality too, so
    # this brings the last server-spinning job into line with the other two.
    #
    # The security gate is NOT kept, as of #194 — it was removed from phpunit,
    # playwright and journeydoc-capture at the same time, for the same reason.
    # See the `security` job for the argument and the 2026-08-06 incident.
    # Short version: the clause below used to read `&& needs.security.result !=
    # 'failure'`, and one advisory against one shared DEV dependency turned
    # this job into `skipped` in every repo at once. That is the identical
    # defect this comment block already describes for php-quality, arriving
    # through a second door.
    #
    # `needs:` is retained for ordering only; with `!cancelled()` and no result
    # condition on either producer, Newman now runs regardless of
    # static-analysis colour, regardless of the advisory feed, and reaches its
    # own verdict.
    #
    # `php-quality` REMOVED from `needs:`, `security` KEPT — see the full note
    # on the phpunit job. The php-quality edge gated nothing (this job's `if:`
    # reads no result from it) and only delayed the start; security resolves in
    # seconds, so keeping it costs no measurable time. No step here reads
    # `needs.*`.
    if: ${{ inputs.enable-newman && !cancelled() }}
    runs-on: ubuntu-latest
    name: "Integration Tests (Newman)"
    # `nextcloud-matrix` supplies the server this job checks out. Real edge.
    needs: [security, nextcloud-matrix]
    # Observed across 39 executions: median 1.9 min, max 7.5 min (launchpad).
    # Also installs a full Nextcloud server first, so 30 min — 4x the worst run.
    timeout-minutes: 30

    services:
      postgres:
        image: ${{ inputs.database == 'pgsql' && 'postgres:16' || '' }}
        env:
          POSTGRES_USER: nextcloud
          POSTGRES_PASSWORD: nextcloud
          POSTGRES_DB: nextcloud
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U nextcloud"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout Nextcloud server
        uses: actions/checkout@v4
        with:
          repository: nextcloud/server
          # THE single server for this job — the numerically highest stable
          # branch in the resolved set, published by the `nextcloud-matrix` job.
          # It used to be entry [0] of a hand-written array, and the action this
          # now derives from returns its branches OLDEST-FIRST, so reading a
          # position would silently have moved this job onto the oldest
          # supported server. See the comment on `nextcloud-matrix`.
          ref: ${{ needs.nextcloud-matrix.outputs.single-server }}
          path: server

      - name: Checkout server submodules
        run: |
          cd server
          git submodule update --init 3rdparty

      - name: Checkout app
        uses: actions/checkout@v4
        with:
          path: server/apps/${{ inputs.app-name }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}
          extensions: mbstring, intl, sqlite3, pgsql, pdo_pgsql, zip, gd, curl, xml, json
          tools: composer:v2

      - name: Checkout additional apps
        if: ${{ inputs.additional-apps != '[]' }}
        run: |
          echo '${{ inputs.additional-apps }}' | jq -c '.[]' | while read -r app; do
            repo=$(echo "$app" | jq -r '.repo')
            name=$(echo "$app" | jq -r '.app')
            ref=$(echo "$app" | jq -r '.ref // "main"')
            echo "Checking out $repo ($name) at $ref..."
            git clone --depth 1 --branch "$ref" "https://github.com/$repo.git" "server/apps/$name"
            if [ -f "server/apps/$name/composer.json" ]; then
              echo "Installing composer dependencies for $name..."
              cd "server/apps/$name"
              composer install --no-progress --prefer-dist --optimize-autoloader --no-dev
              cd -
            fi
          done

      - name: Install Nextcloud
        run: |
          cd server
          if [ "${{ inputs.database }}" = "pgsql" ]; then
            php occ maintenance:install \
              --database pgsql \
              --database-host 127.0.0.1 \
              --database-port 5432 \
              --database-name nextcloud \
              --database-user nextcloud \
              --database-pass nextcloud \
              --admin-user admin \
              --admin-pass admin
          else
            php occ maintenance:install \
              --database ${{ inputs.database }} \
              --admin-user admin \
              --admin-pass admin
          fi
          # A REQUIRED additional app that does not enable is an ENVIRONMENT
          # failure, and it must not be allowed to resurface as APPLICATION
          # failures. It used to: `|| echo "::warning::…, continuing"` let the
          # run proceed without the dependency, and the consuming app's tests
          # then died on the absent classes.
          #
          # Measured on ConductionNL/hermiq, full-scope run 31490144919, six
          # PHPUnit cells, perfect 6/6 correlation:
          #
          #   enable ok      -> Tests: 1500, Errors: 5, Failures: 1   (x3)
          #   enable FAILED  -> Tests: 1500, Errors: 12               (x3)
          #
          # The seven extra "errors" were `Interface
          # "OCA\OpenRegister\Service\Flow\IFlowNodeLogActions" not found` and
          # `Call to undefined method MockObject_ToolRegistryFacade::
          # describeTools()` — which read as app debt and were an absent app.
          # Two distinct causes, one deterministic (OpenRegister declares
          # min-version="32"; the cell was stable31) and one transient
          # (`curl error 60 … self-signed certificate` during composer install
          # left Twig missing, so enabling crashed). Both deserve a red job:
          # the first is a real configuration error, the second is re-runnable.
          #
          # ⚠️ The failure flag goes through a FILE, not a variable. The loop
          # body runs in a subshell (it is fed by a pipeline), so a variable set
          # inside it is invisible after `done` — the same trap the gate runner
          # documents at its gate-30 loop.
          if [ '${{ inputs.additional-apps }}' != '[]' ]; then
            rm -f "${RUNNER_TEMP:-/tmp}/additional-app-enable-failed"
            echo '${{ inputs.additional-apps }}' | jq -r '.[].app' | while read -r name; do
              echo "Enabling app: $name"
              if ! php occ app:enable "$name"; then
                echo "::error::Failed to enable required additional app '$name'. This is an ENVIRONMENT failure, not an application failure — the run cannot measure this repository without it. Common causes: the app declares a min-version above the Nextcloud ref this cell tests, or its composer install did not complete."
                echo "$name" >> "${RUNNER_TEMP:-/tmp}/additional-app-enable-failed"
              fi
            done
            if [ -s "${RUNNER_TEMP:-/tmp}/additional-app-enable-failed" ]; then
              echo "::error::Aborting: $(tr '\n' ' ' < "${RUNNER_TEMP:-/tmp}/additional-app-enable-failed")could not be enabled."
              exit 1
            fi
          fi

      # ── Composer's DOWNLOAD cache, not `vendor/` ──────────────────────────
      #
      # `~/.cache/composer` holds the fetched dist archives and the metadata
      # composer would otherwise re-download from Packagist on every run.
      # Caching it is safe in a way that caching `vendor/` is not: composer
      # still resolves and installs normally, so a stale or partial cache
      # produces a slower install, never a wrong tree.
      #
      # The key names the app's own composer files by explicit path rather than
      # a `**/` glob, because these jobs check out the whole Nextcloud server
      # alongside the app and a glob would fold NC's composer files into the
      # key — rotating the cache whenever `nextcloud-test-refs` moves, for
      # dependencies that did not change.
      #
      # `composer.lock` is listed first and `composer.json` second because
      # three fleet repos (hermiq, hrmq, zaakafhandelapp) ship no lockfile at
      # all. `hashFiles` ignores patterns that match nothing, so those repos key
      # on composer.json and everyone else keys on both.
      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: ${{ runner.os }}-composer-files-${{ hashFiles(format('server/apps/{0}/composer.lock', inputs.app-name), format('server/apps/{0}/composer.json', inputs.app-name)) }}
          restore-keys: ${{ runner.os }}-composer-files-

      - name: Install and enable app
        run: |
          cd server/apps/${{ inputs.app-name }}
          composer install --no-progress --prefer-dist --optimize-autoloader
          cd ../../
          php occ app:enable ${{ inputs.app-name }}

      - name: Start PHP built-in server
        # Same front-controller router as the Playwright job — see the long
        # comment on that step. Without it, `php -S` returns 404 for any path
        # that resolves to an existing directory with no index.php inside,
        # which is every pretty Nextcloud URL once the app is checked out to
        # `server/apps/<app>`. A Postman collection hitting `/apps/<app>/api/…`
        # rather than `/index.php/apps/<app>/api/…` fails here for that reason
        # alone.
        run: |
          cd server
          cat > ci-router.php <<'ROUTER'
          <?php
          $path = parse_url($_SERVER['REQUEST_URI'], PHP_URL_PATH) ?: '/';
          if ($path !== '/' && is_file(__DIR__ . $path)) {
              return false;
          }
          $segments = explode('/', ltrim($path, '/'));
          $prefix = '';
          foreach ($segments as $i => $segment) {
              $prefix .= '/' . $segment;
              if (substr($segment, -4) !== '.php'
                  || $prefix === '/index.php'
                  || !is_file(__DIR__ . $prefix)
              ) {
                  continue;
              }
              $rest = implode('/', array_slice($segments, $i + 1));
              $_SERVER['SCRIPT_NAME'] = $prefix;
              $_SERVER['SCRIPT_FILENAME'] = __DIR__ . $prefix;
              $_SERVER['PHP_SELF'] = $path;
              $_SERVER['PATH_INFO'] = $rest === '' ? '' : '/' . $rest;
              require __DIR__ . $prefix;
              return true;
          }
          $_SERVER['SCRIPT_NAME'] = '/index.php';
          $_SERVER['SCRIPT_FILENAME'] = __DIR__ . '/index.php';
          $_SERVER['PHP_SELF'] = '/index.php';
          require __DIR__ . '/index.php';
          ROUTER
          php -S 0.0.0.0:8080 ci-router.php &
          sleep 3
          curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/status.php || echo "Server not ready"
        env:
          # PHP_CLI_SERVER_WORKERS: `php -S` is SINGLE-WORKER by default, so it
          # can only ever have one request in flight. That is fatal — not slow,
          # FATAL — for any API collection in which the app under test calls
          # BACK into this same instance while serving a request: the one
          # worker is blocked inside the outer request, so the nested request
          # can never be accepted, and both hang until the job's timeout kills
          # them.
          #
          # Measured on openconnector (run 30821823343, job 91713730053): the
          # collection creates a "self-pointing source" whose `location` is
          # this very server, then calls
          # `POST /api/synchronizations/<uuid>/test`. That request never
          # returned. The job sat in "Run Newman tests" for ~30 minutes and was
          # cancelled by timeout-minutes, having completed J2.2 and printed
          # nothing after J2.3. Self-referential fixtures like this are normal
          # in an integration suite — pointing a Source at the instance's own
          # OpenRegister API is the cheapest way to get a real, reachable
          # upstream — so the runner has to be able to serve them.
          #
          # The Playwright job's identical `php -S` step already sets this (for
          # a different symptom: SPA boot requests serialising behind each
          # other). Callers cannot set it — the `php -S` invocation lives in
          # this workflow — so, exactly as noted there, it has to be fixed here.
          PHP_CLI_SERVER_WORKERS: 8

      - name: Seed test data
        if: inputs.newman-seed-command != ''
        # Same rationale as the Playwright job's seed step: a seed script is
        # usually driving the app's own admin API and has to be told WHICH
        # instance and with what credentials. This step declared no `env:` at
        # all, so a script here saw neither BASE_URL nor ADMIN_USER and had to
        # hardcode `http://localhost:8080` — a literal that means the SHARED
        # dev container on a developer box, which makes the same script unsafe
        # to run anywhere else.
        env:
          BASE_URL: http://localhost:8080
          NEXTCLOUD_URL: http://localhost:8080
          NC_BASE_URL: http://localhost:8080
          ADMIN_USER: admin
          ADMIN_PASSWORD: admin
          NC_ADMIN_USER: admin
          NC_ADMIN_PASS: admin
          # THE SEED ARRIVES AS DATA — see the long note on the Playwright
          # job's seed step (#192). The comment that used to sit here said
          # "Use eval to support complex commands with pipes or &&", and that
          # was the assurance the defect hid behind: because the interpolation
          # was UNQUOTED, `a && b` was split by THIS shell before eval saw it,
          # eval ran only `a`, and bash's `set -e` exemption for `&&` lists
          # made a failing `a` exit 0.
          #
          # This job is not hypothetical. openbuild ships
          #   `php occ app:disable openbuild && php occ app:enable openbuild`
          # as its newman-seed-command — a failed disable meant the enable
          # never ran and Newman tested whatever state was left, green.
          SEED_COMMAND: ${{ inputs.newman-seed-command }}
        run: |
          cd server
          printf 'Running seed command: %s\n' "$SEED_COMMAND"
          # eval is retained on purpose: fleet callers pass assignment
          # prefixes (`SEED_SCOPE=register bash …`) and `||` lists. The fix is
          # the QUOTING — the whole seed reaches eval as one unit, so eval's
          # combined status is the step's.
          eval "$SEED_COMMAND" && SEED_RC=0 || SEED_RC=$?
          if [ "$SEED_RC" -ne 0 ]; then
            # Diagnostics on STDERR — an `::error::` on stdout is swallowed by
            # any caller that captures the step's output with `$(…)`.
            {
              echo "::error::Seed command failed with exit ${SEED_RC}: ${SEED_COMMAND}"
              echo "Refusing to run Newman against a half-seeded instance — a full"
              echo "collection tally from an unseeded server looks exactly like a real one."
            } >&2
            exit "$SEED_RC"
          fi
          echo "Seed command completed (exit 0)."

      - name: Setup Node.js and Newman
        uses: actions/setup-node@v4
        with:
          node-version: "${{ inputs.node-version }}"

      # ── Why actions/cache and not setup-node's own `cache: npm` ────────────
      #
      # `actions/setup-node` with `cache: npm` HARD-FAILS when no lockfile
      # exists at the path it is given. This file already carries that scar
      # twice — see the notes on the `security` and `frontend-tests` jobs, where
      # it turned into a permanent red on every repo that legitimately has no
      # package.json. `actions/cache` has no such failure mode: a `hashFiles`
      # pattern that matches nothing yields an empty key segment, the restore
      # misses, and the job continues. For a step that only needs to warm
      # `~/.npm`, that is strictly the safer instrument.
      #
      # `~/.npm` is npm's download cache, so it serves `npm install -g newman`
      # here even though newman is not in the app's lockfile: the tarballs land
      # in the same cache and are restored on the next run. Keyed on the app's
      # lockfile only because that gives a stable key that rotates when the
      # toolchain does; the restore-key means a key miss still reuses the most
      # recent cache rather than starting cold.
      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-newman-${{ inputs.node-version }}-${{ hashFiles(format('server/apps/{0}/package-lock.json', inputs.app-name)) }}
          restore-keys: |
            ${{ runner.os }}-npm-newman-${{ inputs.node-version }}-
            ${{ runner.os }}-npm-

      - name: Install Newman
        run: npm install -g newman

      - name: Validate Newman collections
        run: |
          cd server/apps/${{ inputs.app-name }}
          COLLECTION_PATH="${{ inputs.newman-collection-path }}"
          if [ ! -d "$COLLECTION_PATH" ]; then
            echo "::error::Newman is enabled but collection directory '$COLLECTION_PATH' does not exist."
            exit 1
          fi
          COLLECTIONS=$(find "$COLLECTION_PATH" -name "*.postman_collection.json" 2>/dev/null | wc -l)
          if [ "$COLLECTIONS" -eq 0 ]; then
            echo "::error::No .postman_collection.json files found in '$COLLECTION_PATH'."
            exit 1
          fi
          echo "Found $COLLECTIONS Postman collection(s) in $COLLECTION_PATH."

      - name: Run Newman tests
        run: |
          cd server/apps/${{ inputs.app-name }}/${{ inputs.newman-collection-path }}

          # Build environment args: use --environment file if provided, otherwise ad-hoc vars
          ENV_ARGS=""
          if [ -n "${{ inputs.newman-environment-path }}" ]; then
            # Absolute, so it does not depend on how deep
            # `newman-collection-path` happens to be. The previous value,
            # "../../../apps/<app>/<env-path>", was hand-rolled relative to the
            # cwd set above and was off by one level: from
            # `server/apps/<app>/tests/postman`, `../../..` is `server/apps`,
            # so it resolved to `server/apps/apps/<app>/...` and never existed.
            # Every run took the fallback branch and emitted a "not found"
            # warning about a file that is committed and present (measured on
            # openconnector, which ships tests/postman/*.postman_environment.json).
            # The fallback happens to set the same three variables, so this was
            # invisible — until a collection needs a variable the fallback does
            # not define, at which point it fails for a reason the warning
            # actively misdirects you away from.
            ENV_FILE="$GITHUB_WORKSPACE/server/apps/${{ inputs.app-name }}/${{ inputs.newman-environment-path }}"
            if [ -f "$ENV_FILE" ]; then
              # Rewrite localhost:8080 for CI (PHP built-in server runs on 8080)
              echo "Using environment file: ${{ inputs.newman-environment-path }}"
              ENV_ARGS="--environment $ENV_FILE"
            else
              echo "::warning::Environment file '${{ inputs.newman-environment-path }}' not found, falling back to default env vars."
              ENV_ARGS='--env-var "base_url=http://localhost:8080" --env-var "admin_user=admin" --env-var "admin_password=admin"'
            fi
          else
            ENV_ARGS='--env-var "base_url=http://localhost:8080" --env-var "admin_user=admin" --env-var "admin_password=admin"'
          fi

          FAIL=0
          for collection in *.postman_collection.json; do
            echo ""
            echo "=== Running: $collection ==="
            eval newman run "\"$collection\"" $ENV_ARGS --reporters cli || FAIL=1
          done
          if [ "$FAIL" -ne 0 ]; then
            echo "::error::One or more Newman collections failed."
            exit 1
          fi

      - name: Show Nextcloud log on failure
        if: failure()
        run: |
          echo "=== Last 50 lines of Nextcloud log ==="
          tail -50 server/data/nextcloud.log 2>/dev/null | python3 -m json.tool --no-ensure-ascii 2>/dev/null || tail -50 server/data/nextcloud.log 2>/dev/null || echo "No log found"

  playwright:
    # `needs.security.result != 'failure'` was removed here by #194. E2E is the
    # most expensive evidence this workflow produces and it was the easiest to
    # delete: one advisory against a dev-only formatter took it out fleet-wide
    # on 2026-08-06 and rendered as a grey tick. See the `security` job.
    if: ${{ inputs.enable-playwright && !cancelled() }}
    runs-on: ubuntu-latest
    name: "E2E Tests (Playwright)"
    # `frontend-build` is a dependency purely so its artifact is available to
    # download — NOT a gate. The `if:` above contains `!cancelled()`, which
    # suppresses the implicit `success()` on needs, so a failed or skipped
    # frontend-build still lets this job run and reach its own verdict. When
    # the artifact is absent for any reason the build step below runs exactly
    # as it did before this dependency existed.
    #
    # `php-quality` REMOVED from this list — see the note on the phpunit job. It
    # was never read by this job's `if:` or by any step; it was a leftover from
    # the gating clause #194 deleted, and all it did was delay the start of the
    # most expensive evidence in the workflow.
    #
    # `security` STAYS: it resolves in seconds, so removing it would buy no
    # measurable time. It remains a scheduling edge only — the `if:` above reads
    # no result from it, exactly as #194 established.
    #
    # `frontend-build` STAYS, and it is the one edge here that is real: the step
    # below reads `needs.frontend-build.outputs.built` and downloads its
    # artifact. It is still not a gate — `!cancelled()` above suppresses the
    # implicit `success()`, so a failed or skipped frontend-build still lets this
    # job run and simply rebuild the bundle itself.
    #
    # `nextcloud-matrix` supplies the server this job checks out. Real edge.
    needs: [security, frontend-build, nextcloud-matrix]
    # No job in this file declared a timeout, so a hung suite ran to GitHub's
    # 6-hour default. Observed durations once the suite is healthy: 4-10 min
    # (planix 0.8, doriath 4.2, zaakafhandelapp 5.3, softwarecatalog 6.1,
    # openconnector 7.7, opencatalogi 10.0). Unhealthy runs measured 1.1h and
    # 1.6h before the `visual`/`docs-capture` projects were excluded. 45
    # minutes leaves a wide margin over every healthy run while turning a hang
    # into a failure in under an hour instead of burning a runner for six.
    timeout-minutes: 45

    services:
      postgres:
        image: ${{ inputs.database == 'pgsql' && 'postgres:16' || '' }}
        env:
          POSTGRES_USER: nextcloud
          POSTGRES_PASSWORD: nextcloud
          POSTGRES_DB: nextcloud
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U nextcloud"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout Nextcloud server
        uses: actions/checkout@v4
        with:
          repository: nextcloud/server
          # THE single server for this job — the numerically highest stable
          # branch in the resolved set, published by the `nextcloud-matrix` job.
          # It used to be entry [0] of a hand-written array, and the action this
          # now derives from returns its branches OLDEST-FIRST, so reading a
          # position would silently have moved this job onto the oldest
          # supported server. See the comment on `nextcloud-matrix`.
          ref: ${{ needs.nextcloud-matrix.outputs.single-server }}
          path: server

      - name: Checkout server submodules
        run: |
          cd server
          git submodule update --init 3rdparty

      - name: Checkout app
        uses: actions/checkout@v4
        with:
          path: server/apps/${{ inputs.app-name }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}
          extensions: mbstring, intl, sqlite3, pgsql, pdo_pgsql, zip, gd, curl, xml, json
          tools: composer:v2

      - name: Checkout additional apps
        if: ${{ inputs.additional-apps != '[]' }}
        run: |
          echo '${{ inputs.additional-apps }}' | jq -c '.[]' | while read -r app; do
            repo=$(echo "$app" | jq -r '.repo')
            name=$(echo "$app" | jq -r '.app')
            ref=$(echo "$app" | jq -r '.ref // "main"')
            echo "Checking out $repo ($name) at $ref..."
            git clone --depth 1 --branch "$ref" "https://github.com/$repo.git" "server/apps/$name"
            if [ -f "server/apps/$name/composer.json" ]; then
              echo "Installing composer dependencies for $name..."
              cd "server/apps/$name"
              composer install --no-progress --prefer-dist --optimize-autoloader --no-dev
              cd -
            fi
          done

      - name: Install Nextcloud
        run: |
          cd server
          if [ "${{ inputs.database }}" = "pgsql" ]; then
            php occ maintenance:install \
              --database pgsql \
              --database-host 127.0.0.1 \
              --database-port 5432 \
              --database-name nextcloud \
              --database-user nextcloud \
              --database-pass nextcloud \
              --admin-user admin \
              --admin-pass admin
          else
            php occ maintenance:install \
              --database ${{ inputs.database }} \
              --admin-user admin \
              --admin-pass admin
          fi
          # A REQUIRED additional app that does not enable is an ENVIRONMENT
          # failure, and it must not be allowed to resurface as APPLICATION
          # failures. It used to: `|| echo "::warning::…, continuing"` let the
          # run proceed without the dependency, and the consuming app's tests
          # then died on the absent classes.
          #
          # Measured on ConductionNL/hermiq, full-scope run 31490144919, six
          # PHPUnit cells, perfect 6/6 correlation:
          #
          #   enable ok      -> Tests: 1500, Errors: 5, Failures: 1   (x3)
          #   enable FAILED  -> Tests: 1500, Errors: 12               (x3)
          #
          # The seven extra "errors" were `Interface
          # "OCA\OpenRegister\Service\Flow\IFlowNodeLogActions" not found` and
          # `Call to undefined method MockObject_ToolRegistryFacade::
          # describeTools()` — which read as app debt and were an absent app.
          # Two distinct causes, one deterministic (OpenRegister declares
          # min-version="32"; the cell was stable31) and one transient
          # (`curl error 60 … self-signed certificate` during composer install
          # left Twig missing, so enabling crashed). Both deserve a red job:
          # the first is a real configuration error, the second is re-runnable.
          #
          # ⚠️ The failure flag goes through a FILE, not a variable. The loop
          # body runs in a subshell (it is fed by a pipeline), so a variable set
          # inside it is invisible after `done` — the same trap the gate runner
          # documents at its gate-30 loop.
          if [ '${{ inputs.additional-apps }}' != '[]' ]; then
            rm -f "${RUNNER_TEMP:-/tmp}/additional-app-enable-failed"
            echo '${{ inputs.additional-apps }}' | jq -r '.[].app' | while read -r name; do
              echo "Enabling app: $name"
              if ! php occ app:enable "$name"; then
                echo "::error::Failed to enable required additional app '$name'. This is an ENVIRONMENT failure, not an application failure — the run cannot measure this repository without it. Common causes: the app declares a min-version above the Nextcloud ref this cell tests, or its composer install did not complete."
                echo "$name" >> "${RUNNER_TEMP:-/tmp}/additional-app-enable-failed"
              fi
            done
            if [ -s "${RUNNER_TEMP:-/tmp}/additional-app-enable-failed" ]; then
              echo "::error::Aborting: $(tr '\n' ' ' < "${RUNNER_TEMP:-/tmp}/additional-app-enable-failed")could not be enabled."
              exit 1
            fi
          fi

      # ── Composer's DOWNLOAD cache, not `vendor/` ──────────────────────────
      #
      # `~/.cache/composer` holds the fetched dist archives and the metadata
      # composer would otherwise re-download from Packagist on every run.
      # Caching it is safe in a way that caching `vendor/` is not: composer
      # still resolves and installs normally, so a stale or partial cache
      # produces a slower install, never a wrong tree.
      #
      # The key names the app's own composer files by explicit path rather than
      # a `**/` glob, because these jobs check out the whole Nextcloud server
      # alongside the app and a glob would fold NC's composer files into the
      # key — rotating the cache whenever `nextcloud-test-refs` moves, for
      # dependencies that did not change.
      #
      # `composer.lock` is listed first and `composer.json` second because
      # three fleet repos (hermiq, hrmq, zaakafhandelapp) ship no lockfile at
      # all. `hashFiles` ignores patterns that match nothing, so those repos key
      # on composer.json and everyone else keys on both.
      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: ${{ runner.os }}-composer-files-${{ hashFiles(format('server/apps/{0}/composer.lock', inputs.app-name), format('server/apps/{0}/composer.json', inputs.app-name)) }}
          restore-keys: ${{ runner.os }}-composer-files-

      - name: Install and enable app
        run: |
          cd server/apps/${{ inputs.app-name }}
          composer install --no-progress --prefer-dist --optimize-autoloader
          cd ../../
          php occ app:enable ${{ inputs.app-name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "${{ inputs.node-version }}"

      # Deliberately actions/cache rather than setup-node's `cache: npm`: the
      # install below is guarded on `[ -f package.json ]` precisely because a
      # repo may not have one, and `cache: npm` HARD-FAILS on a missing
      # lockfile — it would turn an optional install into a mandatory one and
      # take the whole job with it. See the same note on the Newman job.
      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ inputs.node-version }}-${{ hashFiles(format('server/apps/{0}/package-lock.json', inputs.app-name)) }}
          restore-keys: |
            ${{ runner.os }}-npm-${{ inputs.node-version }}-
            ${{ runner.os }}-npm-

      - name: Install app npm dependencies
        run: |
          cd server/apps/${{ inputs.app-name }}
          if [ -f "package.json" ]; then
            npm ci
          fi

      - name: Install Playwright
        # A STALLED SETUP STEP EATS THE JOB'S WHOLE CAP AND LEAVES NO VERDICT.
        #
        # Measured 2026-08-19 on app-versions' `development` push run: this step
        # ran 45m24s and the job was cancelled at its `timeout-minutes: 45`
        # bound — `Run Playwright tests` never started, so the run produced no
        # tally, no trace upload (`if: failure()` does not fire on a cancelled
        # job) and no report. It still renders as a red check while carrying no
        # information about the app, and `cancelled` is neither failed nor
        # passed. The same PR's E2E job completed in 24m, so the stall is
        # intermittent, not a capacity problem.
        #
        # `--with-deps` shells out to apt, which is the same thing that hung
        # `Install PDF tools` for 60 minutes across the fleet (#504) and
        # silently switched the quality gate off there too.
        #
        # A step bound converts that into a fast, readable failure. Measured
        # normal duration for this step is under 3 minutes, so 10 leaves more
        # than 3x headroom — a bound that a healthy run could hit would just be
        # a new way to invent a phantom defect.
        timeout-minutes: 10
        run: |
          cd server/apps/${{ inputs.app-name }}
          npm install --save-dev @playwright/test

          # ── WHY THIS IS TWO COMMANDS AND NOT `--with-deps` ──────────────────
          #
          # `--with-deps` does two unrelated things in one process: download the
          # browser binaries from a CDN, and `apt-get install` the system
          # libraries. Measured 2026-08-19 across THREE runs in one morning
          # (app-versions development, app-versions #151, hrmq #87), the
          # combined command printed NOT ONE LINE of output and hung until the
          # job's 45-minute cap killed it:
          #
          #     Terminate orphan process: pid (3857)
          #         (npm exec playwright install --with-deps chromium)
          #
          # Silence from the first instant is the signature of apt blocking on
          # /var/lib/dpkg/lock-frontend — apt waits for that lock forever by
          # design and says nothing while it does. Same mechanism as the
          # `Install PDF tools` stall in #504.
          #
          # Split, the two halves can be treated according to what they are:
          #
          # 1. The browser download is REQUIRED and is a plain CDN fetch that
          #    prints progress, so a stall there is visible and fatal.
          npx playwright install chromium

          # 2. The system libraries are ATTEMPTED, bounded, and NOT fatal.
          #    GitHub's ubuntu runner image already ships the libraries chromium
          #    needs, which is why the suites that got past this step ran fine.
          #    A `timeout` gives apt the bound it will not give itself.
          #
          #    ⚠️ NOT-FATAL IS A DELIBERATE TRADE, NOT A SWALLOWED ERROR. If a
          #    library really is missing, the browser fails to launch in the
          #    test step and Playwright says exactly which one — a real verdict
          #    about a real problem. The alternative it replaces is a 45-minute
          #    cancellation that produces no tally, no trace and no report while
          #    still rendering as a red check.
          if timeout 300 npx playwright install-deps chromium; then
            echo "Playwright system dependencies installed."
          else
            echo "::warning::playwright install-deps did not finish within 5m (apt lock or mirror). Continuing: the runner image ships these libraries, and a genuinely missing one fails loudly at browser launch."
          fi

      # ── Reuse the bundle the `frontend-build` job already compiled ─────────
      #
      # Fast path only. Every condition below is written so that "I am not
      # certain this is the right bundle" resolves to REBUILDING, never to
      # running specs against something unverified — a wrong or empty bundle
      # does not produce a 404, it produces HTTP 200 text/html and a wall of
      # selector timeouts that read as a broken app rather than a broken
      # pipeline. The cost of the fallback is ~3 minutes; the cost of a bad
      # hand-off is a false verdict on every UI spec in the fleet.
      #
      # Guarded on frontend-path == '.' because the build job runs inside
      # `inputs.frontend-path` while this job builds at the app root; for a
      # repo with a nested frontend the two output trees are not the same
      # paths, so that case keeps building here.
      - name: Download prebuilt app frontend
        id: prebuilt
        if: ${{ needs.frontend-build.outputs.built == 'true' && inputs.frontend-path == '.' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: frontend-build-output
          path: /tmp/frontend-build

      - name: Restore prebuilt app frontend
        id: restore
        if: ${{ steps.prebuilt.outcome == 'success' }}
        run: |
          set -euo pipefail
          TARBALL=/tmp/frontend-build/frontend-build-output.tar.gz
          if [ ! -f "$TARBALL" ]; then
            echo "restored=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Prebuilt frontend artifact downloaded but the tarball is missing — building here instead."
            exit 0
          fi
          # Positive check on the thing that actually matters: JavaScript.
          # An artifact that extracts cleanly but carries no .js is
          # indistinguishable from a successful build at the HTTP layer
          # (200 text/html either way), so assert it HERE, where the failure
          # is still legible, and rebuild rather than proceed on doubt.
          TOTAL="$(tar -tzf "$TARBALL" | grep -c . || true)"
          JS_COUNT="$(tar -tzf "$TARBALL" | grep -c '\.js$' || true)"
          echo "Artifact holds $TOTAL file(s), of which $JS_COUNT are .js"
          if [ "$TOTAL" -eq 0 ] || [ "$JS_COUNT" -eq 0 ]; then
            echo "restored=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Prebuilt frontend artifact carried no JavaScript — building here instead."
            exit 0
          fi
          tar -xzf "$TARBALL" -C "server/apps/${{ inputs.app-name }}"
          echo "Restored $TOTAL file(s) from the frontend-build artifact into server/apps/${{ inputs.app-name }}."
          echo "restored=true" >> "$GITHUB_OUTPUT"

      - name: Build app frontend
        # Vue/React apps that mount via `Util::addScript()` need their
        # webpack bundle on disk before specs render the page; without
        # this step every selector waits times out because the script
        # tag 404s and the SPA never mounts. Skip silently when the app
        # has no `build` npm script (legacy apps without a frontend).
        #
        # Skipped when the `frontend-build` job already produced the bundle and
        # the restore step verified it. Any other outcome falls through to here
        # and builds, which is byte-for-byte the behaviour that predates the
        # artifact hand-off.
        if: ${{ steps.restore.outputs.restored != 'true' }}
        run: |
          cd server/apps/${{ inputs.app-name }}
          if [ -f "package.json" ] && node -e "process.exit(require('./package.json').scripts && require('./package.json').scripts.build ? 0 : 1)" 2>/dev/null; then
            echo "Building app frontend with 'npm run build'…"
            npm run build
          else
            echo "No 'build' script in package.json; skipping frontend build."
          fi

      - name: Validate Playwright tests exist
        run: |
          cd server/apps/${{ inputs.app-name }}
          TEST_PATH="${{ inputs.playwright-test-path }}"
          if [ ! -d "$TEST_PATH" ]; then
            echo "::error::Playwright is enabled but test directory '$TEST_PATH' does not exist."
            exit 1
          fi
          TESTS=$(find "$TEST_PATH" -name "*.spec.ts" -o -name "*.spec.js" 2>/dev/null | wc -l)
          if [ "$TESTS" -eq 0 ]; then
            echo "::error::No .spec.ts or .spec.js files found in '$TEST_PATH'."
            exit 1
          fi
          echo "Found $TESTS Playwright test file(s) in $TEST_PATH."

      - name: Start PHP built-in server
        # Started AFTER the slow setup phases (npm ci, playwright install,
        # frontend build) so the server is not idle for minutes — that's
        # what was causing the orphaned `php -S` process to disappear by
        # the time specs ran.
        #
        # Polling loop (per @WilcoLouwerse's review): `curl -sf` returns
        # failure immediately on connection refused — `-m 5` only applies
        # AFTER the TCP connection is established. A single probe after
        # `sleep 3` therefore fails spuriously when the runner is noisy
        # and `php -S` hasn't bound :8080 yet. Poll every 0.5s with a
        # 15s hard cap so the fail-fast path is honest.
        #
        # PHP_CLI_SERVER_WORKERS: the built-in server is SINGLE-WORKER by
        # default, so every request a Nextcloud SPA fires on boot is
        # serialised behind the one before it. Measured on opencatalogi:
        # whichever spec ran first blew its 60s test timeout waiting for the
        # index page to render and then passed in 9.1s on retry, while every
        # later spec ran in 4-7s. It was measuring server warm-up, and it
        # cost a retry on every run. Callers cannot set this — the `php -S`
        # invocation lives here — so it has to be fixed here.
        #
        # ── ci-router.php: PRETTY URLs 404 WITHOUT IT ───────────────────────
        # `php -S` was started with no router script, so it resolved each
        # request path against the document root itself. For a path that
        # resolves to a DIRECTORY WITH NO index.php INSIDE, it returns 404 —
        # it does not fall back to the root index.php. Measured:
        #
        #     /index.php/apps/<app>/   -> 200   PATH_INFO=/apps/<app>/
        #     /apps/<app>/             -> 404   <-- the directory exists
        #     /nonexistent/            -> 200   <-- falls through to index.php
        #
        # Note the inversion: a path that does NOT exist works, and one that
        # DOES exist fails. The app under test is checked out to
        # `server/apps/<app>`, so every pretty Nextcloud URL in the fleet's
        # specs 404s here. None of it shows up in the docker dev images, where
        # apps live in `custom_apps/` and Apache + Nextcloud's own .htaccess
        # rewrites pretty URLs — so a spec that passes locally 404s on CI and
        # reports it as a selector timeout naming an ELEMENT, not a missing
        # page. That is a wall of red pointing at the wrong thing.
        #
        # Evidence, from one run on one instance (ConductionNL/openconnector
        # run 30771630267): the specs whose base URL was
        # `/index.php/apps/openconnector` PASSED, while the specs whose base
        # URL was `/apps/openconnector/#` failed with `main` not found. Across
        # pipelinq, openconnector and scholiq alone that is ~55 spec files.
        #
        # The router does exactly what Nextcloud's shipped .htaccess does —
        # `RewriteRule . index.php [PT,E=PATH_INFO:$1]`: serve real files
        # as-is, route everything else through the root index.php with
        # REQUEST_URI untouched. Nextcloud's Request::getRawPathInfo() derives
        # the path by stripping SCRIPT_NAME from REQUEST_URI, so with
        # SCRIPT_NAME="/index.php" both URL forms yield a byte-identical path
        # info. Verified against that exact algorithm, including query-string
        # preservation, static JS keeping `application/javascript`, and
        # `status.php` still executing as itself.
        #
        # ── AND THE OTHER PHP ENTRY POINTS NEED A PREFIX MATCH ──────────────
        # The first cut of the router claimed those other entry points still
        # "execute as themselves" on the strength of `is_file()`. That check
        # only ever matches a URL that IS a file exactly — `/status.php`, the
        # one case that got tested. Nextcloud never calls the OCS entry points
        # that way: every real request carries path info,
        #
        #     /ocs/v2.php/cloud/user
        #     /ocs/v1.php/cloud/groups?format=json
        #     /remote.php/dav/files/admin
        #
        # and `is_file(__DIR__ . '/ocs/v2.php/cloud/user')` is false. So the
        # router swallowed them into index.php with SCRIPT_NAME="/index.php",
        # getRawPathInfo() returned "/ocs/v2.php/cloud/user", no route matched,
        # and every OCS call in the fleet became a hard 404. Nextcloud's
        # .htaccess exempts these by PREFIX (`RewriteCond %{REQUEST_FILENAME}
        # !/ocs/v1.php` …), not by file existence — so do the same: walk the
        # path for the longest `.php` prefix that exists on disk and hand the
        # request to that script with a matching SCRIPT_NAME/PATH_INFO pair,
        # which is exactly what a router-less `php -S` did before.
        #
        # `/index.php` is excluded from the walk on purpose, so `/index.php/…`
        # keeps taking the fall-through branch byte-for-byte as before. The
        # change is therefore additive: only URLs that were 404ing move.
        #
        # Measured on a fixture reproducing all three configurations
        # (no router / first cut / this one):
        #
        #                                    no router      first cut     this
        #     /ocs/v2.php/cloud/user         ocs/v2.php     index.php     ocs/v2.php
        #     /remote.php/dav/files/admin    remote.php     index.php     remote.php
        #     /status.php                    status.php     status.php    status.php
        #     /apps/<app>/                   404            index.php     index.php
        #     /index.php/apps/<app>/         index.php      index.php     index.php
        env:
          PHP_CLI_SERVER_WORKERS: 8
        run: |
          cd server
          cat > ci-router.php <<'ROUTER'
          <?php
          // Front controller for `php -S`, mirroring Nextcloud's .htaccess.
          //
          // 1. A real file on disk is served by the built-in server as-is, so
          //    static assets keep their MIME types.
          // 2. Nextcloud's other PHP entry points — ocs/v1.php, ocs/v2.php,
          //    remote.php, public.php, cron.php, core/ajax/update.php — are
          //    reached WITH path info, which rule 1 never matches. Resolve the
          //    longest existing `.php` prefix and execute that script itself.
          // 3. Everything else routes through index.php, REQUEST_URI intact.
          $path = parse_url($_SERVER['REQUEST_URI'], PHP_URL_PATH) ?: '/';
          if ($path !== '/' && is_file(__DIR__ . $path)) {
              return false;
          }
          $segments = explode('/', ltrim($path, '/'));
          $prefix = '';
          foreach ($segments as $i => $segment) {
              $prefix .= '/' . $segment;
              if (substr($segment, -4) !== '.php'
                  || $prefix === '/index.php'
                  || !is_file(__DIR__ . $prefix)
              ) {
                  continue;
              }
              $rest = implode('/', array_slice($segments, $i + 1));
              $_SERVER['SCRIPT_NAME'] = $prefix;
              $_SERVER['SCRIPT_FILENAME'] = __DIR__ . $prefix;
              $_SERVER['PHP_SELF'] = $path;
              $_SERVER['PATH_INFO'] = $rest === '' ? '' : '/' . $rest;
              require __DIR__ . $prefix;
              return true;
          }
          $_SERVER['SCRIPT_NAME'] = '/index.php';
          $_SERVER['SCRIPT_FILENAME'] = __DIR__ . '/index.php';
          $_SERVER['PHP_SELF'] = '/index.php';
          require __DIR__ . '/index.php';
          ROUTER
          php -S 0.0.0.0:8080 ci-router.php > /tmp/php-server.log 2>&1 &
          PHP_PID=$!
          echo "${PHP_PID}" > /tmp/php-server.pid
          timeout 15 bash -c 'until curl -sf -o /dev/null http://localhost:8080/status.php; do sleep 0.5; done' || {
            echo "::error::PHP built-in server failed to come up on :8080."
            cat /tmp/php-server.log
            exit 1
          }
          # Prove the front controller is actually routing before any spec runs.
          #
          # The probe MUST be a URL whose path resolves to a real DIRECTORY under
          # the document root with no index.php inside it — that is the precise
          # shape `php -S` answers with a hard 404 when no router is installed,
          # and the only shape that distinguishes "router working" from "router
          # missing". `/login`, `/settings/admin` and friends are useless as
          # probes: they resolve to nothing on disk, so a router-less `php -S`
          # already falls through to the root index.php and returns 200.
          #
          # `/apps/files/` is that shape on every Nextcloud: `apps/files` is a
          # shipped, always-enabled app whose directory exists under the docroot
          # and contains no index.php, and whose `files.view.index` route always
          # resolves. Unauthenticated it answers 302 to /login — never 404 —
          # so a 404 can only mean the front controller is not routing.
          #
          # It deliberately does NOT probe `/apps/<app-name>/`, which is what
          # this gate used to do. That conflated two different properties:
          #   1. does the front controller route pretty URLs (a CI concern), and
          #   2. does THIS app have an index route (an app design choice).
          # Settings-only apps legitimately have neither a navigation entry nor
          # a `/` route — nldesign is one: its whole surface is admin settings
          # pages plus /api/* and /settings/* endpoints, so `/apps/nldesign/` is
          # a correct Nextcloud 404. The old probe read that as a broken router
          # and blocked the E2E job before a single spec ran, while its own
          # error text pointed at the router. See ConductionNL/nldesign#206.
          #
          # Evidence that the two are separable, from that same PR: on run
          # 30859016722 (job 91836768845) the identical URL returned **500**,
          # not 404 — index.php had executed and thrown. Same router, same
          # request, different status. A 404 from `/apps/<app>/` is therefore
          # Nextcloud answering "no such route", not `php -S` answering
          # "no such directory index".
          PRETTY="$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8080/apps/files/")"
          echo "Front-controller check: /apps/files/ -> HTTP ${PRETTY}"
          if [ "$PRETTY" = "404" ]; then
            echo "::error::The php -S front-controller router is not routing pretty URLs — /apps/files/ returned 404, and apps/files is a real directory with no index.php, which is exactly what a router-less php -S 404s. Every spec using a pretty Nextcloud URL will fail on a selector timeout."
            exit 1
          fi
          # The app's own root, reported but NOT gated — see above. Kept visible
          # because when it IS a 404 that is worth knowing (a page app that lost
          # its route looks identical to a settings-only app that never had one,
          # and only the spec run can tell them apart).
          APP_ROOT="$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8080/apps/${{ inputs.app-name }}/")"
          echo "App root: /apps/${{ inputs.app-name }}/ -> HTTP ${APP_ROOT}"
          if [ "$APP_ROOT" = "404" ]; then
            echo "::notice::/apps/${{ inputs.app-name }}/ returned 404 while /apps/files/ routed fine, so the front controller is working — this app declares no index route. Normal for a settings-only app; if this app is supposed to have a page, its route registration is broken."
          fi
          # And prove the OTHER Nextcloud PHP entry points still reach
          # themselves. This gate did not exist when the router first shipped,
          # and its absence is the whole reason a router that broke every OCS
          # call read as a clean green server-start: the pretty-URL check above
          # passed, so nothing spoke. `/ocs/v2.php/cloud/user` unauthenticated
          # is a 401 when it reaches ocs/v2.php and a 404 when the router
          # swallows it into index.php, so the two outcomes are distinguishable
          # by status code alone.
          OCS="$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8080/ocs/v2.php/cloud/user?format=json")"
          echo "OCS entry-point check: /ocs/v2.php/cloud/user -> HTTP ${OCS}"
          if [ "$OCS" = "404" ]; then
            echo "::error::The php -S front-controller router is swallowing Nextcloud's OCS entry point — /ocs/v2.php/cloud/user returned 404 instead of reaching ocs/v2.php. Every OCS call (current user, groups, user_status, dashboard layout) will 404, and specs will report it as a missing element."
            exit 1
          fi
          echo "PHP built-in server alive (pid=${PHP_PID})."

      - name: Seed test data
        if: inputs.playwright-seed-command != ''
        # The seed command needs to know WHICH instance to seed and with what
        # credentials, exactly like the test step below — a seed script is
        # usually driving the app's own admin API. This step declared no `env:`
        # at all, so a script here saw neither BASE_URL nor ADMIN_USER and had
        # to hardcode `http://localhost:8080` to work. That literal is the
        # SHARED dev container on a developer box, which makes the same script
        # unsafe to run anywhere else. The journeydoc capture job already
        # exports the full set to its own seed step; this matches it.
        env:
          BASE_URL: http://localhost:8080
          NEXTCLOUD_URL: http://localhost:8080
          NC_BASE_URL: http://localhost:8080
          ADMIN_USER: admin
          ADMIN_PASSWORD: admin
          NC_ADMIN_USER: admin
          NC_ADMIN_PASS: admin
          # THE SEED ARRIVES THROUGH THE ENVIRONMENT, NOT THE SCRIPT BODY.
          #
          # `${{ }}` is a TEXTUAL substitution performed before bash ever sees
          # the script, so interpolating the input into the body made the seed
          # part of this step's own source. Two things followed (#192):
          #
          #   1. `eval ${{ … }}` was UNQUOTED, so a seed of `a && b && c` was
          #      parsed by THIS shell as `eval a` && `b` && `c`. eval received
          #      only the first stage. And bash's `set -e` exemption for `&&`
          #      lists ("except the command following the final &&") means a
          #      failing first stage aborts nothing and exits 0 — the tail
          #      never runs, the step goes green, and Playwright then tests a
          #      half-seeded instance. Measured on pipelinq run 30800304506.
          #   2. `echo "Running seed command: ${{ … }}"` expanded the seed's
          #      own `$(…)` in THIS shell, before the seed ran. pipelinq's
          #      bundle-truncation control printed identical before/after byte
          #      counts by construction and could not have caught anything.
          #
          # Passing it as data fixes both, and also means a seed containing a
          # quote can no longer reshape the surrounding script.
          SEED_COMMAND: ${{ inputs.playwright-seed-command }}
        run: |
          cd server
          printf 'Running seed command: %s\n' "$SEED_COMMAND"
          # `eval` IS still required. A survey of the fleet's callers found
          # launchpad passing `OC_PASS=… php occ user:add … || true` — an
          # assignment prefix and a `||` list. Running "$SEED_COMMAND" as a
          # bare command would exec that whole string as one argv word.
          # What matters is that the expansion is QUOTED, so the entire seed
          # reaches eval as one unit and eval's combined status is the answer.
          eval "$SEED_COMMAND" && SEED_RC=0 || SEED_RC=$?
          if [ "$SEED_RC" -ne 0 ]; then
            # Diagnostics on STDERR. An `::error::` written to stdout is eaten
            # whole when a caller wraps the step's output in `$(…)`, leaving a
            # bare non-zero exit with no stated cause.
            {
              echo "::error::Seed command failed with exit ${SEED_RC}: ${SEED_COMMAND}"
              echo "Refusing to run Playwright against a half-seeded instance — a full,"
              echo "credible-looking pass/fail tally from an unseeded server is worse than"
              echo "no tally at all. Fix the seed, or unset playwright-seed-command."
            } >&2
            exit "$SEED_RC"
          fi
          echo "Seed command completed (exit 0)."

      - name: Run Playwright tests
        run: |
          cd server/apps/${{ inputs.app-name }}
          CONFIG="${{ inputs.playwright-test-path }}/playwright.config.ts"
          if [ ! -f "$CONFIG" ] && [ -f "playwright.config.ts" ]; then
            CONFIG="playwright.config.ts"
          fi
          npx playwright test --config="$CONFIG"
        # This step exported only BASE_URL / ADMIN_USER / ADMIN_PASSWORD, but a
        # survey of the 21 fleet repos found 15 whose config resolves the target
        # as `process.env.NEXTCLOUD_URL || 'http://localhost:8080'` and never
        # reads BASE_URL. Those repos do not fail here — they fall through to
        # the literal, which happens to be this runner's own `php -S`, so the
        # suite runs against the right host FOR THE WRONG REASON and the same
        # config points at the SHARED dev container the moment anyone runs it
        # locally. Exporting every name the fleet actually uses means the
        # variable, not the fallback, is what selects the target here.
        #
        # (Repos should still drop the `|| 'http://localhost:8080'` literal —
        # see tests/e2e/base-url.ts in openregister/doriath/shillinq for the
        # pattern that throws instead. This just stops CI from silently
        # depending on it.)
        env:
          BASE_URL: http://localhost:8080
          NEXTCLOUD_URL: http://localhost:8080
          NC_BASE_URL: http://localhost:8080
          ADMIN_USER: admin
          ADMIN_PASSWORD: admin
          NC_ADMIN_USER: admin
          NC_ADMIN_PASS: admin
          COLLECT_COVERAGE: ${{ inputs.enable-playwright-coverage }}

      # ── axe-core: produce the file gate-33 has never had ────────────────────
      #
      # hydra-gates gate-33 consumes `tests/axe/report.json` and fails on
      # `serious`/`critical` violations. Measured 2026-08-03 across 13 repos:
      # that file exists in NONE of them, and the `scripts/run-browser-tests.sh`
      # documented as producing it exists in no app either. So gate-33 has never
      # run anywhere, and every "all gates green" this fleet has produced
      # excluded accessibility runtime checking — contrast, landmark structure,
      # ARIA validity, live regions — outright.
      #
      # This is the only job in the file with both a booted Nextcloud and a
      # browser, so this is where the report can be produced. It runs even when
      # the Playwright suite itself failed (`!cancelled()`): an accessibility
      # measurement is not contingent on the e2e verdict, and gate-33 runs
      # either way.
      #
      # The axe runner lives in this repo as a FILE, not in a heredoc — see the
      # "Run axe-core" step below for why that is load-bearing rather than
      # tidiness. It comes from the same checkout the hydra-gates job uses, so
      # the runner and the gate that consumes its report come from one place.
      #
      # (An earlier revision of this comment claimed the opposite — that the
      # runner was embedded here deliberately. That was true until #161/#166/#168
      # and is exactly the instruction that must not survive: inlining it is what
      # made the whole workflow unresolvable fleet-wide.)
      - name: Checkout the axe runner
        if: ${{ inputs.enable-axe && !cancelled() }}
        uses: actions/checkout@v4
        with:
          repository: ConductionNL/.github
          ref: ${{ inputs.hydra-gates-ref }}
          path: gates

      # This workflow is consumed at @main and the runner at the caller's pin,
      # so the file can simply not be there: axe-run.cjs was added in v1.4.0 and
      # every caller in the fleet is currently pinned to v1.3.0. Without this
      # step the miss surfaces as node's `Cannot find module` three steps later,
      # then as "the axe report never arrived", which points the reader at
      # Playwright — the one place the fault is not.
      - name: Assert the axe runner exists at the pinned ref
        if: ${{ inputs.enable-axe && !cancelled() }}
        env:
          GATES_REF: ${{ inputs.hydra-gates-ref }}
        run: |
          set -u
          RUNNER="${GITHUB_WORKSPACE}/gates/hydra-gates/scripts/axe-run.cjs"
          if [ ! -f "${RUNNER}" ]; then
            echo "::error::enable-axe is set, but hydra-gates-ref='${GATES_REF}' ships no hydra-gates/scripts/axe-run.cjs — that file arrived in v1.4.0. No axe report can be produced at this pin, so gate-33 has no input and this job would fail for a reason that has nothing to do with accessibility. Bump hydra-gates-ref to v1.4.0 or later, or set enable-axe: false."
            exit 1
          fi
          echo "axe runner present at ref ${GATES_REF}."

      - name: Install axe-core
        if: ${{ inputs.enable-axe && !cancelled() }}
        run: |
          set -euo pipefail
          cd server/apps/${{ inputs.app-name }}
          # --no-save: this checkout is the app's own tree, and the report is
          # the artefact we want out of it — not a mutated package.json.
          npm install --no-save --no-audit --no-fund "@axe-core/playwright@${{ inputs.axe-version }}"

          # ── this control used to pass for the wrong reason ─────────────────
          #
          # The runner is executed BY ABSOLUTE PATH from OUTSIDE this package
          # tree (`${GITHUB_WORKSPACE}/gates/...`, see the next step), and
          # CommonJS resolves a module's own `require` calls by walking up from
          # the DIRECTORY OF THE FILE — never from the process cwd. `gates/` is
          # a sibling of `server/`, so that walk never reaches
          # `server/apps/<app>/node_modules` and nothing the step above
          # installed is reachable.
          #
          # `node -e`, which is what this control was, resolves from the cwd —
          # here `server/apps/<app>` — so it found the package the runner could
          # not and printed success. docudesk#423 died one step later on
          # `Cannot find module '@playwright/test'` with this control green
          # directly above it.
          #
          # NODE_PATH is a global fallback consulted whatever directory the
          # entry file sits in, so it is what makes the cross-tree invocation
          # resolve at all. The probe then asks the question through
          # `createRequire` ANCHORED ON THE RUNNER, so it resolves exactly the
          # way the runner does and fails exactly when the runner would.
          export NODE_PATH="${PWD}/node_modules"
          RUNNER="${GITHUB_WORKSPACE}/gates/hydra-gates/scripts/axe-run.cjs" \
          node -e "
            const { createRequire } = require('module');
            const req = createRequire(process.env.RUNNER);
            const m = req('@axe-core/playwright');
            if (typeof (m.AxeBuilder || m.default) !== 'function') {
              console.error('::error::@axe-core/playwright installed but exports no AxeBuilder constructor.');
              process.exit(1);
            }
            const pw = req('@playwright/test');
            if (!pw.chromium) {
              console.error('::error::@playwright/test resolved from the axe runner but exports no chromium.');
              process.exit(1);
            }
            console.log('axe runner resolves @playwright/test and @axe-core/playwright.');
          "

      - name: Run axe-core against the app routes
        id: axe
        if: ${{ inputs.enable-axe && !cancelled() }}
        env:
          AXE_BASE_URL: http://localhost:8080
          AXE_USER: admin
          AXE_PASSWORD: admin
          AXE_ROUTES: ${{ inputs.axe-routes }}
          AXE_APP_NAME: ${{ inputs.app-name }}
          AXE_INCLUDE: ${{ inputs.axe-include-selector }}
          AXE_EXCLUDE: ${{ inputs.axe-exclude-selector }}
        run: |
          set -euo pipefail
          # The first-run wizard renders a modal over the first page an admin
          # sees. Its markup is Nextcloud core's, not this app's, and axe cannot
          # tell the difference — leaving it on attributes core's defects to the
          # app under test. Reported, never silenced: if it is not enabled the
          # notice below says so rather than a `|| true` swallowing it.
          if php server/occ app:disable firstrunwizard; then
            echo "firstrunwizard disabled for the axe run."
          else
            echo "::notice::firstrunwizard was not enabled (or could not be disabled) — continuing. If it renders, its violations will be attributed to this app."
          fi

          cd "server/apps/${{ inputs.app-name }}"

          # Default to the app's own root route when the caller named none.
          if [ -z "${AXE_ROUTES}" ]; then
            AXE_ROUTES="/index.php/apps/${AXE_APP_NAME}/"
            echo "::notice::axe-routes was empty; defaulting to ${AXE_ROUTES}. A settings-only app has no root route and will fail the HTTP-status guard below — set axe-routes for those."
          fi
          export AXE_ROUTES
          export AXE_OUT="${PWD}/tests/axe/report.json"

          # The runner is a FILE in this repo (hydra-gates/scripts/axe-run.cjs),
          # not a heredoc, and that is load-bearing rather than tidiness.
          #
          # Embedding it inline grew this ONE `run:` step to 22,439 bytes, and a
          # step that large makes GitHub fail to RESOLVE the whole workflow: every
          # caller in the fleet started up with ZERO jobs and a run `name` equal to
          # the raw file path. Bisected with a controlled probe:
          #   file padded to 226 KB, step untouched  -> RESOLVES
          #   step padded with INERT COMMENTS to 21 KB -> ZERO JOBS
          #   45 workflow_call inputs, step untouched -> RESOLVES
          # So it is neither file size nor input count: it is the size of a single
          # step, and the threshold sits between ~19 KB and ~21 KB. Keeping the
          # program in a file puts this step under 2 KB and takes the whole class
          # of failure off the table.

          # `bash -e` would abort on a failing node before `RC=$?` ever ran, so
          # the cleanup would be skipped and the reason lost. Same `&& / ||`
          # idiom the hydra-gates job uses for the same reason.
          # NODE_PATH, because the entry file is in `gates/` and the packages
          # are in `server/apps/<app>/node_modules`. CommonJS resolves from the
          # entry file's own directory upwards, and those two paths are
          # siblings — without this the runner cannot require `@playwright/test`
          # no matter what the install step put on disk. See the probe in that
          # step for the measurement.
          NODE_PATH="${PWD}/node_modules" \
          node "${GITHUB_WORKSPACE}/gates/hydra-gates/scripts/axe-run.cjs" && RC=0 || RC=$?
          exit "$RC"

      - name: Upload the axe-core report
        # Only when the runner succeeded. A failed runner has deliberately left
        # no file, and `if-no-files-found: error` keeps that honest rather than
        # publishing an empty artifact the gates job would then try to read.
        if: ${{ inputs.enable-axe && !cancelled() && steps.axe.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: axe-report
          path: server/apps/${{ inputs.app-name }}/tests/axe/report.json
          retention-days: 14
          if-no-files-found: error

      # ══ Spec-to-test coverage (#189) ═══════════════════════════════════════
      #
      # This step used to compute, warn about, and ignore a number that was not
      # coverage. All three halves of that are fixed here; the argument is
      # recorded on the `playwright-coverage-threshold` input at the top of the
      # file, and the short version is:
      #
      #   * `::warning::` with no non-zero exit -> the threshold could not fail
      #     anything, ever. It now `::error::`s and exits 1.
      #   * `tests.length / scenarios.length` is a ratio of two totals that are
      #     never compared to each other. It is replaced by real per-scenario
      #     matching. The old ratio survives as `testsPerScenarioPercent`,
      #     reported and never gated on, so nobody loses a number they were
      #     watching.
      #   * `scenarios.length === 0 ? … : 100` scored a repo with no parseable
      #     scenarios at 100%. Zero enforceable scenarios is now NOT MEASURABLE
      #     and fails, because a measurement that could not be taken is not a
      #     pass.
      #
      # WHAT "COVERED" MEANS NOW. A scenario is covered when some Playwright
      # test file carries an `@e2e` reference that resolves to its slug —
      # `@e2e <spec-name>::<slug>` or `@e2e openspec/specs/<name>/spec.md#<slug>`
      # — and a scenario carrying `@e2e exclude <reason>` (at scenario,
      # requirement or whole-spec level) leaves the denominator entirely. That
      # is deliberately the SAME dialect as hydra-gates gate-19
      # (`check_e2e_coverage.py`), so a repo annotates once and both numbers
      # move together. The division of labour: gate-19 is DIFF-SCOPED and blocks
      # a PR that adds an unannotated scenario; this is the WHOLE-REPO figure
      # and blocks on the standing floor. gate-19 is not invoked from here on
      # purpose — this job has no hydra-gates checkout, and adding one would
      # make the E2E job depend on a second repository to report a number.
      #
      # KNOWN GAP, stated here rather than discovered later. gate-19 was
      # rewritten in #249 to read test files with a real JS parser, so it can
      # tell that an `@e2e` reference sits inside a `describe.skip` or an empty
      # test body and refuse to count it. This step reads the annotation as
      # TEXT, so it counts such a reference as covered. That makes this number
      # an UPPER BOUND on real coverage, and the two figures can legitimately
      # disagree in that one direction. It is a deliberate trade: closing the
      # gap means shipping a JS parser into this heredoc, and gate-19 already
      # catches the case on every PR that touches a spec. DO NOT read a passing
      # threshold here as evidence that gate-19 would also pass.
      #
      # WHY A HEREDOC RATHER THAN `node -e`. The program is now long enough to
      # need a test, and a `node -e` string with `${{ }}` interpolated into its
      # middle cannot be executed anywhere except inside a GitHub runner. As a
      # file fed only by environment variables it is a plain Node program, and
      # `scripts/test-spec-coverage-gate.py` extracts THIS text out of THIS file
      # and runs it against fixtures — including a fixture that proves the gate
      # can fail, which #189 correctly points out no run could previously show.
      - name: Generate spec-to-test coverage report
        if: ${{ inputs.enable-playwright-coverage && !cancelled() }}
        env:
          SPEC_COVERAGE_THRESHOLD: ${{ inputs.playwright-coverage-threshold }}
          PLAYWRIGHT_TEST_PATH: ${{ inputs.playwright-test-path }}
        run: |
          cd server/apps/${{ inputs.app-name }}
          cat > /tmp/spec-coverage.js <<'SPEC_COVERAGE_JS'
          // Spec-to-test coverage — real per-scenario matching.
          //
          // Env: SPEC_COVERAGE_THRESHOLD, PLAYWRIGHT_TEST_PATH, SPEC_COVERAGE_OUT
          // Exit: 0 measured and at/above threshold; 1 below threshold, or the
          //       measurement could not be taken at all.
          'use strict';

          var fs = require('fs');
          var path = require('path');

          var THRESHOLD = Number(process.env.SPEC_COVERAGE_THRESHOLD || '0');
          var TEST_DIR = process.env.PLAYWRIGHT_TEST_PATH || 'tests/e2e';
          var OUT = process.env.SPEC_COVERAGE_OUT || 'playwright-coverage.json';
          var SPEC_ROOT = 'openspec/specs';

          function slugify(text) {
            var t = String(text).toLowerCase();
            t = t.replace(/[^a-z0-9\s-]/g, '');
            t = t.replace(/[\s_]+/g, '-');
            t = t.replace(/-{2,}/g, '-');
            return t.replace(/^-+|-+$/g, '');
          }

          function walk(dir, acc) {
            acc = acc || [];
            if (!fs.existsSync(dir)) return acc;
            var entries;
            try { entries = fs.readdirSync(dir, { withFileTypes: true }); } catch (e) { return acc; }
            for (var i = 0; i < entries.length; i++) {
              var e = entries[i];
              var full = path.join(dir, e.name);
              if (e.isDirectory()) walk(full, acc);
              else if (e.isFile()) acc.push(full);
            }
            return acc;
          }

          var EXCLUDE_RE = /@e2e\s+exclude\b[ \t]*(.*?)\s*$/;
          // A WHOLE-SPEC exclusion must be a standalone directive line (after
          // optional markdown bullet/quote/heading markers), so prose that
          // merely mentions the token does not silently void an entire spec.
          var WHOLE_SPEC_EXCLUDE_RE = /^[ \t>*#-]*@e2e\s+exclude\b[ \t]*(.*?)\s*$/;

          function parseExclusion(line) {
            var m = EXCLUDE_RE.exec(line);
            if (!m) return null;
            return { reason: m[1].trim() || null };
          }

          // Format A: `#### Scenario: <title>`
          var SCENARIO_RE = /^#{4}\s+Scenario:\s*(.+)$/i;
          // Format B parent: `### Requirement: …` or `### REQ-xxx: …`
          var REQUIREMENT_RE = /^#{3}\s+(?:Requirement:|REQ-[A-Za-z0-9_-]+:)\s*(.*)$/;
          var ALT_MARKER_RE = /^\*\*Scenarios?:\*\*\s*$/i;
          var ALT_ITEM_RE = /^(\d+)\.\s+\*\*(?:GIVEN|WHEN)\b/i;

          function parseSpecFile(file) {
            var specName = path.basename(path.dirname(file));
            var lines = fs.readFileSync(file, 'utf8').split(/\r?\n/);
            var out = [];

            var wholeExcluded = false, wholeReason = null;
            for (var h = 0; h < lines.length; h++) {
              if (REQUIREMENT_RE.test(lines[h]) || SCENARIO_RE.test(lines[h])) break;
              var wm = WHOLE_SPEC_EXCLUDE_RE.exec(lines[h]);
              if (wm) { wholeExcluded = true; wholeReason = wm[1].trim() || null; break; }
            }

            var reqSlug = null, reqExcluded = false, reqReason = null;
            var i = 0;
            while (i < lines.length) {
              var line = lines[i];

              var rm = REQUIREMENT_RE.exec(line);
              if (rm) {
                var reqText = rm[1].trim() || line.replace(/^#+\s+/, '').trim();
                reqSlug = slugify(reqText);
                var rex = parseExclusion(line);
                reqExcluded = !!rex;
                reqReason = rex ? rex.reason : null;
                for (var k = i + 1; k < lines.length && k <= i + 3; k++) {
                  if (REQUIREMENT_RE.test(lines[k]) || SCENARIO_RE.test(lines[k])) break;
                  var rex2 = parseExclusion(lines[k]);
                  if (rex2) { reqExcluded = true; reqReason = reqReason || rex2.reason; break; }
                }
                i++;
                continue;
              }

              var sm = SCENARIO_RE.exec(line);
              if (sm) {
                var title = sm[1].trim();
                var block = [line];
                var j = i + 1;
                while (j < lines.length && !/^#{1,4}\s/.test(lines[j])) { block.push(lines[j]); j++; }
                var sEx = null;
                for (var b = 0; b < block.length; b++) { sEx = sEx || parseExclusion(block[b]); }
                var excluded = wholeExcluded || reqExcluded || !!sEx;
                var reason = wholeExcluded ? wholeReason : (sEx ? sEx.reason : (reqExcluded ? reqReason : null));
                out.push({
                  spec: specName, file: file, label: 'Scenario: ' + title,
                  slug: slugify(title), excluded: excluded, reason: reason
                });
                i = j;
                continue;
              }

              if (ALT_MARKER_RE.test(line) && reqSlug) {
                var j2 = i + 1;
                while (j2 < lines.length && !/^#{1,4}\s/.test(lines[j2])) {
                  var am = ALT_ITEM_RE.exec(lines[j2]);
                  if (am) {
                    var itemEx = parseExclusion(lines[j2]);
                    var ex2 = wholeExcluded || reqExcluded || !!itemEx;
                    var rsn2 = wholeExcluded ? wholeReason : (itemEx ? itemEx.reason : (reqExcluded ? reqReason : null));
                    out.push({
                      spec: specName, file: file, label: reqSlug + ' scenario ' + am[1],
                      slug: reqSlug + '-scenario-' + am[1], excluded: ex2, reason: rsn2
                    });
                  }
                  j2++;
                }
                i = j2;
                continue;
              }

              i++;
            }
            return out;
          }

          // `@e2e <path>#<slug>` / `@e2e <spec>::<slug>`. `exclude` is a
          // directive, not a reference, so it must not be read as one.
          var REF_RE = /@e2e\s+(?!exclude\b)(\S+)/g;

          function parseTestFile(file) {
            var content = fs.readFileSync(file, 'utf8');
            var refs = [];
            var m;
            REF_RE.lastIndex = 0;
            while ((m = REF_RE.exec(content)) !== null) {
              var raw = m[1];
              var slug = null;
              if (raw.indexOf('#') !== -1) slug = raw.split('#').pop();
              else if (raw.indexOf('::') !== -1) slug = raw.split('::').pop();
              if (slug) refs.push(slugify(slug));
            }
            var titles = content.match(/test\(['"`]([^'"`]+)/g) || [];
            return { refs: refs, tests: titles.length };
          }

          var specFiles = walk(SPEC_ROOT).filter(function (f) {
            var b = path.basename(f);
            return b === 'spec.md' || b === 'specs.md';
          });

          var scenarios = [];
          for (var s = 0; s < specFiles.length; s++) {
            scenarios = scenarios.concat(parseSpecFile(specFiles[s]));
          }

          var testFiles = walk(TEST_DIR).filter(function (f) {
            return /\.(spec|test)\.(ts|js)$/.test(f);
          });

          var referenced = Object.create(null);
          var testCount = 0;
          var refCount = 0;
          for (var t = 0; t < testFiles.length; t++) {
            var parsed = parseTestFile(testFiles[t]);
            testCount += parsed.tests;
            for (var r = 0; r < parsed.refs.length; r++) {
              refCount++;
              (referenced[parsed.refs[r]] = referenced[parsed.refs[r]] || []).push(testFiles[t]);
            }
          }

          var total = scenarios.length;
          var excluded = 0, covered = 0;
          var uncoveredList = [];
          for (var x = 0; x < scenarios.length; x++) {
            var sc = scenarios[x];
            if (sc.excluded) { excluded++; sc.status = 'excluded'; continue; }
            if (referenced[sc.slug]) { covered++; sc.status = 'covered'; sc.coveredBy = referenced[sc.slug]; }
            else { sc.status = 'uncovered'; uncoveredList.push(sc.spec + '#' + sc.slug); }
          }

          var enforceable = total - excluded;
          var measurable = enforceable > 0;
          var coverage = measurable ? Math.round((covered / enforceable) * 100) : null;

          var report = {
            metric: 'scenario-coverage',
            metricDescription: 'percent of non-excluded openspec scenarios referenced by an @e2e annotation in a Playwright test',
            specScenarios: total,
            excludedScenarios: excluded,
            enforceableScenarios: enforceable,
            coveredScenarios: covered,
            uncoveredScenarios: enforceable - covered,
            playwrightTests: testCount,
            e2eReferences: refCount,
            // The OLD number, kept under a name that says what it is: two
            // independent totals divided by each other. Reported, never gated.
            testsPerScenarioPercent: total > 0 ? Math.round((testCount / total) * 100) : null,
            measurable: measurable,
            coverage: coverage,
            threshold: THRESHOLD,
            uncovered: uncoveredList.slice(0, 200),
            scenarios: scenarios
          };

          fs.writeFileSync(OUT, JSON.stringify(report, null, 2));

          console.log('Spec scenarios found:     ' + total);
          console.log('  @e2e-excluded:          ' + excluded);
          console.log('  enforceable:            ' + enforceable);
          console.log('  covered by an @e2e ref: ' + covered);
          console.log('Playwright test() calls:  ' + testCount + '   (reported, NOT gated on)');
          console.log('@e2e references found:    ' + refCount);
          console.log('tests-per-scenario:       ' + report.testsPerScenarioPercent + '%  (reported, NOT gated on)');

          if (!measurable) {
            console.log('::error::NOT MEASURABLE - no enforceable scenarios found under ' + SPEC_ROOT + '. This is a FAILURE TO MEASURE, not 100% coverage: a repo with no parseable scenarios has proved nothing. Expected `#### Scenario: <title>` headings, or `### REQ-x:`/`### Requirement:` followed by `**Scenarios:**` and numbered `N. **GIVEN/WHEN**` items, in openspec/specs/*/spec.md.');
            process.exit(1);
          }

          console.log('Scenario coverage:        ' + coverage + '%  (threshold ' + THRESHOLD + '%)');

          if (coverage < THRESHOLD) {
            console.log('::error::Scenario coverage ' + coverage + '% is below the configured threshold of ' + THRESHOLD + '%. ' + (enforceable - covered) + ' of ' + enforceable + ' enforceable scenarios have no @e2e reference in any Playwright test.');
            var show = uncoveredList.slice(0, 25);
            for (var u = 0; u < show.length; u++) console.log('  uncovered: ' + show[u]);
            if (uncoveredList.length > show.length) console.log('  ... and ' + (uncoveredList.length - show.length) + ' more (full list in ' + OUT + ')');
            process.exit(1);
          }

          console.log('Scenario coverage meets the threshold.');
          SPEC_COVERAGE_JS
          node /tmp/spec-coverage.js

      - name: Upload Playwright report
        if: always()
        # `tests/e2e/…` is included because that is where the scaffolded config
        # in most fleet repos actually writes. With only the app-root paths
        # listed, both upload steps matched nothing — and `if-no-files-found:
        # ignore` meant they said so quietly and uploaded an empty artifact. A
        # red run left no report and no traces to read, which is precisely when
        # you need them. Extra paths are harmless: unmatched ones are ignored.
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            server/apps/${{ inputs.app-name }}/playwright-report/
            server/apps/${{ inputs.app-name }}/tests/e2e/playwright-report/
            server/apps/${{ inputs.app-name }}/playwright-coverage.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: |
            server/apps/${{ inputs.app-name }}/test-results/
            server/apps/${{ inputs.app-name }}/tests/e2e/test-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Show Nextcloud log on failure
        if: failure()
        run: |
          echo "=== Last 50 lines of Nextcloud log ==="
          tail -50 server/data/nextcloud.log 2>/dev/null | python3 -m json.tool --no-ensure-ascii 2>/dev/null || tail -50 server/data/nextcloud.log 2>/dev/null || echo "No log found"

  # ╔══════════════════════════════════════════════╗
  # ║  STAGE 2 (cont.) — Journeydoc capture         ║
  # ║                                               ║
  # ║  Runs the docs-capture Playwright project     ║
  # ║  (tests/e2e/docs-screenshots.spec.ts) against ║
  # ║  a freshly-installed Nextcloud, then commits  ║
  # ║  any new/changed screenshots back to the      ║
  # ║  calling repo and optionally dispatches a     ║
  # ║  docs-deploy workflow.                        ║
  # ║                                               ║
  # ║  Reference: ADR-030 (journeydoc pattern) in   ║
  # ║  ConductionNL/hydra/openspec/architecture/.   ║
  # ║                                               ║
  # ║  Recommended invocation (per-app):            ║
  # ║                                               ║
  # ║    # .github/workflows/docs-capture.yml       ║
  # ║    on:                                        ║
  # ║      schedule:                                ║
  # ║        - cron: "27 3 * * *"   # nightly       ║
  # ║      workflow_dispatch:                       ║
  # ║    jobs:                                      ║
  # ║      capture:                                 ║
  # ║        uses: ConductionNL/.github/            ║
  # ║              .github/workflows/quality.yml@main║
  # ║        with:                                  ║
  # ║          app-name: <slug>                     ║
  # ║          enable-journeydoc-capture: true      ║
  # ║          enable-frontend: false               ║
  # ║          enable-license-check: false          ║
  # ║          enable-sbom: false                   ║
  # ║          enable-features-extract: false       ║
  # ║          journeydoc-deploy-workflow: \         ║
  # ║            documentation.yml                  ║
  # ║                                               ║
  # ║  Don't enable in your main code-quality.yml — ║
  # ║  it spins up a full Nextcloud + Postgres +    ║
  # ║  Playwright for every run. Nightly is plenty. ║
  # ╚══════════════════════════════════════════════╝

  journeydoc-capture:
    # `needs.security.result != 'failure'` removed by #194, with the rest of the
    # test tier. `needs: [security]` is kept for ordering only — `!cancelled()`
    # suppresses the implicit `success()`, so this job reaches its own verdict
    # whatever the advisory feed says. See the `security` job.
    #
    # `needs: [security]` KEPT. It is a scheduling edge only (the `if:` reads no
    # result from it) and security resolves in seconds, so it costs no
    # measurable time. Unlike php-quality on the phpunit/newman/playwright jobs,
    # there was nothing here worth removing.
    if: ${{ inputs.enable-journeydoc-capture && !cancelled() }}
    runs-on: ubuntu-latest
    name: "Journeydoc Capture (screenshots)"
    # `nextcloud-matrix` supplies the server this job checks out. Real edge.
    needs: [security, nextcloud-matrix]
    # UNMEASURED: no caller in the fleet currently sets
    # `enable-journeydoc-capture: true`, so this job has never executed (312
    # skipped records, 0 executions, across 15 repos). Its step list is a
    # superset of the Playwright job's — full Nextcloud install, frontend build,
    # a Playwright project, plus a commit and a workflow dispatch — so it is
    # bounded above the Playwright job's 45 min rather than at it. Revisit with
    # real numbers once a caller enables it.
    timeout-minutes: 60
    permissions:
      contents: write
      actions: write

    services:
      postgres:
        image: ${{ inputs.database == 'pgsql' && 'postgres:16' || '' }}
        env:
          POSTGRES_USER: nextcloud
          POSTGRES_PASSWORD: nextcloud
          POSTGRES_DB: nextcloud
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U nextcloud"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout Nextcloud server
        uses: actions/checkout@v4
        with:
          repository: nextcloud/server
          # THE single server for this job — the numerically highest stable
          # branch in the resolved set, published by the `nextcloud-matrix` job.
          # It used to be entry [0] of a hand-written array, and the action this
          # now derives from returns its branches OLDEST-FIRST, so reading a
          # position would silently have moved this job onto the oldest
          # supported server. See the comment on `nextcloud-matrix`.
          ref: ${{ needs.nextcloud-matrix.outputs.single-server }}
          path: server

      - name: Checkout server submodules
        run: |
          cd server
          git submodule update --init 3rdparty

      - name: Checkout app
        # Default token (github.token) is the caller's GITHUB_TOKEN with
        # contents:write — we need that for the screenshot commit-back later.
        uses: actions/checkout@v4
        with:
          path: server/apps/${{ inputs.app-name }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}
          extensions: mbstring, intl, sqlite3, pgsql, pdo_pgsql, zip, gd, curl, xml, json
          tools: composer:v2

      - name: Checkout additional apps
        if: ${{ inputs.additional-apps != '[]' }}
        run: |
          echo '${{ inputs.additional-apps }}' | jq -c '.[]' | while read -r app; do
            repo=$(echo "$app" | jq -r '.repo')
            name=$(echo "$app" | jq -r '.app')
            ref=$(echo "$app" | jq -r '.ref // "main"')
            echo "Checking out $repo ($name) at $ref..."
            git clone --depth 1 --branch "$ref" "https://github.com/$repo.git" "server/apps/$name"
            if [ -f "server/apps/$name/composer.json" ]; then
              cd "server/apps/$name"
              composer install --no-progress --prefer-dist --optimize-autoloader --no-dev
              cd -
            fi
          done

      - name: Install Nextcloud
        run: |
          cd server
          if [ "${{ inputs.database }}" = "pgsql" ]; then
            php occ maintenance:install \
              --database pgsql \
              --database-host 127.0.0.1 \
              --database-port 5432 \
              --database-name nextcloud \
              --database-user nextcloud \
              --database-pass nextcloud \
              --admin-user admin \
              --admin-pass admin
          else
            php occ maintenance:install \
              --database ${{ inputs.database }} \
              --admin-user admin \
              --admin-pass admin
          fi
          # A REQUIRED additional app that does not enable is an ENVIRONMENT
          # failure, and it must not be allowed to resurface as APPLICATION
          # failures. It used to: `|| echo "::warning::…, continuing"` let the
          # run proceed without the dependency, and the consuming app's tests
          # then died on the absent classes.
          #
          # Measured on ConductionNL/hermiq, full-scope run 31490144919, six
          # PHPUnit cells, perfect 6/6 correlation:
          #
          #   enable ok      -> Tests: 1500, Errors: 5, Failures: 1   (x3)
          #   enable FAILED  -> Tests: 1500, Errors: 12               (x3)
          #
          # The seven extra "errors" were `Interface
          # "OCA\OpenRegister\Service\Flow\IFlowNodeLogActions" not found` and
          # `Call to undefined method MockObject_ToolRegistryFacade::
          # describeTools()` — which read as app debt and were an absent app.
          # Two distinct causes, one deterministic (OpenRegister declares
          # min-version="32"; the cell was stable31) and one transient
          # (`curl error 60 … self-signed certificate` during composer install
          # left Twig missing, so enabling crashed). Both deserve a red job:
          # the first is a real configuration error, the second is re-runnable.
          #
          # ⚠️ The failure flag goes through a FILE, not a variable. The loop
          # body runs in a subshell (it is fed by a pipeline), so a variable set
          # inside it is invisible after `done` — the same trap the gate runner
          # documents at its gate-30 loop.
          if [ '${{ inputs.additional-apps }}' != '[]' ]; then
            rm -f "${RUNNER_TEMP:-/tmp}/additional-app-enable-failed"
            echo '${{ inputs.additional-apps }}' | jq -r '.[].app' | while read -r name; do
              echo "Enabling app: $name"
              if ! php occ app:enable "$name"; then
                echo "::error::Failed to enable required additional app '$name'. This is an ENVIRONMENT failure, not an application failure — the run cannot measure this repository without it. Common causes: the app declares a min-version above the Nextcloud ref this cell tests, or its composer install did not complete."
                echo "$name" >> "${RUNNER_TEMP:-/tmp}/additional-app-enable-failed"
              fi
            done
            if [ -s "${RUNNER_TEMP:-/tmp}/additional-app-enable-failed" ]; then
              echo "::error::Aborting: $(tr '\n' ' ' < "${RUNNER_TEMP:-/tmp}/additional-app-enable-failed")could not be enabled."
              exit 1
            fi
          fi

      # ── Composer's DOWNLOAD cache, not `vendor/` ──────────────────────────
      #
      # `~/.cache/composer` holds the fetched dist archives and the metadata
      # composer would otherwise re-download from Packagist on every run.
      # Caching it is safe in a way that caching `vendor/` is not: composer
      # still resolves and installs normally, so a stale or partial cache
      # produces a slower install, never a wrong tree.
      #
      # The key names the app's own composer files by explicit path rather than
      # a `**/` glob, because these jobs check out the whole Nextcloud server
      # alongside the app and a glob would fold NC's composer files into the
      # key — rotating the cache whenever `nextcloud-test-refs` moves, for
      # dependencies that did not change.
      #
      # `composer.lock` is listed first and `composer.json` second because
      # three fleet repos (hermiq, hrmq, zaakafhandelapp) ship no lockfile at
      # all. `hashFiles` ignores patterns that match nothing, so those repos key
      # on composer.json and everyone else keys on both.
      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: ${{ runner.os }}-composer-files-${{ hashFiles(format('server/apps/{0}/composer.lock', inputs.app-name), format('server/apps/{0}/composer.json', inputs.app-name)) }}
          restore-keys: ${{ runner.os }}-composer-files-

      - name: Install and enable app
        run: |
          cd server/apps/${{ inputs.app-name }}
          composer install --no-progress --prefer-dist --optimize-autoloader
          cd ../../
          php occ app:enable ${{ inputs.app-name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "${{ inputs.node-version }}"

      # Deliberately actions/cache rather than setup-node's `cache: npm`: the
      # install below is guarded on `[ -f package.json ]` precisely because a
      # repo may not have one, and `cache: npm` HARD-FAILS on a missing
      # lockfile — it would turn an optional install into a mandatory one and
      # take the whole job with it. See the same note on the Newman job.
      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ inputs.node-version }}-${{ hashFiles(format('server/apps/{0}/package-lock.json', inputs.app-name)) }}
          restore-keys: |
            ${{ runner.os }}-npm-${{ inputs.node-version }}-
            ${{ runner.os }}-npm-

      - name: Install app npm dependencies
        run: |
          cd server/apps/${{ inputs.app-name }}
          if [ -f "package.json" ]; then
            npm ci
          fi

      - name: Install Playwright
        # Same bound, same reason as the playwright job's copy of this step: an
        # apt stall inside `--with-deps` otherwise consumes the job's cap and
        # cancels it before any capture runs, producing no verdict at all.
        timeout-minutes: 10
        run: |
          cd server/apps/${{ inputs.app-name }}
          npm install --save-dev @playwright/test

          # ── WHY THIS IS TWO COMMANDS AND NOT `--with-deps` ──────────────────
          #
          # `--with-deps` does two unrelated things in one process: download the
          # browser binaries from a CDN, and `apt-get install` the system
          # libraries. Measured 2026-08-19 across THREE runs in one morning
          # (app-versions development, app-versions #151, hrmq #87), the
          # combined command printed NOT ONE LINE of output and hung until the
          # job's 45-minute cap killed it:
          #
          #     Terminate orphan process: pid (3857)
          #         (npm exec playwright install --with-deps chromium)
          #
          # Silence from the first instant is the signature of apt blocking on
          # /var/lib/dpkg/lock-frontend — apt waits for that lock forever by
          # design and says nothing while it does. Same mechanism as the
          # `Install PDF tools` stall in #504.
          #
          # Split, the two halves can be treated according to what they are:
          #
          # 1. The browser download is REQUIRED and is a plain CDN fetch that
          #    prints progress, so a stall there is visible and fatal.
          npx playwright install chromium

          # 2. The system libraries are ATTEMPTED, bounded, and NOT fatal.
          #    GitHub's ubuntu runner image already ships the libraries chromium
          #    needs, which is why the suites that got past this step ran fine.
          #    A `timeout` gives apt the bound it will not give itself.
          #
          #    ⚠️ NOT-FATAL IS A DELIBERATE TRADE, NOT A SWALLOWED ERROR. If a
          #    library really is missing, the browser fails to launch in the
          #    test step and Playwright says exactly which one — a real verdict
          #    about a real problem. The alternative it replaces is a 45-minute
          #    cancellation that produces no tally, no trace and no report while
          #    still rendering as a red check.
          if timeout 300 npx playwright install-deps chromium; then
            echo "Playwright system dependencies installed."
          else
            echo "::warning::playwright install-deps did not finish within 5m (apt lock or mirror). Continuing: the runner image ships these libraries, and a genuinely missing one fails loudly at browser launch."
          fi

      - name: Build app frontend
        # Same rationale as the playwright job: SPA mount via Util::addScript()
        # needs the bundle on disk before the docs-capture spec navigates.
        run: |
          cd server/apps/${{ inputs.app-name }}
          if [ -f "package.json" ] && node -e "process.exit(require('./package.json').scripts && require('./package.json').scripts.build ? 0 : 1)" 2>/dev/null; then
            echo "Building app frontend with 'npm run build'…"
            npm run build
          else
            echo "No 'build' script in package.json; skipping frontend build."
          fi

      - name: Validate journeydoc capture spec exists
        run: |
          cd server/apps/${{ inputs.app-name }}
          if [ ! -f "tests/e2e/docs-screenshots.spec.ts" ]; then
            echo "::error::Journeydoc capture spec not found at tests/e2e/docs-screenshots.spec.ts. See ADR-030."
            exit 1
          fi
          # Confirm playwright config declares a 'docs-capture' project — without it,
          # `--project docs-capture` silently runs nothing and we'd commit nothing.
          if ! grep -q "name: 'docs-capture'" playwright.config.ts 2>/dev/null && \
             ! grep -q 'name: "docs-capture"' playwright.config.ts 2>/dev/null; then
            echo "::error::playwright.config.ts does not declare a 'docs-capture' project. Run /journeydoc-init to regenerate the scaffold (ADR-030)."
            exit 1
          fi

      - name: Start PHP built-in server
        # Same front-controller router as the Playwright job — see the long
        # comment on that step. The docs-capture project drives the same
        # pretty Nextcloud URLs the regression specs do, so without the router
        # every tutorial screenshot would be shot against a 404 page.
        run: |
          cd server
          cat > ci-router.php <<'ROUTER'
          <?php
          $path = parse_url($_SERVER['REQUEST_URI'], PHP_URL_PATH) ?: '/';
          if ($path !== '/' && is_file(__DIR__ . $path)) {
              return false;
          }
          $segments = explode('/', ltrim($path, '/'));
          $prefix = '';
          foreach ($segments as $i => $segment) {
              $prefix .= '/' . $segment;
              if (substr($segment, -4) !== '.php'
                  || $prefix === '/index.php'
                  || !is_file(__DIR__ . $prefix)
              ) {
                  continue;
              }
              $rest = implode('/', array_slice($segments, $i + 1));
              $_SERVER['SCRIPT_NAME'] = $prefix;
              $_SERVER['SCRIPT_FILENAME'] = __DIR__ . $prefix;
              $_SERVER['PHP_SELF'] = $path;
              $_SERVER['PATH_INFO'] = $rest === '' ? '' : '/' . $rest;
              require __DIR__ . $prefix;
              return true;
          }
          $_SERVER['SCRIPT_NAME'] = '/index.php';
          $_SERVER['SCRIPT_FILENAME'] = __DIR__ . '/index.php';
          $_SERVER['PHP_SELF'] = '/index.php';
          require __DIR__ . '/index.php';
          ROUTER
          php -S 0.0.0.0:8080 ci-router.php > /tmp/php-server.log 2>&1 &
          PHP_PID=$!
          echo "${PHP_PID}" > /tmp/php-server.pid
          timeout 15 bash -c 'until curl -sf -o /dev/null http://localhost:8080/status.php; do sleep 0.5; done' || {
            echo "::error::PHP built-in server failed to come up on :8080."
            cat /tmp/php-server.log
            exit 1
          }
          echo "PHP built-in server alive (pid=${PHP_PID})."

      - name: Seed test data
        if: inputs.playwright-seed-command != ''
        env:
          # Same contract as the E2E job's seed step above — see the long note
          # there. Short version (#192): interpolating the input into the
          # script body made `eval ${{ … }}` unquoted, so an `a && b` seed was
          # split by THIS shell, eval got only `a`, and bash's `set -e`
          # exemption for `&&` lists let a failing first stage exit 0 while
          # printing "Seed command completed."
          SEED_COMMAND: ${{ inputs.playwright-seed-command }}
        run: |
          cd server
          printf 'Running seed command: %s\n' "$SEED_COMMAND"
          # Quoted expansion: the whole seed reaches eval as one unit and
          # eval's combined status is the step's. eval is retained because
          # fleet callers pass assignment prefixes and `||` lists.
          eval "$SEED_COMMAND" && SEED_RC=0 || SEED_RC=$?
          if [ "$SEED_RC" -ne 0 ]; then
            # Diagnostics on STDERR — an `::error::` on stdout is swallowed by
            # any caller that captures the step's output with `$(…)`.
            {
              echo "::error::Seed command failed with exit ${SEED_RC}: ${SEED_COMMAND}"
              echo "Refusing to capture documentation screenshots of a half-seeded"
              echo "instance — the images would be committed and would look real."
            } >&2
            exit "$SEED_RC"
          fi
          echo "Seed command completed (exit 0)."

      - name: Run docs-capture Playwright project
        run: |
          cd server/apps/${{ inputs.app-name }}
          npx playwright test --project docs-capture
        env:
          BASE_URL: http://localhost:8080
          NEXTCLOUD_URL: http://localhost:8080
          NC_BASE_URL: http://localhost:8080
          ADMIN_USER: admin
          ADMIN_PASSWORD: admin
          NC_ADMIN_USER: admin
          NC_ADMIN_PASS: admin

      - name: Commit refreshed screenshots if changed
        id: commit
        run: |
          set -euo pipefail
          cd server/apps/${{ inputs.app-name }}
          OUTPUT_PATH="${{ inputs.journeydoc-output-path }}"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage anything under the journeydoc output path (new files + diffs).
          git add "$OUTPUT_PATH" 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No screenshot changes — nothing to commit."
            echo "changed=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Count what we're committing for the message.
          CHANGED=$(git diff --staged --name-only -- "$OUTPUT_PATH" | wc -l)
          git commit -m "docs(screenshots): refresh journeydoc captures (${CHANGED} files) [skip ci]"

          # Push to the branch this workflow ran on. Use github.ref_name (e.g.
          # "main") not github.ref (e.g. "refs/heads/main") — git push wants a
          # bare branch.
          REF_NAME="${{ github.ref_name }}"
          # FAIL LOUDLY if the push is refused (#61). This used to swallow the
          # rejection behind a `::warning::` and set changed=0, which made a
          # refused push indistinguishable from "no screenshots changed" — the
          # captures silently never landed and the job still reported success.
          # The step runs under `set -euo pipefail`, so a non-zero `git push`
          # fails the job. The screenshots are still uploaded as an artifact by
          # the `if: always()` step below, so a refusal is recoverable by hand.
          git push origin "HEAD:${REF_NAME}"
          echo "Screenshots pushed to ${REF_NAME}."
          echo "changed=1" >> "$GITHUB_OUTPUT"

      - name: Dispatch deploy workflow if screenshots changed
        if: ${{ inputs.journeydoc-deploy-workflow != '' && steps.commit.outputs.changed == '1' }}
        env:
          GH_TOKEN: ${{ github.token }}
        # GITHUB_TOKEN-driven pushes do NOT auto-trigger workflow_run on other
        # workflows (anti-loop). Explicitly dispatch the docs-deploy workflow
        # so the site rebuilds with the new screenshots.
        run: |
          gh workflow run "${{ inputs.journeydoc-deploy-workflow }}" \
            --repo "${{ github.repository }}" \
            --ref "${{ github.ref_name }}"

      - name: Upload screenshots as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journeydoc-screenshots
          path: server/apps/${{ inputs.app-name }}/${{ inputs.journeydoc-output-path }}/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Playwright trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: journeydoc-playwright-traces
          path: server/apps/${{ inputs.app-name }}/test-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Show Nextcloud log on failure
        if: failure()
        run: |
          echo "=== Last 50 lines of Nextcloud log ==="
          tail -50 server/data/nextcloud.log 2>/dev/null | python3 -m json.tool --no-ensure-ascii 2>/dev/null || tail -50 server/data/nextcloud.log 2>/dev/null || echo "No log found"

      - name: Record result
        if: always()
        run: |
          mkdir -p quality-results
          echo "${{ job.status }}" > quality-results/journeydoc-capture.txt
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-journeydoc-capture
          path: quality-results/

  # ╔══════════════════════════════════════════════╗
  # ║  STAGE 3 — Reporting & coverage baseline      ║
  # ╚══════════════════════════════════════════════╝

  baseline-protection:
    if: ${{ inputs.enable-coverage-guard && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    name: "Coverage Baseline Protection"
    # Observed across 8 executions: median 0.3 min, max 1.0 min (procest).
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # .coverage-baseline is the conservative fail-safe floor — the ratchet
      # proper is the measured merge-base comparison in the phpunit job. This
      # job used to ban every manual change outright, which was coherent only
      # while the push-side job auto-committed the new value. That push has
      # always been rejected on ruleset-protected branches (#61), so the blanket
      # ban left the baseline unchangeable by anyone — bot or human — an
      # unclosable gate.
      #
      # The anti-gaming property that matters is "the floor never goes DOWN", so
      # enforce exactly that: a PR may RAISE the floor but never lower it. Fails
      # closed on any value it cannot parse.
      #
      # Raising it is now optional rather than the way a red push job is closed
      # — that job is gone (see the block further down). A floor left below
      # actual coverage is simply conservative, and is never what blocks a pull
      # request.
      - name: Reject a lowered baseline
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          BASE="origin/${BASE_REF}"

          if ! git diff --name-only "${BASE}...HEAD" | grep -q '^\.coverage-baseline$'; then
            echo "No .coverage-baseline change in this PR."
            exit 0
          fi

          NEW="$(tr -d '[:space:]' < .coverage-baseline)"
          if ! OLD="$(git show "${BASE}:.coverage-baseline" 2>/dev/null | tr -d '[:space:]')"; then
            OLD=""
          fi

          if [ -z "${OLD}" ]; then
            echo "No baseline on ${BASE} — this PR introduces one (${NEW}). Accepted."
            exit 0
          fi

          for v in "${OLD}" "${NEW}"; do
            if ! awk -v v="${v}" 'BEGIN { exit !(v ~ /^[0-9]+(\.[0-9]+)?$/) }'; then
              echo "::error::Unparseable coverage baseline value '${v}' — refusing to guess. Expected a bare number such as 55.54."
              exit 1
            fi
          done

          if awk -v o="${OLD}" -v n="${NEW}" 'BEGIN { exit !(n + 0 < o + 0) }'; then
            echo "::error::.coverage-baseline was LOWERED from ${OLD} to ${NEW}. The baseline is a ratchet — it may be raised, never lowered."
            exit 1
          fi

          echo "Baseline change accepted: ${OLD} -> ${NEW} (not a decrease)."

  # ── "Coverage Baseline Check" (update-baseline) — REMOVED ────────────────
  #
  # This job recomputed the baseline on pushes to main/development and HARD-
  # FAILED when the committed file no longer matched. It is gone, and the
  # asymmetry it created is the reason.
  #
  # It failed on coverage going UP. The phpunit-side guard fails on coverage
  # going DOWN. Between them they demanded that a checked-in constant equal the
  # measurement exactly — and the only way to restore that equality was to
  # commit, in a pull request, the number the tree would measure after that pull
  # request landed. That is a race no author can win, and the fleet ran into it
  # simultaneously: on 2026-08-06 six of the sixteen apps were red here, every
  # one of them for coverage being HIGHER than recorded —
  #
  #   openregister  58.87 -> 58.88      openbuild   57.39 -> 58.83
  #   docudesk      61.39 -> 61.41      larpingapp  67.68 -> 71.73
  #   procest       29.60 -> 29.69      doriath     55.78 -> 55.79
  #
  # Three of those are one or two hundredths of a percent. A gate whose red is
  # produced by a single extra covered statement is not measuring anything worth
  # blocking a mainline for.
  #
  # The staleness requirement was a leftover. While this job auto-committed the
  # recomputed value, "the file equals the measurement" was an invariant a
  # machine maintained. That push was removed when rulesets rejected it (#61),
  # but the invariant it maintained was left behind — and became a standing
  # human obligation against a moving target. The invariant outlived its
  # enforcement mechanism.
  #
  # Nothing is lost by removing it. A push to development is the RESULT of an
  # already-gated merge: there is nothing left to reject, and failing it only
  # produces a mainline no pull request can turn green. The ratchet now lives
  # entirely on the pull request, where a change can still be refused, and its
  # floor is the MEASURED merge base rather than a typed constant — see "Measure
  # merge-base coverage" in the phpunit job. That floor cannot go stale, so the
  # failure mode this job existed to report no longer exists.
  #
  # `.coverage-baseline` survives as a conservative fail-safe floor, still
  # enforced by the phpunit-side guard on pushes, and still protected from being
  # LOWERED by the baseline-protection job above. It will drift below actual
  # coverage over time. That is intended: a floor that is too low is merely
  # conservative, and it is never the binding constraint on a pull request.

  # ── Hydra mechanical gates ──────────────────────
  #
  # The Hydra mechanical quality gates, run from conduction/hydra-gates (this
  # repository, hydra-gates/ — https://github.com/ConductionNL/.github/tree/main/hydra-gates).
  # OPT-IN via enable-hydra-gates; default false. See the input description.
  #
  # Deliberately no count. The package declares its own total and prints it
  # (COVERAGE: N of M declared gates reported a result); that runtime number is
  # the only trustworthy one, because the total moves with the caller's
  # hydra-gates-ref pin and the executed count moves with the repo's diff and
  # toolchain. A hard-coded digit in prose has nothing to reconcile against, so
  # it drifts silently in both directions and outlives the thing it describes.
  #
  # Read the COVERAGE line, not the banner. Gates can skip silently and the job
  # still reports a plain green tick; hydra-gates-require-full-coverage turns
  # incomplete coverage into an error for repos that want that.
  #
  # Two properties this job exists to preserve, both of which have been observed
  # failing silently:
  #
  #   1. THE BASE REF IS EXPLICIT AND FAILS CLOSED. The gates are diff-scoped,
  #      so a base that resolves to nothing makes every gate pass having read no
  #      files — a green indistinguishable from a real one. On a pull_request we
  #      name the PR's actual target branch. We never use @{upstream} (on a
  #      pushed feature branch that is the branch ITSELF, which is exactly the
  #      empty-diff case, and it happens precisely when CI runs) and we never
  #      fall back to HEAD~1 (on a squash-merged mainline that is the previous
  #      release). An unresolvable base exits 99 and prints no green.
  #
  #   2. THE EXIT CODE IS THE FAILURE COUNT. We capture it before deciding the
  #      job verdict, and report 99 ("could not run at all") distinctly from
  #      "N gates failed". A configuration error must never read as a clean tree.
  #
  # The package is checked out as a SIBLING of the app checkout, not inside it,
  # so nothing in the gate package can ever be mistaken for app code under scan.
  hydra-gates:
    # `!cancelled()` is load-bearing, not decoration. `needs:` below implies
    # `success()` on the Playwright job, which would make this whole job vanish
    # for every repo that has the gates on and Playwright off — the gates would
    # stop running on a majority of the fleet, silently, as a side effect of
    # wiring up ONE gate's input. `!cancelled()` suppresses that implicit
    # `success()`, so a skipped or failed Playwright job still lets the gates
    # run and reach their own verdict.
    #
    # MEASURED, not assumed — ConductionNL/.github run 30909727531, a harness
    # that reproduced this exact `needs:`/`if:` pair three times in one run and
    # drove the producer into each of its three states:
    #
    #   producer succeeded -> gates RAN   (needs.playwright.result=success)
    #   producer FAILED    -> gates RAN   (needs.playwright.result=failure)
    #   producer SKIPPED   -> gates RAN   (needs.playwright.result=skipped)
    #
    # Do not "simplify" this to a bare `inputs.enable-hydra-gates`: that
    # restores the implicit `success()` and deletes the job with no red, no
    # skip and no trace whenever Playwright does not succeed.
    if: ${{ inputs.enable-hydra-gates && !cancelled() }}
    runs-on: ubuntu-latest
    name: "Hydra Gates"
    # ── WHY THIS JOB DEPENDS ON PLAYWRIGHT (and why removing it failed) ────
    #
    # gate-33 (axe-core) consumes `tests/axe/report.json`, which can only be
    # produced by a browser against a booted instance. This job has neither: it
    # is a checkout, a shell script and python. The Playwright job is the only
    # place in this file with both, so the report is produced there and handed
    # over as an artifact — and an artifact cannot be downloaded before the job
    # that uploads it has finished. Hence the edge.
    #
    # REMOVING THIS EDGE WAS ATTEMPTED IN #326 AND REVERTED. Recorded here so
    # the next person does not spend the same day on it.
    #
    # The reasoning was: `enable-axe` is opt-in and defaults false, a survey of
    # all 20 consumers on both `main` and `development` found ZERO setting it,
    # and this file's own input docs record gate-33 as SKIPPED "in every repo in
    # the fleet since it was written". So the edge looked like pure
    # serialisation — it put a 31s job behind php-quality -> frontend-build ->
    # playwright, roughly t+7m instead of t+31s, for an input never produced.
    #
    # TWO THINGS KILLED IT.
    #
    # 1. THE SURVEY WAS A SNAPSHOT, NOT A PROPERTY. docudesk#423 is open to set
    #    `enable-axe: true`. "No consumer does X" is a fact with an expiry date,
    #    and building a structural decision on one means the decision expires
    #    with it — silently, in someone else's repository.
    #
    # 2. THE REPLACEMENT WAS WORSE THAN THE PROBLEM. With the edge gone, an
    #    `enable-axe: true` caller cannot receive the artifact, so the job
    #    refused the configuration up front. MEASURED on run 31370581318:
    #    ZERO `[gate-*]` lines were emitted. The refusal sat before the
    #    checkout, so gate-33 produced no verdict AND NEITHER DID THE OTHER 63.
    #    It did not `_skip` with a named reason and it did not `_pass` — the
    #    whole job died. That is precisely the outcome the note on the
    #    `axe-check` step below already forbids: a gate that suppresses sixty
    #    other gates to report itself is its own kind of outage. The axe failure
    #    is RECORDED there and RAISED at the END for exactly this reason.
    #
    # WHAT WAS KEPT INSTEAD. `php-quality` was removed from the `needs:` of
    # phpunit, newman and playwright, where it gated nothing (see the note on
    # the phpunit job). Playwright therefore starts earlier, and this job's
    # verdict lands at roughly t+4.8m rather than t+7m — a real improvement with
    # no new machinery and no case that has never been exercised.
    #
    # THE WAY TO GET FULL PARALLELISM, if someone wants it: `needs:` cannot be
    # conditional in GitHub Actions, so it requires two mutually exclusive jobs
    # (one with the edge for `enable-axe`, one without), which today would mean
    # duplicating ~120 lines of steps for a security-critical runner — and two
    # copies that can drift is the failure mode this file exists to document.
    # Extract these steps into a composite action referenced as
    # `ConductionNL/.github/.github/actions/hydra-gates@main` FIRST (note: a
    # bare `./` path in a reusable workflow resolves against the CALLER's
    # checkout, not this repo), then the two jobs become thin. That is a
    # separate change with its own testing, not a rider on a caching PR.
    needs: [playwright]
    timeout-minutes: 20

    steps:
      - name: Checkout app
        uses: actions/checkout@v4
        with:
          path: app
          # fetch-depth: 0 is REQUIRED, not an optimisation. The gates are
          # diff-scoped; a shallow clone has no base branch to diff against, so
          # the base would not resolve and the run would (correctly) exit 99.
          fetch-depth: 0

      - name: Checkout conduction/hydra-gates
        uses: actions/checkout@v4
        with:
          repository: ConductionNL/.github
          ref: ${{ inputs.hydra-gates-ref }}
          path: gates

      # ── Does the PINNED gate package know what "not applicable" means? ─────
      #
      # This workflow is consumed at @main; the gate package is consumed at
      # whatever tag the caller pinned. The two move independently, so a NEW
      # default here reaches an OLD runner — the pinned-ref hazard running
      # backwards.
      #
      # It is not hypothetical. `hydra-gates-require-full-coverage` was flipped
      # to default TRUE once the runner learned to tell a not-applicable gate
      # from a real gap (#164, released as v1.3.0). Every caller still pinned at
      # v1.0.1 then got the new flag handed to a runner that counts EVERY gate
      # it did not run as a gap. Measured, both red on nothing but gates
      # 4/24/33 — none of which had any subject matter in those repos:
      #
      #   decidesk  job 92432089644  ref v1.0.1  ALL 61 GATES GREEN
      #                              COVERAGE: 58 of 61 / DID NOT RUN: 4 24 33 -> exit 98, JOB FAILED
      #   doriath   job 92363547732  ref v1.0.1  same three gates, same verdict
      #
      # That is precisely the outcome the flag was fixed to stop producing: a
      # legitimately not-applicable gate failing the run. So the flag is only
      # handed to a package that can honour it, and when it is withheld the run
      # says so out loud — a quiet downgrade of a control is how the control
      # stops existing.
      #
      # The probe reads the package's own accounting rather than parsing the
      # ref as a version: a caller may pin a branch, a SHA or a fork, and none
      # of those compare. `_NA_GATES` (runner) and the `NOT APPLICABLE` verdict
      # (wrapper, which recomputes coverage independently) are both introduced
      # by the same change and absent from every earlier tag — verified against
      # the published tags: v1.0.0/v1.0.1/v1.1.0/v1.2.0 have neither, v1.3.0 and
      # v1.4.0 have both.
      #
      # THOSE TWO LITERALS ARE A CONTRACT, NOT AN IMPLEMENTATION DETAIL.
      # Renaming either one in the package would silently disable coverage
      # enforcement in every repo in the fleet, with a warning that reads like
      # an old pin. hydra-gates/tests/test-hydra-gates-bin.sh asserts both, so
      # a rename fails the package's own CI instead.
      - name: Can the pinned gate package tell "not applicable" from a gap?
        id: gatecap
        env:
          GATES_REF: ${{ inputs.hydra-gates-ref }}
        run: |
          set -u
          RUNNER="${GITHUB_WORKSPACE}/gates/hydra-gates/scripts/run-hydra-gates.sh"
          WRAPPER="${GITHUB_WORKSPACE}/gates/hydra-gates/bin/hydra-gates"
          # A missing file is a broken checkout, not an old package. Fail — a
          # capability probe that answers "no" to a question it could not read
          # is the same defect one layer up.
          for f in "${RUNNER}" "${WRAPPER}"; do
            if [ ! -f "${f}" ]; then
              echo "::error::the hydra-gates checkout at ref '${GATES_REF}' has no ${f#"${GITHUB_WORKSPACE}/gates/"}. This is not a version difference — the package did not check out. Nothing was gated."
              exit 1
            fi
          done
          CAP=0
          if grep -q '_NA_GATES' "${RUNNER}" && grep -q 'NOT APPLICABLE' "${WRAPPER}"; then
            CAP=1
          fi
          echo "categories=${CAP}" >> "$GITHUB_OUTPUT"
          if [ "${CAP}" -eq 1 ]; then
            echo "hydra-gates @ ${GATES_REF} reports NOT APPLICABLE separately from SKIPPED — coverage enforcement can be honoured."
          else
            echo "hydra-gates @ ${GATES_REF} predates the coverage accounting fix (v1.3.0)."
          fi

      # ── the floating-caller / pinned-callee contract ──────────────────────
      #
      # THIS WORKFLOW FLOATS ON @main; THE PACKAGE IT DRIVES IS PINNED.
      #
      # A caller references this file as
      # `ConductionNL/.github/.github/workflows/quality.yml@main` while
      # pinning `hydra-gates-ref` to a tag. So the two halves of one system
      # move independently, and every path this workflow executes inside
      # `gates/hydra-gates/` is an UNVERSIONED INTERFACE between them.
      #
      # That interface has broken three times in one day. The decisive one
      # was #168: a change on @main made this workflow execute
      # `gates/hydra-gates/scripts/axe-run.cjs` BY PATH, and every repo whose
      # pin predated that file got a failure whose message named neither the
      # pin nor the file.
      #
      # Pinning both halves from one tag, or floating both, is the real fix
      # and is a human decision — it changes how 22 repos receive gate fixes.
      # Until then this step makes the desync SAY SO. A named refusal is not
      # a fix, but it is the difference between "gate-33 is broken" and
      # "your pin is four fixes behind and here is the file it is missing".
      - name: Verify the pinned gates package satisfies this workflow
        run: |
          set -uo pipefail
          REF='${{ inputs.hydra-gates-ref }}'
          MISSING=""
          for p in \
            bin/hydra-gates \
            scripts/run-hydra-gates.sh \
            scripts/axe-run.cjs \
            scripts/lib/check_spec_anchors.py \
            scripts/lib/check_form_labels.py \
            scripts/lib/check_license_triangle.py \
            scripts/lib/check_no_admin_idor.py \
            scripts/lib/check_semantic_auth.py \
            scripts/lib/check_orphan_auth.py
          do
            [ -e "${GITHUB_WORKSPACE}/gates/hydra-gates/${p}" ] || MISSING="${MISSING} ${p}"
          done
          if [ -n "${MISSING}" ]; then
            echo "::error::hydra-gates-ref '${REF}' does not contain:${MISSING}"
            echo "::error::This workflow floats on @main and executes those paths by name inside the PINNED package, so a pin older than them cannot run the gates they implement. Bump hydra-gates-ref to a tag that includes them. This is NOT a code-quality finding about your repository."
            exit 1
          fi
          echo "Pinned gates package at '${REF}' provides every path this workflow executes."

      # ── Does the APP have node dependencies this job can install? ──────────
      #
      # Detection runs BEFORE setup-node, and the reason is the same one
      # documented on the security and frontend-build jobs: `actions/setup-node`
      # with `cache: npm` HARD-FAILS when there is no lockfile at the path it is
      # given. A PHP-only repo would then lose all sixty-odd gates to a cache
      # setting. So the cache is requested only once a lockfile is known to
      # exist, and its absence is announced rather than fatal.
      #
      # The path is the app ROOT, not `inputs.frontend-path`, because the app
      # root is the only place the gates resolve `node_modules` FROM —
      # scripts/lib/check_icon_vocabulary.py looks in `<app>/node_modules` and
      # `<app>/../node_modules` and nowhere else. Installing into a frontend
      # subdirectory would produce a tree the gates cannot see, which is the
      # current bug wearing a fix's clothing.
      - name: Does the app have node dependencies?
        id: appnode
        run: |
          set -u
          DIR="${GITHUB_WORKSPACE}/app"
          if [ ! -f "${DIR}/package.json" ]; then
            echo "install=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No package.json at the app root, so this repo has no node dependencies to install. Gates that need them (60 icon-vocabulary) will report NOT APPLICABLE or SKIPPED with their own reason — this step is not what decides that."
          elif [ ! -f "${DIR}/package-lock.json" ]; then
            echo "install=false" >> "$GITHUB_OUTPUT"
            # NOTE the escaped backticks. Inside a double-quoted string bash
            # treats a bare backtick pair as COMMAND SUBSTITUTION, so writing
            # this message with plain backticks would have EXECUTED `npm ci`
            # here and pasted its output into the warning — in the one branch
            # that fires precisely when the install is supposed to be skipped.
            echo "::warning::package.json is present at the app root but package-lock.json is not, and \`npm ci\` requires a lockfile. The app's node dependencies are NOT installed, so gate-60 cannot verify that a manifest icon exists upstream and will skip as 'wiring'. Commit a package-lock.json to close that gap."
          else
            echo "install=true" >> "$GITHUB_OUTPUT"
            echo "Found package.json + package-lock.json at the app root — the app's node dependencies will be installed."
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "${{ inputs.node-version }}"
          # Empty string = no caching, which is what setup-node does by
          # default. Written as an expression rather than omitted so the cache
          # is enabled exactly when a lockfile exists to key it on.
          cache: ${{ steps.appnode.outputs.install == 'true' && 'npm' || '' }}
          cache-dependency-path: app/package-lock.json

      # ── The app's own node dependencies ───────────────────────────────────
      #
      # WHY THIS JOB INSTALLS THE APP'S DEPENDENCIES AT ALL.
      #
      # It used to install only the gates package's own `ajv` and nothing else,
      # so `<app>/node_modules` did not exist. gate-60 (icon-vocabulary) resolves
      # `vue-material-design-icons` from there to answer one question: does this
      # manifest icon name exist upstream, or was it invented? With no
      # node_modules it cannot answer, and it reports `SKIPPED (wiring)` — which
      # `--require-full-coverage` counts as a coverage gap and turns into a job
      # failure. Every repo in the fleet declares vue-material-design-icons
      # directly, so the gate's authority was never in doubt; only its
      # environment was missing.
      #
      # MEASURED, as an A/B on one tree that differs ONLY in whether the app's
      # node_modules is present. The subject is a planted true positive: a menu
      # icon named `LedgerOutline`, an MDI component that does not exist
      # upstream and would render blank in every app that copied it.
      #
      #   deps ABSENT (main today) : [gate-60] SKIPPED (wiring)
      #                              RESULT: ALL GATES PASSED — EXCEPT GATES 60,
      #                              WHICH DID NOT RUN.   exit 98
      #   deps PRESENT (this change): [gate-60] FAIL — 1 icon(s) outside the
      #                              canonical vocabulary (ADR-077)   exit 1
      #
      # Read the failing arm carefully: today the job DOES go red, but it goes
      # red about coverage and never names the invented icon. The finding was
      # not merely unreported, it was unobtainable — which is why a `wiring`
      # skip is not a softer version of a FAIL.
      #
      # Removing the planted icon on the same tree returns exit 0 and
      # `[gate-60] icon-vocabulary: PASS`, so the gate is shown able to answer
      # in both directions rather than merely to stop complaining.
      #
      # Deliberately NOT a `download-artifact` from frontend-build. An
      # artifact-dependent job SKIPS when its producer fails, and a skipped job
      # renders as a grey tick rather than a red X — this file already carries
      # several notes about that failure class. Installing in-job keeps the
      # gates both independent and parallel.
      - name: Install the app's node dependencies
        if: steps.appnode.outputs.install == 'true'
        working-directory: app
        # `--ignore-scripts` because this job never builds or runs the app: it
        # reads the tree. Lifecycle scripts would be arbitrary code executed for
        # no benefit to any gate, on a job that checks out pull-request content.
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Install ajv for the manifest gates
        # Installed INTO the package dir so `require('ajv')` from
        # scripts/lib/check_manifest.js resolves by walking up to
        # gates/hydra-gates/node_modules. A global install would need NODE_PATH
        # and would silently not be found.
        #
        # Since 2026-08-03 a miss here is loud rather than survivable: gate-22
        # used to fall back to a structural lint that checks only the AppHost
        # blocks and report the result as a PASS — a manifest certified without
        # ever being schema-validated. It now FAILS with a named reason (the
        # validator exits 3 DEGRADED), exactly as gate-53 already refused to run
        # fail-open. If this step is ever removed, both gates say so.
        run: npm --prefix gates/hydra-gates install --no-save --no-audit --no-fund ajv

      # ── gate-33's subject, handed over from the Playwright job ─────────────
      #
      # continue-on-error so that a missing artifact does not abort the job
      # here with download-artifact's own generic message. The absence is
      # handled one step down, where it can be named — and, since `enable-axe`
      # is an explicit opt-in to enforcement, where it FAILS. It is not
      # tolerated: continue-on-error moves the verdict, it does not soften it.
      - name: Download the axe-core report
        id: axe-download
        if: ${{ inputs.enable-axe }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: axe-report
          path: app/tests/axe

      # A downloaded file is not the same as a report. An artifact that
      # extracted but is empty, truncated, or came from a run that analysed
      # nothing would be read by gate-33 as a CLEAN accessibility result —
      # verified: gate-33 reports PASS on a file containing exactly `{}`. That
      # is the one outcome worse than today's loud skip, because it converts
      # "never measured" into "measured clean".
      #
      # So the file is checked against the provenance the runner writes, and
      # DELETED if it does not hold up — gate-33 can then never read a rejected
      # file as a clean run.
      #
      # Deletion alone is not enough, and this is the second half of the same
      # defect. `enable-axe: true` is an explicit request for accessibility
      # ENFORCEMENT, not for a best-effort attempt. Before this step failed
      # closed, the two ways of having no measurement — the artifact never
      # arrived (Playwright skipped, or crashed before its axe step), and the
      # artifact arrived but was rejected here — both ended in gate-33
      # reporting SKIPPED and the gates job reporting a plain green tick. A
      # `::notice` buried in a three-thousand-line log is not a verdict: the
      # absence of the check looked exactly like the check succeeding, which is
      # the shape this whole file exists to eliminate.
      #
      # So with `enable-axe` set, no usable report is a FAILURE with a named
      # reason and the producer's resolved state quoted in it. The way to not
      # enforce axe is `enable-axe: false` — one line in the caller, visible in
      # a diff and attributable to a person — not a silent green in a log.
      #
      # A/B on this file, same caller and same inputs (gates on, axe on,
      # Playwright — the only producer — off), the arms differing only in which
      # quality.yml they called:
      #
      #   before, quality.yml@main : run 30910234160, Hydra Gates SUCCESS
      #                              "##[notice]No axe report was downloaded"
      #                              "[gate-33] axe-core: SKIPPED"
      #   after,  this branch      : run 30910908474, Hydra Gates FAILURE
      #                              gates still ran and reported in full
      #
      # And the control that bounds the blast radius: the same inputs with
      # `enable-axe: false` — the fleet default and openbuild's live config, the
      # only repo with the gates enabled — run 30911069404, Hydra Gates SUCCESS
      # with both axe steps SKIPPED. Nothing that is green today turns red.
      #
      # Not measured end to end, and worth knowing why: the case where
      # Playwright RUNS AND FAILS. Attempted in run 30911499894 by turning
      # `enable-playwright` on, but this repo is not a Nextcloud app, so the
      # security jobs failed first and the Playwright job's own
      # `needs.security.result != 'failure'` guard turned it back into a skip.
      # The gates job failed correctly there anyway, because what this step
      # branches on is whether a usable report exists, not how the producer
      # resolved — the producer's state appears only in the error text. That
      # the gates job SURVIVES a genuinely failed producer is the thing that
      # needed measuring, and run 30909727531 measured it directly.
      #
      # The failure is RECORDED here and RAISED at the end of the job, not
      # thrown from this step. Measured first as a plain `exit 1` (run
      # 30910345294): it aborted the job before `Run the Hydra gates`, so a
      # missing axe artifact took the other sixty gates down with it and the PR
      # lost all mechanical feedback until someone fixed an unrelated Playwright
      # job. A gate that suppresses sixty other gates to report itself is its
      # own kind of outage. So this step always exits 0, the gates run and print
      # their full report, and the job is failed afterwards.
      - name: The axe report must exist and hold up
        id: axe-check
        if: ${{ inputs.enable-axe }}
        env:
          PLAYWRIGHT_RESULT: ${{ needs.playwright.result }}
        run: |
          set -uo pipefail
          REPORT="${GITHUB_WORKSPACE}/app/tests/axe/report.json"
          if [ ! -f "${REPORT}" ]; then
            echo "unmeasured=absent" >> "$GITHUB_OUTPUT"
            echo "::error::enable-axe is set, but NO axe report reached this job — gate-33 will measure nothing and this run carries no accessibility verdict at all. The Playwright job, which is the only producer of tests/axe/report.json, resolved '${PLAYWRIGHT_RESULT}'. Fix that job (enable-axe also requires enable-playwright), or set enable-axe: false to state deliberately that this repo does not enforce axe yet. The remaining gates still run below; this job will fail at the end."
            exit 0
          fi
          echo "Downloaded $(wc -c < "${REPORT}") byte(s) into ${REPORT}."
          python3 - "${REPORT}" <<'PYVALIDATE' && VALID=0 || VALID=$?
          import json, sys
          path = sys.argv[1]
          def reject(why):
              print("::warning::axe report rejected: " + why + " Deleting it so gate-33 skips loudly instead of reading it as a clean accessibility run.")
              sys.exit(1)
          try:
              with open(path) as f:
                  data = json.load(f)
          except Exception as e:
              reject("it does not parse as JSON (%s)." % e)
          if not isinstance(data, dict):
              reject("the top level is %s, not an object." % type(data).__name__)
          if not isinstance(data.get('violations'), list):
              reject("there is no `violations` array — that is the only key gate-33 reads.")
          engine = data.get('testEngine') or {}
          if engine.get('name') != 'axe-core':
              reject("testEngine is %r, so this file did not come from axe-core." % (engine,))
          if data.get('selfTest', {}).get('detected') is not True:
              reject("the runner's positive control is not recorded as detected, so axe was never shown capable of reporting a violation on this run.")
          routes = data.get('routesAnalysed')
          if not isinstance(routes, list) or len(routes) == 0:
              reject("it records ZERO routes analysed. An empty violations array from zero routes is an absent measurement, not a clean one.")
          for r in routes:
              if not (200 <= int(r.get('status', 0)) < 400):
                  reject("route %s answered HTTP %s." % (r.get('url'), r.get('status')))
              if int(r.get('passes', 0)) + int(r.get('violations', 0)) == 0:
                  reject("route %s produced no axe results at all." % r.get('url'))
          blocking = [v for v in data['violations'] if v.get('impact') in ('serious', 'critical')]
          print("axe report OK: %d route(s), %d violation(s), %d serious/critical (axe-core %s, generated %s)."
                % (len(routes), len(data['violations']), len(blocking),
                   engine.get('version'), data.get('generatedAt')))
          for r in routes:
              print("  route %s -> HTTP %s | passes=%s violations=%s" % (r.get('url'), r.get('status'), r.get('passes'), r.get('violations')))
          sys.exit(0)
          PYVALIDATE
          if [ "${VALID}" -ne 0 ]; then
            rm -f "${REPORT}"
            echo "unmeasured=rejected" >> "$GITHUB_OUTPUT"
            echo "Removed ${REPORT} so gate-33 cannot read it as a clean accessibility run."
            echo "::error::enable-axe is set and the axe report was REJECTED for the reason above, so this run has no accessibility verdict. A rejected report is the same amount of evidence as no report: none. Fix the producer, or set enable-axe: false. The remaining gates still run below; this job will fail at the end."
          fi

      # ── Which SCOPE is this run entitled to, and why ────────────────────────
      #
      # A FORCED RUN MUST PRODUCE A VERDICT. It did not.
      #
      # On `workflow_dispatch` there is no pull request, so there is no target
      # branch to diff against, and there is no `github.event.before` either —
      # that field belongs to a push. The package's auto-detection then resolves
      # `origin/HEAD`, which on a dispatch from a mainline branch IS HEAD. The
      # wrapper correctly refuses to gate a self-comparison and exits 99. That
      # refusal is right — a run that inspected nothing must never wear a
      # green — but the conclusion drawn from it was wrong: the answer to "no
      # diff is available" is not "gate nothing", it is "gate everything".
      #
      # REPRODUCED, on a fixture repository whose `origin/main` equals HEAD,
      # which is exactly the dispatch shape:
      #
      #   default scope : [hydra-gates] FATAL: the diff base is HEAD ...
      #                   NOTHING WAS CHECKED.                      exit 99
      #   --full        : Base ref: n/a — --full requested, scanning the entire
      #                   tree.   28 of 28 applicable gates ran.     real verdict
      #
      # So a dispatch is scoped FULL-REPO. This is not a relaxation: ADR-020
      # diff-scoping exists to stop INHERITED debt blocking a PR, and a forced
      # run is the one context where inherited debt is the thing being asked
      # about. Expect a dispatch to be redder than a PR — that is the honest
      # answer, and it is the answer someone pressing "Run workflow" wants.
      #
      # `--full` is safe to pass at ANY pin. Verified against every published
      # tag of the gate package (v1.0.0 through v1.6.0): all of them parse
      # `--full`. It therefore needs none of the capability probing that
      # `--axe-enabled` and `--require-full-coverage` require, whose parsers
      # would otherwise swallow an unknown flag as the app directory.
      - name: Resolve the diff base and the scope
        id: base
        run: |
          set -u
          EVENT="${{ github.event_name }}"
          if [ "${EVENT}" = "pull_request" ] || [ "${EVENT}" = "pull_request_target" ]; then
            # The PR's real target branch. This is the only base that answers
            # the question the gates are being asked: "what does this PR add?"
            BASE="origin/${{ github.base_ref }}"
            SCOPE="diff"
            WHY="this is a ${EVENT}, so the PR's target branch is the base and ADR-020 diff-scoping applies."
          elif [ "${EVENT}" = "push" ]; then
            # A push HAS a previous tip. We deliberately set NOTHING and let the
            # package's own precedence chain resolve origin/HEAD ->
            # origin/development -> origin/main -> origin/master, then re-scope
            # to github.event.before when that lands on HEAD. Inventing a base
            # here would be the HEAD~1 mistake wearing a different name.
            BASE=""
            SCOPE="diff"
            WHY="this is a push, so the previous tip (github.event.before) is a real base and ADR-020 diff-scoping applies."
          else
            # workflow_dispatch, schedule, and anything else with no diff to
            # take. Full-repo, stated out loud, never silently empty.
            BASE=""
            SCOPE="full"
            WHY="this is a '${EVENT}' run, which has neither a pull-request target branch nor a previous pushed tip, so no diff exists to scope to. Scanning the ENTIRE tree instead of refusing to run."
          fi
          echo "base=${BASE}" >> "$GITHUB_OUTPUT"
          echo "scope=${SCOPE}" >> "$GITHUB_OUTPUT"
          {
            echo "SCOPE FOR THIS RUN: ${SCOPE}"
            echo "REASON: ${WHY}"
            echo "Diff base: ${BASE:-<none set — see the run output for what the package resolved>}"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run the Hydra gates
        id: gates
        env:
          HYDRA_GATE_BASE_REF: ${{ steps.base.outputs.base }}
          # Several gates document a reason-bearing opt-out —
          # `[hydra-gate-<name> exclude] <reason>` — and read it from THIS
          # variable, falling back to `git log -1`. Neither reached anything:
          #
          #   - this variable was never set, so the first path was always empty
          #   - on a pull_request, actions/checkout checks out the synthetic
          #     MERGE commit, whose message is `Merge <sha> into <sha>`, so the
          #     fallback inspected a message no author wrote
          #
          # So every reason-bearing opt-out in the suite was unreachable on a
          # PR — the one place they are needed. Measured on hermiq#162: the tag
          # was placed in the PR body AND in an explicit head commit, and the
          # finding count did not move either time.
          #
          # `github.event.pull_request.body` is null on a push, which is
          # correct: the fallback then reads the real pushed commit.
          HYDRA_GATE_PR_BODY: ${{ github.event.pull_request.body }}
          # The author's own head commit, so the fallback stops reading the
          # merge commit. Empty on a push, where `git log -1` is already right.
          HYDRA_GATE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -u
          ARGS="--app-dir ${GITHUB_WORKSPACE}/app"
          # Full-repo scope for a run that has no diff to take (see the scope
          # step above). Passed unconditionally at any pin: every published tag
          # of the gate package parses --full, so unlike --axe-enabled it
          # cannot be swallowed as a positional and clobber --app-dir.
          if [ "${{ steps.base.outputs.scope }}" = "full" ]; then
            ARGS="${ARGS} --full"
            echo "SCOPE: full-repo. ${{ github.event_name }} has no diff base, so every gate is run against the entire tree rather than refused."
          else
            echo "SCOPE: diff. ADR-020 diff-scoping against the base resolved above."
          fi
          if [ "${{ inputs.hydra-gates-require-full-coverage }}" = "true" ]; then
            if [ "${{ steps.gatecap.outputs.categories }}" = "1" ]; then
              ARGS="${ARGS} --require-full-coverage"
            else
              echo "::warning::hydra-gates-require-full-coverage is on, but this run pins hydra-gates-ref='${{ inputs.hydra-gates-ref }}', whose gate package cannot tell a NOT-APPLICABLE gate from a real gap — it counts every gate it did not run against coverage. Enforcing it here would fail this run for gates that have no subject matter in this repo at all (measured: decidesk and doriath, both red on nothing but gates 4, 24 and 33). COVERAGE ENFORCEMENT IS THEREFORE NOT APPLIED TO THIS RUN — the coverage block below is printed but not enforced. Bump hydra-gates-ref to v1.3.0 or later to get it back."
            fi
          fi
          # gate-33's input is the ONE input this runner cannot make for itself
          # — it comes from a browser in the Playwright job, and only when the
          # caller opted in. Telling the runner what the caller undertook is
          # what lets it distinguish "this repo has not opted into runtime
          # accessibility enforcement" (not applicable; the choice is a visible
          # line in the caller's workflow) from "it DID opt in and the report
          # never arrived" (a real gap, and it fails). Without this the runner
          # has to guess, and guessing "unverified" in both cases is what made
          # --require-full-coverage unusable in every repo in the fleet.
          #
          # Gated on the same probe, because `--axe-enabled` arrived in the same
          # release as the categories and the OLD wrapper's argument parser ends
          # in `*) APP_DIR="$1"` — an unrecognised flag is swallowed as a
          # POSITIONAL and CLOBBERS the app dir set moments earlier. A v1.0.1
          # pin handed this flag aborts with
          # `FATAL: --app-dir '--axe-enabled' is not a directory. No gate ran.`
          # and exits 99: every gate lost, for a flag the caller never typed.
          if [ "${{ inputs.enable-axe }}" = "true" ]; then
            if [ "${{ steps.gatecap.outputs.categories }}" = "1" ]; then
              ARGS="${ARGS} --axe-enabled"
            else
              echo "::warning::enable-axe is on, but hydra-gates-ref='${{ inputs.hydra-gates-ref }}' predates the flag (v1.3.0) and its argument parser would swallow it as the app directory, losing every gate. The flag is withheld; gate-33 will report its usual skip instead of a structural gap. Bump hydra-gates-ref to v1.3.0 or later."
            fi
          fi
          # The default shell for a `run:` block is `bash -e {0}`. A bare
          # invocation followed by `RC=$?` would therefore never reach the
          # assignment — the step would abort on the first failing gate and the
          # exit code, which carries the FAILURE COUNT, would be lost. Putting
          # the call in an `&& / ||` list suspends errexit for it, so we get the
          # real code. This is the 0/1 collapse the contract forbids, and it is
          # one character away at all times.
          # Output goes to a FILE and is printed afterwards, rather than through
          # a pipe. `bash -e {0}` plus a pipeline is how the exit code — which
          # carries the failure COUNT — gets replaced by the last stage's
          # status. Redirecting keeps the proven `&& / ||` form byte-for-byte
          # while still giving the assertion below something to read.
          GATES_OUT="${RUNNER_TEMP}/hydra-gates-output.txt"
          bash "${GITHUB_WORKSPACE}/gates/hydra-gates/bin/hydra-gates" ${ARGS} > "${GATES_OUT}" 2>&1 && RC=0 || RC=$?
          cat "${GATES_OUT}"
          echo "rc=${RC}" >> "$GITHUB_OUTPUT"

          # ── A FORCED RUN MUST NEVER REPORT GREEN OVER NOTHING ──────────────
          #
          # Full-repo scope removes the empty-diff failure mode, but it does not
          # by itself prove that any gate actually inspected anything: a repo
          # with no PHP, no src/ and no manifest would legitimately reach
          # "0 applicable gates" and exit 0, and that green would be
          # indistinguishable from a real one — the exact defect making the
          # dispatch produce a verdict was supposed to eliminate.
          #
          # So the count is READ, not assumed. The wrapper emits exactly one
          # `COVERAGE: <n> of <m> declared gates reported a result` line; <n> is
          # the number of gates that returned PASS or FAIL. Zero is not a pass.
          #
          # A missing COVERAGE line is also failed, not ignored — an assertion
          # that cannot find its subject must never resolve to "fine".
          if [ "${{ steps.base.outputs.scope }}" = "full" ] && [ "${RC}" -eq 0 ]; then
            REPORTED="$(sed -n 's/^\[hydra-gates\] COVERAGE: \([0-9][0-9]*\) of .*/\1/p' "${GATES_OUT}" | head -1)"
            if [ -z "${REPORTED}" ]; then
              echo "::error::This was a forced full-repo run that exited 0, but no COVERAGE line could be found in the gate output, so the number of gates that actually reported a result is UNKNOWN. An unverifiable green is not a green. Failing the job rather than publishing a verdict nothing backs."
              exit 1
            fi
            if [ "${REPORTED}" -eq 0 ]; then
              echo "::error::This was a forced full-repo run and ZERO gates reported a result — every gate found no subject matter in this repository. Exit 0 here means 'nothing was measured', not 'everything passed', and a forced run exists precisely to avoid publishing that as a green. Failing the job."
              exit 1
            fi
            echo "Forced full-repo run: ${REPORTED} gate(s) reported a real PASS/FAIL result."
          fi

          if [ "${RC}" -eq 0 ]; then
            echo "All gates that ran passed. Read the COVERAGE block above before treating this as complete."
            exit 0
          fi
          if [ "${RC}" -eq 99 ]; then
            echo "::error::hydra-gates COULD NOT RUN (exit 99). This is a configuration error, NOT a clean tree — nothing was gated. Most often: the diff base did not resolve, or the app checkout is shallow."
            exit 1
          fi
          if [ "${RC}" -eq 98 ]; then
            echo "::error::hydra-gates passed every gate that ran, but a gate whose SUBJECT MATTER EXISTS did not report, and hydra-gates-require-full-coverage is set. See the GATES THAT DID NOT RUN line above — each names itself as either 'structural' (nothing produced its input) or 'wiring' (its own helper or tool is missing). Gates listed under NOT APPLICABLE are NOT the cause: they were excluded from this verdict."
            exit 1
          fi
          echo "::error::${RC} Hydra gate(s) failed. The exit code is the failure COUNT — see the named [gate-N] FAIL lines above."
          exit 1

      # The verdict for `enable-axe`, raised here rather than at the check
      # itself so the gates above still produce their full report first (see
      # the reasoning on the axe-check step). `always()` so it is reached even
      # when the gates step already failed — a run can be both "gates failed"
      # and "accessibility never measured", and collapsing those loses one.
      # It only ever turns a pass into a failure, never the reverse.
      - name: Fail when axe was requested but never measured
        if: ${{ always() && inputs.enable-axe && steps.axe-check.outputs.unmeasured != '' }}
        run: |
          echo "::error::enable-axe is set and this run produced NO accessibility measurement (reason: ${{ steps.axe-check.outputs.unmeasured }}). gate-33 reporting SKIPPED is the absence of the check, not the check passing — see the named error earlier in this job. Failing the gates job so the run cannot be read as accessible."
          exit 1

      - name: Record result
        if: always()
        run: |
          mkdir -p quality-results
          echo "${{ job.status }}" > quality-results/hydra-gates.txt
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-hydra-gates
          path: quality-results/

  report:
    runs-on: ubuntu-latest
    name: "Quality Report"
    # EVERY verdict-producing job must be listed here, and `frontend-tests`
    # was not (#190). This job is the ONLY meaningful required check on main
    # and beta — measured across all 25 fleet repos, whose `Main`/`Beta Branch
    # Protection` rulesets require exactly `branch-protection / check-branch`
    # and `quality / Quality Report` — so a leg missing from this list cannot
    # block a merge no matter how red it goes. `Frontend Tests (unit)` runs a
    # real unit suite with no continue-on-error, and its failure reached
    # nothing.
    #
    # Latent rather than observed: sampled across ten repos it is currently
    # green everywhere (with some supersession cancellations), so nothing has
    # been waved through yet. A gate that would not catch a failure is still a
    # dead gate, and `scripts/assert-quality-report-gates-every-leg.py` now
    # keeps the list complete.
    #
    # THE THREE NEXTCLOUD LEGS (#383, #385) ARE ON THIS LIST DELIBERATELY, and
    # what that does per leg is not the same thing:
    #
    #   app-check-code  internally non-blocking by default. The step swallows a
    #                   non-zero `occ` exit and warns unless `check-code-blocking`
    #                   is set, so the job concludes `success` with findings and
    #                   listing it changes nothing today. It becomes a real gate
    #                   the moment an app flips its own input — which is the
    #                   point: the wiring must already be there, or flipping the
    #                   input would be a no-op nobody notices.
    #   reuse           same shape, via `continue-on-error: ${{ !inputs.reuse-blocking }}`.
    #   info-xml        HAS NO SUCH FLAG AND IS BLOCKING ON ARRIVAL. #383
    #                   measured 5 pass / 13 fail before it merged. RE-MEASURED
    #                   2026-08-12 14:20Z against every repo's live `development`
    #                   tip, same App Store XSD: 6 PASS / 12 FAIL. Eleven of the
    #                   twelve are xs:sequence element ORDER; the twelfth
    #                   (zaakafhandelapp) is a <summary> over the schema's length
    #                   cap. The one-app difference is not drift in the
    #                   instrument — larpingapp's manifest was reordered by
    #                   efa6aead at 11:28:48Z, and validating that one file at
    #                   both refs gives FAIL then PASS.
    #
    #                   Live-confirmed against CI, not only locally: openregister
    #                   run 31591669849 emitted `Element 'documentation': This
    #                   element is not expected` — the same message, byte for
    #                   byte, as the local validator.
    #
    #                   So listing it here turns 12 of 18 apps red until their
    #                   manifests are reordered, and that is the authorised
    #                   trade: the App Store rejects the same files at upload
    #                   time, after the release has been built, tagged and
    #                   published. TREAT THE 12 AS DECAYING — it is a count over
    #                   files several agents edit daily, so re-measure before
    #                   quoting it.
    #
    # The two remaining Nextcloud checks are NOT missing from this list. Multi
    # database PHPUnit is a matrix dimension of `phpunit`, which is already
    # here, and `occ integrity:sign-app` lives in release.yml, which has no
    # Quality Report to gate.
    #
    # `nextcloud-matrix` IS ON THIS LIST, and it is the one entry whose failure
    # does not describe the app's code. It fails when the range the app promises
    # the App Store cannot be turned into a set of servers to test on — a
    # malformed <nextcloud> element, or a derivation that produced nothing. The
    # legs still run, on the shared fallback range, and they still go green,
    # which is exactly why this has to be gated separately: a green PHPUnit
    # matrix measured on versions the app never claimed is the failure this
    # whole change exists to remove, and it looks identical to a pass.
    needs: [php-quality, vue-quality, frontend-build, frontend-checks, frontend-tests, security, license, nextcloud-matrix, phpunit, newman, playwright, journeydoc-capture, baseline-protection, sbom, features-check, features-extract, hydra-gates, app-check-code, info-xml, reuse]
    if: always()
    # Observed across 266 executions: median 0.6 min — but 2% of runs sit at
    # ~30 min because the `Install PDF tools` apt-get step stalls on the Ubuntu
    # mirror. That stall is currently intermittent-but-live fleet-wide
    # (nldesign, opencatalogi, pipelinq, planix, softwarecatalog) and it still
    # SUCCEEDS: pipelinq run 30799846661 spent 09:34:30 -> 10:04:52 in that one
    # step and went green. Anything under ~45 min would newly fail runs that
    # pass today, so this is bounded at 60 min. The apt stall is a separate
    # defect worth fixing on its own; this bound only stops the 6-hour case.
    timeout-minutes: 60

    steps:
      - name: Download all result artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: result-*
          path: results/
          merge-multiple: false

      - name: Download license reports
        uses: actions/download-artifact@v4
        with:
          pattern: license-report-*
          path: license-reports/
          merge-multiple: true
        continue-on-error: true

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: coverage/
        continue-on-error: true

      - name: Download Playwright coverage
        uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: results/playwright-report/
        continue-on-error: true

      # A PACKAGE INSTALL MUST NOT BE ABLE TO DISABLE THE GATE.
      #
      # Measured on decidesk run 32158299327 and shillinq run 32158364133,
      # 2026-08-18: this step produced zero output for SIXTY MINUTES, hit the
      # job timeout, and the runner cancelled the job. Everything downstream —
      # including "Gate — fail when any upstream job failed", "Gate — a test
      # job that was ENABLED but never ran", and "Gate — fail when an upstream
      # job was cancelled" — was SKIPPED. Both runs went red on `development`
      # with every other job green, and the three steps whose entire purpose is
      # to decide pass/fail never executed. An apt mirror turned the quality
      # gate off.
      #
      # pandoc and wkhtmltopdf render the markdown report to PDF. That is a
      # nice-to-have attachment; the report, the step summary and the gates all
      # work without them. So this is now bounded (5 min per attempt, 3
      # attempts), non-fatal, and records whether it succeeded. `-qq` is gone
      # because it hid the stall completely — the old log contained the command
      # and nothing else.
      - name: Install PDF tools
        id: pdf_tools
        continue-on-error: true
        run: |
          set -uo pipefail

          # Same reasoning as `Install xmllint`: the cheapest way not to hang on
          # the dpkg lock is not to take it. Cheap to ask, and it costs nothing
          # when the answer is no.
          if command -v pandoc > /dev/null 2>&1 && command -v wkhtmltopdf > /dev/null 2>&1; then
            echo "pandoc and wkhtmltopdf already present."
            echo "available=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for attempt in 1 2 3; do
            if timeout 300 sudo apt-get update -q && timeout 300 sudo apt-get install -y -q pandoc wkhtmltopdf; then
              echo "available=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::warning::apt attempt ${attempt}/3 failed or timed out after 300s; retrying."
            sleep 10
          done
          echo "available=false" >> "$GITHUB_OUTPUT"
          echo "::warning::pandoc/wkhtmltopdf could not be installed after 3 bounded attempts. The PDF rendering of the quality report is skipped; the report, the step summary and every gate below still run. This is infrastructure, not a finding about this app."

      - name: Generate report
        run: |
          set -euo pipefail

          REPORT="quality-report.md"
          REPO="${{ github.repository }}"
          SHA="${{ github.sha }}"
          SHORT_SHA="${SHA:0:7}"
          BRANCH="${{ github.ref_name }}"
          EVENT="${{ github.event_name }}"
          DATE="$(date -u +'%Y-%m-%d %H:%M UTC')"
          RUN_URL="https://github.com/$REPO/actions/runs/${{ github.run_id }}"

          # Helper to read result from artifact files
          read_result() {
            local file="$1"
            if [ -f "$file" ]; then
              cat "$file" | tr -d '[:space:]'
            else
              echo "skipped"
            fi
          }

          icon() {
            case "$1" in
              success|Success) echo "✅" ;;
              skipped|Skipped) echo "⏭️" ;;
              *) echo "❌" ;;
            esac
          }

          # Test-tier icon (#194). `skipped` means two completely different
          # things depending on whether the caller asked for the job:
          #
          #   enabled=false → the repo does not have this kind of test. ⏭️.
          #   enabled=true  → the job was asked for and DID NOT RUN. That is
          #                   the ABSENCE OF A VERDICT, and it must not share a
          #                   glyph with "no tests configured" — which is
          #                   exactly how a fleet-wide advisory deleted the test
          #                   tier on 2026-08-06 while every report looked
          #                   ordinary. Rendered in words, not a tick.
          #
          # $1 = needs.<job>.result, $2 = "true"/"false" for enabled
          test_icon() {
            if [ "$2" = "true" ] && [ "$1" = "skipped" ]; then
              echo "🚨 **NO VERDICT — enabled but never ran**"
            else
              icon "$1"
            fi
          }

          # Build license info strings
          license_info() {
            local eco="$1"
            local JSON_FILE="license-reports/$eco-licenses.json"
            if [ -f "$JSON_FILE" ]; then
              local total=$(jq 'length' "$JSON_FILE")
              local denied=$(jq '[.[] | select(.status == "DENIED")] | length' "$JSON_FILE")
              if [ "$denied" -gt 0 ]; then
                echo "❌ $denied/$total denied"
              else
                echo "✅ $total/$total"
              fi
            else
              local result=$(read_result "results/result-license-$eco/$eco.txt")
              echo "$(icon "$result")"
            fi
          }

          # ── Compact report: categories as columns, checks as rows ──
          {
            echo "# Quality Report — $REPO @ \`$SHORT_SHA\`"
            echo ""
            echo "| Check | PHP | Vue | Security | License | Tests |"
            echo "|-------|-----|-----|----------|---------|-------|"

            # PHP-only checks
            for tool in lint phpcs phpmd psalm phpstan phpmetrics; do
              result=$(read_result "results/result-php-quality-$tool/$tool.txt")
              echo "| $tool | $(icon "$result") | | | | |"
            done

            # Vue-only checks
            for tool in eslint stylelint; do
              result=$(read_result "results/result-vue-quality-$tool/$tool.txt")
              echo "| $tool | | $(icon "$result") | | | |"
            done

            # Frontend build gate (auto-detected, blocking)
            build_result=$(read_result "results/result-frontend-build/frontend-build.txt")
            echo "| build | | $(icon "$build_result") | | | |"

            # Custom frontend checks (if any)
            for f in results/result-frontend-check-*/*.txt; do
              [ -f "$f" ] || continue
              tool=$(basename "$f" .txt)
              echo "| $tool | | $(icon "$(read_result "$f")") | | | |"
            done

            # Composer: security + license in one row
            sec_comp=$(read_result "results/result-security-composer/composer.txt")
            echo "| composer | | | $(icon "$sec_comp") | $(license_info "composer") | |"

            # npm: security + license in one row
            sec_npm=$(read_result "results/result-security-npm/npm.txt")
            echo "| npm | | | $(icon "$sec_npm") | $(license_info "npm") | |"

            # The three Nextcloud legs. They are in `needs:` above, so their
            # failure reds this job — but a leg the report never mentions is the
            # exact silence the Hydra-gates row below exists to correct, and it
            # would have been reintroduced the day these three landed.
            #
            # READ THESE THREE CELLS DIFFERENTLY, because the artefacts behind
            # them hold different things:
            #
            #   REUSE           records `steps.lint.outcome` — the RAW step
            #                   outcome, before `continue-on-error` rewrites it.
            #                   So this cell goes ❌ on findings even while the
            #                   job concludes success. That is the useful shape.
            #   app:check-code  records `job.status`, and the step exits 0 on
            #                   findings unless `check-code-blocking` is set. So
            #                   ✅ here means "the run produced a recognisable
            #                   verdict", NOT "no private API usage" — the
            #                   findings are in that job's `::warning::` only.
            #                   Worth narrowing to the step's own finding count;
            #                   deliberately not done in this commit.
            #   info.xml        records `job.status` and has no non-blocking
            #                   flag, so its cell and its gate agree.
            echo "| app:check-code | $(icon "$(read_result "results/result-app-check-code/app-check-code.txt")") | | | | |"
            echo "| info.xml | $(icon "$(read_result "results/result-info-xml/info-xml.txt")") | | | | |"
            echo "| REUSE | $(icon "$(read_result "results/result-reuse/reuse.txt")") | | | | |"

            # Test rows. `test_icon` rather than `icon`: see its definition —
            # an enabled-but-skipped test job is the absence of a verdict and
            # says so in words.
            echo "| PHPUnit | | | | | $(test_icon '${{ needs.phpunit.result }}' '${{ inputs.enable-php && inputs.enable-phpunit }}') |"
            echo "| Newman | | | | | $(test_icon '${{ needs.newman.result }}' '${{ inputs.enable-newman }}') |"
            echo "| Playwright | | | | | $(test_icon '${{ needs.playwright.result }}' '${{ inputs.enable-playwright }}') |"
            if [ '${{ inputs.enable-journeydoc-capture }}' = 'true' ]; then
              echo "| Journeydoc capture | | | | | $(test_icon '${{ needs.journeydoc-capture.result }}' 'true') |"
            fi
            # The Hydra gates were in this job's `needs:` and in its failure
            # gate below, so a red gates job did red the Quality Report — but
            # the report itself never mentioned them, in any state. The one
            # artefact people actually read (the PR comment, the PDF) was
            # silent about sixty gates: read on its own it was indistinguishable
            # from a repo that has no gates, whether they passed, failed or
            # never ran. `needs.<job>.result` rather than the result artifact,
            # so a job that was skipped or deleted still renders as ⏭️ instead
            # of vanishing from the table.
            echo "| Hydra gates | | | | | $(icon '${{ needs.hydra-gates.result }}') |"
            echo ""
          } > "$REPORT"

          # ── Failures detail (only shown when something fails) ──
          HAS_FAILURES=false

          # License denials
          for eco in composer npm; do
            JSON_FILE="license-reports/$eco-licenses.json"
            if [ -f "$JSON_FILE" ]; then
              DENIED=$(jq '[.[] | select(.status == "DENIED")] | length' "$JSON_FILE")
              if [ "$DENIED" -gt 0 ]; then
                HAS_FAILURES=true
                {
                  echo "### ❌ Denied $eco licenses"
                  echo ""
                  echo "| Package | Version | License |"
                  echo "|---------|---------|---------|"
                  jq -r '.[] | select(.status == "DENIED") | "| \(.package) | \(.version) | \(.license) |"' "$JSON_FILE"
                  echo ""
                } >> "$REPORT"
              fi
            fi
          done

          # Coverage (if available)
          if [ -f "coverage/clover.xml" ]; then
            # `grep -m1` rather than `grep | head -1`: this step also runs under
            # `set -o pipefail`, so head closing the pipe on a clover.xml with
            # many matches kills grep with SIGPIPE. The `|| echo "0"` then does
            # not rescue the value — it APPENDS "0" to whatever head already
            # printed, and the arithmetic below gets "1234\n0". Reporting a wrong
            # coverage number is worse than failing, because nobody re-checks a
            # number that rendered. -m1 stops grep itself, so there is no pipe.
            COVERED=$(grep -oPm1 'coveredstatements="\K[0-9]+' coverage/clover.xml || echo "0")
            TOTAL_STMTS=$(grep -oPm1 'statements="\K[0-9]+' coverage/clover.xml || echo "0")
            if [ "$TOTAL_STMTS" -gt 0 ]; then
              COVERAGE=$(echo "scale=1; $COVERED * 100 / $TOTAL_STMTS" | bc)
              echo "**Coverage:** ${COVERAGE}% ($COVERED/$TOTAL_STMTS statements)" >> "$REPORT"
              echo "" >> "$REPORT"
            fi
          fi

          # Playwright spec-to-test coverage (if available)
          # #189: this used to render "<coverage>% (<tests> tests / <specs>
          # specs)", which stated the broken model out loud — a ratio of two
          # totals that were never compared. The producer now emits real
          # per-scenario matching, so the numerator and denominator here are
          # the same population and the sentence means what it says. `.coverage`
          # is null when the measurement could not be taken, and that case says
          # so rather than printing "null%".
          COVERAGE_FILE="results/playwright-report/playwright-coverage.json"
          if [ -f "$COVERAGE_FILE" ]; then
            MEASURABLE=$(jq -r '.measurable // "unknown"' "$COVERAGE_FILE")
            if [ "$MEASURABLE" = "false" ]; then
              echo "**Spec coverage:** ⚠️ NOT MEASURABLE — no enforceable openspec scenarios were found. This is a failure to measure, not full coverage." >> "$REPORT"
            else
              COVERED=$(jq -r '.coveredScenarios // 0' "$COVERAGE_FILE")
              ENFORCEABLE=$(jq -r '.enforceableScenarios // 0' "$COVERAGE_FILE")
              EXCLUDED=$(jq -r '.excludedScenarios // 0' "$COVERAGE_FILE")
              COVERAGE=$(jq -r '.coverage // 0' "$COVERAGE_FILE")
              THRESH=$(jq -r '.threshold // 0' "$COVERAGE_FILE")
              echo "**Spec coverage:** ${COVERAGE}% — $COVERED of $ENFORCEABLE enforceable scenarios carry an \`@e2e\` reference (threshold ${THRESH}%, $EXCLUDED excluded with a reason)." >> "$REPORT"
            fi
            echo "" >> "$REPORT"
          fi

          # Footer
          echo "---" >> "$REPORT"
          echo "" >> "$REPORT"
          echo "*[Quality workflow]($RUN_URL) — $DATE*" >> "$REPORT"

          echo "Report generated: $(wc -l < "$REPORT") lines"

      # Only when the tools actually installed. Previously this ran
      # unconditionally, so a failed install turned into a second, more
      # confusing failure here ("pandoc: command not found") on top of the
      # first.
      - name: Convert to PDF
        if: steps.pdf_tools.outputs.available == 'true'
        run: |
          pandoc quality-report.md \
            -o quality-report.pdf \
            --pdf-engine=wkhtmltopdf \
            --metadata title="Quality Report" \
            -V margin-top=20mm \
            -V margin-bottom=20mm \
            -V margin-left=15mm \
            -V margin-right=15mm

      - name: Write step summary
        if: always()
        run: cat quality-report.md >> $GITHUB_STEP_SUMMARY

      - name: Upload PDF report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-report
          path: |
            quality-report.pdf
            quality-report.md
          retention-days: 90

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        # Posting the summary comment needs `pull-requests: write`. A reusable
        # workflow inherits the CALLER's permissions, and most callers declare
        # only `contents: read` + `packages: read` — so this step 403s with
        # "Resource not accessible by integration" and failed the whole Quality
        # Report job. A cosmetic comment must never fail a quality gate: the
        # gate's verdict comes from the jobs it aggregates, not from whether it
        # could comment. Callers that want the comment should add
        # `pull-requests: write` to their own `permissions:` block.
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = fs.readFileSync('quality-report.md', 'utf8');
            body += `\n\n> Download the [full PDF report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) from the workflow artifacts.\n`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      # Makes "quality / Quality Report" a usable required check: without
      # this the job always succeeded (if: always() + report-only steps),
      # so requiring it in branch protection would gate nothing.
      - name: Gate — fail when any upstream job failed
        if: ${{ always() && contains(needs.*.result, 'failure') }}
        run: |
          echo "::error::One or more quality jobs failed — see the report above."
          exit 1

      # ══ Gate 2 — an ENABLED test job that never ran (#194) ═════════════════
      #
      # The invariant, stated once: **`skipped` in the test tier must never be
      # summarised as a pass.** `skipped` is not `failure`, so the gate above —
      # `contains(needs.*.result, 'failure')` — reads straight past it, and the
      # check renders in the same colour family as a success. On 2026-08-06 a
      # single advisory against a dev-only formatter turned PHPUnit, Newman and
      # E2E into `skipped` in 16 repositories at once and every one of those
      # runs read as unremarkable. The absence of a verdict was indistinguishable
      # from a good one, and that — not the security failure — is what cost us
      # the morning.
      #
      # The cause of that particular skip is removed (the test jobs no longer
      # read `needs.security.result`), but a cause is not an invariant. Any
      # future `if:` clause, matrix collapse or producer edge can delete the
      # same evidence the same way. This step is the invariant, so the next one
      # is loud on arrival instead of being reconstructed from a timeline.
      #
      # WHY `enabled` IS PART OF THE TEST. `skipped` legitimately means "this
      # repo has no Newman collections" for most of the fleet. The defect is
      # only a defect when the CALLER ASKED FOR THE JOB and did not get it, so
      # each row pairs `needs.<job>.result` with the input(s) that switch it on.
      # That keeps the gate silent for the 20-odd repos that run no E2E at all.
      #
      # WHY THE SUPERSESSION CHECK IS REPEATED HERE. A run cancelled by
      # `cancel-in-progress` can leave a not-yet-started job reporting `skipped`
      # rather than `cancelled`. Failing on that would turn every rapid push
      # red — the same wall of red the gate below exists to avoid — so this
      # borrows its discriminator: a run whose head SHA is no longer the branch
      # tip has been superseded, and the newer run is the one whose verdict
      # counts.
      - name: Gate — a test job that was ENABLED but never ran has no verdict
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_REF: ${{ github.head_ref || github.ref_name }}
          SECURITY_RESULT: ${{ needs.security.result }}
          PHPUNIT_ENABLED: ${{ inputs.enable-php && inputs.enable-phpunit }}
          PHPUNIT_RESULT: ${{ needs.phpunit.result }}
          NEWMAN_ENABLED: ${{ inputs.enable-newman }}
          NEWMAN_RESULT: ${{ needs.newman.result }}
          PLAYWRIGHT_ENABLED: ${{ inputs.enable-playwright }}
          PLAYWRIGHT_RESULT: ${{ needs.playwright.result }}
          JOURNEYDOC_ENABLED: ${{ inputs.enable-journeydoc-capture }}
          JOURNEYDOC_RESULT: ${{ needs['journeydoc-capture'].result }}
        run: |
          set -uo pipefail

          MISSING=""
          RAN=""

          # $1 = human label, $2 = enabled ("true"/"false"), $3 = job result
          classify() {
            if [ "$2" != "true" ]; then
              echo "  - $1: not enabled by this caller — nothing expected."
              return
            fi
            case "$3" in
              skipped)
                echo "  - $1: ENABLED but result=skipped — NO VERDICT EXISTS."
                MISSING="${MISSING}${1}"$'\n'
                ;;
              success)
                echo "  - $1: ran, passed."
                RAN="${RAN}${1}"$'\n'
                ;;
              *)
                echo "  - $1: ran, result=$3."
                RAN="${RAN}${1}"$'\n'
                ;;
            esac
          }

          echo "Test-tier verdict census:"
          classify "PHPUnit"            "$PHPUNIT_ENABLED"    "$PHPUNIT_RESULT"
          classify "Newman"             "$NEWMAN_ENABLED"     "$NEWMAN_RESULT"
          classify "Playwright"         "$PLAYWRIGHT_ENABLED" "$PLAYWRIGHT_RESULT"
          classify "Journeydoc capture" "$JOURNEYDOC_ENABLED" "$JOURNEYDOC_RESULT"

          if [ -z "$MISSING" ]; then
            echo "Every enabled test job produced a verdict."
            # State the distinction the 2026-08-06 reports could not make.
            if [ "$SECURITY_RESULT" = "failure" ] && [ -n "$RAN" ]; then
              echo "::notice::Security failed, and the test tier still ran and reported. This is 'tests produced a verdict, security did not pass' — NOT 'tests never ran'. The merge is blocked by the security failure, and the test results above are real."
            fi
            exit 0
          fi

          TIP="$(gh api "repos/${{ github.repository }}/commits/${RUN_REF}" --jq .sha 2>/dev/null || true)"
          if [ -n "$TIP" ] && [ "$TIP" != "$RUN_SHA" ]; then
            echo "::notice::Test job(s) did not run, but this run has been SUPERSEDED (${RUN_REF} is now at ${TIP:0:7}, this run is ${RUN_SHA:0:7}). The newer run is the one whose verdict counts — staying quiet."
            exit 0
          fi

          echo "::error::TEST TIER NOT EXECUTED — NO VERDICT EXISTS for one or more enabled test jobs. A skipped test job is not a pass; it is the absence of a result. This gate cannot pass."
          {
            echo ""
            echo "## 🚨 Gate failed — NO VERDICT EXISTS for the test tier"
            echo ""
            echo "These jobs were **enabled by this repository's caller** and did **not run**:"
            echo ""
            # `|| true` on the loop: the default shell is `bash -e`, and a final
            # iteration whose `[ -n ]` test is false would make the pipeline
            # return 1 and abort the rest of this summary block.
            printf '%s' "$MISSING" | while IFS= read -r j; do
              if [ -n "$j" ]; then echo "- \`$j\` — result \`skipped\`"; fi
            done || true
            echo ""
            echo "**This is not a test failure. It is the absence of a test result.**"
            echo "Nothing above should be read as evidence that the code works, because"
            echo "no test was executed to produce that evidence."
            echo ""
            if [ "$SECURITY_RESULT" = "failure" ]; then
              echo "\`Security\` also failed in this run. Note the two are now independent"
              echo "(#194) — a security failure no longer skips the test tier, so if the"
              echo "test tier is missing, something else deleted it. Investigate the"
              echo "skipped job's \`if:\` condition."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      # A CANCELLED job renders NO verdict, so treating it as merely
      # "not a failure" lets this gate go green over a leg that never ran.
      # Observed live on pipelinq run 30903070948: `E2E Tests (Playwright)`
      # and `Hydra Gates` both CANCELLED, `Quality Report` still SUCCESS.
      #
      # But cancellation has two shapes and only one of them is a defect:
      #
      #   (a) a job cancelled while its run CARRIES ON — a real gap: that leg
      #       produced no verdict while its siblings produced theirs. Reached
      #       via a job-level `concurrency` group, a lost runner, or a
      #       fail-fast matrix sibling. MUST fail the gate.
      #
      #   (b) the WHOLE run cancelled, almost always by this workflow's own
      #       `concurrency: cancel-in-progress` when a newer commit supersedes
      #       it. Entirely legitimate and routine — four merge commits in one
      #       programme were superseded exactly this way. Must stay quiet, or
      #       every rapid push turns into a wall of red.
      #
      # THE EXPRESSION CONTEXT CANNOT SEPARATE THEM. Measured, not assumed, on
      # petstore's `probe/cancel-gate-semantics` branch:
      #
      #   run 30906581133 — shape (a), job-level concurrency cancelled ONE job
      #     while the run carried on:  cancelled() = FALSE, run.conclusion = cancelled
      #   run 30906801110 — shape (b), workflow-level `cancel-in-progress`
      #     superseded the WHOLE run:  cancelled() = FALSE, run.conclusion = cancelled
      #
      # Both identical. So `cancelled()` is NOT the discriminator it looks like:
      # it does not report true for a concurrency supersession, and a run's
      # conclusion is `cancelled` merely because SOME job in it was cancelled.
      # Gating on `!cancelled()` alone would have turned every superseded run
      # red — the exact wall of red this must avoid.
      #
      # The property that actually differs is: **is this run still the
      # authoritative one for its ref?** A supersession happens precisely
      # because a newer commit arrived, so a superseded run's head SHA is no
      # longer the branch tip. A run whose SHA is still the tip has not been
      # superseded, so a cancelled leg in it is a real gap.
      #
      # That needs only `contents: read`, which every caller already grants.
      #
      # RESIDUE, stated rather than papered over:
      #   * A run cancelled by a HUMAN, with no new commit pushed, still looks
      #     like shape (a) and will now fail this gate. That is arguably right
      #     (a cancelled leg rendered no verdict) but it is a behaviour change.
      #   * A shape-(a) cancellation that coincides with a new push is read as
      #     a supersession and stays quiet. Errs toward silence; the newer run
      #     is the one whose verdict gates the PR.
      #   * The tip lookup failing is treated as "not superseded" (fail loudly)
      #     rather than silently waving a cancelled leg through.
      - name: Gate — fail when an upstream job was cancelled mid-run
        if: ${{ !cancelled() && contains(needs.*.result, 'cancelled') }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          set -uo pipefail

          TIP="$(gh api "repos/${{ github.repository }}/commits/${RUN_REF}" --jq .sha 2>/dev/null || true)"

          if [ -n "$TIP" ] && [ "$TIP" != "$RUN_SHA" ]; then
            echo "::notice::Job(s) cancelled, but this run has been SUPERSEDED (${RUN_REF} is now at ${TIP:0:7}, this run is ${RUN_SHA:0:7}). Concurrency cancellation of an outdated run is not a defect — staying quiet."
            {
              echo ""
              echo "### ⏭️ Cancelled jobs ignored — run superseded"
              echo ""
              echo "\`${RUN_REF}\` has moved to \`${TIP:0:7}\`; this run is \`${RUN_SHA:0:7}\`."
              echo "The newer run is the one whose verdict counts."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "::error::One or more quality jobs were CANCELLED while this run was still the tip of ${RUN_REF}. A cancelled job renders no verdict, so this gate cannot pass."
          {
            echo ""
            echo "## ❌ Gate failed — cancelled job(s)"
            echo ""
            echo "These jobs were cancelled while this run was still the authoritative"
            echo "run for \`${RUN_REF}\` (\`${RUN_SHA:0:7}\`), so they produced no verdict:"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          echo '${{ toJSON(needs) }}' \
            | jq -r 'to_entries[] | select(.value.result == "cancelled") | "- `\(.key)`"' \
            >> "$GITHUB_STEP_SUMMARY"
          exit 1

  # ╔══════════════════════════════════════════════╗
  # ║  STAGE 4 — SBOM Generation & Validation      ║
  # ║                                               ║
  # ║  Generates a CycloneDX SBOM from Composer     ║
  # ║  and npm dependencies, validates against CVE   ║
  # ║  databases and license policies, then commits  ║
  # ║  the validated SBOM to the repository.         ║
  # ╚══════════════════════════════════════════════╝

  sbom:
    if: ${{ inputs.enable-php && inputs.enable-sbom && !cancelled() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta' || github.ref == 'refs/heads/development') }}
    runs-on: ubuntu-latest
    name: "SBOM"
    needs: [security]
    # Observed across 54 executions: median 1.1 min, max 1.9 min
    # (nextcloud-app-template). Does composer install + npm install + a Grype
    # download + a CVE scan, all network-bound, so 30 min rather than 10.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}
          extensions: mbstring, intl, zip, gd, curl, xml, json
          tools: composer:v2

      - name: Setup Node
        if: ${{ inputs.enable-frontend }}
        uses: actions/setup-node@v4
        with:
          node-version: "${{ inputs.node-version }}"

      # `npm ci` below is gated on enable-frontend, and a repo can have that on
      # without a lockfile, so this is actions/cache rather than setup-node's
      # `cache: npm` — the latter hard-fails on a missing lockfile. Same note as
      # the Newman and Playwright jobs.
      - name: Cache npm downloads
        if: ${{ inputs.enable-frontend }}
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ inputs.node-version }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-${{ inputs.node-version }}-
            ${{ runner.os }}-npm-

      # `composer.json` joins the key for the same reason as on the php-quality
      # job: `hashFiles` yields an empty string when nothing matches, which
      # collapsed this key to a constant on the three fleet repos with no
      # composer.lock — and an Actions cache entry is immutable once written, so
      # a constant key can never be rotated by a dependency change.
      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock', 'composer.json') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: ${{ runner.os }}-composer-files-${{ hashFiles('composer.lock', 'composer.json') }}
          restore-keys: ${{ runner.os }}-composer-files-

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Generate PHP SBOM
        run: composer CycloneDX:make-sbom --output-format=JSON --output-file=bom-php.cdx.json --spec-version=1.5 --omit=dev --omit=plugin

      - name: Install npm dependencies
        if: ${{ inputs.enable-frontend }}
        run: npm ci

      - name: Generate npm SBOM
        if: ${{ inputs.enable-frontend }}
        # --package-lock-only: build the SBOM from package-lock.json rather than
        # `npm ls`. `npm ls` exits non-zero (ELSPROBLEMS) on benign tree quirks —
        # peer/version mismatches in transitive deps, a hard dependency declared
        # by a lib but deduped away, etc. — which has nothing to do with the SBOM.
        # The lockfile is the deterministic source of truth for what gets installed.
        # --ignore-npm-errors: cyclonedx-npm still shells out to `npm ls` internally
        # even with --package-lock-only, and aborts on those same benign
        # ELSPROBLEMS (e.g. a transitive @vueuse/core pulled by @nextcloud/dialogs
        # that mismatches a peer range). The tree quirk does not affect the SBOM,
        # so tolerate it rather than red the whole quality run.
        run: npx @cyclonedx/cyclonedx-npm --package-lock-only --ignore-npm-errors --output-file bom-npm.cdx.json --spec-version 1.5 --omit dev

      - name: Merge PHP + npm SBOMs
        if: ${{ inputs.enable-frontend }}
        run: |
          jq -s '.[0] * {components: ([.[].components[]?] | unique_by(.purl // .name))}' bom-php.cdx.json bom-npm.cdx.json > sbom.cdx.json

      - name: Use PHP SBOM as single SBOM
        if: ${{ !inputs.enable-frontend }}
        run: mv bom-php.cdx.json sbom.cdx.json

      # Fold each component's npm scope back into its name.
      #
      # CycloneDX splits a scoped package into two fields:
      #
      #     name:  gen-mapping        group: @jridgewell
      #     purl:  pkg:npm/%40jridgewell/gen-mapping@0.3.13
      #
      # Grype matches on `name` alone and ignores `group`, so the legitimate
      # @jridgewell/gen-mapping collides with "Malware in gen-mapping" — an
      # advisory about the UNSCOPED typosquat of the same base name. The npm
      # typosquatting campaign hit enough popular scoped packages that this is a
      # recurring class, not three one-offs: openbuild's SBOM went red on
      # @rollup/rollup-linux-riscv64-gnu after the ignore list below already
      # covered the first two.
      #
      # Writing "@scope/name" into `name` is what npm itself calls the package,
      # matches the purl that is already correct, and makes Grype match the right
      # advisory. It SUPPRESSES NOTHING: a genuinely unscoped malicious package
      # has no `group` to fold, keeps its bare name, and is still flagged.
      #
      # Recursive because CycloneDX permits nested `components`; a top-level-only
      # pass leaves nested entries unrenamed and still failing.
      - name: Normalise scoped npm names in the SBOM
        run: |
          python3 - <<'PY'
          import json

          with open('sbom.cdx.json') as fh:
              doc = json.load(fh)

          renamed = 0

          def fold(node):
              global renamed
              if isinstance(node, dict):
                  group = node.get('group')
                  name = node.get('name')
                  if group and isinstance(name, str) and not name.startswith('@'):
                      node['name'] = group + '/' + name
                      renamed += 1
                  for value in node.values():
                      fold(value)
              elif isinstance(node, list):
                  for value in node:
                      fold(value)

          fold(doc)

          with open('sbom.cdx.json', 'w') as fh:
              json.dump(doc, fh)

          print(f'Normalised {renamed} scoped component name(s) for Grype matching.')
          PY

      # ── Validation gate ──

      - name: Install Grype
        uses: anchore/scan-action/download-grype@v5
        id: grype-install

      # The ignore list that used to live here is deliberately gone.
      #
      # It suppressed GHSA-8rmg-jf7p-4p22 and GHSA-pvjq-589m-3mc8 outright to work
      # around the scope-matching problem the normalisation step above now fixes
      # properly. Those entries carried no package qualifier, so they suppressed
      # the advisories for ANY component — including a genuinely malicious
      # unscoped `gen-mapping`, which is exactly the package the advisory is about.
      #
      # Measured, by injecting a real unscoped `gen-mapping@0.3.13` (no group) into
      # the SBOM:
      #
      #   with the old ignore list   -> grype exit 0, 0 criticals   (malware hidden)
      #   with normalisation, no list -> grype exit 1, 1 critical    (malware caught)
      #
      # A workaround that hides the thing it is named after is worse than the
      # false positive it was written for.

      - name: CVE scan SBOM
        run: ${{ steps.grype-install.outputs.cmd }} sbom:sbom.cdx.json --fail-on critical

      - name: Composer audit
        run: composer audit --format=json || true
        # composer audit exits non-zero for any advisory; we rely on Grype for blocking

      - name: npm audit
        if: ${{ inputs.enable-frontend }}
        # --omit=dev: gate only on production-dependency criticals. Dev-only
        # build tooling (node-gyp/cacache → tar, cyclonedx, babel, …) is never
        # shipped in the app bundle, and its frequent advisories would otherwise
        # red every run. Matches the dedicated `Security (npm)` job, which
        # already runs `--audit-level=critical --omit=dev`.
        # Also tolerate an unavailable npm advisory endpoint (npm is retiring
        # audits/quick; it intermittently 400s) — an infra outage, not a finding.
        # Real advisories (a vuln table, not an endpoint error) still fail.
        run: |
          out="$(npm audit --audit-level=critical --omit=dev 2>&1)" && rc=0 || rc=$?
          echo "$out"
          if [ "$rc" -ne 0 ] && printf '%s' "$out" | grep -qiE "audit endpoint returned an error|Invalid package tree|ECONNRESET|ETIMEDOUT|ENOTFOUND|being retired|Service Unavailable"; then
            echo "::warning::npm audit skipped — npm advisory endpoint unavailable (external); not a vulnerability."
          elif [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi

      # ── Publish validated SBOM ──
      # The SBOM is intentionally NOT committed back to the repo.
      # It is published via two channels:
      #   1. Workflow artifact (90-day retention) — used by CI debugging + audit replay
      #   2. Release asset on every tag push — stable URL for downstream consumers
      # See SECURITY.md "Software Bill of Materials" for the consumer contract.

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ inputs.app-name }}
          path: sbom.cdx.json
          retention-days: 90

      - name: Attach SBOM to release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          files: sbom.cdx.json

  # ╔══════════════════════════════════════════════╗
  # ║  STAGE 5 — Features verification (read-only)  ║
  # ║                                               ║
  # ║  Scans openspec/specs/*/spec.md for           ║
  # ║  capabilities whose YAML frontmatter declares  ║
  # ║  status: implemented OR reviewed, emits a      ║
  # ║  sorted docs/features.json that the in-product ║
  # ║  Features & Roadmap surface consumes via       ║
  # ║  initial-state injection.                      ║
  # ║                                               ║
  # ║  CI never commits: generation happens at       ║
  # ║  COMMIT TIME via each repo's committed          ║
  # ║  .githooks/pre-commit (CONVENTIONS.md). Both    ║
  # ║  jobs below only verify and HARD-FAIL when     ║
  # ║  stale — via the Quality Report gate that      ║
  # ║  blocks the merge.                             ║
  # ╚══════════════════════════════════════════════╝

  # On pull_request events, run the extractor in `--check` mode only — fail
  # the PR if docs/features.json is stale instead of auto-committing. This
  # keeps the PR diff clean (no bot commits on top of the human's work) and
  # forces the author to regenerate locally so they see the change.
  features-check:
    if: ${{ inputs.enable-features-extract && !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    name: "Features Check"
    # Observed across 174 executions: median 0.2 min, max 3.1 min
    # (zaakafhandelapp).
    timeout-minutes: 20
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python -m pip install --quiet pyyaml

      - name: Checkout shared scripts
        uses: actions/checkout@v4
        with:
          repository: ConductionNL/.github
          path: .conduction-shared
          ref: main

      - name: Verify docs/features.json is up to date
        run: python .conduction-shared/scripts/extract-features.py --app-root . --check

  # READ-ONLY by design. This job used to auto-commit + push the regenerated
  # docs/features.json back to the branch — a quality pipeline mutating the
  # branch it is judging. That moved the PR head from under the checks
  # (with [skip ci] it stripped ALL checks from the PR), dismissed reviewer
  # approvals via the org ruleset's dismiss-stale-on-push, and on protected
  # branches the bot push bounced anyway (#61). Generation now happens at
  # COMMIT TIME in each repo via the committed .githooks/pre-commit hook
  # (see CONVENTIONS.md § features.json is generated at commit time); CI
  # only verifies and hands back the regenerated file as an artifact.
  features-extract:
    if: ${{ inputs.enable-features-extract && !cancelled() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    name: "Features Extract"
    # Observed across 76 executions: median 0.2 min, max 2.5 min
    # (nextcloud-app-template).
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python -m pip install --quiet pyyaml

      - name: Checkout shared scripts
        uses: actions/checkout@v4
        with:
          repository: ConductionNL/.github
          path: .conduction-shared
          ref: main

      - name: Regenerate docs/features.json
        run: python .conduction-shared/scripts/extract-features.py --app-root .

      - name: Fail if stale
        id: fail-if-stale
        run: |
          if git diff --quiet docs/features.json 2>/dev/null && ! git status --porcelain docs/features.json | grep -q '^??'; then
            echo "docs/features.json is up to date."
          else
            echo "::error::docs/features.json is out of date with openspec/specs/. Regenerate it locally (the committed .githooks/pre-commit hook does this automatically — see CONVENTIONS.md) and commit it. The regenerated file is attached as the 'features-json' artifact of this run."
            exit 1
          fi

      - name: Upload regenerated file
        # Gate on the staleness step SPECIFICALLY, not `failure()` alone: if the
        # Regenerate step itself crashed, the file on disk is the stale committed
        # copy (or absent), and uploading it under the 'features-json' label would
        # invite committing exactly what CI just rejected. Only when fail-if-stale
        # failed is the on-disk file guaranteed to be the fresh regeneration.
        # (`failure() &&` is required — without a status-check function GitHub
        # implies `success()`, and the step would never run after a failure.)
        if: failure() && steps.fail-if-stale.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: features-json
          path: docs/features.json
          retention-days: 7
