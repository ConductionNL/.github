name: Release

on:
  workflow_call:
    inputs:
      release-type:
        description: "Release type: unstable, beta, or stable"
        required: true
        type: string
      app-name:
        description: "Nextcloud app ID (must match appinfo/info.xml)"
        required: true
        type: string
      previous-app-id:
        # Set this on an app whose `<id>` has been renamed. The App Store keys
        # everything on the id, so a renamed app is a BRAND NEW store entry
        # starting from nothing -- and the version line would silently restart
        # below what the app already shipped under its old name. filinq was
        # about to publish 0.0.40 while docudesk sits at 0.1.0-beta.3 on the
        # store. Naming the old id here folds its published versions into the
        # baseline, so the renamed app picks the line up instead of restarting
        # it. Delete the input once the old entry is retired.
        description: "Previous App Store id, if this app's <id> was renamed (e.g. docudesk for filinq)"
        required: false
        type: string
        default: ""
      php-version:
        description: "PHP version for building"
        required: false
        type: string
        default: "8.3"
      node-version:
        # Kept in step with quality.yml's default (see the rationale there):
        # an app whose devDependencies require Node 22 to lint must also be
        # able to BUILD its release artefact on the same major.
        description: "Node.js version for building"
        required: false
        type: string
        default: "22"
      verify-vendor-deps:
        description: "Enable vendor dependency verification after composer install"
        required: false
        type: boolean
        default: false
      vendor-check-paths:
        description: "Comma-separated vendor paths to verify exist (e.g. 'openai-php/client/src,theodo-group/llphant/src')"
        required: false
        type: string
        default: ""
      extra-rsync-excludes:
        description: "Additional rsync --exclude flags (one per line, e.g. '/data')"
        required: false
        type: string
        default: ""

jobs:
  release:
    # DO NOT RELEASE THE RELEASE.
    #
    # This workflow ends by opening a pull request that brings the integration
    # branch up to the version it just tagged. Merging that pull request is a
    # push to the integration branch, which triggers this workflow again, which
    # bumps the version again, which opens another pull request. The bump commit
    # used to carry `[skip ci]`, but the MERGE COMMIT that actually lands on the
    # branch does not, so the marker never got a chance to work anyway. It was
    # removed on 2026-08-26 — see the note at the commit step for why keeping it
    # was actively harmful.
    #
    # Left running, the repository releases itself indefinitely. Measured on
    # opencatalogi 2026-08-20, over its last 100 development commits:
    #
    #     45  chore(release): version bumps
    #     46  merges of release/* branches
    #      9  actual work
    #
    # 91% of the branch's history was the workflow reacting to itself, one cycle
    # roughly every ten minutes, and the base version never advanced — every one
    # of those releases was 1.0.9-unstable.<timestamp>. It is not obviously a
    # loop from the outside: each individual run is a legitimate release of a
    # real commit, and the only symptom is that the branch never settles, which
    # reads as "someone is committing a lot" rather than as a defect.
    #
    # It also breaks things downstream. A development branch that moves every
    # ten minutes cancels its own in-flight CI by concurrency, so dev→beta pull
    # requests never finish a full run — opencatalogi's had its E2E and Hydra
    # Gates jobs cancelled repeatedly for exactly this reason.
    #
    # So: skip when the push that triggered us IS the bump landing. Both merge
    # styles are covered — a merge commit names the `release/v*` head branch,
    # and a squash produces `chore(release): <version> (#123)`.
    #
    # Nothing is lost by skipping. Those pushes contain only appinfo/info.xml
    # (and openapi.json where present); re-releasing them would build a
    # byte-identical artefact under a new number.
    #
    # `workflow_dispatch` is deliberately never skipped, so a human can always
    # force a release by hand — including of a commit this guard would refuse.
    if: >-
      github.event_name != 'push'
      || !(
        startsWith(github.event.head_commit.message, 'chore(release):')
        || contains(github.event.head_commit.message, '/release/v')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # The version bump is routed through a pull request rather than pushed
      # straight at a protected branch, so the job needs to open one.
      pull-requests: write
    # Observed across 73 executions of the shared release jobs: median 1.3 min,
    # p95 3.0 min, max 4.0 min (nextcloud-vue). A release is expensive to fail
    # spuriously — it builds the frontend (measured at 211 s under load),
    # installs composer deps, packages and signs a tarball and uploads it — so
    # this is bounded at 45 min, ~11x the worst run, purely as a hang stop.
    timeout-minutes: 45
    steps:

      - name: Validate release type
        run: |
          if [[ "${{ inputs.release-type }}" != "unstable" && "${{ inputs.release-type }}" != "beta" && "${{ inputs.release-type }}" != "stable" ]]; then
            echo "::error::Invalid release-type '${{ inputs.release-type }}'. Must be: unstable, beta, or stable"
            exit 1
          fi
          echo "Release type: ${{ inputs.release-type }}"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Version calculation ──

      # The App Store is the only place that knows what users can actually
      # install, and until now nothing in this workflow read it.
      #
      # The baseline was derived from the newest STABLE git tag (plus, since
      # #589, the branch's own info.xml). Neither sees a prerelease line that
      # ran ahead somewhere else. The fleet spent June and July releasing from
      # Codeberg, where the beta line had walked up a MINOR -- pipelinq
      # 0.4.0-beta.2, decidesk 1.1.0-beta.1, larpingapp 0.2.0-beta.1 -- and
      # those tags are prereleases, so the `^v[0-9]+\.[0-9]+\.[0-9]+$` filter
      # below is blind to them by construction. Back on GitHub the baseline
      # fell back to the old stable patch line and every beta since has
      # proposed a version BELOW what the store already serves: pipelinq
      # computed 0.3.2-beta against a store holding 0.4.0-beta.2. Measured
      # 2026-08-27: 14 of the 21 fleet apps were computing a downgrade.
      #
      # Nothing rejected it. nextcloudappstore/api/v1/views.py::_check_permission
      # validates that the app exists and that you own it, and has NO version
      # ordering rule at all -- a lower version uploads with a 200 and then
      # sits there, never offered to anyone already on a higher one. So the
      # defect is invisible from the upload side: it can only be caught here,
      # by reading what the store holds BEFORE choosing a number.
      #
      # /api/v1/apps.json is the unfiltered catalogue. The per-platform
      # endpoint (/api/v1/platform/<v>/apps.json) is the wrong source: it drops
      # releases that do not match that platform's requirements, so the max it
      # reports can be below the true max and would reintroduce the downgrade.
      # Verified 2026-08-27 across 18 fleet ids -- apps.json agreed with the
      # union of three platform files on every one.
      - name: Read what the App Store already serves
        id: store
        env:
          APP_ID: ${{ inputs.app-name }}
          PREV_APP_ID: ${{ inputs.previous-app-id }}
        run: |
          # No `|| true` anywhere in this step. A failed fetch must not fall
          # back to "the store has nothing", because that is indistinguishable
          # from an unregistered app and would compute the downgrade this step
          # exists to prevent.
          curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors --max-time 180 \
            "https://apps.nextcloud.com/api/v1/apps.json" -o "$RUNNER_TEMP/appstore.json"

          echo "Catalogue: $(wc -c < "$RUNNER_TEMP/appstore.json") bytes, $(python3 -c 'import json,os;print(len(json.load(open(os.environ["RUNNER_TEMP"]+"/appstore.json"))))') apps"

          # Shared by the assertion step further down.
          cat > "$RUNNER_TEMP/semver.py" <<'PY'
          import re


          def parse(v):
              """Order a semver string the way semver.org says, prerelease below release."""
              m = re.match(r"^(\d+)\.(\d+)\.(\d+)(?:-(.+?))?(?:\+.+)?$", v.strip())
              if not m:
                  return None
              major, minor, patch = int(m.group(1)), int(m.group(2)), int(m.group(3))
              pre = m.group(4)
              if pre is None:
                  # A release outranks every prerelease of the same core.
                  key = (1,)
              else:
                  ids = tuple(
                      (0, int(p), "") if p.isdigit() else (1, 0, p) for p in pre.split(".")
                  )
                  key = (0, ids)
              return (major, minor, patch, key)


          def core(v):
              p = parse(v)
              return None if p is None else "%d.%d.%d" % p[:3]
          PY

          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, sys

          sys.path.insert(0, os.environ["RUNNER_TEMP"])
          from semver import parse, core

          catalogue = json.load(open(os.environ["RUNNER_TEMP"] + "/appstore.json"))
          by_id = {a["id"]: a for a in catalogue}

          def max_version(app_id):
              app = by_id.get(app_id)
              if app is None:
                  return None
              versions = [r["version"] for r in app.get("releases", [])]
              parsed = [v for v in versions if parse(v) is not None]
              if len(parsed) != len(versions):
                  # An unparseable version would be silently dropped from the
                  # max, which is exactly the kind of quiet downgrade this step
                  # is here to stop.
                  bad = sorted(set(versions) - set(parsed))
                  sys.exit("App Store lists a version this step cannot order: %s" % bad)
              return max(parsed, key=parse) if parsed else None

          app_id = os.environ["APP_ID"]
          prev_id = os.environ.get("PREV_APP_ID", "").strip()

          this_max = max_version(app_id)
          prev_max = max_version(prev_id) if prev_id else None

          if prev_id and prev_id not in by_id:
              sys.exit(
                  "previous-app-id is set to %r but no such app is on the App Store. "
                  "Either it is misspelled or the old entry is gone -- drop the input "
                  "rather than leaving it pointing at nothing." % prev_id
              )

          print("registered=%s" % ("true" if app_id in by_id else "false"))
          print("max=%s" % (this_max or ""))
          print("previous_max=%s" % (prev_max or ""))

          cores = [core(v) for v in (this_max, prev_max) if v]
          print("baseline=%s" % (max(cores, key=parse) if cores else ""))

          print(
              "App Store: %s is %s (max %s)%s"
              % (
                  app_id,
                  "registered" if app_id in by_id else "NOT registered",
                  this_max or "-",
                  ", previous id %s max %s" % (prev_id, prev_max or "-") if prev_id else "",
              ),
              file=sys.stderr,
          )
          PY

      - name: Get latest stable version
        id: stable_version
        run: |
          # Find latest stable version tag (vX.Y.Z without prerelease suffix)
          LATEST_TAG=$(git tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)

          if [ -z "$LATEST_TAG" ]; then
            # Fallback: read from info.xml on main
            git fetch origin main 2>/dev/null || true
            VERSION=$(git show origin/main:appinfo/info.xml 2>/dev/null | grep -oP '(?<=<version>)[^<]+' | sed 's/-.*//' || echo "")

            if [ -z "$VERSION" ]; then
              # Last resort: current info.xml
              VERSION=$(grep -oP '(?<=<version>)[^<]+' appinfo/info.xml | sed 's/-.*//')
            fi

            echo "No git tags found, using info.xml baseline: $VERSION"
          else
            VERSION="${LATEST_TAG#v}"
            echo "Latest stable tag: $LATEST_TAG ($VERSION)"
          fi

          # The baseline must not sit BELOW the branch we are releasing from.
          #
          # Everything above derives it from the latest stable TAG (or main's
          # info.xml). On several apps that trails `development` badly:
          #
          #     thematiq   tag v1.0.0  development 1.1.0
          #     versioniq  tag v1.2.0  development 1.4.1
          #     planninq   tag v0.1.3  development 0.2.13
          #     integriq   no tag      development 0.3.4
          #
          # Bumping the patch of a baseline that already trails the branch still
          # computes a version BELOW what is shipping -- 1.2.1-unstable.<ts> is
          # less than 1.4.1 -- so the downgrade survives. Taking the max with the
          # branch's own version is what actually closes it.
          CURRENT=$(grep -oP '(?<=<version>)[^<]+' appinfo/info.xml | head -1 | sed 's/-.*//')
          if [ -n "$CURRENT" ]; then
            HIGHER=$(printf '%s\n%s\n' "$VERSION" "$CURRENT" | sort -V | tail -1)
            if [ "$HIGHER" != "$VERSION" ]; then
              echo "Baseline $VERSION trails the branch ($CURRENT); using $CURRENT"
              VERSION="$HIGHER"
            fi
          fi

          # ...and it must not trail the App Store either. Both sources above
          # are repository-local, and the repository is precisely what lost the
          # Codeberg-era prerelease line. The branch's own info.xml is not a
          # backstop for that: the version bump lands through a pull request,
          # so whenever that PR has not merged yet, info.xml still reads the
          # PREVIOUS release's number and this guard sees nothing wrong.
          STORE="${{ steps.store.outputs.baseline }}"
          if [ -n "$STORE" ]; then
            HIGHER=$(printf '%s\n%s\n' "$VERSION" "$STORE" | sort -V | tail -1)
            if [ "$HIGHER" != "$VERSION" ]; then
              echo "Baseline $VERSION trails the App Store ($STORE); using $STORE"
              VERSION="$HIGHER"
            fi
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Baseline: $VERSION"

      - name: Calculate unstable version
        if: inputs.release-type == 'unstable'
        run: |
          STABLE="${{ steps.stable_version.outputs.version }}"
          IFS='.' read -ra PARTS <<< "$STABLE"

          # Unstable, like beta, is always one patch AHEAD of the stable
          # baseline. It used to reuse the baseline verbatim
          # ("${STABLE}-unstable.${TIMESTAMP}"), and that is a downgrade by
          # construction: a prerelease sorts BELOW the release of the same
          # core version, so 0.2.0-unstable.20260827023555 < 0.2.0.
          #
          # It only stayed invisible while development sat on a prerelease of
          # its own. The moment an app's development carried a STABLE version
          # -- integriq 0.3.4, thematiq 1.1.0, humaniq 0.2.0, versioniq 1.4.1,
          # planninq 0.2.13 -- every release this job opened proposed to move
          # the app backwards, and had to be triaged and closed by hand once
          # per push. The #566 auto-merge guard refused them, so nothing ever
          # shipped backwards; the cost was the endless backlog, not a bad
          # release.
          #
          # The beta branch below already computed it this way, and was never
          # affected. This makes unstable agree with it.
          NEXT_PATCH=$(( ${PARTS[2]} + 1 ))
          TIMESTAMP=$(date -u +"%Y%m%d%H%M%S")

          UNSTABLE_VERSION="${PARTS[0]}.${PARTS[1]}.${NEXT_PATCH}-unstable.${TIMESTAMP}"

          echo "NEW_VERSION=$UNSTABLE_VERSION" >> $GITHUB_ENV
          echo "APP_NAME=${{ inputs.app-name }}" >> $GITHUB_ENV
          echo "Unstable version: $UNSTABLE_VERSION (stable baseline: $STABLE)"

      - name: Calculate beta version
        if: inputs.release-type == 'beta'
        run: |
          STABLE="${{ steps.stable_version.outputs.version }}"
          IFS='.' read -ra PARTS <<< "$STABLE"

          # Beta is always one patch ahead of stable
          NEXT_PATCH=$(( ${PARTS[2]} + 1 ))
          TIMESTAMP=$(date -u +"%Y%m%d%H%M%S")

          BETA_VERSION="${PARTS[0]}.${PARTS[1]}.${NEXT_PATCH}-beta.${TIMESTAMP}"

          echo "NEW_VERSION=$BETA_VERSION" >> $GITHUB_ENV
          echo "APP_NAME=${{ inputs.app-name }}" >> $GITHUB_ENV
          echo "Beta version: $BETA_VERSION (stable baseline: $STABLE)"

      - name: Get merged PR labels
        if: inputs.release-type == 'stable'
        id: pr_label
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Find the PR that was just merged (the merge commit on main)
          MERGE_SHA="${{ github.sha }}"

          # Query GitHub for PRs associated with this commit
          PR_DATA=$(gh api repos/${{ github.repository }}/commits/${MERGE_SHA}/pulls \
            --jq '.[0] | {number: .number, labels: [.labels[].name]}' 2>/dev/null || echo '{}')

          PR_NUMBER=$(echo "$PR_DATA" | jq -r '.number // empty')
          echo "Merged PR: #${PR_NUMBER:-none}"

          # Determine bump level from labels (default: patch)
          BUMP="patch"
          LABELS=$(echo "$PR_DATA" | jq -r '.labels[]? // empty' 2>/dev/null)

          for label in $LABELS; do
            case "$label" in
              major) BUMP="major"; break ;;
              minor) BUMP="minor"; break ;;
              patch) BUMP="patch"; break ;;
            esac
          done

          echo "bump=$BUMP" >> $GITHUB_OUTPUT
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
          echo "Bump level: $BUMP"

      - name: Calculate stable version
        if: inputs.release-type == 'stable'
        id: next_version
        uses: actions-ecosystem/action-bump-semver@v1
        with:
          current_version: ${{ steps.stable_version.outputs.version }}
          level: ${{ steps.pr_label.outputs.bump }}

      - name: Set stable version env
        if: inputs.release-type == 'stable'
        run: |
          VERSION="${{ steps.next_version.outputs.new_version }}"
          echo "NEW_VERSION=$VERSION" >> $GITHUB_ENV
          echo "APP_NAME=${{ inputs.app-name }}" >> $GITHUB_ENV
          echo "Releasing stable version: $VERSION"

      # Assert the two properties the steps above are supposed to produce,
      # rather than trusting that they did.
      #
      # This is deliberately a separate step with its own comparison. The
      # baseline arithmetic works in stripped X.Y.Z cores and `sort -V`; a
      # published version is a full semver string where `1.0.10-beta.2` ranks
      # below `1.0.10` and `0.4.0-beta.2` above `0.4.0-beta.1`. Re-checking the
      # real thing under real semver is what catches an off-by-one in the core
      # arithmetic -- comparing cores to cores again would just agree with it.
      - name: The release must outrank the App Store, and must not invent a major
        env:
          NEW_VERSION: ${{ env.NEW_VERSION }}
          BASELINE: ${{ steps.stable_version.outputs.version }}
          STORE_MAX: ${{ steps.store.outputs.max }}
          STORE_PREV_MAX: ${{ steps.store.outputs.previous_max }}
          PREV_APP_ID: ${{ inputs.previous-app-id }}
          BUMP_LEVEL: ${{ steps.pr_label.outputs.bump }}
          RELEASE_TYPE: ${{ inputs.release-type }}
        run: |
          python3 - <<'PY'
          import os, sys

          sys.path.insert(0, os.environ["RUNNER_TEMP"])
          from semver import parse

          new = os.environ["NEW_VERSION"]
          new_p = parse(new)
          if new_p is None:
              sys.exit("Computed version %r is not a semver string." % new)

          failures = []

          for label, other in (
              ("the App Store entry for this app", os.environ.get("STORE_MAX", "")),
              (
                  "the App Store entry for %s (previous-app-id)"
                  % os.environ.get("PREV_APP_ID", ""),
                  os.environ.get("STORE_PREV_MAX", ""),
              ),
          ):
              other = other.strip()
              if not other:
                  continue
              if new_p <= parse(other):
                  failures.append(
                      "%s already serves %s, which outranks the %s this run would "
                      "publish. The App Store accepts it with a 200 and then never "
                      "offers it to anyone, so this has to fail here."
                      % (label, other, new)
                  )

          baseline = os.environ.get("BASELINE", "").strip()
          if baseline:
              base_major = parse(baseline)[0]
              deliberate = (
                  os.environ.get("RELEASE_TYPE") == "stable"
                  and os.environ.get("BUMP_LEVEL") == "major"
              )
              if new_p[0] != base_major and not deliberate:
                  failures.append(
                      "This run would move the major from %d to %d off its own "
                      "arithmetic. A major bump is a decision, not a side effect -- "
                      "it happens only on a stable release carrying the `major` "
                      "label." % (base_major, new_p[0])
                  )

          if failures:
              for f in failures:
                  print("::error::%s" % f)
              sys.exit(1)

          print(
              "%s outranks the App Store (%s) and stays on major %d."
              % (new, os.environ.get("STORE_MAX") or "nothing published", new_p[0])
          )
          PY

      # ── Build ──

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      # setup-node installs the npm BUNDLED with the Node it selects, which is
      # not necessarily the npm the repository requires. Node 22 bundles npm
      # 10; launchpad and portaliq declare `engines.npm: ^11.0.0` and ship an
      # `.npmrc` using `min-release-age`, a supply-chain cooldown that exists
      # ONLY on npm 11+.
      #
      # MEASURED 2026-08-20: on npm 10 that setting is silently ignored,
      # resolution differs, and `npm ci` rejects a PERFECTLY GOOD lock as out
      # of sync — "Missing: vite@8.2.2 from lock file". The lock is fine: the
      # identical commit installs cleanly under npm 11 (`npm ci --dry-run`,
      # exit 0, 1416 packages). Both apps' releases failed on this, and the
      # error blames the lock, so the obvious "fix" is to regenerate the lock
      # — which would have re-broken the cooldown policy while papering over a
      # toolchain mismatch.
      #
      # So honour what the repo declares. A repo with no `engines.npm` keeps
      # the bundled npm and is unaffected.
      - name: Honour engines.npm
        run: |
          set -euo pipefail
          if [ ! -f package.json ]; then
            echo "no package.json — nothing to honour"
            exit 0
          fi
          RANGE="$(node -p "(((require('./package.json').engines)||{}).npm)||''")"
          if [ -z "${RANGE}" ]; then
            echo "package.json declares no engines.npm — keeping bundled npm $(npm -v)"
            exit 0
          fi
          echo "package.json engines.npm = ${RANGE}; bundled npm is $(npm -v)"
          npm i -g "npm@${RANGE}"
          echo "now running npm $(npm -v)"

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}
          extensions: zip, gd

      - name: Install and build frontend
        run: |
          if [ -f "package.json" ]; then
            npm ci
            npm run build
          else
            echo "No package.json found, skipping frontend build"
          fi

      - name: Install composer dependencies
        run: |
          if [ -f "composer.json" ]; then
            composer install --no-dev --optimize-autoloader --classmap-authoritative
          else
            echo "No composer.json found, skipping composer install"
          fi

      - name: Verify vendor dependencies
        if: inputs.verify-vendor-deps
        run: |
          echo "Checking critical vendor dependencies..."

          if [ ! -d "vendor" ] || [ -z "$(ls -A vendor 2>/dev/null)" ]; then
            echo "ERROR: vendor directory is missing or empty"
            exit 1
          fi

          IFS=',' read -ra PATHS <<< "${{ inputs.vendor-check-paths }}"
          missing=0
          for check_path in "${PATHS[@]}"; do
            check_path=$(echo "$check_path" | xargs)
            if [ -n "$check_path" ] && [ ! -d "vendor/$check_path" ]; then
              echo "ERROR: vendor/$check_path not found"
              missing=1
            fi
          done

          if [ $missing -eq 1 ]; then
            echo "HINT: Check composer.json dependencies and composer install output"
            exit 1
          fi

          echo "✓ All critical dependencies verified"

      # ── Package ──

      # ── Commit the version to the repository, BEFORE the tag exists ──
      #
      # This retires "Version Is Not In The Repository". The version used to
      # exist only inside the built package: `sed` rewrote appinfo/info.xml in
      # the copy under package/, and the committed file kept whatever stale
      # number was last hand-edited.
      #
      # That is incompatible with Nextcloud's own release template, which reads
      # the version FROM appinfo/info.xml and asserts the tag matches:
      #
      #     [ "$APP_VERSION" = "v$(xpath info.xml //version)" ]
      #
      # Following Nextcloud means the repository has to be the source of truth,
      # so the bump is committed here and the tag is cut from that commit. The
      # tag then names a tree whose info.xml says what the tag says.
      #
      # This commit deliberately does NOT carry `[skip ci]`.
      #
      # It used to. The reasoning was that the commit changes one number in one
      # XML file and the quality suite has already run on the code being
      # released, so a second full pipeline is waste. That reasoning was sound
      # about cost and wrong about consequence.
      #
      # `[skip ci]` suppresses EVERY workflow on the resulting pull request,
      # including merge-hygiene.yml — and merge-hygiene's job, "Conflict markers
      # and PHP syntax", is the single REQUIRED status check on `development` in
      # all 17 fleet repos. A required check that never runs is never satisfied,
      # so the pull request sat at MERGEABLE/BLOCKED forever: auto-merge was
      # enabled, every check that did run was green, and it still could not
      # merge. That is the mechanism behind the release-PR pile-up in
      # ConductionNL/.github#562 — the loop opened one per run and nothing ever
      # closed them. Measured 2026-08-26: 73 of 74 green open PRs fleet-wide
      # were release bumps in exactly this state.
      #
      # The cost objection also weakened: these are public repositories, where
      # Actions minutes are billed at $0.
      #
      # So the suite now runs on the release PR. It verifies the tree that is
      # actually being tagged, and the required check appears, so auto-merge
      # completes on its own.
      #
      # No push on a dry run and no push when the number has not moved — a
      # re-run of a release that already happened must not create an empty
      # commit and re-tag it.
      - name: Commit the version bump
        id: bump
        run: |
          set -euo pipefail
          CURRENT=$(grep -oP '(?<=<version>)[^<]+' appinfo/info.xml | head -1)

          # An app that publishes an OpenAPI document carries the same version a
          # SECOND time, in `openapi.json`'s `info.version`. Bumping only
          # appinfo/info.xml leaves the two disagreeing, and that is not
          # cosmetic: opencatalogi asserts they match (OpenApiParityTest, which
          # exists because the served document's version is a published API
          # fact), so ONE release after the numbers diverged all six of its
          # PHPUnit cells went red — and stayed red, because every subsequent
          # release moved info.xml again. See opencatalogi#912.
          #
          # Three distinct states, kept apart on purpose. Folding "no document"
          # and "document with no info.version" into one empty string would let
          # the second pass silently, and OpenAPI 3.x REQUIRES info.version — so
          # that case is a real defect in the app, worth a warning rather than a
          # shrug. It does not fail the release: the document was already like
          # that before this step existed, and a release is the wrong place to
          # start enforcing it.
          OPENAPI_CURRENT=""
          OPENAPI_STATE="absent"
          if [ -f openapi.json ]; then
            OPENAPI_CURRENT=$(python3 -c 'import json; print(json.load(open("openapi.json")).get("info", {}).get("version", ""))')
            if [ -n "$OPENAPI_CURRENT" ]; then
              OPENAPI_STATE="versioned"
            else
              OPENAPI_STATE="unversioned"
              echo "::warning::openapi.json ships no info.version, which OpenAPI 3.x requires. The release cannot keep a version it cannot find in step with appinfo/info.xml, so this document will drift."
            fi
          fi

          # BOTH files have to be current before this is "nothing to commit".
          # Checking only info.xml would skip a re-run over a tree where the XML
          # already matches but the JSON still lags — which is precisely the
          # state opencatalogi was left in.
          if [ "$CURRENT" = "${{ env.NEW_VERSION }}" ] \
             && { [ "$OPENAPI_STATE" != "versioned" ] || [ "$OPENAPI_CURRENT" = "${{ env.NEW_VERSION }}" ]; }; then
            echo "appinfo/info.xml (and openapi.json where present) already say ${{ env.NEW_VERSION }} — nothing to commit."
            echo "bump_sha=" >> "$GITHUB_OUTPUT"
            echo "bump_branch=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sed -i "s|<version>.*</version>|<version>${{ env.NEW_VERSION }}</version>|" appinfo/info.xml
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appinfo/info.xml

          # Byte-precise edit, NOT a json round-trip. Re-serialising a 2000-line
          # document to change one string would reformat the whole file and bury
          # the release diff; it would also silently normalise anything the
          # generator wrote deliberately. Replace only the first "version" that
          # follows the top-level "info" key, then prove the result still parses.
          # The sys.exit below is reachable only for a document whose "info" block
          # loses its version between the read above and this write.
          #
          # The heredoc body sits at the block's base indentation on purpose: YAML
          # strips the common prefix from a `|` scalar, so anything further in
          # would reach bash still indented — the terminator would not close the
          # heredoc, and Python would refuse the leading whitespace.
          if [ "$OPENAPI_STATE" = "versioned" ] && [ "$OPENAPI_CURRENT" != "${{ env.NEW_VERSION }}" ]; then
          python3 - <<'PY'
          import json, os, re, sys

          path = "openapi.json"
          src = open(path, encoding="utf-8").read()
          new = os.environ["NEW_VERSION"]

          start = src.index('"info"')
          match = re.search(r'"version"\s*:\s*"[^"]*"', src[start:])
          if match is None:
              sys.exit('openapi.json has an "info" object with no "version" — refusing to guess where the version lives.')

          patched = src[:start + match.start()] + '"version": "%s"' % new + src[start + match.end():]

          if json.loads(patched)["info"]["version"] != new:
              sys.exit("openapi.json did not carry the new version after patching — refusing to commit it.")

          open(path, "w", encoding="utf-8").write(patched)
          print("openapi.json info.version -> %s" % new)
          PY
            git add openapi.json
          fi

          git commit -m "chore(release): ${{ env.NEW_VERSION }}"

          # The bump lands on its OWN branch, never on ${{ github.ref_name }}.
          # `development`, `beta` and `main` all require a pull request, so a
          # direct push is rejected with GH013 and the release dies there — which
          # is exactly what happened to openregister and openconnector.
          BUMP_BRANCH="release/v${{ env.NEW_VERSION }}"
          if git ls-remote --exit-code --heads origin "$BUMP_BRANCH" >/dev/null 2>&1; then
            # A previous run of this same version already created it. Reuse it
            # rather than overwriting: a force push here would discard whatever
            # that run produced, and the tag below has to name a real commit.
            BUMP_SHA=$(git ls-remote origin "refs/heads/$BUMP_BRANCH" | cut -f1)
            echo "::notice::$BUMP_BRANCH already exists at ${BUMP_SHA} — reusing it."
          else
            git push origin "HEAD:refs/heads/$BUMP_BRANCH"
            BUMP_SHA=$(git rev-parse HEAD)
            echo "Committed ${CURRENT} -> ${{ env.NEW_VERSION }} on $BUMP_BRANCH"
          fi
          echo "bump_sha=${BUMP_SHA}" >> "$GITHUB_OUTPUT"
          echo "bump_branch=${BUMP_BRANCH}" >> "$GITHUB_OUTPUT"
          # Exported so the pull-request step can refuse to auto-merge a bump
          # that would move the branch BACKWARDS. See the guard there.
          echo "prev_version=${CURRENT}" >> "$GITHUB_OUTPUT"

      # THE BUMP PULL REQUEST MERGES WITHOUT A QUALITY GATE, SO BOUND WHAT IT
      # IS ALLOWED TO CONTAIN.
      #
      # A pull request opened with GITHUB_TOKEN does not trigger any workflow —
      # GitHub's anti-recursion rule — so `Code Quality` and `Merge Hygiene`
      # never run on it. Measured 2026-08-24: openregister#2817 merged with 4
      # check-runs, all CodeQL, where neighbouring pull requests had 45. Roughly
      # 15 such pull requests were merged across the fleet that day.
      #
      # We cannot cheaply give it real CI (quality.yml has no `ref` input, so
      # calling it from here would check out the integration branch and report a
      # green describing a DIFFERENT commit — the precise failure this guard
      # exists to prevent). What we CAN do is make the unverified content small
      # enough that not verifying it is defensible: the bump step stages only
      # appinfo/info.xml and, where present, openapi.json.
      #
      # Two checks, deliberately different in severity:
      #
      #   1. The commit THIS RUN created is a hard failure if it strays outside
      #      the allow-list. That commit is entirely under our control and has no
      #      legitimate reason to contain anything else.
      #
      #   2. The pull request's full diff against the base is a WARNING only.
      #      The reuse path above adopts a pre-existing release/vX branch whose
      #      contents this run did not author, and the base may have drifted.
      #      Failing here would abort the workflow AFTER the tag is cut and the
      #      package published, turning a reporting gap into a broken release —
      #      strictly worse than the gap. Annotate loudly and let a human judge.
      - name: The bump commit may only touch version files
        if: steps.bump.outputs.bump_sha != ''
        env:
          BUMP_SHA: ${{ steps.bump.outputs.bump_sha }}
          BASE_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # `git commit` without -a stages nothing on its own, so this is the
          # exact set the bump step chose to add.
          ALLOWED='^(appinfo/info\.xml|openapi\.json)$'

          if ! git cat-file -e "${BUMP_SHA}^{commit}" 2>/dev/null; then
            echo "::notice::${BUMP_SHA} is not present locally (pre-existing branch reused) — skipping the commit check."
          else
            CHANGED="$(git diff --name-only "${BUMP_SHA}^" "${BUMP_SHA}")"
            echo "Files in the bump commit:"
            echo "${CHANGED}" | sed 's/^/  /'
            STRAY="$(echo "${CHANGED}" | grep -vE "${ALLOWED}" || true)"
            if [ -n "${STRAY}" ]; then
              echo "::error::The version-bump commit touches files outside the version allow-list."
              echo "::error::This pull request merges WITHOUT a quality gate, so it may only carry version metadata."
              echo "${STRAY}" | sed 's/^/  unexpected: /'
              exit 1
            fi
            echo "Bump commit is version-only."
          fi

          # Widen to what will actually be merged. Fetch the base explicitly:
          # the checkout is shallow and origin/<base> may not be present.
          git fetch --no-tags --depth=50 origin "${BASE_REF}" >/dev/null 2>&1 || true
          if git rev-parse --verify -q FETCH_HEAD >/dev/null; then
            FULL="$(git diff --name-only FETCH_HEAD..."${BUMP_SHA}" 2>/dev/null || true)"
            EXTRA="$(echo "${FULL}" | grep -vE "${ALLOWED}" | grep -v '^$' || true)"
            if [ -n "${EXTRA}" ]; then
              echo "::warning::The bump pull request carries more than version metadata, and nothing will run CI on it."
              echo "${EXTRA}" | sed 's/^/  also changed: /'
            fi
          fi

      # THE TAG STILL NAMES A TREE WHOSE info.xml MATCHES IT.
      #
      # That requirement is not ours — Nextcloud's release template asserts it:
      #     [ "$APP_VERSION" = "v$(xpath info.xml //version)" ]
      # A tag does not have to sit on the integration branch to satisfy it, so
      # the tag is cut from the bump commit on the release branch (see `commit:`
      # on the release step) and the branch catches up via this pull request.
      - name: Open the version-bump pull request
        if: steps.bump.outputs.bump_branch != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BR="${{ steps.bump.outputs.bump_branch }}"
          if gh pr view "$BR" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "A pull request for $BR already exists."
            exit 0
          fi
          gh pr create \
            --repo "${{ github.repository }}" \
            --base "${{ github.ref_name }}" \
            --head "$BR" \
            --title "chore(release): ${{ env.NEW_VERSION }}" \
            --body "Version bump for ${{ env.NEW_VERSION }}, opened by the release workflow.

          The tag v${{ env.NEW_VERSION }} already names this commit, so the released
          package and its label agree. Merging this brings ${{ github.ref_name }} up
          to the released version.

          Raised as a pull request rather than pushed directly because
          ${{ github.ref_name }} requires one; a direct push is rejected with GH013
          and takes the release down with it."

          # CLOSE THE LOOP. Opening the pull request is not the same as landing
          # the bump, and until 2026-08-24 nothing did the second half: every
          # release added one more open PR and none were ever merged. The
          # backlog reached 230 across 17 repos — 25 on openregister, 26 on
          # shillinq — and each one held the branch one version behind the tag
          # that had already been published from it.
          #
          # Auto-merge rather than a direct merge, because neither alternative
          # works here:
          #   --admin  needs admin rights to bypass branch protection, and
          #            github.token is not an admin;
          #   plain    merge is refused while the required check is pending.
          # --auto queues the merge and GitHub performs it when the required
          # check passes, with no human in the loop and nothing left open.
          #
          # `allow_auto_merge` must be true on the repository or this errors —
          # it was false fleet-wide until 2026-08-24 and is now enabled on all
          # 17 core apps. A failure here must not fail the release: the tag and
          # the package are already published by this point, so the bump PR
          # staying open is a backlog item, not a broken release.
          #
          # BUT NEVER AUTO-MERGE A BUMP THAT GOES BACKWARDS.
          #
          # On a branch carrying a STABLE version, the unstable line computes
          # its next version from a base that predates that release, and the
          # result is LOWER than what is already there. Measured 2026-08-24:
          # integriq `0.3.4` -> `0.2.25-unstable`, thematiq `1.1.0` ->
          # `1.0.0-unstable`. Those 29 PRs were closed unmerged precisely
          # because merging them would have downgraded the app.
          #
          # Automating the merge without this guard would turn a backlog of
          # PRs nobody merged into a downgrade nobody reviewed — strictly worse
          # than the accumulation it replaces. The PR is still opened, so the
          # case stays visible; it is only the *merge* that is withheld.
          PREV="${{ steps.bump.outputs.prev_version }}"
          NEW="${{ env.NEW_VERSION }}"
          if [ -n "$PREV" ] && ! python3 -c "
          import sys, re
          def key(v):
              m = re.match(r'^(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z.\-]+))?$', v.strip())
              if not m:
                  sys.exit(2)                      # unparseable: do not judge
              core = tuple(int(m.group(i)) for i in (1, 2, 3))
              pre = m.group(4)
              # semver: a release outranks any prerelease of the same core
              return (core, 1 if pre is None else 0, pre or '')
          sys.exit(0 if key('$NEW') > key('$PREV') else 1)
          "; then
            echo "::warning::Not auto-merging $BR — ${NEW} does not sort above ${PREV}, so merging it would move ${{ github.ref_name }} backwards (or the versions could not be compared). The pull request stays open for a human."
            exit 0
          fi

          gh pr merge "$BR" \
            --repo "${{ github.repository }}" \
            --squash \
            --auto \
            || echo "::warning::Could not set auto-merge on the version-bump PR for $BR — it stays open and ${{ github.ref_name }} remains one version behind the tag. Check that allow_auto_merge is enabled on this repository."

      - name: Copy files into package directory
        run: |
          mkdir -p package/${{ inputs.app-name }}
          rsync -a --progress \
            --exclude='/package' \
            --exclude='/.git' \
            --exclude='/.github' \
            --exclude='/.claude' \
            --exclude='/.hydra' \
            --exclude='/.cursor' \
            --exclude='/.vscode' \
            --exclude='/.nextcloud' \
            --exclude='/docker' \
            --exclude='/docker-compose.yml' \
            --exclude='/docs' \
            --exclude='/docusaurus' \
            --exclude='/website' \
            --exclude='/node_modules' \
            --exclude='/src' \
            --exclude='/phpcs-custom-sniffs' \
            --exclude='/resources' \
            --exclude='/tests' \
            --exclude='/data' \
            --exclude='/openspec' \
            --exclude='/package.json' \
            --exclude='/package-lock.json' \
            --exclude='/composer.json' \
            --exclude='/composer.lock' \
            --exclude='/composer-setup.php' \
            --exclude='/phpcs.xml' \
            --exclude='/phpmd.xml' \
            --exclude='/psalm.xml' \
            --exclude='/phpunit.xml' \
            --exclude='/phpunit-unit.xml' \
            --exclude='/.phpunit.cache' \
            --exclude='.phpunit.result.cache' \
            --exclude='/jest.config.js' \
            --exclude='/eslint.config.js' \
            --exclude='/webpack.config.js' \
            --exclude='/tsconfig.json' \
            --exclude='/.babelrc' \
            --exclude='/.eslintrc.js' \
            --exclude='/.prettierrc' \
            --exclude='/stylelint.config.js' \
            --exclude='/.spectral.yml' \
            --exclude='/.gitignore' \
            --exclude='/.gitattributes' \
            --exclude='/.php-cs-fixer.dist.php' \
            --exclude='/.nvmrc' \
            --exclude='/changelog-ci-config.json' \
            --exclude='/coverage.txt' \
            --exclude='/.coverage-baseline' \
            --exclude='/signing-key.key' \
            --exclude='/signing-cert.crt' \
            --exclude='/openapi.json' \
            --exclude='/.phpqa.yml' \
            --exclude='/.grype.yaml' \
            --exclude='/sbom.cdx.json' \
            --exclude='/bom-npm-test.cdx.json' \
            --exclude='/*_ANALYSIS.md' \
            --exclude='/*_FIX.md' \
            --exclude='/*_SUMMARY.md' \
            --exclude='/*_GUIDE.md' \
            --exclude='/CHANGELOG.md' \
            --exclude='/CONTRIBUTING.md' \
            ${{ inputs.extra-rsync-excludes }} \
            ./ package/${{ inputs.app-name }}/

      - name: Inject version into package info.xml
        run: |
          sed -i "s|<version>.*</version>|<version>${{ env.NEW_VERSION }}</version>|" \
            package/${{ inputs.app-name }}/appinfo/info.xml
          echo "Injected version ${{ env.NEW_VERSION }} into package info.xml"
          grep '<version>' package/${{ inputs.app-name }}/appinfo/info.xml

      - name: Verify package contents
        if: inputs.verify-vendor-deps
        run: |
          if [ ! -d "package/${{ inputs.app-name }}/vendor" ]; then
            echo "ERROR: vendor directory not found in package"
            exit 1
          fi

          IFS=',' read -ra PATHS <<< "${{ inputs.vendor-check-paths }}"
          for check_path in "${PATHS[@]}"; do
            check_path=$(echo "$check_path" | xargs)
            if [ -n "$check_path" ] && [ ! -d "package/${{ inputs.app-name }}/vendor/$check_path" ]; then
              echo "ERROR: vendor/$check_path not found in package"
              exit 1
            fi
          done

          echo "✓ Package vendor directory verified"

      # ── Sign & Release ──

      - name: Prepare signing credentials
        env:
          SIGNING_KEY: ${{ secrets.NEXTCLOUD_SIGNING_KEY }}
          SIGNING_CERT: ${{ secrets.NEXTCLOUD_SIGNING_CERT }}
        run: |
          printf '%s\n' "$SIGNING_KEY"  > signing-key.key
          printf '%s\n' "$SIGNING_CERT" > signing-cert.crt

          # CHECK THE CREDENTIALS HERE, WHERE THE ERROR CAN NAME THEM.
          #
          # An absent secret interpolates to an empty string, so this step used
          # to write a file containing one newline and report success. The
          # failure then surfaced four steps later, inside Nextcloud, as:
          #
          #     TypeError: base64_encode(): Argument #1 ($string) must be of
          #     type string, false given in .../IntegrityCheck/Checker.php:184
          #
          # which is `$privateKey->sign()` returning false because phpseclib
          # never loaded a key. Nothing in that message mentions a secret, a
          # repository, or a name to go and set.
          #
          # Measured across the fleet on 2026-08-24: NEXTCLOUD_SIGNING_KEY and
          # NEXTCLOUD_SIGNING_CERT are REPOSITORY-level secrets, not org-level.
          # Nine repos have them and release cleanly; humaniq, versioniq and
          # planninq have neither and had been failing every release since at
          # least 2026-08-23 with the TypeError above. Correlation was exact.
          for pair in "signing-key.key:NEXTCLOUD_SIGNING_KEY:PRIVATE KEY" \
                      "signing-cert.crt:NEXTCLOUD_SIGNING_CERT:CERTIFICATE"; do
            file="${pair%%:*}"; rest="${pair#*:}"
            name="${rest%%:*}"; marker="${rest#*:}"
            if [ ! -s "$file" ] || [ "$(tr -d '[:space:]' < "$file" | wc -c)" -eq 0 ]; then
              echo "::error title=${name} is not set::This repository has no ${name} secret, so the signing ${marker,,} is empty. These are REPOSITORY-level secrets (nine fleet repos have them; this one does not). Add it under Settings → Secrets and variables → Actions. Without this the run fails later inside Nextcloud with 'base64_encode(): ... false given', which names nothing you can act on."
              exit 1
            fi
            if ! grep -q -- "-----BEGIN .*${marker}-----" "$file"; then
              echo "::error title=${name} is not a PEM ${marker,,}::The secret is set but does not contain a '-----BEGIN ... ${marker}-----' line, so phpseclib will not load it and signing will return false. Check the secret was pasted whole, including its header and footer lines."
              exit 1
            fi
          done
          echo "Signing credentials present and PEM-shaped."

      # ── Nextcloud's own integrity signature ──
      #
      # THE GAP THIS CLOSES: every release this fleet has ever published went
      # out WITHOUT appinfo/signature.json. We signed the tarball — which is
      # what the App Store API authenticates the upload with — and stopped
      # there. Nextcloud's integrity checker verifies something else entirely:
      # a per-file manifest INSIDE the app directory. Without it, `occ
      # integrity:check-app <app>` reports the app as unverifiable, and an
      # administrator running an integrity check sees our apps as the ones that
      # cannot be vouched for.
      #
      # `occ` has to come from somewhere, so the server is fetched at the
      # version the app declares it needs. Reading min-version from info.xml
      # rather than hardcoding it is the same principle as
      # icewind1991/nextcloud-version-matrix: the release cannot drift from what
      # the app says it supports, because it is computed from it.
      #
      # NOT continue-on-error. An unsigned package that ships looks exactly like
      # a signed one until an administrator checks, which is precisely the class
      # of silent gap this whole change is about.
      - name: Fetch Nextcloud server for occ
        run: |
          set -euo pipefail
          # ANCHORED TO THE <nextcloud> ELEMENT ON PURPOSE. info.xml carries
          # min-version on <php> too, and <php> comes FIRST in every fleet
          # app. Measured across all 18 on 2026-08-12, an unanchored
          # `(?<=min-version=")[0-9]+` returned:
          #   13 apps -> 8    (from <php min-version="8.3"/>)
          #   portaliq -> 28  (from a <nextcloud> further down, but the WRONG one)
          # The first form fails loudly, because updates.nextcloud.com has no
          # NC 8. The second does not: it resolves a real server and signs the
          # app against a Nextcloud four majors below what it supports.
          NCVERSION=$(grep -oP '<nextcloud[^>]*min-version="\K[0-9]+' appinfo/info.xml | head -1)
          [ -n "${NCVERSION}" ] || { echo "::error::appinfo/info.xml declares no <nextcloud min-version>."; exit 1; }
          echo "App declares min-version ${NCVERSION}; fetching that server to sign with."
          URL=$(curl -sS "https://updates.nextcloud.com/updater_server/latest?channel=stable&version=${NCVERSION}" | jq -r '.downloads.zip[0]')
          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "::warning::No stable download for NC ${NCVERSION}; falling back to the beta channel."
            URL=$(curl -sS "https://updates.nextcloud.com/updater_server/latest?channel=beta&version=${NCVERSION}" | jq -r '.downloads.zip[0]')
          fi
          [ -n "$URL" ] && [ "$URL" != "null" ] || { echo "::error::Could not resolve a Nextcloud server download for min-version ${NCVERSION}."; exit 1; }
          curl -sSL "$URL" -o nextcloud.zip
          unzip -q nextcloud.zip
          test -f nextcloud/occ || { echo "::error::The downloaded archive has no nextcloud/occ."; exit 1; }

      - name: Sign the app with occ integrity:sign-app
        run: |
          set -euo pipefail
          php nextcloud/occ integrity:sign-app \
            --privateKey="$PWD/signing-key.key" \
            --certificate="$PWD/signing-cert.crt" \
            --path="$PWD/package/${{ inputs.app-name }}"
          SIG="package/${{ inputs.app-name }}/appinfo/signature.json"
          # POSITIVE CONTROL. `integrity:sign-app` exits 0 on several paths that
          # produce no manifest, so the exit code alone is not evidence. Assert
          # the artefact exists and actually enumerates files.
          test -f "$SIG" || { echo "::error::integrity:sign-app exited 0 but wrote no ${SIG}. The package would ship unsigned."; exit 1; }
          COUNT=$(jq -r '.hashes | length' "$SIG" 2>/dev/null || echo 0)
          [ "${COUNT:-0}" -gt 0 ] || { echo "::error::${SIG} exists but hashes 0 files — an empty manifest verifies nothing."; exit 1; }
          echo "Signed ${COUNT} file(s) into ${SIG}"

      - name: Create tarball
        run: |
          cd package && tar -czf ../nextcloud-release.tar.gz ${{ inputs.app-name }}

      - name: Sign tarball
        run: |
          openssl dgst -sha512 -sign signing-key.key nextcloud-release.tar.gz | openssl base64 -out nextcloud-release.signature

      # Sibling digest for installers that fetch the archive over plain HTTPS
      # rather than through the app store. The App Versions app looks for a
      # .sha256 next to the .tar.gz and verifies against it; without one it
      # falls back to trusting whatever it downloaded the first time. The
      # file holds the bare digest, because the archive is renamed on upload
      # and a "digest  filename" line would name the wrong file.
      - name: Compute SHA-256 of tarball
        run: |
          sha256sum nextcloud-release.tar.gz | cut -d' ' -f1 > nextcloud-release.tar.gz.sha256
          echo "SHA-256: $(cat nextcloud-release.tar.gz.sha256)"

      - name: Upload tarball as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.release-type }}-${{ inputs.app-name }}-${{ env.NEW_VERSION }}
          path: |
            nextcloud-release.tar.gz
            nextcloud-release.tar.gz.sha256
            nextcloud-release.signature
          retention-days: ${{ inputs.release-type == 'stable' && 90 || (inputs.release-type == 'beta' && 30 || 7) }}

      - name: Create GitHub release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ env.NEW_VERSION }}
          # Tag the BUMP commit, not the branch head — that is the tree whose
          # info.xml says ${{ env.NEW_VERSION }}. Falls back to the triggering
          # sha when no bump was needed (a re-run of an already-released
          # version), which is the same tree by definition.
          commit: ${{ steps.bump.outputs.bump_sha || github.sha }}
          name: "${{ inputs.release-type == 'stable' && 'Release' || (inputs.release-type == 'beta' && 'Beta' || 'Unstable') }} ${{ env.NEW_VERSION }}"
          draft: false
          prerelease: ${{ inputs.release-type != 'stable' }}
          generateReleaseNotes: true

      - name: Attach tarball to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ github.token }}
          file: nextcloud-release.tar.gz
          asset_name: ${{ inputs.app-name }}-${{ env.NEW_VERSION }}.tar.gz
          tag: v${{ env.NEW_VERSION }}
          overwrite: true

      # Named to sit beside the tarball: <app>-<version>.tar.gz.sha256. The
      # installer derives this name from the archive's own URL, so the suffix
      # follows the renamed asset rather than the build file.
      - name: Attach SHA-256 to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ github.token }}
          file: nextcloud-release.tar.gz.sha256
          asset_name: ${{ inputs.app-name }}-${{ env.NEW_VERSION }}.tar.gz.sha256
          tag: v${{ env.NEW_VERSION }}
          overwrite: true

      # ── App Store upload (beta and stable only) ──

      - name: Register and upload to Nextcloud App Store
        if: inputs.release-type != 'unstable'
        run: |
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/v${{ env.NEW_VERSION }}/${{ inputs.app-name }}-${{ env.NEW_VERSION }}.tar.gz"
          NIGHTLY="${{ inputs.release-type == 'beta' && 'true' || 'false' }}"

          # Registration used to run on EVERY release, described as "idempotent".
          # It is not. POST /api/v1/apps is the certificate-update endpoint, it
          # is rate limited hard, and on 2026-08-27 the fleet was getting
          #
          #   HTTP 429 {"detail":"Request was throttled. Expected available in
          #             62877 seconds."}
          #
          # -- a 17-hour lockout bought for nothing, since every one of those
          # apps was already registered. Ask the catalogue instead: it was
          # already fetched to compute the version, and it says outright whether
          # this id exists.
          if [ "${{ steps.store.outputs.registered }}" = "true" ]; then
            echo "✓ ${{ inputs.app-name }} is already on the App Store; not re-sending the certificate."
          else
            echo "${{ inputs.app-name }} is not on the App Store yet — registering..."

            REG_SIGNATURE=$(echo -n "${{ inputs.app-name }}" | openssl dgst -sha512 -sign signing-key.key | openssl base64 -A)
            CERT_CONTENT=$(cat signing-cert.crt)

            REG_CODE=$(curl -s -o /tmp/register-response.json -w "%{http_code}" \
              -X POST "https://apps.nextcloud.com/api/v1/apps" \
              -H "Authorization: Token ${{ secrets.NEXTCLOUD_APPSTORE_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d "{\"certificate\": $(echo "$CERT_CONTENT" | jq -Rs .), \"signature\": \"$REG_SIGNATURE\"}")

            REG_BODY=$(cat /tmp/register-response.json 2>/dev/null || echo "")

            case "$REG_CODE" in
              200|201|204)
                echo "✓ App registered successfully"
                ;;
              *)
                echo "::error::Registering ${{ inputs.app-name }} returned HTTP $REG_CODE: $REG_BODY"
                # The two failures the fleet actually hits, named so the log
                # says what to do rather than what went wrong.
                case "$REG_BODY" in
                  *"Signature is invalid"*)
                    echo "::error::The signing certificate does not match this app id. Nextcloud issues one certificate per id (CN = the id), so a renamed <id> needs its OWN certificate — request it at nextcloud/app-certificate-requests, then put the issued cert in NEXTCLOUD_SIGNING_CERT."
                    ;;
                  *"Only the app owner"*)
                    echo "::error::NEXTCLOUD_APPSTORE_TOKEN belongs to an account that does not own this app on the store. Transfer ownership, or add that account as the owner, at https://apps.nextcloud.com/account/authors."
                    ;;
                  *"throttled"*)
                    echo "::error::Rate limited. This should no longer happen for an already-registered app; if it does, the catalogue read above disagreed with the store."
                    ;;
                esac
                exit 1
                ;;
            esac
          fi

          # Sign the release tarball
          SIGNATURE=$(openssl dgst -sha512 -sign signing-key.key nextcloud-release.tar.gz | openssl base64 -A)

          # Upload the release
          echo "Uploading release to App Store (nightly: $NIGHTLY)..."
          UPLOAD_CODE=$(curl -s -o /tmp/upload-response.json -w "%{http_code}" \
            -X POST "https://apps.nextcloud.com/api/v1/apps/releases" \
            -H "Authorization: Token ${{ secrets.NEXTCLOUD_APPSTORE_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"download\": \"$DOWNLOAD_URL\", \"signature\": \"$SIGNATURE\", \"nightly\": $NIGHTLY}")

          UPLOAD_BODY=$(cat /tmp/upload-response.json 2>/dev/null || echo "")

          if [ "$UPLOAD_CODE" = "200" ] || [ "$UPLOAD_CODE" = "201" ]; then
            echo "✓ Release uploaded to App Store successfully"
          else
            # This was a ::warning:: and an exit 0, and that is why the problem
            # ran for weeks. On 2026-08-27 eighteen of the twenty-one fleet apps
            # failed this call -- 400 unregistered id, 403 wrong owner -- and
            # every one of those runs is recorded as a green release. "The App
            # Store upload can be retried manually" describes a retry that
            # nobody was ever told to perform.
            #
            # Publishing to the store is the job. If it did not happen, the job
            # did not succeed.
            echo "::error::App Store upload returned HTTP $UPLOAD_CODE: $UPLOAD_BODY"
            case "$UPLOAD_BODY" in
              *"does not exist"*)
                echo "::error::${{ inputs.app-name }} is not registered on the App Store. If <id> was recently renamed, the new id needs its own Nextcloud-issued certificate before it can be registered."
                ;;
              *"permission"*)
                echo "::error::NEXTCLOUD_APPSTORE_TOKEN belongs to an account that is not an owner or co-maintainer of ${{ inputs.app-name }} on the store."
                ;;
            esac
            echo "The GitHub release and tag were created; only the App Store publish failed. Re-run this job once the cause above is fixed."
            exit 1
          fi

      # ── Summary ──

      - name: Release summary
        run: |
          echo "=== Release Summary ==="
          echo "App: ${{ inputs.app-name }}"
          echo "Type: ${{ inputs.release-type }}"
          echo "Version: ${{ env.NEW_VERSION }}"
          echo "Tag: v${{ env.NEW_VERSION }}"
          echo "Prerelease: ${{ inputs.release-type != 'stable' }}"
          echo "App Store: ${{ inputs.release-type != 'unstable' }}"
          if [ "${{ inputs.release-type }}" != "unstable" ]; then
            echo "Nightly: ${{ inputs.release-type == 'beta' }}"
          fi
          echo ""
          echo "info.xml in tarball:"
          tar -xOf nextcloud-release.tar.gz ${{ inputs.app-name }}/appinfo/info.xml | grep '<version>'
          echo ""
          echo "Tarball size: $(du -h nextcloud-release.tar.gz | cut -f1)"

      - name: Clean up signing credentials
        if: always()
        run: rm -f signing-key.key signing-cert.crt
