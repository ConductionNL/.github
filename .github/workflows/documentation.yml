name: Documentation

on:
  workflow_call:
    inputs:
      cname:
        description: "Custom domain for GitHub Pages (e.g. 'pipelinq.app')"
        required: true
        type: string
      source-folder:
        description: "Folder containing the Docusaurus project"
        required: false
        type: string
        default: "docs"
      node-version:
        # Kept in step with quality.yml's default (see the rationale there).
        description: "Node.js version for building"
        required: false
        type: string
        default: "22"
      docs-hosts:
        description: >-
          Comma-separated hostnames this documentation site is served on, e.g.
          "openbuild.conduction.nl,buildiq.conduction.nl". Declared EXPLICITLY
          rather than derived, and listed in FULL, because the deploy below
          reconciles the worker's triggers: a hostname left out of this list is
          REMOVED from the worker, which takes that site down. Defaults to
          `cname` alone, which is correct for a site served on one host.
        required: false
        type: string
        default: ""
      canonical-host:
        description: >-
          The ONE hostname this site should be reached on. Optional, and empty
          by default, which keeps today's behaviour exactly: every host in
          `docs-hosts` serves the same bytes.
          Set it after a rename. `docs-hosts` keeps the retired hostname
          answering — that is what stops old links breaking — but on its own it
          leaves TWO live copies of every page, so the old app name stays as
          discoverable as the current one. With this set, any host that is not
          the canonical one answers 301 to the same path and query on the
          canonical host, and only the canonical host serves content.
          It MUST also appear in `docs-hosts`; a canonical host the worker does
          not answer on would redirect every visitor to a hostname that routes
          nowhere.
        required: false
        type: string
        default: ""
      worker-name:
        description: >-
          Cloudflare Worker that serves this site. PIN IT. The default derives
          the name from `cname` (first label + "-docs"), which is only correct
          while the hostname and the worker still share a name — and across the
          fleet they no longer do: `integriq.conduction.nl` is served by
          `openconnector-docs`, `dossiq.conduction.nl` by `procest-docs`, and so
          on for eight of twelve apps.
          A derived name that does not exist is NOT an error. wrangler CREATES
          that worker and deploys to it, while the custom domains keep routing
          to the real one — so the run goes green and the site never changes.
          Measured 2026-08-24: every fleet app had left this unset, and every
          renamed one would have forked its deployment on the first successful
          publish.
        required: false
        type: string
        default: ""
      build-image:
        description: >-
          Build and push a self-contained Apache image of the built site to
          GHCR (ghcr.io/<owner>/<repo>). Lets the site be spun up anywhere
          (docker run -p 80:80 ...) as a fallback when GitHub Pages is down.
          Set to false to opt a consumer out.
        required: false
        type: boolean
        default: true
    secrets:
      # DECLARED, so callers can map them EXPLICITLY. A reusable workflow
      # receives no secrets by default; the only two ways in are
      # `secrets: inherit`, which hands over EVERY secret the caller holds, or
      # an explicit mapping — and an explicit mapping only compiles for secrets
      # named here. Without this block the sole option was `inherit`, which on
      # these repos would have passed NEXTCLOUD_SIGNING_KEY, DEPLOY_KEY and the
      # appstore token to a workflow that needs none of them.
      #
      # Both are optional on purpose. A consumer with no Cloudflare credentials
      # still builds and still deploys to gh-pages; the publish step guards on
      # CF_API_TOKEN being non-empty and warns loudly when it is not, rather
      # than failing a run over a site that may not be Worker-served at all.
      #
      # THE FLEET'S ORG SECRETS ARE `CF_API_TOKEN` AND `CF_ACCOUNT_ID` — the
      # SAME names this workflow reads. A caller therefore maps them onto
      # themselves:
      #
      #     secrets:
      #       CF_API_TOKEN:  ${{ secrets.CF_API_TOKEN }}
      #       CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      #
      # This comment previously said the org names were `CLOUDFLARE_*`. That was
      # never true, and because this is the file consumers read to learn how to
      # call the workflow, ALL TWELVE fleet callers copied it — mapping from
      # `secrets.CLOUDFLARE_API_TOKEN`, which does not exist anywhere.
      #
      # Mapping from a non-existent secret is NOT an error. It yields an empty
      # string, the publish step's `if: env.CF_API_TOKEN != ''` guard skips, and
      # the run goes green having changed nothing. Measured 2026-08-24 on
      # planninq run 32760529026, after the mapping had merged: publish SKIPPED,
      # `CF_API_TOKEN:` empty in the log, site still serving its pre-rename
      # build. A wrong name in a comment cost twelve sites months of staleness.
      #
      # `conduction-website/.github/workflows/deploy.yml` records the same
      # discovery independently ("asked for CLOUDFLARE_API_TOKEN, which is not a
      # secret anywhere"), and `deploy-docs.yml` in this repo reads `CF_*`
      # directly. Three files now agree.
      #
      # A consumer whose credentials genuinely live under another name maps that
      # name onto these — that is what the mapping is for.
      CF_API_TOKEN:
        description: >-
          Cloudflare API token with Workers Scripts:Edit on the account that
          owns this site's worker. When absent, the Worker publish is skipped
          and the run warns that the live site is unchanged.
        required: false
      CF_ACCOUNT_ID:
        description: >-
          Cloudflare account id that owns the worker. Required alongside
          CF_API_TOKEN; wrangler cannot resolve the target account without it.
        required: false

# Two jobs so the AI-baseline validation gate runs on every event,
# including pull_request, while the actual gh-pages deploy stays
# gated to push / schedule / workflow_dispatch. Sites that ship the
# postbuild validator from @conduction/docusaurus-preset (robots.txt,
# llms.txt, sitemaps, JSON-LD, FAQPage, og:image, etc.) get PR-time
# enforcement of the contract automatically.

jobs:
  build:
    name: Build and validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      built: ${{ steps.flag.outputs.built }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install dependencies and build
        timeout-minutes: 10
        env:
          # Pass the run-scoped token through so npm prebuild scripts
          # that hit the GitHub API (e.g. conduction-website's nightly
          # app-downloads fetch) authenticate and avoid 60-req/hr rate
          # limits. Token is auto-scoped to the run, expires when the
          # job ends.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd ${{ inputs.source-folder }}
          rm -rf node_modules/.cache .docusaurus build
          npm run ci

      - name: Verify build output
        run: |
          if [ ! -f "${{ inputs.source-folder }}/build/index.html" ]; then
            echo "ERROR: index.html not found in build directory!"
            exit 1
          fi

      - name: Upload build artifact for deploy job
        if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: docusaurus-build
          path: ${{ inputs.source-folder }}/build
          retention-days: 1

      - id: flag
        run: echo "built=true" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy Documentation
    needs: build
    runs-on: ubuntu-latest
    # Observed across 9 executions: median 0.2 min, max 1.8 min (.github,
    # docs.conduction.nl). Downloads the built artifact and pushes gh-pages.
    timeout-minutes: 20
    # Deploy only on direct pushes, scheduled rebuilds, and manual
    # workflow_dispatch. PR runs stop after the build job, so the
    # AI-baseline gate runs but no gh-pages push happens.
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: docusaurus-build
          path: ${{ inputs.source-folder }}/build

      - name: Create .nojekyll and CNAME files
        run: |
          cd ${{ inputs.source-folder }}/build
          touch .nojekyll
          echo "${{ inputs.cname }}" > CNAME

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./${{ inputs.source-folder }}/build
          publish_branch: gh-pages
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          force_orphan: false
          allow_empty_commit: true
          keep_files: false

      # ─────────────────────────────────────────────────────────────────────
      # THE STEP ABOVE DOES NOT PUBLISH THIS SITE, AND FOR THREE MONTHS THAT
      # WENT UNNOTICED BECAUSE THE ONE BELOW IT SAID "Deployment completed".
      #
      # Every fleet docs host is served by a CLOUDFLARE WORKER — the DNS record
      # for openbuild.conduction.nl is a proxied record bound to the
      # `openbuild-docs` worker as a custom domain, not a GitHub Pages record.
      # gh-pages is written on every push and nothing reads it.
      #
      # MEASURED 2026-08-23, last worker deployment per site:
      #   openbuild-docs        2026-06-26     procest-docs   2026-06-06
      #   hrmq-docs             2026-06-03     scholiq-docs   2026-05-30
      #   softwarecatalog-docs  2026-05-30
      #
      # Meanwhile the sources moved on: buildiq's docs landing page has said
      # `appId="buildiq"` since the app-id rename merged, and
      # buildiq.conduction.nl still renders "OpenBuild" with a broken glyph,
      # because the bytes on the edge are from June.
      #
      # ConductionNL/.github fixed exactly this for its own docs.conduction.nl
      # in deploy-docs.yml, and the fix was never carried into the reusable
      # workflow the other seventeen repos call.
      #
      # ROUTES ARE DECLARED IN FULL, ON PURPOSE. wrangler reconciles a worker's
      # triggers against the config it is given: a hostname absent from
      # `routes` is REMOVED, and `workers_dev` absent from the file is DISABLED
      # (observed — it silently took openbuild-docs.workers.dev from 200 to 404
      # while reporting success). So both flags are set explicitly and every
      # host this site answers on must appear in `docs-hosts`.
      - name: Publish to the Cloudflare Worker that serves this site
        if: env.CF_API_TOKEN != ''
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          SOURCE_FOLDER: ${{ inputs.source-folder }}
          CNAME: ${{ inputs.cname }}
          DOCS_HOSTS: ${{ inputs.docs-hosts }}
          WORKER_NAME: ${{ inputs.worker-name }}
          CANONICAL_HOST: ${{ inputs.canonical-host }}
        run: |
          set -euo pipefail

          WORKER="${WORKER_NAME:-${CNAME%%.*}-docs}"
          if [ -z "${WORKER_NAME}" ]; then
            echo "::warning title=worker-name was derived, not pinned::Deploying to '${WORKER}', derived from cname '${CNAME}'. If that worker does not already exist, wrangler will CREATE it and publish there while the custom domains keep routing to the real one — a green run that reaches nobody. Pass worker-name explicitly."
          fi
          HOSTS="${DOCS_HOSTS:-$CNAME}"

          cd "$SOURCE_FOLDER"
          rm -rf build/.git

          # WHEN A CANONICAL HOST IS DECLARED, THE OTHER HOSTS REDIRECT TO IT.
          #
          # `docs-hosts` makes one worker answer on several hostnames, and it
          # serves the SAME bytes on each. That is what a rename needs on day
          # one — the old address must not break — and it is wrong from then on:
          # openconnector.conduction.nl and integriq.conduction.nl were serving
          # two identical copies of every page, so the retired name stayed as
          # discoverable as the current one.
          #
          # A worker with only `[assets]` cannot express that, because there is
          # no code to inspect the Host header. Declaring `canonical-host` adds
          # a script in front of the asset binding: any request whose hostname
          # is not the canonical one is answered 301 to the SAME path and query
          # on the canonical host, and everything else is handed to
          # `env.ASSETS.fetch(request)` unchanged.
          #
          # Delegating rather than reimplementing matters: the asset binding
          # keeps its own html_handling and 404 behaviour, so a site that opts
          # in serves exactly what it served before on its canonical host.
          #
          # Absent `canonical-host` the generated wrangler.toml is byte-for-byte
          # what it was, and no script is emitted at all. This is opt-in so that
          # a rollout cannot regress a site that never asked for it.
          if [ -n "${CANONICAL_HOST}" ]; then
            # The hostname reaches the script as a JSON string literal, not as
            # raw text spliced between quotes, so a stray quote in the input
            # cannot terminate the string and change what the worker does.
            CANON_JSON="$(printf '%s' "${CANONICAL_HOST}" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read().strip()))')"
            cat > docs-redirect-worker.js <<WORKERJS
          export default {
            async fetch(request, env) {
              const url = new URL(request.url);
              const canonical = ${CANON_JSON};
              if (url.hostname !== canonical) {
                url.hostname = canonical;
                // 301, not 302: the old hostname is retired, not moved for the
                // afternoon, and only a permanent redirect makes search engines
                // and caches forget it. Path and query ride along untouched, so
                // a deep link into the old docs lands on the same page.
                return Response.redirect(url.toString(), 301);
              }
              return env.ASSETS.fetch(request);
            }
          };
          WORKERJS
          fi

          {
            echo "name = \"${WORKER}\""
            echo "compatibility_date = \"2026-05-30\""
            echo "workers_dev = true"
            echo "preview_urls = true"
            if [ -n "${CANONICAL_HOST}" ]; then
              echo "main = \"./docs-redirect-worker.js\""
            fi
            echo ""
            echo "[assets]"
            echo "directory = \"./build\""
            if [ -n "${CANONICAL_HOST}" ]; then
              # Only meaningful with a script: this is the name the script
              # reaches the static files through.
              echo "binding = \"ASSETS\""
              # WITHOUT THIS THE SCRIPT NEVER RUNS ON A REAL PAGE.
              #
              # By default the asset server answers first: if the request path
              # matches a file in ./build it is served directly and the Worker
              # is never invoked. The redirect would then fire only for paths
              # that have NO asset — i.e. never, for an actual documentation
              # page. Measured 2026-08-29 on the buildiq pilot: wrangler
              # reported `env.ASSETS Assets` and "Deployed openbuild-docs
              # triggers", the deploy was green, and openbuild.conduction.nl
              # still answered 200 instead of 301 — as did the worker's own
              # workers.dev URL, which is what proved the script was not
              # running rather than the route being wrong.
              echo "run_worker_first = true"
            fi
            echo ""
            echo "routes = ["
            IFS=,
            for h in $HOSTS; do
              h="$(echo "$h" | tr -d '[:space:]')"
              [ -n "$h" ] || continue
              echo "  { pattern = \"${h}\", custom_domain = true },"
            done
            echo "]"
          } > wrangler.toml

          echo "── publishing ${WORKER} for: ${HOSTS}"
          cat wrangler.toml
          npx -y wrangler@4 deploy

      - name: Warn when Cloudflare credentials are absent
        if: env.CF_API_TOKEN == ''
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          echo "::warning title=Docs published to gh-pages only::CF_API_TOKEN is not set, so the Cloudflare Worker that actually serves ${{ inputs.cname }} was NOT updated. gh-pages now holds the new build and nothing reads it — the live site is unchanged. This is the failure mode that left every fleet docs site on a May/June build."

      - name: Verify the LIVE site serves this build
        # gh-pages having moved is not evidence the site did. This fetches the
        # public host and compares it against the build that was just made, so
        # "deployed" means the bytes are being served rather than written.
        env:
          # Needed to tell "nothing was published" apart from "published, edge
          # not warm yet" below. `set -u` is on, so this must be declared here
          # rather than assumed present from the publish step's own env.
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          set -uo pipefail
          BUILD_INDEX="${{ inputs.source-folder }}/build/index.html"
          HOST="${{ inputs.cname }}"

          git fetch origin gh-pages --quiet || true
          echo "gh-pages now at: $(git rev-parse origin/gh-pages 2>/dev/null || echo unknown)"

          for attempt in 1 2 3 4 5 6; do
            sleep 10
            LIVE="$(curl -sSL --max-time 30 "https://${HOST}/" || true)"
            if [ -n "$LIVE" ] && [ "$(printf '%s' "$LIVE" | wc -c)" -gt 200 ]; then
              LIVE_TITLE="$(printf '%s' "$LIVE"  | grep -o '<title[^>]*>[^<]*' | head -1 || true)"
              BUILT_TITLE="$(grep -o '<title[^>]*>[^<]*' "$BUILD_INDEX" | head -1 || true)"
              echo "attempt ${attempt}: live=${LIVE_TITLE:-none} built=${BUILT_TITLE:-none}"
              if [ -n "$BUILT_TITLE" ] && [ "$LIVE_TITLE" = "$BUILT_TITLE" ]; then
                echo "The live site serves this build."
                exit 0
              fi
            fi
          done

          # A MISMATCH IS A FAILURE WHEN WE KNOW WHY, AND A WARNING WHEN WE DO
          # NOT.
          #
          # This step used to warn in every case, and on 2026-08-24 that made it
          # useless in exactly the situation it was written for: eleven sites
          # served their pre-rename build, this step FOUND the mismatch, emitted
          # a warning, and the job went green. A check that detects the failure
          # it exists for and then passes is not a check.
          #
          # The discriminator is whether the Worker publish actually ran. If it
          # was SKIPPED — no credentials — then nothing was published and the
          # mismatch is not a caching artefact, it is the deployment having gone
          # nowhere. That is certain, so it fails.
          #
          # If the publish DID run and the host still disagrees within 60s, that
          # can legitimately be Cloudflare edge caching, so it stays a warning
          # rather than failing a run over propagation delay.
          if [ -z "${CF_API_TOKEN}" ]; then
            echo "::error title=Docs did not reach the live site::${HOST} still serves a different build, and the Cloudflare Worker publish was SKIPPED because CF_API_TOKEN is empty. gh-pages was updated and nothing reads it. This is not a caching delay — nothing was published. Check that the caller maps CF_API_TOKEN/CF_ACCOUNT_ID from secrets that EXIST (mapping from a missing secret yields an empty string silently)."
            exit 1
          fi
          echo "::warning title=Live site not confirmed::${HOST} did not match the freshly built <title> within 60s, though the Worker publish did run. Cloudflare caching can explain a short delay; a persistent mismatch means the host is served by something other than the worker this workflow publishes."

  image:
    name: Build fallback site image
    needs: build
    # UNMEASURED: no executed run of this job appears in the fleet history
    # sampled (0 executions). It is a docker buildx build-and-push to GHCR of a
    # static Apache site, so 30 min is a wide bound for an image build plus a
    # registry push. Revisit once it has run a few times.
    timeout-minutes: 30
    # Build the portable Apache image on the same events that deploy to
    # gh-pages, so the GHCR :latest tag always matches what is live. The
    # build job only uploads the artifact on these events, so the
    # download below would otherwise fail.
    if: >-
      inputs.build-image &&
      (github.event_name == 'push' ||
       github.event_name == 'schedule' ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # Best-effort by design: the fallback image is a nice-to-have on top of
    # an already-completed gh-pages deploy. The known failure mode is
    # org-side, not repo-side — GHCR's per-package "Manage Actions access"
    # not granting the repository write access yields
    # `denied: permission_denied: write_package`, and only an org/package
    # admin can fix that (observed on conduction-website since 2026-07-26).
    # A red job for an unfixable-from-here cause hides real failures, so the
    # push is continue-on-error and the warn step below keeps the
    # degradation loud instead of silent.
    continue-on-error: true
    steps:
      - name: Download build artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: docusaurus-build
          path: site

      - name: Generate Apache Dockerfile
        run: |
          cat > Dockerfile.site <<'DOCKER'
          # Self-contained fallback image: the fully built static site
          # served by Apache httpd. Generated by the centralized
          # Documentation workflow so any Conduction docs/product site
          # can be spun up off GitHub Pages during an outage:
          #   docker run --rm -p 8080:80 ghcr.io/<owner>/<repo>:latest
          FROM httpd:2.4-alpine

          # Docusaurus emits <route>/index.html, which Apache's default
          # DirectoryIndex serves directly. Point ErrorDocument at the
          # site's own 404 page so unknown routes match the live site.
          RUN printf '\nErrorDocument 404 /404.html\n' >> /usr/local/apache2/conf/httpd.conf

          COPY site/ /usr/local/apache2/htdocs/

          EXPOSE 80
          HEALTHCHECK --interval=30s --timeout=3s \
            CMD wget -qO- http://localhost/ >/dev/null 2>&1 || exit 1
          DOCKER
          echo "----- Dockerfile.site -----"
          cat Dockerfile.site

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push fallback image
        id: push_image
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.site
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.sha }}

      - name: Warn loudly when the fallback image could not be pushed
        if: steps.push_image.outcome == 'failure'
        run: |
          echo "::warning title=Fallback site image DEGRADED::GHCR push of ${{ steps.img.outputs.name }} failed. Known cause: the package's 'Manage Actions access' does not grant this repository write access (denied: permission_denied: write_package) — an org/package admin must add the repo with write role under the package's settings; repo-side tokens cannot do this. The gh-pages deploy itself is unaffected. This job is best-effort until the grant lands."
          echo "Fallback image push FAILED — degraded pending the org-side GHCR package grant (see warning annotation)."
