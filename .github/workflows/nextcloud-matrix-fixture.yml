name: Fixture — the derived PHPUnit matrix materialises its legs

# THIS WORKFLOW EXISTS TO BE FAILED, and to be COUNTED. Same shape and same
# reasoning as `test-tier-gating-fixture.yml`.
#
# WHAT IT MEASURES, AND WHY NOTHING ELSE IN THIS REPO CAN
# -------------------------------------------------------
# `quality.yml` now derives its PHPUnit server matrix from appinfo/info.xml. The
# claim that needs evidence is not "the derived value is correct" — that is
# asserted by `quality-resolve-probe.yml`, against both fixtures, on every PR.
# The claim that needs evidence is that the derived value still EXPANDS INTO
# LEGS, because a matrix that collapses to one leg looks exactly like a matrix
# that works: the job is present, it is green, and five sixths of the coverage
# is gone with no row to show for it.
#
# `quality-selftest.yml` cannot measure that. It disables every leg, and a
# matrix job whose `if:` is false DOES NOT EXPAND — measured on run
# 31692599960, where the skipped PHPUnit job renders as one row still carrying
# the literal `${{ matrix.nextcloud-ref }}` in its name. Counting jobs there
# would have reported "1 PHPUnit job" whether the matrix worked or not.
#
# So this workflow enables PHPUnit for real, against the two fixture manifests,
# and the measurement is the JOB LIST:
#
#   info-32-34.xml  ->  6 legs   (stable32, stable33, stable34 x PHP 8.3, 8.4)
#   info-32-33.xml  ->  4 legs   (stable32, stable33          x PHP 8.3, 8.4)
#
# The legs THEMSELVES fail — .github is not a Nextcloud app and has no PHPUnit
# suite. That is expected and is not the measurement. What is being read is how
# many rows exist and what their names say, which is decided at matrix
# expansion, long before any step runs.
#
# The pair is the point. Six legs alone is consistent with a hard-coded range;
# six-and-then-four, from two files differing in one attribute, is not.
#
# Runs only on `fixture/**` branches, so it costs the fleet nothing and can be
# re-run whenever someone wants to see the mechanism rather than read about it.

on:
  push:
    branches:
      - 'fixture/**'
  workflow_dispatch:

# At least as wide as the widest `permissions:` any job in quality.yml declares
# — see the note in quality-selftest.yml. A caller whose grant is narrower
# produces NO JOBS AND NO RED.
permissions:
  contents: write
  actions: write

concurrency:
  group: nextcloud-matrix-fixture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything that is not PHPUnit is switched off. `enable-php` must stay true
  # — the PHPUnit job's `if:` reads it — so the individual PHP-quality tools are
  # switched off one by one instead.
  legs-32-34:
    name: "6 legs"
    uses: ./.github/workflows/quality.yml
    with:
      app-name: nextcloud-matrix-fixture
      nextcloud-info-path: scripts/fixtures/nextcloud-matrix/info-32-34.xml
      enable-php: true
      enable-phpunit: true
      enable-psalm: false
      enable-phpstan: false
      enable-phpmd: false
      enable-phpcs: false
      enable-phpmetrics: false
      enable-npm: false
      enable-frontend: false
      enable-newman: false
      enable-playwright: false
      enable-hydra-gates: false
      enable-license-check: false
      enable-journeydoc-capture: false
      enable-coverage-guard: false
      enable-sbom: false
      enable-features-extract: false

  # THE POSITIVE CONTROL. One attribute different in one file; two fewer legs.
  legs-32-33:
    name: "4 legs (positive control)"
    uses: ./.github/workflows/quality.yml
    with:
      app-name: nextcloud-matrix-fixture
      nextcloud-info-path: scripts/fixtures/nextcloud-matrix/info-32-33.xml
      enable-php: true
      enable-phpunit: true
      enable-psalm: false
      enable-phpstan: false
      enable-phpmd: false
      enable-phpcs: false
      enable-phpmetrics: false
      enable-npm: false
      enable-frontend: false
      enable-newman: false
      enable-playwright: false
      enable-hydra-gates: false
      enable-license-check: false
      enable-journeydoc-capture: false
      enable-coverage-guard: false
      enable-sbom: false
      enable-features-extract: false
