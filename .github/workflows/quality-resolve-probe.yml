name: Quality resolve probe

# THE GUARD ON THE SHARED WORKFLOW.
#
# Every caller in the fleet consumes .github/workflows/quality.yml at @main and,
# as of `chore/track-latest-gates`, takes the gates package from @main too. That
# is what the product owner asked for — nobody should have to bump a pin in 23
# repositories to receive a fix. The cost of it is that a broken main now
# reaches all 23 at once, so main has to be gated on the one failure mode that
# does not announce itself.
#
# THE FAILURE MODE
# ----------------
# An unresolvable reusable workflow is not a red check. GitHub creates a run
# with no jobs in it, or creates no run at all. There is nothing to fail, so
# nothing fails: every caller quietly stops being checked and every dashboard
# stays green. On 2026-08-04 a single ~22 KB `run:` step did exactly this
# (#161); it was reverted (#166) and re-landed with the script in a file (#168).
#
# The signature is `jobs == 0`. So this probe COUNTS JOBS. It never looks at
# whether they passed — a conclusion is a different measurement and reading it
# here would reintroduce the same blind spot one level up.
#
# WHY TWO WORKFLOWS
# -----------------
# The thing being resolved is `quality-selftest.yml`. It lives in its own file
# rather than as a job here, and that separation is load-bearing: if the call
# sat in THIS workflow and quality.yml were unresolvable, this whole workflow
# would fail to materialise, the required check would never report, and the PR
# would sit PENDING FOREVER. A permanently-pending gate is one of the three
# shapes a dead gate takes, and the hardest to notice. Split in two, the probe
# always runs and always reports, so the outage surfaces as an explicit RED.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: quality-resolve-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-limits:
    name: "No `run:` step big enough to break resolution"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Deterministic, and it names the offending step — which a job count
      # cannot do. This is the #161 class caught before merge rather than
      # after.
      - name: Assert every `run:` block is under the limit
        run: python3 scripts/assert-run-steps-resolvable.py .github/workflows/*.yml

      # POSITIVE CONTROL for the lint. A limit low enough that today's largest
      # step must trip it proves the check has a reachable failure branch and
      # is reading real sizes. Without this, a lint that silently stopped
      # parsing `run:` blocks would report the same clean pass forever.
      - name: "Positive control — the lint must fail on a limit it cannot meet"
        run: |
          set -eu
          if python3 scripts/assert-run-steps-resolvable.py --limit 1 \
               .github/workflows/quality.yml > /dev/null 2>&1; then
            echo "::error::the run-step lint reported OK at a 1-byte limit. It is \
          not measuring anything — every workflow in this repo has `run:` blocks \
          larger than one byte."
            exit 1
          fi
          echo "OK — the lint fails when it should. Its clean pass above is a verdict."

  gate-completeness:
    name: "Every leg is inside the required check"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # POSITIVE CONTROL FIRST. Drop a job from the report's `needs:` in
      # memory and require the lint to notice. A lint that had stopped reading
      # the list would pass the real check forever.
      - name: "Positive control — removing a leg must be detected"
        run: python3 scripts/assert-quality-report-gates-every-leg.py --positive-control .github/workflows/quality.yml

      # THE MEASUREMENT. `quality / Quality Report` is the only meaningful
      # required check on main and beta in all 25 fleet repos, and its gating
      # steps read `needs.*.result`. A job outside that list cannot block a
      # merge however red it goes — which is what `frontend-tests` was (#190).
      - name: "Assert every verdict-producing job is in Quality Report's needs"
        run: python3 scripts/assert-quality-report-gates-every-leg.py .github/workflows/quality.yml

      # ── THE OTHER DIRECTION (#194) ────────────────────────────────────────
      #
      # The two checks above close direction 1: a job's failure must be able to
      # reach the required check. They say nothing about direction 2: whether
      # the job RUNS AT ALL. A job deleted by an upstream result is `skipped`,
      # `skipped` is not `failure`, and `contains(needs.*.result, 'failure')`
      # reads straight past it — so a job can be perfectly wired into the gate
      # and still contribute nothing, silently. That is #194: four test jobs
      # carried `needs.security.result != 'failure'`, and one advisory against
      # a dev-only formatter deleted PHPUnit, Newman and E2E in sixteen repos
      # at once without turning anything red.
      #
      # Positive control first, same discipline as above.
      - name: "Positive control — a producer that deletes a verdict must be detected"
        run: python3 scripts/assert-no-producer-deletes-a-verdict.py --positive-control .github/workflows/quality.yml

      - name: "Assert no job can be DELETED by a producer's result"
        run: python3 scripts/assert-no-producer-deletes-a-verdict.py .github/workflows/quality.yml

  changed-path-filter:
    name: "The changed-path filter cannot silently delete the test tier"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # The filter decides whether PHPUnit and Playwright run AT ALL. A bug in
      # it does not go red — it removes the test tier and renders as a green
      # run over untested code, which is the #194 shape with a new cause. So it
      # is executed against real git repositories, not reasoned about.
      #
      # POSITIVE CONTROL FIRST, same discipline as the two lints above: break
      # the fail-safe in memory and require the suite to notice. A suite that
      # had stopped reading the shipped script would pass the real check
      # forever.
      - name: "Positive control — a broken fail-safe must fail the suite"
        run: python3 scripts/test-changed-path-filter.py --positive-control .github/workflows/quality.yml

      - name: "Assert the filter skips only what it can prove is irrelevant"
        run: python3 scripts/test-changed-path-filter.py .github/workflows/quality.yml

  consolidated-tool-legs:
    name: "A consolidated tool family cannot swallow a failure"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # `consolidate-tool-legs` turns six one-tool jobs into one six-tool job,
      # and the danger is quiet: `set -e` is ACTIVE in a `run:` block but
      # SUSPENDED inside a function invoked on the left of `||`, which is how
      # `run_tool "$T" || RC=$?` calls it. Bash returns a function's LAST
      # command's status, so an unguarded command that is NOT last lets the
      # next command's success become the family's verdict — a red tool
      # reported green, in the job that exists to catch red tools.
      #
      # POSITIVE CONTROL FIRST. It strips the `|| return $?` guards and
      # requires this suite to notice. That control found a real hole when it
      # was written: the first version of the suite only failed tools that were
      # LAST in their case arm, where bash returns the right status anyway, so
      # it passed with every guard removed. It now covers a failing
      # `composer install` and a failing `npm ci`, which are the commands the
      # guards actually protect.
      - name: "Positive control — removing the guards must fail the suite"
        run: python3 scripts/test-consolidated-tool-legs.py --positive-control .github/workflows/quality.yml

      - name: "Assert every tool's own exit code reaches the family verdict"
        run: python3 scripts/test-consolidated-tool-legs.py .github/workflows/quality.yml

  coverage-gate-can-fail:
    name: "The spec-coverage threshold can fail a run"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # #189: `playwright-coverage-threshold` had NEVER gated. Below-threshold
      # emitted `::warning::` and returned zero, so the knob was decorative —
      # pipelinq declared 75, its run printed 28%, and the run passed.
      #
      # POSITIVE CONTROL FIRST, and it is the whole point here: the suite is
      # re-run with the gate neutered back to warning-only, and MUST go red. A
      # suite that stays green against the known-bad program is not measuring
      # enforcement, which is exactly how the defect survived this long.
      - name: "Positive control — a warning-only gate must fail this suite"
        run: python3 scripts/test-spec-coverage-gate.py --positive-control .github/workflows/quality.yml

      # THE MEASUREMENT. The Node program is EXTRACTED from quality.yml's
      # heredoc and executed against fixtures — below-threshold (must exit
      # non-zero), at-threshold (must exit zero), zero-scenarios (must be NOT
      # MEASURABLE rather than the old 100%), and a fixture proving ten
      # unrelated `test()` calls no longer move the number.
      #
      # Running the shipped text rather than a transcription is deliberate: a
      # test against a copy passes happily while the workflow does something
      # else.
      - name: "Exercise the shipped spec-coverage program against fixtures"
        run: python3 scripts/test-spec-coverage-gate.py .github/workflows/quality.yml

      # MUTATION BATTERY. A green suite proves nothing on its own — the question
      # is whether it would have NOTICED. Each mutant reintroduces one specific
      # defect (enforcement removed, threshold that never fires, zero scenarios
      # scoring 100, exclusions folded back into the denominator, …) and the
      # suite must go red for every one. A mutant that SURVIVES means the
      # fixture cannot reach that branch, and the fix is a better fixture.
      #
      # This is not decorative: it caught a real hole on its first run. The
      # obvious fixture for `@e2e exclude` in a test file could not tell the
      # guarded regex from the unguarded one — both capture `exclude`, which
      # resolves to no slug — so that assertion passed while proving nothing.
      # The separator forms (`exclude::<slug>`, `exclude#<slug>`) are where the
      # guard is load-bearing, and the fixture now uses them.
      #
      # The last mutant is an ANTI-WIDENING control: it reworks a log string
      # nothing asserts on, and the suite must STAY GREEN. Without it, a suite
      # that failed on any edit at all would score a perfect kill rate while
      # being worthless.
      - name: "Mutation battery — every known defect must be caught"
        run: python3 scripts/test-spec-coverage-gate.py --mutation-battery .github/workflows/quality.yml

  seed-semantics:
    name: "A failing seed fails the job"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # POSITIVE CONTROL, FIRST — same discipline as the probe below. The
      # battery is run against the PRE-#192 step, reconstructed verbatim, and
      # must reject it. A battery that passed the known-bad body would pass
      # the fixed one for reasons unrelated to the fix, and its verdict on the
      # real workflow would mean nothing.
      - name: "Positive control — the known-bad seed step must be rejected"
        run: python3 scripts/assert-seed-step-fails-loudly.py --positive-control

      # THE MEASUREMENT. Every step named "Seed test data" is EXTRACTED from
      # the workflow — env block and run body both — and EXECUTED under the
      # same shell GitHub uses, against seeds that include a failing `&&`
      # chain, a legitimate multi-stage chain, and the assignment-prefix +
      # `|| true` shape launchpad actually ships.
      #
      # Running the shipped text rather than grepping it is what found the
      # THIRD instance of the defect: the Newman job has its own "Seed test
      # data" step reading `newman-seed-command`, and openbuild passes it
      # `php occ app:disable openbuild && php occ app:enable openbuild`.
      - name: "Exercise every 'Seed test data' step in quality.yml"
        run: python3 scripts/assert-seed-step-fails-loudly.py .github/workflows/quality.yml

  matrix-derivation:
    name: "The test matrix tracks info.xml"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # THE POSITIVE CONTROL IS THE WHOLE POINT OF THIS JOB.
      #
      # quality.yml derives the PHPUnit server matrix from appinfo/info.xml. The
      # obvious way to check that is to assert the derived value equals what the
      # 18 core apps hand-declare — and every one of them declares NC 32-34, so
      # an action that returned ["stable32","stable33","stable34"] unconditionally
      # would satisfy that assertion forever, on every app, while measuring
      # nothing. A value that matches is not evidence until you have shown it can
      # differ.
      #
      # So both fixtures are derived here and the two results are required to be
      # DIFFERENT in the specific way info.xml says they should be: the only
      # byte that differs between the two manifests is `max-version`, and
      # stable34 must be present in one and absent from the other.
      # Both fixtures are put through quality.yml's OWN derive step, not through
      # the action it used to call. That distinction is the whole value of this
      # job: quality.yml stopped using icewind1991/nextcloud-version-matrix on
      # 2026-08-21, and a probe still invoking the action would have kept passing
      # while measuring code the fleet no longer runs.
      #
      # scripts/run-derive-step.py reads the `derive` step out of quality.yml and
      # executes the Python inside it, so there is exactly one copy of the logic
      # and no way for the probe's subject to drift from the shipping one. It
      # raises rather than falls back if it cannot find that step — including if
      # the step becomes a `uses:` again.
      - name: Derive from a manifest declaring NC 32-34
        id: full
        env:
          INFO_PATH: scripts/fixtures/nextcloud-matrix/info-32-34.xml
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/run-derive-step.py

      - name: Derive from a manifest declaring NC 32-33 (positive control)
        id: narrow
        env:
          INFO_PATH: scripts/fixtures/nextcloud-matrix/info-32-33.xml
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/run-derive-step.py

      # ── WHAT THIS JOB DOES NOT COVER, AND HOW TO MEASURE IT ───────────────
      #
      # This job proves the derived VALUE tracks info.xml. It does not prove
      # that value still EXPANDS INTO LEGS, and those are different claims: a
      # matrix that collapses to one leg is present, green, and missing five
      # sixths of its coverage with no row to show for it.
      #
      # `quality-selftest.yml` cannot measure it either. It disables every leg,
      # and a matrix job whose `if:` is false DOES NOT EXPAND — measured on run
      # 31692599960, where the skipped PHPUnit job renders as one row still
      # carrying the literal `${{ matrix.nextcloud-ref }}` in its name.
      # Counting there would report "1 PHPUnit job" whether the matrix worked
      # or not.
      #
      # MEASURED ONCE, ON REAL ACTIONS, and reproducible on demand: push a
      # `fixture/**` branch carrying a workflow that calls ./.github/workflows/
      # quality.yml twice with `enable-phpunit: true`, pointing
      # `nextcloud-info-path` at each fixture above. Run 31734347530:
      #
      #   info-32-34.xml -> 6 legs  PHPUnit (PHP 8.3|8.4, NC stable32|33|34, pgsql)
      #   info-32-33.xml -> 4 legs  PHPUnit (PHP 8.3|8.4, NC stable32|33,    pgsql)
      #
      # The legs themselves fail — .github has no PHPUnit suite — which is not
      # the measurement. The job list is.
      #
      # ⚠️ TWO THINGS THAT WORKFLOW MUST DO, BOTH LEARNED BY GETTING THEM WRONG:
      #
      #   1. SERIALISE the two calls with `needs:` + `!cancelled()`. quality.yml
      #      declares `concurrency: quality-${{ github.ref }}` with
      #      cancel-in-progress, so two calls on one ref share the group and the
      #      second cancels the first. Measured on run 31734110346: every job
      #      under the control came back `cancelled` with its PHPUnit row
      #      unexpanded — the control measured nothing while looking like it ran.
      #
      #   2. DO NOT MERGE IT. It was in this PR and was withdrawn. quality.yml
      #      requires `contents: write` + `actions: write` at run-creation time
      #      (see quality-selftest.yml), so a `fixture/**` caller hands
      #      quality.yml's ~12 `actions/cache` steps an entry point reachable
      #      from a non-default branch. CodeQL scored that as 12 NEW HIGH
      #      alerts, `actions/cache-poisoning/poisonable-step` — against 0 on
      #      main, so it was this workflow and not a pre-existing pattern. A
      #      poisoned cache in a repo 23 others consume at @main is not worth a
      #      permanent leg counter. Push it, read the job list, delete it.
      - name: Assert the derived matrix is a function of info.xml
        env:
          FULL: ${{ steps.full.outputs.branches }}
          FULL_MAX: ${{ steps.full.outputs.branches-max }}
          NARROW: ${{ steps.narrow.outputs.branches }}
          NARROW_MAX: ${{ steps.narrow.outputs.branches-max }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys

          full   = json.loads(os.environ["FULL"])
          narrow = json.loads(os.environ["NARROW"])
          fmax   = os.environ["FULL_MAX"]
          nmax   = os.environ["NARROW_MAX"]

          print(f"32-34 -> branches={full} branches-max={fmax}")
          print(f"32-33 -> branches={narrow} branches-max={nmax}")

          bad = []

          if set(full) != {"stable32", "stable33", "stable34"}:
              bad.append(f"a manifest declaring NC 32-34 derived {full}, not stable32/33/34.")
          if set(narrow) != {"stable32", "stable33"}:
              bad.append(f"a manifest declaring NC 32-33 derived {narrow}, not stable32/33.")

          # THE CONTROL. If these are equal the action is not reading the file.
          if set(full) == set(narrow):
              bad.append(
                  "both manifests derived the SAME set. The only difference "
                  "between them is max-version, so the matrix is not a function "
                  "of info.xml — it is a constant, and every 'the derived value "
                  "matches what the app declares' assertion in this repo is "
                  "vacuous."
              )
          if "stable34" not in full:
              bad.append("stable34 is missing from the 32-34 derivation.")
          if "stable34" in narrow:
              bad.append("stable34 survived a manifest that declares max-version=33.")

          # `branches` IS OLDEST-FIRST — verified against the action's source,
          # where range(min,max) is reversed for the branched-off check and
          # reversed back. quality.yml must therefore never read entry [0] as
          # "the newest server": that is how newman, playwright, journeydoc and
          # the coverage guard would silently move onto stable32. This asserts
          # the ordering that makes `branches-max` necessary, so a future
          # release that flipped it would surface here rather than as four jobs
          # quietly testing the wrong server.
          if full[0] != "stable32" or full[-1] != "stable34":
              bad.append(
                  f"`branches` is no longer oldest-first ({full}). quality.yml "
                  f"relies on `branches-max` precisely because it is; re-read "
                  f"the single-server wiring before changing anything."
              )
          if fmax != "stable34" or nmax != "stable33":
              bad.append(
                  f"`branches-max` did not track max-version ({fmax!r}, {nmax!r})."
              )

          for problem in bad:
              print(f"::error::{problem}")
          sys.exit(1 if bad else 0)
          PY
          echo "OK — the matrix is derived from info.xml, and it changes when info.xml does."

  coverage-guard:
    name: "The coverage guard's deletion rule"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # quality-config/coverage-guard.php is copied into all 18 app repos and its
      # verdict blocks pull requests, and until now nothing in this repository
      # executed it. That is the same shape as every other job here: an
      # instrument nobody has watched refuse.
      #
      # The suite runs the SHIPPED program against clover reports built to the
      # shape PHPUnit actually emits, and it FAILS FIRST — the two pull requests
      # the file-scoped rule blocked (opencatalogi#895, launchpad#128) are
      # asserted to still fail under the old flags, with the exact percentages CI
      # printed, before the new flag is exercised at all. A test that only ever
      # sees the fixed program cannot tell a fix from a no-op.
      - name: "Exercise the shipped coverage guard"
        run: python3 quality-config/tests/test-coverage-guard.py

      # POSITIVE CONTROL FOR THE HARNESS ITSELF. The suite above shells out to
      # `php`; if php were missing, or the guard path wrong, a harness that
      # treated "could not run" as "nothing to report" would print a clean pass
      # forever. Point it at a file that is not the guard and require it to fail.
      - name: "Positive control — the suite must fail against a program that is not the guard"
        run: |
          set -eu
          printf '#!/usr/bin/env php\n<?php\nexit(0);\n' > "$RUNNER_TEMP/not-the-guard.php"
          if python3 quality-config/tests/test-coverage-guard.py "$RUNNER_TEMP/not-the-guard.php" > /dev/null 2>&1; then
            echo "::error::the coverage-guard suite reported PASS against a program that exits 0 and \
          measures nothing. It is not executing the subject, so its verdict above means nothing."
            exit 1
          fi
          echo "OK — the suite fails when handed the wrong program. Its clean pass above is a verdict."

  probe:
    name: "quality.yml resolves (job count > 0)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # POSITIVE CONTROL, FIRST. Run the counter against a workflow that
      # cannot possibly have a run at this SHA and require the answer to be 0.
      #
      # This is the assertion the whole probe rests on: that a count of zero is
      # something this instrument can actually produce and report. If the
      # counter were broken — wrong repo, missing token scope, a jq path that
      # silently yields nothing — it would return 0 here AND 0 for the real
      # subject, and the probe would be a gate that only ever fails. Equally, a
      # counter that had started returning a constant would pass the real check
      # forever. Measuring the known-zero case first distinguishes the two.
      - name: "Positive control — a workflow that does not exist must count 0"
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -eu
          # Short timeout: this one is EXPECTED to find nothing, so there is no
          # race to wait out.
          n="$(bash scripts/count-workflow-jobs.sh '__no-such-workflow.yml' "${HEAD_SHA}" 5)"
          echo "control count = ${n}"
          [ "${n}" = "0" ] || {
            echo "::error::the counter returned ${n} jobs for a workflow that does not \
          exist. It is not counting what it claims to count, so its verdict on \
          quality.yml means nothing."
            exit 1
          }
          echo "OK — the counter can return 0, and reports it."

      # THE MEASUREMENT. quality-selftest.yml calls ./.github/workflows/quality.yml
      # on this same commit. If quality.yml resolves, that run materialises its
      # jobs (18 top-level jobs as of this change, some of which skip — a
      # skipped job is still a job and still counts, which is the point: the
      # probe measures RESOLUTION, not execution).
      - name: "Count the jobs quality-selftest.yml materialised"
        id: count
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -eu
          n="$(bash scripts/count-workflow-jobs.sh 'quality-selftest.yml' "${HEAD_SHA}" 420)"
          echo "count=${n}" >> "$GITHUB_OUTPUT"
          echo "quality-selftest.yml materialised ${n} jobs at ${HEAD_SHA}"

      - name: "Assert the shared workflow resolved"
        env:
          COUNT: ${{ steps.count.outputs.count }}
        run: |
          set -eu
          if [ "${COUNT}" -eq 0 ]; then
            echo "::error::quality.yml produced ZERO jobs. This is the #161 outage \
          signature, not a slow run: an unresolvable reusable workflow yields a run \
          with no jobs (or no run) and NEVER goes red on its own. Do not merge — \
          every caller in the fleet consumes this file at @main and would silently \
          stop being checked. Check for an oversized \`run:\` step, a malformed \
          \`on: workflow_call\` block, or a YAML error."
            exit 1
          fi
          echo "OK — ${COUNT} jobs. quality.yml is resolvable at this commit."

  # A single check to require in the ruleset, so adding a job above does not
  # need a branch-protection edit to be enforced. `needs:` implies success(),
  # which is what we want here — but it also DELETES this job if a dependency
  # is skipped, so `!cancelled()` is used and each result is asserted by name
  # rather than inferred from this job having run at all.
  guard:
    name: "Shared-workflow guard"
    runs-on: ubuntu-latest
    needs: [static-limits, seed-semantics, gate-completeness, matrix-derivation, coverage-guard, probe, changed-path-filter]
    if: ${{ !cancelled() }}
    steps:
      - name: Assert both guards reached a verdict
        env:
          STATIC: ${{ needs.static-limits.result }}
          SEED: ${{ needs.seed-semantics.result }}
          LEGS: ${{ needs.gate-completeness.result }}
          MATRIX: ${{ needs.matrix-derivation.result }}
          COVERAGE: ${{ needs.coverage-guard.result }}
          PROBE: ${{ needs.probe.result }}
          FILTER: ${{ needs['changed-path-filter'].result }}
        run: |
          set -eu
          echo "static-limits=${STATIC} seed-semantics=${SEED} gate-completeness=${LEGS} matrix-derivation=${MATRIX} coverage-guard=${COVERAGE} probe=${PROBE} changed-path-filter=${FILTER}"
          # `skipped` is failed here on purpose. A guard that did not run is
          # not a guard that passed.
          for pair in "static-limits:${STATIC}" "seed-semantics:${SEED}" "gate-completeness:${LEGS}" "matrix-derivation:${MATRIX}" "coverage-guard:${COVERAGE}" "probe:${PROBE}" "changed-path-filter:${FILTER}"; do
            name="${pair%%:*}"; result="${pair##*:}"
            [ "${result}" = "success" ] || {
              echo "::error::${name} did not succeed (result=${result}). A guard that \
          was skipped or cancelled has returned no verdict at all."
              exit 1
            }
          done
          echo "OK — every guard ran and passed."
