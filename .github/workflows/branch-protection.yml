name: Branch Protection

on:
  workflow_call:

jobs:
  check-branch:
    runs-on: ubuntu-latest
    # Observed across 123 executions: median and max both 0.1 min. A single
    # bash branch-name comparison with no checkout and no network.
    timeout-minutes: 10
    steps:
      - name: Validate source branch
        run: |
          TARGET="${{ github.base_ref }}"
          SOURCE="${{ github.head_ref }}"

          echo "PR: $SOURCE → $TARGET"

          # `release/v*` is machine-generated by release.yml, which commits the
          # version bump onto its own branch and opens a pull request back into
          # the branch the release ran on. Without it in this list the fleet's
          # own release automation is refused by the fleet's own gate: measured
          # 2026-08-27, five release bumps opened that morning (integriq#1598,
          # filinq#834, zaakafhandelapp#482, pipelinq#1477, planninq#387) were
          # all sitting red on this check, and every release since has been.
          #
          # It is a narrow allowance, not a hole: release.yml stages only
          # appinfo/info.xml and, where present, openapi.json, and hard-fails
          # its own run if the bump commit strays outside that allow-list.
          if [[ "$TARGET" == "main" || "$TARGET" == "master" ]]; then
            if [[ "$SOURCE" != "beta" ]] && ! [[ "$SOURCE" =~ ^hotfix ]] && ! [[ "$SOURCE" =~ ^release/ ]]; then
              echo "::error::Pull requests to main must come from 'beta', a 'hotfix/*' branch, or a 'release/v*' version bump."
              echo ""
              echo "Allowed patterns:"
              echo "  beta → main"
              echo "  hotfix/* → main"
              echo "  release/v* → main (automated version bump)"
              echo ""
              echo "Your branch '$SOURCE' does not match any allowed pattern."
              exit 1
            fi

          elif [[ "$TARGET" == "beta" ]]; then
            if [[ "$SOURCE" != "development" ]] && ! [[ "$SOURCE" =~ ^hotfix ]] && [[ "$SOURCE" != "main" ]] && [[ "$SOURCE" != "master" ]] && ! [[ "$SOURCE" =~ ^release/ ]]; then
              echo "::error::Pull requests to beta must come from 'development', 'main', a 'hotfix/*' branch, or a 'release/v*' version bump."
              echo ""
              echo "Allowed patterns:"
              echo "  development → beta"
              echo "  hotfix/* → beta"
              echo "  main → beta (backport)"
              echo "  release/v* → beta (automated version bump)"
              echo ""
              echo "Your branch '$SOURCE' does not match any allowed pattern."
              exit 1
            fi
          fi

          echo "✓ Branch check passed: $SOURCE → $TARGET"
