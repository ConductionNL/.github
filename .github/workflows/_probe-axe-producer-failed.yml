# TEMPORARY MEASUREMENT HARNESS — deleted once the measurement is recorded.
#
# The third producer state for the axe verdict. Runs 30910908474 (producer
# SKIPPED) and the validator positive control cover the other two; this one
# turns Playwright ON in a repo that is not a Nextcloud app, so the producer
# FAILS and uploads nothing. Expected: `Hydra Gates` still runs, the gates
# still report in full, and the job fails quoting playwright's resolved state
# as 'failure' rather than 'skipped'.
name: probe-axe-producer-failed

on:
  push:
    branches: [fix/hydra-gates-needs-skip-deletion]

permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: write

jobs:
  arm:
    uses: ./.github/workflows/quality.yml
    with:
      app-name: probe
      enable-hydra-gates: true
      enable-axe: true
      enable-playwright: true
      enable-phpunit: false
      enable-newman: false
      enable-frontend: false
      enable-eslint: false
      enable-psalm: false
      enable-phpstan: false
      enable-phpmetrics: false
      enable-sbom: false
      enable-coverage-guard: false
