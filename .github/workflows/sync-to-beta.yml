name: Sync Development to Beta

on:
  workflow_call:

# Only the newest `development` head needs syncing to beta. An older run that
# is still waiting is replaced by the newer one; a run that has started
# finishes, because it pushes and opens or edits a PR and must not stop
# halfway. Measured 2026-11-12: 320 superseded Sync to Beta runs sat queued
# across the fleet. The `reusable-` prefix keeps this group distinct from
# any the caller declares (an identical group in caller and callee deadlocks).
concurrency:
  group: reusable-sync-to-beta-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-pr:
    runs-on: ubuntu-latest
    # Observed across 152 executions: median 0.1 min, p95 1.1 min, max 5.6 min
    # (openregister — a full-depth checkout of a large repo). 20 min covers a
    # slow `fetch-depth: 0` clone with a wide margin.
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create or update PR to beta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Ensure beta branch exists
          if ! git ls-remote --heads origin beta | grep -q beta; then
            echo "Beta branch does not exist yet. Creating from development..."
            git push origin origin/development:refs/heads/beta
          fi

          # Check if a PR already exists
          EXISTING_PR=$(gh pr list --base beta --head development --state open --json number --jq '.[0].number' 2>/dev/null || echo "")

          if [ -n "$EXISTING_PR" ] && [ "$EXISTING_PR" != "null" ]; then
            echo "PR #$EXISTING_PR already exists — it will auto-update with new commits"
          else
            # NOTHING TO SYNC IS NOT A FAILURE. When beta already holds every
            # commit on development, `gh pr create` exits 1 with
            #   GraphQL: No commits between beta and development
            # and the whole release pipeline reports red for a branch that is
            # perfectly in sync. Measured on versioniq 2026-08-27, whose only
            # non-signing red on development was exactly this.
            #
            # Matched on the message rather than pre-comparing the two refs, so
            # a commit landing between the check and the create cannot turn a
            # real sync into a skipped one. Every other failure still exits 1.
            set +e
            CREATE_OUT=$(gh pr create \
              --base beta \
              --head development \
              --title "Release: merge development into beta" \
              --body "Automated PR to sync development changes to beta for beta release.

          Merging this PR will trigger the beta release workflow.

          > **Reminder:** Add a \`major\`, \`minor\`, or \`patch\` label to this PR to control the version bump. Default is \`patch\`." 2>&1)
            CREATE_RC=$?
            set -e
            printf '%s\n' "$CREATE_OUT"
            if [ "$CREATE_RC" -ne 0 ]; then
              if printf '%s' "$CREATE_OUT" | grep -q 'No commits between'; then
                echo "beta already holds every commit on development. Nothing to sync."
              else
                exit "$CREATE_RC"
              fi
            fi
          fi
